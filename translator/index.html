<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Translator with OCR</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #1e293b;
            padding: 25px;
            border-radius: 20px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; color: #60a5fa; font-size: 22px; margin-bottom: 15px; }

        .label { font-size: 14px; color: #94a3b8; margin-bottom: 5px; display: block; }

        textarea {
            width: 100%;
            height: 100px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 12px;
            padding: 12px;
            font-size: 15px;
            resize: none;
            margin-bottom: 10px;
        }

        select, input[type="file"] {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            cursor: pointer;
            background: #3b82f6;
            color: #fff;
            transition: 0.3s;
            min-width: 100px;
        }
        .btn:hover { background: #2563eb; }
        .btn-camera { background: #10b981; }
        .btn-camera.active { background: #ef4444; }
        .btn-camera:hover { background: #059669; }
        .btn-camera.active:hover { background: #dc2626; }
        .btn-audio { background: #8b5cf6; }
        .btn-audio.active { background: #ef4444; }
        .btn-clear { background: #ef4444; }
        .btn-clear:hover { background: #dc2626; }

        #result {
            background: #0f172a;
            padding: 15px;
            border-radius: 12px;
            min-height: 60px;
            margin-top: 10px;
            border: 1px solid #475569;
            font-size: 17px;
            white-space: pre-wrap;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 15px;
            border-top: 1px solid #334155;
            padding-top: 12px;
        }

        #cameraPreview, #audioPreview {
            width: 100%;
            border-radius: 12px;
            margin-top: 10px;
            display: none;
            background: #0f172a;
            border: 1px solid #475569;
        }

        .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .row select { flex: 1; }
        .row .btn { flex: 0.5; }
        .lang-label { font-size: 13px; color: #94a3b8; margin-bottom: 2px; display: block; }
    </style>
</head>
<body>
<div class="container">
    <h1>🌍 Global Translator</h1>

    <label class="label" for="inputText">📝 Input Text</label>
    <textarea id="inputText" placeholder="Type text, upload file, or use audio/camera..."></textarea>

    <div class="row">
        <div style="flex:1">
            <label class="lang-label" for="sourceLang">From</label>
            <select id="sourceLang">
                <option value="auto">Detect Language</option>
                <option value="en">English</option>
                <option value="ur">Urdu</option>
                <option value="ar">Arabic</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="zh">Chinese</option>
                <option value="hi">Hindi</option>
                <option value="fa">Persian</option>
                <option value="ps">Pashto</option>
                <option value="ru">Russian</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="pt">Portuguese</option>
                <option value="it">Italian</option>
                <option value="tr">Turkish</option>
            </select>
        </div>

        <div style="flex:1">
            <label class="lang-label" for="targetLang">To</label>
            <select id="targetLang">
                <option value="en">English</option>
                <option value="ur">Urdu</option>
                <option value="ar">Arabic</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="zh">Chinese</option>
                <option value="hi">Hindi</option>
                <option value="fa">Persian</option>
                <option value="ps">Pashto</option>
                <option value="ru">Russian</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="pt">Portuguese</option>
                <option value="it">Italian</option>
                <option value="tr">Turkish</option>
            </select>
        </div>
    </div>

    <input type="file" id="fileInput" accept=".pdf,.txt,.docx,.jpg,.png">

    <video id="cameraPreview" autoplay playsinline></video>
    <audio id="audioPreview" controls></audio>

    <div class="btn-group">
        <button class="btn" onclick="translateText()">🔄 Translate</button>
        <button class="btn btn-camera" id="cameraBtn" onclick="toggleCamera()">📸 Camera</button>
        <button class="btn btn-audio" id="audioBtn" onclick="toggleAudio()">🎙️ Audio</button>
        <button class="btn btn-clear" onclick="clearAll()">🗑️ Clear</button>
    </div>

    <label class="label">📄 Translation Output</label>
    <div id="result">Translation will appear here...</div>

    <div class="footer">
        Developed by <strong>Akbar Ali Khan(SCT) GCMHS No.3 MARDAN(+923068183790)</strong> &bull; Powered by Google Translate
    </div>
</div>

<script>
    let cameraStream = null;
    let isCameraOn = false;
    let isRecording = false;

    // --- TRANSLATE (Preserving Spacing & Multiline) ---
    async function translateText() {
        let text = document.getElementById('inputText').value;
        const source = document.getElementById('sourceLang').value;
        const target = document.getElementById('targetLang').value;
        const resultBox = document.getElementById('result');

        if (!text.trim()) {
            resultBox.innerText = "⚠️ Please type, upload, or use audio/camera first.";
            return;
        }

        resultBox.innerText = "🔄 Translating...";
        try {
            const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${source}&tl=${target}&dt=t&q=${encodeURIComponent(text)}`;
            const resp = await fetch(url);
            const data = await resp.json();

            if (data && data[0]) {
                let translatedText = "";
                data[0].forEach(segment => {
                    if (segment[0]) translatedText += segment[0];
                });
                resultBox.innerText = translatedText;
            } else {
                resultBox.innerText = "⚠️ Translation failed. Try again.";
            }
        } catch (e) {
            resultBox.innerText = "⚠️ Error: " + e.message;
        }
    }

    // --- CAMERA CAPTURE (Tesseract OCR) ---
    async function capturePhoto() {
        const video = document.getElementById('cameraPreview');
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/png');

        document.getElementById('result').innerText = '📸 Processing image... Please wait.';

        try {
            const { data: { text } } = await Tesseract.recognize(dataUrl, 'eng+urd');
            document.getElementById('inputText').value = text;
            document.getElementById('result').innerText = '📸 Text extracted! Click Translate.';
        } catch (error) {
            document.getElementById('result').innerText = '❌ OCR failed: ' + error.message;
        }
    }

    // --- CAMERA TOGGLE (Back Camera) ---
    function toggleCamera() {
        const video = document.getElementById('cameraPreview');
        const btn = document.getElementById('cameraBtn');

        if (isCameraOn) {
            capturePhoto();
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }
            video.style.display = 'none';
            video.srcObject = null;
            btn.innerText = '📸 Camera';
            btn.classList.remove('active');
            isCameraOn = false;
        } else {
            const constraints = {
                video: {
                    facingMode: 'environment'
                }
            };
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia(constraints)
                    .then(stream => {
                        cameraStream = stream;
                        video.srcObject = stream;
                        video.style.display = 'block';
                        btn.innerText = '⏹️ Capture & Close';
                        btn.classList.add('active');
                        isCameraOn = true;
                    })
                    .catch(err => {
                        alert("Camera access denied: " + err.message);
                    });
            } else {
                alert("Camera not supported on this device.");
            }
        }
    }

    // --- AUDIO TOGGLE (Native Android Speech) ---
    function toggleAudio() {
        const btn = document.getElementById('audioBtn');

        if (isRecording) {
            isRecording = false;
            btn.innerText = '🎙️ Audio';
            btn.classList.remove('active');
        } else {
            if (typeof Android !== 'undefined') {
                Android.startSpeechToText();
                btn.innerText = '⏹️ Stop Audio';
                btn.classList.add('active');
                isRecording = true;
            } else {
                alert('Speech not supported in this browser');
            }
        }
    }

    // --- CLEAR ---
    function clearAll() {
        document.getElementById('inputText').value = '';
        document.getElementById('result').innerText = 'Translation will appear here...';
        document.getElementById('fileInput').value = '';
        document.getElementById('audioPreview').style.display = 'none';
    }

    // --- FILE UPLOAD (Enhanced: Auto OCR for Images) ---
    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const fileName = file.name.toLowerCase();
        const resultBox = document.getElementById('result');

        if (fileName.endsWith('.jpg') || fileName.endsWith('.png') || fileName.endsWith('.jpeg')) {
            resultBox.innerText = '🖼️ Processing image OCR... Please wait.';
            const reader = new FileReader();
            reader.onload = async function(ev) {
                try {
                    const { data: { text } } = await Tesseract.recognize(ev.target.result, 'eng+urd');
                    document.getElementById('inputText').value = text;
                    resultBox.innerText = '🖼️ OCR Complete! Click Translate.';
                } catch (err) {
                    resultBox.innerText = '❌ OCR Error: ' + err.message;
                }
            };
            reader.readAsDataURL(file);
        } else {
            const reader = new FileReader();
            reader.onload = function(ev) {
                document.getElementById('inputText').value = ev.target.result;
                resultBox.innerText = '📄 File loaded! Click Translate.';
            };
            reader.readAsText(file);
        }
    });
</script>
    <script data-goatcounter="https://iphone-apps.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
