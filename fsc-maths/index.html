<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FSc Mathematics ECAT Test P1+2</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a0033">
    <link rel="icon" type="image/png" href="./icons-fsc-maths.png">
    <link rel="apple-touch-icon" href="./icons-fsc-maths.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(180deg, #0a0a1a 0%, #1a0033 50%, #2e0059 100%); color: white; font-family: 'Arial'; text-align: center; padding: 8px 10px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        .main-title { font-size: 29px; color: #ffeb3b; font-weight: bold; margin-bottom: 3px; text-shadow: 0 0 15px #ffeb3b; }
        .main-subtitle { font-size: 15px; color: #d1c5e8; margin-bottom: 10px; }
        .disclaimer-top { background: rgba(187, 134, 252, 0.12); border: 1px solid rgba(187, 134, 252, 0.4); border-radius: 8px; padding: 6px 10px; margin: 0 auto 10px auto; width: 70%; max-width: 650px; font-size: 11px; color: #d1c5e8; line-height: 1.4; }
        .box { background: linear-gradient(135deg, #1a0033, #3d0099); border: 2px solid #bb86fc; border-radius: 14px; padding: 16px; margin: 10px auto; width: 100%; max-width: 600px; cursor: pointer; box-shadow: 0 4px 20px rgba(123,0,255,0.2); }
        .level-btn { display: block; background: linear-gradient(135deg, #7f00ff, #e100ff); color: white; border: none; padding: 12px; margin: 6px auto; border-radius: 10px; font-size: 17px; width: 90%; max-width: 500px; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
        #installBtn{ display:none; background:linear-gradient(90deg,#ffeb3b,#ff9800); color:#000; border:none; padding:13px 24px; border-radius:30px; font-weight:900; font-size:16px; margin:14px auto; cursor:pointer; box-shadow:0 0 20px rgba(255,235,59,0.6); width:95%; max-width:600px; animation:btnGlow 1.5s infinite; }
        @keyframes btnGlow{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
        .madeby-box { background: linear-gradient(135deg, #1a0033, #3d0099); border: 2px solid #ffeb3b; border-radius: 14px; padding: 16px; margin: 15px auto; max-width: 600px; }
    </style>
</head>
<body>
<div class="container">
    <h1 class="main-title">📐 FSc Mathematics ECAT</h1>
    <p class="main-subtitle">Part 1 + Part 2 · Chapterwise & ECAT Pattern</p>
    <div class="disclaimer-top">⚠️ <strong>Disclaimer:</strong> Independent practice app only. NOT affiliated with BISE or UET. For self-study.</div>
    
    <div class="box" onclick="toggleTests()">
        <h2>📚 Mathematics Test Series</h2>
        <p>Click to expand · Part 1 & 2 + ECAT</p>
    </div>

    <button id="installBtn">📲 INSTALL Maths App - اصلی آئیکون کے ساتھ</button>

    <div id="testLevels" class="hidden">
        <button class="level-btn" onclick="openTest('math1-ch1.html')">📘 Ch-01: Number Systems</button>
        <button class="level-btn" onclick="openTest('math1-ch2.html')">📗 Ch-02: Sets, Functions & Groups</button>
        <button class="level-btn" onclick="openTest('math2-ch1.html')">📙 Part 2 Ch-01: Functions & Limits</button>
        <button class="level-btn" onclick="openTest('ecat-math-full.html')">📕 ECAT Full Pattern Test</button>
    </div>

    <div class="madeby-box">
        <h3>Made By: Akbar Ali Khan (SCT)</h3>
        <p>GCMHS No:3 MARDAN<br>akbarmdn72@gmail.com</p>
    </div>
</div>
<script>
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; installBtn.style.display = 'block'; });
    installBtn.addEventListener('click', async () => { if (deferredPrompt) { deferredPrompt.prompt(); const { outcome } = await deferredPrompt.userChoice; if (outcome === 'accepted') { installBtn.style.display = 'none'; } deferredPrompt = null; } });
    window.addEventListener('appinstalled', () => { installBtn.style.display = 'none'; });
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js', {scope: './'}); }
    function toggleTests() { var x = document.getElementById("testLevels"); if (x.style.display === "none" || x.style.display === "") { x.style.display = "block"; x.classList.remove("hidden"); } else { x.style.display = "none"; } }
    function openTest(f) { window.location.href = f; }
</script>
<script data-goatcounter="https://iphone-apps.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
