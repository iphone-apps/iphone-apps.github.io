<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
    height:100%;
    width:100%;
    overflow:hidden;
}
body{
    background:linear-gradient(180deg, #08133A 0%, #0F2A7A 50%, #123CA8 100%);
    font-family:'Segoe UI', Arial, sans-serif;
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    direction:ltr;
}
.header{
    flex-shrink:0;
    text-align:center;
    padding:12px 10px;
    background:#08133A;
    border-bottom:3px solid #FFD600;
    width:100%;
    position:relative;
}
.header h1{
    color:#FF8F00;
    font-size:20px;
    font-weight:900;
}
.count{
    flex-shrink:0;
    text-align:center;
    padding:6px;
    color:#FFEB3B;
    font-weight:bold;
    font-size:13px;
    background:rgba(0,0,0,0.3);
}
.joke-box{
    flex:1 1 auto;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:linear-gradient(180deg, #0A1E5E 0%, #0F2F8A 100%);
    margin:10px;
    border:2.5px solid #FFD600;
    border-radius:16px;
    padding:16px;
    color:white;
    font-size:19px;
    line-height:34px;
    white-space:pre-wrap;
    word-wrap:break-word;
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
    min-height:0;
    text-align:left;
    direction:ltr;
}
.nav-area{
    flex-shrink:0;
    padding:10px;
    display:flex;
    gap:8px;
    background:rgba(0,0,0,0.25);
    direction:ltr;
}
.nav-btn{
    flex:1;
    padding:13px 6px;
    border:2.5px solid #FFD600;
    border-radius:12px;
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
}
.btn-prev{background:#0A1E5E;color:white}
.btn-next{background:#0A1E5E;color:white}
.btn-home{background:#2E7D32;color:white}
.footer{
    flex-shrink:0;
    background:linear-gradient(180deg, #0A1E5E 0%, #0F2F8A 100%);
    border-top:2px solid #FFD600;
    padding:6px 8px;
    text-align:center;
    color:white;
    font-size:10px;
    line-height:15px;
    max-height:22vh;
    overflow-y:auto;
}
.footer b{color:#FFEB3B;font-size:11px}
@media (max-height:600px){
    .footer{display:none;}
    .header h1{font-size:17px;}
    .joke-box{font-size:16px;line-height:28px;padding:12px;margin:8px;}
    .nav-btn{padding:11px 4px;font-size:13px;}
}
</style>
</head>

<script>
var jokes = [
"चुटकुला 1:\n\nटीचर: हादसा और मुसीबत में क्या फर्क है?\nछात्र: सर, जब किसी की बीवी मायके चली जाए और वापसी पर उसका एक्सीडेंट हो जाए और मर जाए, तो ये हादसा है। और अगर वो ज़िंदा सलामत घर वापस आ जाए, तो ये मुसीबत है!",
"चुटकुला 1a:\n\nएक आदमी दुकान पर आया और दुकानदार से पूछा: भाई, काम-काज कैसा चल रहा है?\nदुकानदार: माशाअल्लाह, रोज़ाना लाखों की सेल होती है!\nआदमी: क्या आप टैक्स देते हैं?\nआदमी ने कहा: मैं इनकम टैक्स ऑफिसर हूँ!\nदुकानदार फौरन बोला: अरे साहब, इस पूरे बाज़ार में जाकर पूछ लें — मैं सबसे बड़ा झूठा मशहूर हूँ, झूठ बोलने वाला भगत मार!",
"चुटकुला 2:\n\nटीचर: अगर तुम्हें एक करोड़ रुपये मिलें तो क्या करोगे?\nछात्र: सर, पहले स्कूल की फीस दूंगा।\nटीचर: वाह, कितना अच्छा बच्चा है!\nछात्र: फिर बाकी पैसों से बीवी को मायके भेजूंगा!",
"चुटकुला 3:\n\nपत्नी: जी, अगर मैं मर जाऊं तो क्या करोगे?\nपति: दूसरी शादी कर लूंगा।\nपत्नी: और अगर मैं ज़िंदा रहूं?\nपति: फिर क्या, पहले वाली ही रहेगी!",
"चुटकुला 4:\n\nएक आदमी डॉक्टर के पास गया: डॉक्टर साहब, मुझे हर वक्त लगता है कि मैं मर जाऊंगा।\nडॉक्टर: कब से?\nआदमी: जब से मेरी शादी हुई है।\nडॉक्टर: भाई, ये बीमारी नहीं, ये हकीकत है!",
"चुटकुला 5:\n\nपति: जी, तुम मुझे कितना प्यार करती हो?\nपत्नी: इतना कि तुम्हारे बगैर एक घंटा नहीं रह सकती।\nपति: तो फिर आज खाना क्यों नहीं बनाया?\nपत्नी: क्योंकि मैं तुम्हारे बगैर खाना नहीं बना सकती!",
"चुटकुला 6:\n\nटीचर: अगर तुम्हारी बीवी और मां दोनों नदी में गिर जाएं, तो पहले किसे बचाओगे?\nछात्र: सर, पहले मां को, क्योंकि बीवी तो तैरना जानती है — मायके जाने के लिए रोज़ नदी पार करती है!",
"चुटकुला 7:\n\nडॉक्टर: तुम्हें क्या तकलीफ है?\nमरीज़: डॉक्टर साहब, मेरी बीवी मुझे रोज़ डांटती है।\nडॉक्टर: तो मैं क्या करूं?\nमरीज़: आप उसे कोई दवा दे दें ताकि वो डांटना छोड़ दे!",
"चुटकुला 8:\n\nटीचर: शादी के बाद क्या महसूस हुआ?\nछात्र: सर, पहले मुझे लगता था कि मैं आज़ाद हूं — शादी के बाद पता चला कि मैं पहले कैदी था, अब रिहाई मिली है!",
"चुटकुला 9:\n\nपत्नी: जी, आज बाज़ार चलें?\nपति: पैसे नहीं हैं।\nपत्नी: तो क्या हुआ, सिर्फ देखने चलेंगे।\nपति: पिछली बार भी यही कहा था, और मैंने 3 महीने की तनख्वाह बाज़ार में छोड़ दी!",
"चुटकुला 10:\n\nटीचर: अगर तुम्हें नौकरी मिले तो क्या करोगे?\nछात्र: सर, पहले महीने की तनख्वाह से मां को तोहफा दूंगा।\nटीचर: वाह, कितना अच्छा बेटा है!\nछात्र: फिर बाकी महीने भी मां को दे दूंगा, बीवी को कुछ नहीं!",
"चुटकुला 11:\n\nपत्नी: जी, आपने मुझे कभी फूल नहीं दिए।\nपति: तुम्हें फूल पसंद हैं?\nपत्नी: हां।\nपति: फिर कल बाज़ार से फूल खरीद लो!",
"चुटकुला 12:\n\nटीचर: ज़िंदगी का सबसे बड़ा सदमा क्या हुआ?\nछात्र: सर, जब मेरी बीवी ने बताया कि मैं बाप बनने वाला हूं — और मैंने सोचा कि मैं तो खुद अभी बच्चा हूं!",
"चुटकुला 13:\n\nडॉक्टर: तुम्हें एक्सरसाइज की ज़रूरत है।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ बीवी से डांट खाने के बाद भागता हूं!",
"चुटकुला 14:\n\nटीचर: अगर तुम्हारी बीवी और मां एक साथ डांटें, तो किसकी सुनोगे?\nछात्र: सर, मां की।\nटीचर: बीवी की क्यों नहीं?\nछात्र: सर, बीवी की तो रात को भी सुननी है, मां की सिर्फ दिन में!",
"चुटकुला 15:\n\nपत्नी: जी, आज खाने में क्या बनाऊं?\nपति: जो तुम्हारा दिल करे।\nपत्नी: ठीक है, मैं आज कुछ नहीं बनाऊंगी।\nपति: अरे नहीं, मैंने तो मज़ाक किया था!",
"चुटकुला 16:\n\nटीचर: ज़िंदगी का सबसे बड़ा सबक क्या मिला?\nछात्र: सर, शादी से पहले मैं सोचता था कि मैं बादशाह हूं, शादी के बाद पता चला कि मैं वज़ीर हूं — और बीवी प्रधानमंत्री!",
"चुटकुला 17:\n\nडॉक्टर: तुम्हें सिगरेट नहीं पीनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं तो सिर्फ देखता हूं।\nडॉक्टर: तो फिर देखना छोड़ दो!",
"चुटकुला 18:\n\nटीचर: अगर तुम्हें एक जहाज़ मिले तो कहां जाओगे?\nछात्र: सर, मायके!",
"चुटकुला 19:\n\nपत्नी: जी, आपकी सबसे पसंदीदा चीज़ क्या है?\nपति: तुम।\nपत्नी: वाह, कितना प्यार!\nपति: नहीं, मेरी पसंदीदा चीज़ तुम्हारा मायके जाना है!",
"चुटकुला 20:\n\nटीचर: अगर तुम्हारी बीवी और बच्चा दोनों छत पर चढ़ जाएं, तो पहले किसे नीचे लाओगे?\nछात्र: सर, बच्चे को।\nटीचर: बीवी को क्यों नहीं?\nछात्र: सर, बीवी छत से खुद कूद कर नीचे आ जाएगी, बच्चा नहीं आ सकेगा!",
"चुटकुला 21:\n\nडॉक्टर: तुम्हें सोना चाहिए।\nमरीज़: डॉक्टर साहब, मैं सोता हूं।\nडॉक्टर: कितने घंटे?\nमरीज़: डॉक्टर साहब, मैं रात भर सोता हूं, दिन में बीवी नहीं सोने देती!",
"चुटकुला 22:\n\nटीचर: तुम्हारे घर में सबसे ताकतवर कौन है?\nछात्र: सर, मेरी बीवी।\nटीचर: कैसे?\nछात्र: सर, वो एक हाथ से पूरा घर चला सकती है, मेरी तनख्वाह भी!",
"चुटकुला 23:\n\nपत्नी: जी, अगर मैं और आपकी मां दोनों एक साथ बीमार हो जाएं, तो किसकी दवा लाओगे?\nपति: तुम्हारी!\nपत्नी: वाह, इतना प्यार!\nपति: नहीं, मां की दवा तो खुद आ जाएगी, तुम्हारी मैं ही लाऊंगा!",
"चुटकुला 24:\n\nटीचर: क्या तुम्हें लगता है, शादी ज़िंदगी का सबसे बड़ा फैसला है?\nछात्र: सर, नहीं, शादी ज़िंदगी का सबसे बड़ा 'हादसा' है — और बीवी 'मुसीबत'!",
"चुटकुला 25:\n\nडॉक्टर: तुम्हें क्या तकलीफ है?\nमरीज़: डॉक्टर साहब, मुझे हर वक्त लगता है कि मैं मर जाऊंगा।\nडॉक्टर: कब से?\nमरीज़: जब से मेरी शादी हुई है!",
"चुटकुला 26:\n\nटीचर: अगर तुम्हें एक करोड़ रुपये मिलें तो क्या करोगे?\nछात्र: सर, पहले बीवी को मायके भेजूंगा, फिर चैन से सोऊंगा!",
"चुटकुला 27:\n\nपत्नी: जी, आप मुझे कितना प्यार करते हैं?\nपति: इतना कि तुम्हें मायके भी नहीं जाने दूंगा।\nपत्नी: वाह, इतनी मोहब्बत!\nपति: नहीं, मायके जाने का खर्चा बचाना है!",
"चुटकुला 28:\n\nटीचर: शादी के बाद क्या महसूस हुआ?\nछात्र: सर, पहले मैं अकेला था, अब मैं 'हम' हूं — लेकिन 'हम' में सिर्फ बीवी की सुनी जाती है!",
"चुटकुला 29:\n\nडॉक्टर: तुम्हें एक्सरसाइज की ज़रूरत है।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह उठने की कोशिश करता हूं!",
"चुटकुला 30:\n\nटीचर: अगर तुम्हारी बीवी और मां बीमार हो जाएं, तो किसे अस्पताल ले जाओगे?\nछात्र: सर, मां को।\nटीचर: बीवी का क्या होगा?\nछात्र: सर, बीवी तो खुद अस्पताल चली जाएगी — मुझे तो मां को ले जाने की फिक्र है!",
"चुटकुला 31:\n\nपत्नी: जी, आज खाने में क्या है?\nपति: जो तुमने बनाया है।\nपत्नी: मैंने कुछ नहीं बनाया!\nपति: तो फिर बाहर से मंगवा लो!",
"चुटकुला 32:\n\nटीचर: तुम्हारे पिता क्या करते हैं?\nछात्र: सर, वो मेरे पिता हैं!\nटीचर: वो तो मुझे भी पता है, क्या काम करते हैं?\nछात्र: सर, वो मेरी मां के पति हैं!",
"चुटकुला 33:\n\nडॉक्टर: तुम्हें फल खाने चाहिएं।\nमरीज़: डॉक्टर साहब, मैं रोज़ आम खाता हूं।\nडॉक्टर: सिर्फ आम?\nमरीज़: डॉक्टर साहब, आम का मतलब है 'फलों का बादशाह'!",
"चुटकुला 34:\n\nटीचर: अगर तुम्हें एक रात के लिए प्रधानमंत्री बना दिया जाए, तो क्या करोगे?\nछात्र: सर, पहले स्कूल की छुट्टी करूंगा, फिर अपनी बीवी की तनख्वाह बढ़ाऊंगा!",
"चुटकुला 35:\n\nपत्नी: जी, आप मुझे कहां ले जा रहे हैं?\nपति: मैं तुम्हें बाज़ार ले जा रहा हूं।\nपत्नी: क्या खरीदना है?\nपति: तुम्हें जो पसंद हो, लेकिन पैसे मेरे पास सिर्फ 500 हैं!",
"चुटकुला 36:\n\nटीचर: तुम्हें शादी क्यों करनी है?\nछात्र: सर, क्योंकि मेरी मां ने कहा कि शादी के बाद मुझे कोई नहीं डांटेगा।\nटीचर: फिर क्या हुआ?\nछात्र: सर, शादी के बाद पता चला कि अब मुझे एक ही डांटने वाली बाकी है — बीवी!",
"चुटकुला 37:\n\nडॉक्टर: तुम्हें मीठा कम खाना चाहिए।\nमरीज़: डॉक्टर साहब, मैं मीठा नहीं खाता।\nडॉक्टर: तो फिर तुम्हारे दांत क्यों खराब हैं?\nमरीज़: डॉक्टर साहब, मैंने मीठा छोड़ा, लेकिन बीवी नहीं छोड़ी!",
"चुटकुला 38:\n\nटीचर: ज़िंदगी का सबसे बड़ा झटका क्या लगा?\nछात्र: सर, जब मैंने अपनी बीवी को मायके जाने के लिए तैयार किया, और वो बोली 'मैं नहीं जा रही' — ये सबसे बड़ा झटका था!",
"चुटकुला 39:\n\nपत्नी: जी, आपकी सबसे पसंदीदा चीज़ क्या है?\nपति: तुम।\nपत्नी: वाह, कितना प्यार!\nपति: नहीं, मेरी पसंदीदा चीज़ तुम्हारा मायके जाना है!",
"चुटकुला 40:\n\nटीचर: अगर तुम्हारी बीवी और बच्चा दोनों नदी में गिर जाएं, तो पहले किसे बचाओगे?\nछात्र: सर, बच्चे को।\nटीचर: बीवी को क्यों नहीं?\nछात्र: सर, बीवी तो खुद तैर कर निकल आएगी, बच्चा नहीं निकल सकेगा!",
"चुटकुला 41:\n\nडॉक्टर: तुम्हें आराम की ज़रूरत है।\nमरीज़: डॉक्टर साहब, मैं तो आराम ही करता हूं।\nडॉक्टर: फिर तुम बीमार कैसे हो?\nमरीज़: आराम करते करते थक गया!",
"चुटकुला 42:\n\nटीचर: तुम्हारा रिजल्ट कैसा है?\nछात्र: सर, पास हो गया!\nटीचर: कितने नंबर हैं?\nछात्र: सर, पास होने के लिए नंबर ज़रूरी नहीं!",
"चुटकुला 43:\n\nपत्नी: जी, आज शाम को कहां जाएं?\nपति: जहां तुम कहो।\nपत्नी: मायके चलें?\nपति: वहां क्यों?\nपत्नी: क्योंकि वहां खाना भी मिलेगा और आपकी तनख्वाह भी बच जाएगी!",
"चुटकुला 44:\n\nटीचर: ज़िंदगी का सबसे बड़ा सबक क्या मिला?\nछात्र: सर, शादी से पहले मैं सोचता था कि मैं बादशाह हूं, शादी के बाद पता चला कि मैं वज़ीर हूं — और बीवी प्रधानमंत्री!",
"चुटकुला 45:\n\nडॉक्टर: तुम्हें सोना चाहिए।\nमरीज़: डॉक्टर साहब, मैं सोता हूं।\nडॉक्टर: कितने घंटे?\nमरीज़: डॉक्टर साहब, मैं दिन भर सोता हूं!",
"चुटकुला 46:\n\nटीचर: अगर तुम्हें एक जहाज़ मिले तो कहां जाओगे?\nछात्र: सर, मायके!",
"चुटकुला 47:\n\nपत्नी: जी, अगर मैं मर जाऊं तो क्या करोगे?\nपति: दूसरी शादी कर लूंगा।\nपत्नी: और अगर मैं ज़िंदा रहूं?\nपति: फिर क्या, पहले वाली ही रहेगी!",
"चुटकुला 48:\n\nटीचर: अगर तुम्हें एक करोड़ रुपये मिलें तो क्या करोगे?\nछात्र: सर, पहले बीवी को मायके भेजूंगा, फिर चैन से सोऊंगा!",
"चुटकुला 49:\n\nडॉक्टर: तुम्हें सिगरेट नहीं पीनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं तो सिर्फ देखता हूं।\nडॉक्टर: तो फिर देखना छोड़ दो!",
"चुटकुला 50:\n\nटीचर: शादी के बाद क्या महसूस हुआ?\nछात्र: सर, पहले मुझे लगता था कि मैं आज़ाद हूं — शादी के बाद पता चला कि मैं पहले कैदी था, अब रिहाई मिली है!",
"चुटकुला 51:\n\nपत्नी: जी, आप मुझे कितना प्यार करते हैं?\nपति: इतना कि तुम्हें मायके भी नहीं जाने दूंगा।\nपत्नी: वाह, इतनी मोहब्बत!\nपति: नहीं, मायके जाने का खर्चा बचाना है!",
"चुटकुला 52:\n\nटीचर: ज़िंदगी का सबसे बड़ा सदमा क्या हुआ?\nछात्र: सर, जब मेरी बीवी ने बताया कि मैं बाप बनने वाला हूं — और मैंने सोचा कि मैं तो खुद अभी बच्चा हूं!",
"चुटकुला 53:\n\nडॉक्टर: तुम्हें एक्सरसाइज की ज़रूरत है।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ बीवी से डांट खाने के बाद भागता हूं!",
"चुटकुला 54:\n\nटीचर: अगर तुम्हारी बीवी और मां एक साथ डांटें, तो किसकी सुनोगे?\nछात्र: सर, मां की।\nटीचर: बीवी की क्यों नहीं?\nछात्र: सर, बीवी की तो रात को भी सुननी है, मां की सिर्फ दिन में!",
"चुटकुला 55:\n\nपत्नी: जी, आज खाने में क्या बनाऊं?\nपति: जो तुम्हारा दिल करे।\nपत्नी: ठीक है, मैं आज कुछ नहीं बनाऊंगी।\nपति: अरे नहीं, मैंने तो मज़ाक किया था!",
"चुटकुला 56:\n\nटीचर: तुम्हें शादी क्यों करनी है?\nछात्र: सर, क्योंकि मेरी मां ने कहा कि शादी के बाद मुझे कोई नहीं डांटेगा।\nटीचर: फिर क्या हुआ?\nछात्र: सर, शादी के बाद पता चला कि अब मुझे एक ही डांटने वाली बाकी है — बीवी!",
"चुटकुला 57:\n\nडॉक्टर: तुम्हें मीठा कम खाना चाहिए।\nमरीज़: डॉक्टर साहब, मैं मीठा नहीं खाता।\nडॉक्टर: तो फिर तुम्हारे दांत क्यों खराब हैं?\nमरीज़: डॉक्टर साहब, मैंने मीठा छोड़ा, लेकिन बीवी नहीं छोड़ी!",
"चुटकुला 58:\n\nटीचर: ज़िंदगी का सबसे बड़ा झटका क्या लगा?\nछात्र: सर, जब मैंने अपनी बीवी को मायके जाने के लिए तैयार किया, और वो बोली 'मैं नहीं जा रही' — ये सबसे बड़ा झटका था!",
"चुटकुला 59:\n\nएक आदमी डॉक्टर के पास गया: डॉक्टर साहब, मुझे हर वक्त लगता है कि मैं मर जाऊंगा।\nडॉक्टर: कब से?\nआदमी: जब से मेरी शादी हुई है।\nडॉक्टर: भाई, ये बीमारी नहीं, ये हकीकत है!",
"चुटकुला 60:\n\nटीचर: अगर तुम्हें एक करोड़ रुपये मिलें तो क्या करोगे?\nछात्र: सर, पहले स्कूल की फीस दूंगा।\nटीचर: वाह, कितना अच्छा बच्चा है!\nछात्र: फिर बाकी पैसों से बीवी को मायके भेजूंगा!",
"चुटकुला 61:\n\nपत्नी: जी, अगर मैं मर जाऊं तो क्या करोगे?\nपति: दूसरी शादी कर लूंगा।\nपत्नी: और अगर मैं ज़िंदा रहूं?\nपति: फिर क्या, पहले वाली ही रहेगी!",
"चुटकुला 62:\n\nटीचर: हादसा और मुसीबत में क्या फर्क है?\nछात्र: सर, जब किसी की बीवी मायके चली जाए और वापसी पर एक्सीडेंट हो जाए और मर जाए, तो ये हादसा है। और अगर ज़िंदा सलामत घर वापस आ जाए, तो ये मुसीबत है!",
"चुटकुला 63:\n\nपति: जी, तुम मुझे कितना प्यार करती हो?\nपत्नी: इतना कि तुम्हारे बगैर एक घंटा नहीं रह सकती।\nपति: तो फिर आज खाना क्यों नहीं बनाया?\nपत्नी: क्योंकि मैं तुम्हारे बगैर खाना नहीं बना सकती!",
"चुटकुला 64:\n\nटीचर: अगर तुम्हारी बीवी और मां दोनों नदी में गिर जाएं, तो पहले किसे बचाओगे?\nछात्र: सर, पहले मां को, क्योंकि बीवी तो तैरना जानती है — मायके जाने के लिए रोज़ नदी पार करती है!",
"चुटकुला 65:\n\nडॉक्टर: तुम्हें क्या तकलीफ है?\nमरीज़: डॉक्टर साहब, मेरी बीवी मुझे रोज़ डांटती है।\nडॉक्टर: तो मैं क्या करूं?\nमरीज़: आप उसे कोई दवा दे दें ताकि वो डांटना छोड़ दे!",
"चुटकुला 66:\n\nटीचर: शादी के बाद क्या महसूस हुआ?\nछात्र: सर, पहले मुझे लगता था कि मैं आज़ाद हूं — शादी के बाद पता चला कि मैं पहले कैदी था, अब रिहाई मिली है!",
"चुटकुला 67:\n\nपत्नी: जी, आज बाज़ार चलें?\nपति: पैसे नहीं हैं।\nपत्नी: तो क्या हुआ, सिर्फ देखने चलेंगे।\nपति: पिछली बार भी यही कहा था, और मैंने 3 महीने की तनख्वाह बाज़ार में छोड़ दी!",
"चुटकुला 68:\n\nटीचर: अगर तुम्हें नौकरी मिले तो क्या करोगे?\nछात्र: सर, पहले महीने की तनख्वाह से मां को तोहफा दूंगा।\nटीचर: वाह, कितना अच्छा बेटा है!\nछात्र: फिर बाकी महीने भी मां को दे दूंगा, बीवी को कुछ नहीं!",
"चुटकुला 69:\n\nपत्नी: जी, आपने मुझे कभी फूल नहीं दिए।\nपति: तुम्हें फूल पसंद हैं?\nपत्नी: हां।\nपति: फिर कल बाज़ार से फूल खरीद लो!",
"चुटकुला 70:\n\nटीचर: ज़िंदगी का सबसे बड़ा सदमा क्या हुआ?\nछात्र: सर, जब मेरी बीवी ने बताया कि मैं बाप बनने वाला हूं — और मैंने सोचा कि मैं तो खुद अभी बच्चा हूं!",
"चुटकुला 71:\n\nडॉक्टर: तुम्हें एक्सरसाइज की ज़रूरत है।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ बीवी से डांट खाने के बाद भागता हूं!",
"चुटकुला 72:\n\nटीचर: अगर तुम्हारी बीवी और मां एक साथ डांटें, तो किसकी सुनोगे?\nछात्र: सर, मां की।\nटीचर: बीवी की क्यों नहीं?\nछात्र: सर, बीवी की तो रात को भी सुननी है, मां की सिर्फ दिन में!",
"चुटकुला 73:\n\nपत्नी: जी, आज खाने में क्या बनाऊं?\nपति: जो तुम्हारा दिल करे।\nपत्नी: ठीक है, मैं आज कुछ नहीं बनाऊंगी।\nपति: अरे नहीं, मैंने तो मज़ाक किया था!",
"चुटकुला 74:\n\nटीचर: ज़िंदगी का सबसे बड़ा सबक क्या मिला?\nछात्र: सर, शादी से पहले मैं सोचता था कि मैं बादशाह हूं, शादी के बाद पता चला कि मैं वज़ीर हूं — और बीवी प्रधानमंत्री!",
"चुटकुला 75:\n\nडॉक्टर: तुम्हें सिगरेट नहीं पीनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं तो सिर्फ देखता हूं।\nडॉक्टर: तो फिर देखना छोड़ दो!",
"चुटकुला 76:\n\nटीचर: अगर तुम्हें एक जहाज़ मिले तो कहां जाओगे?\nछात्र: सर, मायके!",
"चुटकुला 77:\n\nपत्नी: जी, आपकी सबसे पसंदीदा चीज़ क्या है?\nपति: तुम।\nपत्नी: वाह, कितना प्यार!\nपति: नहीं, मेरी पसंदीदा चीज़ तुम्हारा मायके जाना है!",
"चुटकुला 78:\n\nटीचर: अगर तुम्हारी बीवी और बच्चा दोनों छत पर चढ़ जाएं, तो पहले किसे नीचे लाओगे?\nछात्र: सर, बच्चे को।\nटीचर: बीवी को क्यों नहीं?\nछात्र: सर, बीवी छत से खुद कूद कर नीचे आ जाएगी, बच्चा नहीं आ सकेगा!",
"चुटकुला 79:\n\nडॉक्टर: तुम्हें सोना चाहिए।\nमरीज़: डॉक्टर साहब, मैं सोता हूं।\nडॉक्टर: कितने घंटे?\nमरीज़: डॉक्टर साहब, मैं रात भर सोता हूं, दिन में बीवी नहीं सोने देती!",
"चुटकुला 80:\n\nटीचर: तुम्हारे घर में सबसे ताकतवर कौन है?\nछात्र: सर, मेरी बीवी।\nटीचर: कैसे?\nछात्र: सर, वो एक हाथ से पूरा घर चला सकती है, मेरी तनख्वाह भी!",
"चुटकुला 81:\n\nपत्नी: जी, अगर मैं और आपकी मां दोनों एक साथ बीमार हो जाएं, तो किसकी दवा लाओगे?\nपति: तुम्हारी!\nपत्नी: वाह, इतना प्यार!\nपति: नहीं, मां की दवा तो खुद आ जाएगी, तुम्हारी मैं ही लाऊंगा!",
"चुटकुला 82:\n\nटीचर: क्या तुम्हें लगता है, शादी ज़िंदगी का सबसे बड़ा फैसला है?\nछात्र: सर, नहीं, शादी ज़िंदगी का सबसे बड़ा 'हादसा' है — और बीवी 'मुसीबत'!",
"चुटकुला 83:\n\nडॉक्टर: तुम्हें क्या तकलीफ है?\nमरीज़: डॉक्टर साहब, मुझे हर वक्त लगता है कि मैं मर जाऊंगा।\nडॉक्टर: कब से?\nमरीज़: जब से मेरी शादी हुई है!",
"चुटकुला 84:\n\nटीचर: अगर तुम्हें एक करोड़ रुपये मिलें तो क्या करोगे?\nछात्र: सर, पहले बीवी को मायके भेजूंगा, फिर चैन से सोऊंगा!",
"चुटकुला 85:\n\nपत्नी: जी, आप मुझे कितना प्यार करते हैं?\nपति: इतना कि तुम्हें मायके भी नहीं जाने दूंगा।\nपत्नी: वाह, इतनी मोहब्बत!\nपति: नहीं, मायके जाने का खर्चा बचाना है!",
"चुटकुला 86:\n\nटीचर: शादी के बाद क्या महसूस हुआ?\nछात्र: सर, पहले मैं अकेला था, अब मैं 'हम' हूं — लेकिन 'हम' में सिर्फ बीवी की सुनी जाती है!",
"चुटकुला 87:\n\nडॉक्टर: तुम्हें एक्सरसाइज की ज़रूरत है।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह उठने की कोशिश करता हूं!",
"चुटकुला 88:\n\nटीचर: अगर तुम्हारी बीवी और मां बीमार हो जाएं, तो किसे अस्पताल ले जाओगे?\nछात्र: सर, मां को।\nटीचर: बीवी का क्या होगा?\nछात्र: सर, बीवी तो खुद अस्पताल चली जाएगी — मुझे तो मां को ले जाने की फिक्र है!",
"चुटकुला 89:\n\nपत्नी: जी, आज खाने में क्या है?\nपति: जो तुमने बनाया है।\nपत्नी: मैंने कुछ नहीं बनाया!\nपति: तो फिर बाहर से मंगवा लो!",
"चुटकुला 90:\n\nटीचर: तुम्हारे पिता क्या करते हैं?\nछात्र: सर, वो मेरे पिता हैं!\nटीचर: वो तो मुझे भी पता है, क्या काम करते हैं?\nछात्र: सर, वो मेरी मां के पति हैं!",
"चुटकुला 91:\n\nडॉक्टर: तुम्हें फल खाने चाहिएं।\nमरीज़: डॉक्टर साहब, मैं रोज़ आम खाता हूं।\nडॉक्टर: सिर्फ आम?\nमरीज़: डॉक्टर साहब, आम का मतलब है 'फलों का बादशाह'!",
"चुटकुला 92:\n\nटीचर: अगर तुम्हें एक रात के लिए प्रधानमंत्री बना दिया जाए, तो क्या करोगे?\nछात्र: सर, पहले स्कूल की छुट्टी करूंगा, फिर अपनी बीवी की तनख्वाह बढ़ाऊंगा!",
"चुटकुला 93:\n\nपत्नी: जी, आप मुझे कहां ले जा रहे हैं?\nपति: मैं तुम्हें बाज़ार ले जा रहा हूं।\nपत्नी: क्या खरीदना है?\nपति: तुम्हें जो पसंद हो, लेकिन पैसे मेरे पास सिर्फ 500 हैं!",
"चुटकुला 94:\n\nटीचर: तुम्हें शादी क्यों करनी है?\nछात्र: सर, क्योंकि मेरी मां ने कहा कि शादी के बाद मुझे कोई नहीं डांटेगा।\nटीचर: फिर क्या हुआ?\nछात्र: सर, शादी के बाद पता चला कि अब मुझे एक ही डांटने वाली बाकी है — बीवी!",
"चुटकुला 95:\n\nडॉक्टर: तुम्हें मीठा कम खाना चाहिए।\nमरीज़: डॉक्टर साहब, मैं मीठा नहीं खाता।\nडॉक्टर: तो फिर तुम्हारे दांत क्यों खराब हैं?\nमरीज़: डॉक्टर साहब, मैंने मीठा छोड़ा, लेकिन बीवी नहीं छोड़ी!",
"चुटकुला 96:\n\nटीचर: ज़िंदगी का सबसे बड़ा झटका क्या लगा?\nछात्र: सर, जब मैंने अपनी बीवी को मायके जाने के लिए तैयार किया, और वो बोली 'मैं नहीं जा रही' — ये सबसे बड़ा झटका था!",
"चुटकुला 97:\n\nपत्नी: जी, आपकी सबसे पसंदीदा चीज़ क्या है?\nपति: तुम।\nपत्नी: वाह, कितना प्यार!\nपति: नहीं, मेरी पसंदीदा चीज़ तुम्हारा मायके जाना है!",
"चुटकुला 98:\n\nटीचर: अगर तुम्हारी बीवी और बच्चा दोनों नदी में गिर जाएं, तो पहले किसे बचाओगे?\nछात्र: सर, बच्चे को।\nटीचर: बीवी को क्यों नहीं?\nछात्र: सर, बीवी तो खुद तैर कर निकल आएगी, बच्चा नहीं निकल सकेगा!",
"चुटकुला 99:\n\nडॉक्टर: तुम्हें आराम की ज़रूरत है।\nमरीज़: डॉक्टर साहब, मैं तो आराम ही करता हूं।\nडॉक्टर: फिर तुम बीमार कैसे हो?\nमरीज़: आराम करते करते थक गया!",
"चुटकुला 100:\n\nटीचर: हादसा और मुसीबत में क्या फर्क है?\nछात्र: सर, जब किसी की बीवी मायके चली जाए और वापसी पर एक्सीडेंट हो जाए और मर जाए, तो ये हादसा है। और अगर ज़िंदा सलामत घर वापस आ जाए, तो ये मुसीबत है! 😄",
"चुटकुला 101:\n\nपापा: बेटा, तुम्हारी गाड़ी कहां है?\nबेटा: पापा, गाड़ी तो ठीक है, लेकिन पेट्रोल खत्म हो गया है!\nपापा: तो फिर तुम कैसे आए?\nबेटा: मैंने गाड़ी को धक्का दिया, वो खुद चल पड़ी!",
"चुटकुला 102:\n\nटीचर: तुम्हें पढ़ाई में दिल क्यों नहीं लगता?\nछात्र: सर, दिल तो है, लेकिन दिमाग को छुट्टी चाहिए!",
"चुटकुला 103:\n\nमां: बेटा, कमरा साफ करो।\nबेटा: मां, मैं मसरूफ हूं।\nमां: क्या कर रहे हो?\nबेटा: सफाई के बारे में सोच रहा हूं!",
"चुटकुला 104:\n\nडॉक्टर: तुम्हें सिगरेट नहीं पीनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं तो सिर्फ देखता हूं।\nडॉक्टर: तो फिर देखना छोड़ दो!",
"चुटकुला 105:\n\nटीचर: तुम्हारा नाम क्या है?\nछात्र: सर, मेरा नाम अली है।\nटीचर: अली क्या करते हो?\nछात्र: सर, मैं पढ़ता हूं!",
"चुटकुला 106:\n\nपत्नी: जी, आज खाने में क्या बनाऊं?\nपति: जो तुम्हारा दिल करे।\nपत्नी: ठीक है, मैं आज कुछ नहीं बनाऊंगी।\nपति: अरे नहीं, मैंने तो मज़ाक किया था!",
"चुटकुला 107:\n\nटीचर: तुमने घर में क्या किया?\nछात्र: सर, मैंने पढ़ाई की।\nटीचर: फिर नंबर कम क्यों हैं?\nछात्र: सर, मैंने पढ़ाई की, लेकिन याद नहीं रही!",
"चुटकुला 108:\n\nपापा: बेटा, तुम्हारी आंखें क्यों लाल हैं?\nबेटा: पापा, मैंने रात भर पढ़ाई की।\nपापा: पढ़ाई की या फिल्म देखी?\nबेटा: पापा, फिल्म भी पढ़ाई का हिस्सा है!",
"चुटकुला 109:\n\nटीचर: तुम्हें इंग्लिश क्यों नहीं आती?\nछात्र: सर, मैंने कोशिश की, लेकिन इंग्लिश ने मुझे कबूल नहीं किया!",
"चुटकुला 110:\n\nमां: बेटा, बाहर जाकर खेलो।\nबेटा: मां, मैं तो मोबाइल पर खेल रहा हूं।\nमां: ये खेल नहीं है!\nबेटा: मां, ये नया खेल है!",
"चुटकुला 111:\n\nटीचर: तुमने होमवर्क क्यों नहीं किया?\nछात्र: सर, मैंने सोचा कि आप छोटी-मोटी गलतियां माफ कर देते हैं!",
"चुटकुला 112:\n\nडॉक्टर: तुम्हें आराम की ज़रूरत है।\nमरीज़: डॉक्टर साहब, मैं तो आराम ही करता हूं!\nडॉक्टर: फिर तुम बीमार कैसे हो?\nमरीज़: आराम करते करते थक गया!",
"चुटकुला 113:\n\nटीचर: तुम्हें क्या बनना है?\nछात्र: सर, मैं डॉक्टर बनना चाहता हूं।\nटीचर: तो फिर पढ़ाई करो।\nछात्र: सर, मैं पढ़ाई कर रहा हूं, लेकिन डॉक्टर बनने के लिए!",
"चुटकुला 114:\n\nपत्नी: जी, आप मुझे कितना प्यार करते हैं?\nपति: इतना कि तुम्हारे बगैर एक दिन नहीं रह सकता।\nपत्नी: तो फिर आपने आज खाना क्यों नहीं बनाया?\nपति: क्योंकि मैं तुम्हारे बगैर खाना नहीं बना सकता!",
"चुटकुला 115:\n\nटीचर: तुम्हें सज़ा मिलनी चाहिए।\nछात्र: सर, मैंने क्या किया?\nटीचर: तुमने क्लास में सोते हुए क्या किया?\nछात्र: सर, मैंने सपने में पढ़ाई की!",
"चुटकुला 116:\n\nमां: बेटा, आज स्कूल में क्या हुआ?\nबेटा: मां, टीचर ने मुझे शाबाशी दी।\nमां: किस बात पर?\nबेटा: मैंने क्लास में बात नहीं की!",
"चुटकुला 117:\n\nपापा: बेटा, तुम्हारी गाड़ी का टायर पंक्चर क्यों है?\nबेटा: पापा, मैंने इसे हवा नहीं दी।\nपापा: तो फिर ये कैसे चली?\nबेटा: पापा, मैंने इसे धक्का दिया!",
"चुटकुला 118:\n\nटीचर: तुम्हें गणित क्यों नहीं आती?\nछात्र: सर, मैंने कोशिश की, लेकिन नंबर मेरे दोस्त नहीं हैं!",
"चुटकुला 119:\n\nडॉक्टर: तुम्हें पानी ज़्यादा पीना चाहिए।\nमरीज़: डॉक्टर साहब, मैं रोज़ नहाता हूं!\nडॉक्टर: नहाना पानी पीना नहीं होता!",
"चुटकुला 120:\n\nपत्नी: जी, आप मुझे क्या तोहफा देंगे?\nपति: तुम्हें जो चाहिए वो मांगो।\nपत्नी: मुझे एक नया मोबाइल चाहिए।\nपति: अरे नहीं, मैंने मज़ाक किया था!",
"चुटकुला 121:\n\nटीचर: तुमने कॉपी में क्या लिखा?\nछात्र: सर, मैंने होमवर्क लिखा।\nटीचर: तो फिर ये गंदगी क्या है?\nछात्र: सर, ये होमवर्क का हिस्सा है!",
"चुटकुला 122:\n\nमां: बेटा, तुम्हारी आंखें कैसी हैं?\nबेटा: मां, मैंने रात भर मोबाइल देखा।\nमां: ये अच्छी बात नहीं!\nबेटा: मां, मैंने पढ़ाई के लिए देखा!",
"चुटकुला 123:\n\nटीचर: तुम्हें साइंस क्यों पसंद है?\nछात्र: सर, क्योंकि इसमें एक्सपेरिमेंट करते हैं!\nटीचर: तो फिर तुमने क्या एक्सपेरिमेंट किया?\nछात्र: सर, मैंने सोना एक्सपेरिमेंट किया!",
"चुटकुला 124:\n\nपापा: बेटा, तुम्हारा रिजल्ट कैसा है?\nबेटा: पापा, मैं पास हो गया!\nपापा: कितने नंबर हैं?\nबेटा: पापा, पास होने के लिए नंबर ज़रूरी नहीं!",
"चुटकुला 125:\n\nपत्नी: जी, आपने मुझे कभी फूल नहीं दिए।\nपति: तुम्हें फूल पसंद हैं?\nपत्नी: हां।\nपति: फिर कल बाज़ार से फूल खरीद लो!",
"चुटकुला 126:\n\nटीचर: तुम्हें इतिहास क्यों नहीं आता?\nछात्र: सर, इतिहास तो पुराना होता है, मुझे नई चीज़ें पसंद हैं!",
"चुटकुला 127:\n\nडॉक्टर: तुम्हें एक्सरसाइज करनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह उठने की कोशिश करता हूं!",
"चुटकुला 128:\n\nमां: बेटा, तुम्हारा कमरा गंदा क्यों है?\nबेटा: मां, मैंने सफाई की कोशिश की, लेकिन कमरा साफ नहीं हुआ!",
"चुटकुला 129:\n\nटीचर: तुम्हें इंग्लिश क्यों नहीं आती?\nछात्र: सर, मैंने इंग्लिश सीखने की कोशिश की, लेकिन इंग्लिश ने सीखने से इंकार कर दिया!",
"चुटकुला 130:\n\nपापा: बेटा, तुम्हारी गाड़ी कहां है?\nबेटा: पापा, मैंने इसे पार्क किया।\nपापा: कहां?\nबेटा: पापा, पेड़ पर!",
"चुटकुला 131:\n\nपत्नी: जी, आप मुझे कहां ले जा रहे हैं?\nपति: मैं तुम्हें बाज़ार ले जा रहा हूं।\nपत्नी: क्या खरीदना है?\nपति: तुम्हें जो पसंद हो!",
"चुटकुला 132:\n\nटीचर: तुमने परीक्षा में क्या किया?\nछात्र: सर, मैंने कॉपी में लिखा।\nटीचर: फिर क्या हुआ?\nछात्र: सर, मैंने कॉपी में लिखा, लेकिन टीचर ने पढ़ा नहीं!",
"चुटकुला 133:\n\nडॉक्टर: तुम्हें मीठा कम खाना चाहिए।\nमरीज़: डॉक्टर साहब, मैं मीठा नहीं खाता।\nडॉक्टर: तो फिर तुम्हारे दांत क्यों खराब हैं?\nमरीज़: डॉक्टर साहब, मैंने मीठा छोड़ा, लेकिन बीवी नहीं छोड़ी!",
"चुटकुला 134:\n\nमां: बेटा, तुम्हें नींद क्यों आ रही है?\nबेटा: मां, मैंने रात भर पढ़ाई की।\nमां: पढ़ाई की या गेम खेला?\nबेटा: मां, गेम भी पढ़ाई का हिस्सा है!",
"चुटकुला 135:\n\nटीचर: तुम्हें भूगोल क्यों नहीं आता?\nछात्र: सर, मैंने कोशिश की, लेकिन दुनिया बहुत बड़ी है!",
"चुटकुला 136:\n\nपापा: बेटा, तुम्हारा मोबाइल कहां है?\nबेटा: पापा, मैंने इसे चार्ज पर लगाया है।\nपापा: कहां?\nबेटा: पापा, मैंने इसे फ्रिज में रखा है, वहां ठंडा रहेगा!",
"चुटकुला 137:\n\nपत्नी: जी, आप मुझे कितना प्यार करते हैं?\nपति: इतना कि तुम्हारे बगैर एक घंटा नहीं रह सकता।\nपत्नी: तो फिर आपने मुझे फूल क्यों नहीं दिए?\nपति: क्योंकि फूल महंगे होते हैं!",
"चुटकुला 138:\n\nटीचर: तुम्हें कंप्यूटर क्यों पसंद है?\nछात्र: सर, क्योंकि ये सब कुछ कर सकता है!\nटीचर: तो फिर तुमने क्या किया?\nछात्र: सर, मैंने इसे ऑन किया और सो गया!",
"चुटकुला 139:\n\nडॉक्टर: तुम्हें सोना चाहिए।\nमरीज़: डॉक्टर साहब, मैं सोता हूं।\nडॉक्टर: कितने घंटे?\nमरीज़: डॉक्टर साहब, मैं दिन भर सोता हूं!",
"चुटकुला 140:\n\nमां: बेटा, तुम्हारा बैग कहां है?\nबेटा: मां, मैंने इसे स्कूल में छोड़ दिया।\nमां: क्यों?\nबेटा: मां, मैंने सोचा कि कल फिर ले आऊंगा!",
"चुटकुला 141:\n\nटीचर: तुम्हें पढ़ाई में दिल क्यों नहीं लगता?\nछात्र: सर, दिल तो है, लेकिन दिमाग को आराम चाहिए!",
"चुटकुला 142:\n\nपापा: बेटा, तुम्हारी गाड़ी का रंग क्या है?\nबेटा: पापा, मेरी गाड़ी का रंग नीला है।\nपापा: तो फिर ये लाल क्यों है?\nबेटा: पापा, मैंने इसे पेंट किया!",
"चुटकुला 143:\n\nपत्नी: जी, आज खाने में क्या है?\nपति: जो तुमने बनाया है।\nपत्नी: मैंने कुछ नहीं बनाया!\nपति: तो फिर बाहर से मंगवा लो!",
"चुटकुला 144:\n\nटीचर: तुमने होमवर्क कहां किया?\nछात्र: सर, मैंने घर पर किया।\nटीचर: फिर कॉपी में क्यों नहीं है?\nछात्र: सर, मैंने घर पर किया, कॉपी में नहीं!",
"चुटकुला 145:\n\nडॉक्टर: तुम्हें एक्सरसाइज करनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह भागता हूं!",
"चुटकुला 146:\n\nमां: बेटा, तुम्हारे कपड़े गंदे क्यों हैं?\nबेटा: मां, मैं खेलते वक्त गिर गया।\nमां: फिर क्या हुआ?\nबेटा: मां, मैंने फिर खेला!",
"चुटकुला 147:\n\nटीचर: तुम्हें गणित क्यों पसंद है?\nछात्र: सर, क्योंकि इसमें नंबर होते हैं!\nटीचर: तो फिर तुम्हारे नंबर कम क्यों हैं?\nछात्र: सर, नंबर तो हैं, लेकिन कम हैं!",

"चुटकुला 149:\n\nपत्नी: जी, आप मुझे कहां ले जा रहे हैं?\nपति: मैं तुम्हें सैर पर ले जा रहा हूं।\nपत्नी: कहां?\nपति: तुम्हें जो पसंद हो!",
"चुटकुला 150:\n\nटीचर: तुमने परीक्षा में क्या लिखा?\nछात्र: सर, मैंने जो याद था लिखा।\nटीचर: और जो याद नहीं था?\nछात्र: सर, मैंने उसे छोड़ दिया!",
"चुटकुला 151:\n\nडॉक्टर: तुम्हें फल खाने चाहिएं।\nमरीज़: डॉक्टर साहब, मैं रोज़ फल खाता हूं।\nडॉक्टर: कौन सा?\nमरीज़: डॉक्टर साहब, मैं आम खाता हूं!",
"चुटकुला 152:\n\nमां: बेटा, तुम्हारा होमवर्क कहां है?\nबेटा: मां, मैंने इसे स्कूल में छोड़ दिया।\nमां: क्यों?\nबेटा: मां, मैंने सोचा कि कल फिर ले आऊंगा!",
"चुटकुला 153:\n\nटीचर: तुम्हें साइंस क्यों पसंद है?\nछात्र: सर, क्योंकि इसमें एक्सपेरिमेंट करते हैं!\nटीचर: तो फिर तुमने क्या एक्सपेरिमेंट किया?\nछात्र: सर, मैंने सोना एक्सपेरिमेंट किया!",
"चुटकुला 154:\n\nपापा: बेटा, तुम्हारी गाड़ी कहां है?\nबेटा: पापा, मैंने इसे पार्क किया।\nपापा: कहां?\nबेटा: पापा, मैंने इसे घर के बाहर पार्क किया!",
"चुटकुला 155:\n\nपत्नी: जी, आप मुझे क्या तोहफा देंगे?\nपति: तुम्हें जो चाहिए वो मांगो।\nपत्नी: मुझे एक नया बैग चाहिए।\nपति: अरे नहीं, मैंने मज़ाक किया था!",
"चुटकुला 156:\n\nटीचर: तुम्हें इतिहास क्यों नहीं आता?\nछात्र: सर, इतिहास तो पुराना होता है, मुझे नई चीज़ें पसंद हैं!",
"चुटकुला 157:\n\nडॉक्टर: तुम्हें एक्सरसाइज करनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह उठने की कोशिश करता हूं!",
"चुटकुला 158:\n\nमां: बेटा, तुम्हारा कमरा गंदा क्यों है?\nबेटा: मां, मैंने सफाई की कोशिश की, लेकिन कमरा साफ नहीं हुआ!",
"चुटकुला 159:\n\nटीचर: तुम्हें इंग्लिश क्यों नहीं आती?\nछात्र: सर, मैंने इंग्लिश सीखने की कोशिश की, लेकिन इंग्लिश ने सीखने से इंकार कर दिया!",
"चुटकुला 160:\n\nपापा: बेटा, तुम्हारी गाड़ी कहां है?\nबेटा: पापा, मैंने इसे पार्क किया।\nपापा: कहां?\nबेटा: पापा, पेड़ पर!",

"चुटकुला 183:\n\nटीचर: तुम्हें साइंस क्यों पसंद है?\nछात्र: सर, क्योंकि इसमें एक्सपेरिमेंट करते हैं!\nटीचर: तो फिर तुमने क्या एक्सपेरिमेंट किया?\nछात्र: सर, मैंने सोना एक्सपेरिमेंट किया!",
"चुटकुला 184:\n\nपापा: बेटा, तुम्हारी गाड़ी कहां है?\nबेटा: पापा, मैंने इसे पार्क किया।\nपापा: कहां?\nबेटा: पापा, मैंने इसे घर के बाहर पार्क किया!",
"चुटकुला 185:\n\nपत्नी: जी, आप मुझे क्या तोहफा देंगे?\nपति: तुम्हें जो चाहिए वो मांगो।\nपत्नी: मुझे एक नया बैग चाहिए।\nपति: अरे नहीं, मैंने मज़ाक किया था!",
"चुटकुला 186:\n\nटीचर: तुम्हें इतिहास क्यों नहीं आता?\nछात्र: सर, इतिहास तो पुराना होता है, मुझे नई चीज़ें पसंद हैं!",
"चुटकुला 187:\n\nडॉक्टर: तुम्हें एक्सरसाइज करनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह उठने की कोशिश करता हूं!",
"चुटकुला 188:\n\nमां: बेटा, तुम्हारा कमरा गंदा क्यों है?\nबेटा: मां, मैंने सफाई की कोशिश की, लेकिन कमरा साफ नहीं हुआ!",
"चुटकुला 189:\n\nटीचर: तुम्हें इंग्लिश क्यों नहीं आती?\nछात्र: सर, मैंने इंग्लिश सीखने की कोशिश की, लेकिन इंग्लिश ने सीखने से इंकार कर दिया!",
"चुटकुला 190:\n\nपापा: बेटा, तुम्हारी गाड़ी कहां है?\nबेटा: पापा, मैंने इसे पार्क किया।\nपापा: कहां?\nबेटा: पापा, पेड़ पर!",

"चुटकुला 234:\n\nटीचर: तुमने होमवर्क कहां किया?\nछात्र: सर, मैंने घर पर किया।\nटीचर: फिर कॉपी में क्यों नहीं है?\nछात्र: सर, मैंने घर पर किया, कॉपी में नहीं!",
"चुटकुला 235:\n\nडॉक्टर: तुम्हें एक्सरसाइज करनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह भागता हूं!",
"चुटकुला 236:\n\nमां: बेटा, तुम्हारे कपड़े गंदे क्यों हैं?\nबेटा: मां, मैं खेलते वक्त गिर गया।\nमां: फिर क्या हुआ?\nबेटा: मां, मैंने फिर खेला!",
"चुटकुला 237:\n\nटीचर: तुम्हें गणित क्यों पसंद है?\nछात्र: सर, क्योंकि इसमें नंबर होते हैं!\nटीचर: तो फिर तुम्हारे नंबर कम क्यों हैं?\nछात्र: सर, नंबर तो हैं, लेकिन कम हैं!",
"चुटकुला 238:\n\nपापा: बेटा, तुम्हारा मोबाइल कहां है?\nबेटा: पापा, मैंने इसे खो दिया।\nपापा: कहां?\nबेटा: पापा, मैंने इसे घर में कहीं रखा था!",
"चुटकुला 239:\n\nपत्नी: जी, आप मुझे कहां ले जा रहे हैं?\nपति: मैं तुम्हें सैर पर ले जा रहा हूं।\nपत्नी: कहां?\nपति: तुम्हें जो पसंद हो!",
"चुटकुला 240:\n\nटीचर: तुमने परीक्षा में क्या लिखा?\nछात्र: सर, मैंने जो याद था लिखा।\nटीचर: और जो याद नहीं था?\nछात्र: सर, मैंने उसे छोड़ दिया!",
"चुटकुला 241:\n\nडॉक्टर: तुम्हें फल खाने चाहिएं।\nमरीज़: डॉक्टर साहब, मैं रोज़ फल खाता हूं।\nडॉक्टर: कौन सा?\nमरीज़: डॉक्टर साहब, मैं आम खाता हूं!",
"चुटकुला 242:\n\nमां: बेटा, तुम्हारा होमवर्क कहां है?\nबेटा: मां, मैंने इसे स्कूल में छोड़ दिया।\nमां: क्यों?\nबेटा: मां, मैंने सोचा कि कल फिर ले आऊंगा!",
"चुटकुला 243:\n\nटीचर: तुम्हें साइंस क्यों पसंद है?\nछात्र: सर, क्योंकि इसमें एक्सपेरिमेंट करते हैं!\nटीचर: तो फिर तुमने क्या एक्सपेरिमेंट किया?\nछात्र: सर, मैंने सोना एक्सपेरिमेंट किया!",
"चुटकुला 244:\n\nपापा: बेटा, तुम्हारी गाड़ी कहां है?\nबेटा: पापा, मैंने इसे पार्क किया।\nपापा: कहां?\nबेटा: पापा, मैंने इसे घर के बाहर पार्क किया!",
"चुटकुला 245:\n\nपत्नी: जी, आप मुझे क्या तोहफा देंगे?\nपति: तुम्हें जो चाहिए वो मांगो।\nपत्नी: मुझे एक नया बैग चाहिए।\nपति: अरे नहीं, मैंने मज़ाक किया था!",
"चुटकुला 246:\n\nटीचर: तुम्हें इतिहास क्यों नहीं आता?\nछात्र: सर, इतिहास तो पुराना होता है, मुझे नई चीज़ें पसंद हैं!",
"चुटकुला 247:\n\nडॉक्टर: तुम्हें एक्सरसाइज करनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह उठने की कोशिश करता हूं!",
"चुटकुला 248:\n\nमां: बेटा, तुम्हारा कमरा गंदा क्यों है?\nबेटा: मां, मैंने सफाई की कोशिश की, लेकिन कमरा साफ नहीं हुआ!",
"चुटकुला 249:\n\nटीचर: तुम्हें इंग्लिश क्यों नहीं आती?\nछात्र: सर, मैंने इंग्लिश सीखने की कोशिश की, लेकिन इंग्लिश ने सीखने से इंकार कर दिया!",
"चुटकुला 250:\n\nपापा: बेटा, तुम्हारी गाड़ी कहां है?\nबेटा: पापा, मैंने इसे पार्क किया।\nपापा: कहां?\nबेटा: पापा, पेड़ पर!",
"चुटकुला 251:\n\nपत्नी: जी, आप मुझे कहां ले जा रहे हैं?\nपति: मैं तुम्हें बाज़ार ले जा रहा हूं।\nपत्नी: क्या खरीदना है?\nपति: तुम्हें जो पसंद हो!",
"चुटकुला 252:\n\nटीचर: तुमने परीक्षा में क्या किया?\nछात्र: सर, मैंने कॉपी में लिखा।\nटीचर: फिर क्या हुआ?\nछात्र: सर, मैंने कॉपी में लिखा, लेकिन टीचर ने पढ़ा नहीं!",
"चुटकुला 253:\n\nडॉक्टर: तुम्हें मीठा कम खाना चाहिए।\nमरीज़: डॉक्टर साहब, मैं मीठा नहीं खाता।\nडॉक्टर: तो फिर तुम्हारे दांत क्यों खराब हैं?\nमरीज़: डॉक्टर साहब, मैंने मीठा छोड़ा, लेकिन बीवी नहीं छोड़ी!",
"चुटकुला 254:\n\nमां: बेटा, तुम्हें नींद क्यों आ रही है?\nबेटा: मां, मैंने रात भर पढ़ाई की।\nमां: पढ़ाई की या गेम खेला?\nबेटा: मां, गेम भी पढ़ाई का हिस्सा है!",
"चुटकुला 255:\n\nटीचर: तुम्हें भूगोल क्यों नहीं आता?\nछात्र: सर, मैंने कोशिश की, लेकिन दुनिया बहुत बड़ी है!",
"चुटकुला 256:\n\nपापा: बेटा, तुम्हारा मोबाइल कहां है?\nबेटा: पापा, मैंने इसे चार्ज पर लगाया है।\nपापा: कहां?\nबेटा: पापा, मैंने इसे फ्रिज में रखा है, वहां ठंडा रहेगा!",
"चुटकुला 257:\n\nपत्नी: जी, आप मुझे कितना प्यार करते हैं?\nपति: इतना कि तुम्हारे बगैर एक घंटा नहीं रह सकता।\nपत्नी: तो फिर आपने मुझे फूल क्यों नहीं दिए?\nपति: क्योंकि फूल महंगे होते हैं!",
"चुटकुला 258:\n\nटीचर: तुम्हें कंप्यूटर क्यों पसंद है?\nछात्र: सर, क्योंकि ये सब कुछ कर सकता है!\nटीचर: तो फिर तुमने क्या किया?\nछात्र: सर, मैंने इसे ऑन किया और सो गया!",
"चुटकुला 259:\n\nडॉक्टर: तुम्हें सोना चाहिए।\nमरीज़: डॉक्टर साहब, मैं सोता हूं।\nडॉक्टर: कितने घंटे?\nमरीज़: डॉक्टर साहब, मैं दिन भर सोता हूं!",
"चुटकुला 260:\n\nमां: बेटा, तुम्हारा बैग कहां है?\nबेटा: मां, मैंने इसे स्कूल में छोड़ दिया।\nमां: क्यों?\nबेटा: मां, मैंने सोचा कि कल फिर ले आऊंगा!",
"चुटकुला 261:\n\nटीचर: तुम्हें पढ़ाई में दिल क्यों नहीं लगता?\nछात्र: सर, दिल तो है, लेकिन दिमाग को आराम चाहिए!",

"चुटकुला 337:\n\nडॉक्टर: तुम्हें एक्सरसाइज करनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह उठने की कोशिश करता हूं!",
"चुटकुला 338:\n\nमां: बेटा, तुम्हारा कमरा गंदा क्यों है?\nबेटा: मां, मैंने सफाई की कोशिश की, लेकिन कमरा साफ नहीं हुआ!",
"चुटकुला 339:\n\nटीचर: तुम्हें इंग्लिश क्यों नहीं आती?\nछात्र: सर, मैंने इंग्लिश सीखने की कोशिश की, लेकिन इंग्लिश ने सीखने से इंकार कर दिया!",
"चुटकुला 340:\n\nपापा: बेटा, तुम्हारी गाड़ी कहां है?\nबेटा: पापा, मैंने इसे पार्क किया।\nपापा: कहां?\nबेटा: पापा, पेड़ पर!",
"चुटकुला 341:\n\nपत्नी: जी, आप मुझे कहां ले जा रहे हैं?\nपति: मैं तुम्हें बाज़ार ले जा रहा हूं।\nपत्नी: क्या खरीदना है?\nपति: तुम्हें जो पसंद हो!",
"चुटकुला 342:\n\nटीचर: तुमने परीक्षा में क्या किया?\nछात्र: सर, मैंने कॉपी में लिखा।\nटीचर: फिर क्या हुआ?\nछात्र: सर, मैंने कॉपी में लिखा, लेकिन टीचर ने पढ़ा नहीं!",
"चुटकुला 343:\n\nडॉक्टर: तुम्हें मीठा कम खाना चाहिए।\nमरीज़: डॉक्टर साहब, मैं मीठा नहीं खाता।\nडॉक्टर: तो फिर तुम्हारे दांत क्यों खराब हैं?\nमरीज़: डॉक्टर साहब, मैंने मीठा छोड़ा, लेकिन बीवी नहीं छोड़ी!",
"चुटकुला 344:\n\nमां: बेटा, तुम्हें नींद क्यों आ रही है?\nबेटा: मां, मैंने रात भर पढ़ाई की।\nमां: पढ़ाई की या गेम खेला?\nबेटा: मां, गेम भी पढ़ाई का हिस्सा है!",
"चुटकुला 345:\n\nटीचर: तुम्हें भूगोल क्यों नहीं आता?\nछात्र: सर, मैंने कोशिश की, लेकिन दुनिया बहुत बड़ी है!",
"चुटकुला 346:\n\nपापा: बेटा, तुम्हारा मोबाइल कहां है?\nबेटा: पापा, मैंने इसे चार्ज पर लगाया है।\nपापा: कहां?\nबेटा: पापा, मैंने इसे फ्रिज में रखा है, वहां ठंडा रहेगा!",
"चुटकुला 347:\n\nपत्नी: जी, आप मुझे कितना प्यार करते हैं?\nपति: इतना कि तुम्हारे बगैर एक घंटा नहीं रह सकता।\nपत्नी: तो फिर आपने मुझे फूल क्यों नहीं दिए?\nपति: क्योंकि फूल महंगे होते हैं!",
"चुटकुला 348:\n\nटीचर: तुम्हें कंप्यूटर क्यों पसंद है?\nछात्र: सर, क्योंकि ये सब कुछ कर सकता है!\nटीचर: तो फिर तुमने क्या किया?\nछात्र: सर, मैंने इसे ऑन किया और सो गया!",
"चुटकुला 349:\n\nडॉक्टर: तुम्हें सोना चाहिए।\nमरीज़: डॉक्टर साहब, मैं सोता हूं।\nडॉक्टर: कितने घंटे?\nमरीज़: डॉक्टर साहब, मैं दिन भर सोता हूं!",
"चुटकुला 350:\n\nमां: बेटा, तुम्हारा बैग कहां है?\nबेटा: मां, मैंने इसे स्कूल में छोड़ दिया।\nमां: क्यों?\nबेटा: मां, मैंने सोचा कि कल फिर ले आऊंगा!",
"चुटकुला 351:\n\nटीचर: तुम्हें पढ़ाई में दिल क्यों नहीं लगता?\nछात्र: सर, दिल तो है, लेकिन दिमाग को आराम चाहिए!",
"चुटकुला 352:\n\nपापा: बेटा, तुम्हारी गाड़ी का रंग क्या है?\nबेटा: पापा, मेरी गाड़ी का रंग नीला है।\nपापा: तो फिर ये लाल क्यों है?\nबेटा: पापा, मैंने इसे पेंट किया!",

"चुटकुला 354:\n\nटीचर: तुमने होमवर्क कहां किया?\nछात्र: सर, मैंने घर पर किया।\nटीचर: फिर कॉपी में क्यों नहीं है?\nछात्र: सर, मैंने घर पर किया, कॉपी में नहीं!",

"चुटकुला 356:\n\nमां: बेटा, तुम्हारे कपड़े गंदे क्यों हैं?\nबेटा: मां, मैं खेलते वक्त गिर गया।\nमां: फिर क्या हुआ?\nबेटा: मां, मैंने फिर खेला!",
"चुटकुला 357:\n\nटीचर: तुम्हें गणित क्यों पसंद है?\nछात्र: सर, क्योंकि इसमें नंबर होते हैं!\nटीचर: तो फिर तुम्हारे नंबर कम क्यों हैं?\nछात्र: सर, नंबर तो हैं, लेकिन कम हैं!",

"चुटकुला 359:\n\nपत्नी: जी, आप मुझे कहां ले जा रहे हैं?\nपति: मैं तुम्हें सैर पर ले जा रहा हूं।\nपत्नी: कहां?\nपति: तुम्हें जो पसंद हो!",
"चुटकुला 360:\n\nटीचर: तुमने परीक्षा में क्या लिखा?\nछात्र: सर, मैंने जो याद था लिखा।\nटीचर: और जो याद नहीं था?\nछात्र: सर, मैंने उसे छोड़ दिया!",
"चुटकुला 361:\n\nडॉक्टर: तुम्हें फल खाने चाहिएं।\nमरीज़: डॉक्टर साहब, मैं रोज़ फल खाता हूं।\nडॉक्टर: कौन सा?\nमरीज़: डॉक्टर साहब, मैं आम खाता हूं!",
"चुटकुला 362:\n\nमां: बेटा, तुम्हारा होमवर्क कहां है?\nबेटा: मां, मैंने इसे स्कूल में छोड़ दिया।\nमां: क्यों?\nबेटा: मां, मैंने सोचा कि कल फिर ले आऊंगा!",

"चुटकुला 364:\n\nपापा: बेटा, तुम्हारी गाड़ी कहां है?\nबेटा: पापा, मैंने इसे पार्क किया।\nपापा: कहां?\nबेटा: पापा, मैंने इसे घर के बाहर पार्क किया!",
"चुटकुला 365:\n\nपत्नी: जी, आप मुझे क्या तोहफा देंगे?\nपति: तुम्हें जो चाहिए वो मांगो।\nपत्नी: मुझे एक नया बैग चाहिए।\nपति: अरे नहीं, मैंने मज़ाक किया था!",

"चुटकुला 441:\n\nटीचर: तुम्हें पढ़ाई में दिल क्यों नहीं लगता?\nछात्र: सर, दिल तो है, लेकिन दिमाग को आराम चाहिए!",
"चुटकुला 442:\n\nपापा: बेटा, तुम्हारी गाड़ी का रंग क्या है?\nबेटा: पापा, मेरी गाड़ी का रंग नीला है।\nपापा: तो फिर ये लाल क्यों है?\nबेटा: पापा, मैंने इसे पेंट किया!",
"चुटकुला 443:\n\nपत्नी: जी, आज खाने में क्या है?\nपति: जो तुमने बनाया है।\nपत्नी: मैंने कुछ नहीं बनाया!\nपति: तो फिर बाहर से मंगवा लो!",
"चुटकुला 444:\n\nटीचर: तुमने होमवर्क कहां किया?\nछात्र: सर, मैंने घर पर किया।\nटीचर: फिर कॉपी में क्यों नहीं है?\nछात्र: सर, मैंने घर पर किया, कॉपी में नहीं!",
"चुटकुला 445:\n\nडॉक्टर: तुम्हें एक्सरसाइज करनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह भागता हूं!",

"चुटकुला 492:\n\nटीचर: तुमने परीक्षा में क्या किया?\nछात्र: सर, मैंने कॉपी में लिखा।\nटीचर: फिर क्या हुआ?\nछात्र: सर, मैंने कॉपी में लिखा, लेकिन टीचर ने पढ़ा नहीं!",
"चुटकुला 493:\n\nडॉक्टर: तुम्हें मीठा कम खाना चाहिए।\nमरीज़: डॉक्टर साहब, मैं मीठा नहीं खाता।\nडॉक्टर: तो फिर तुम्हारे दांत क्यों खराब हैं?\nमरीज़: डॉक्टर साहब, मैंने मीठा छोड़ा, लेकिन बीवी नहीं छोड़ी!",
"चुटकुला 494:\n\nमां: बेटा, तुम्हें नींद क्यों आ रही है?\nबेटा: मां, मैंने रात भर पढ़ाई की।\nमां: पढ़ाई की या गेम खेला?\nबेटा: मां, गेम भी पढ़ाई का हिस्सा है!",
"चुटकुला 495:\n\nटीचर: तुम्हें भूगोल क्यों नहीं आता?\nछात्र: सर, मैंने कोशिश की, लेकिन दुनिया बहुत बड़ी है!",
"चुटकुला 496:\n\nपापा: बेटा, तुम्हारा मोबाइल कहां है?\nबेटा: पापा, मैंने इसे चार्ज पर लगाया है।\nपापा: कहां?\nबेटा: पापा, मैंने इसे फ्रिज में रखा है, वहां ठंडा रहेगा!",
"चुटकुला 497:\n\nपत्नी: जी, आप मुझे कितना प्यार करते हैं?\nपति: इतना कि तुम्हारे बगैर एक घंटा नहीं रह सकता।\nपत्नी: तो फिर आपने मुझे फूल क्यों नहीं दिए?\nपति: क्योंकि फूल महंगे होते हैं!",
"चुटकुला 498:\n\nटीचर: तुम्हें कंप्यूटर क्यों पसंद है?\nछात्र: सर, क्योंकि ये सब कुछ कर सकता है!\nटीचर: तो फिर तुमने क्या किया?\nछात्र: सर, मैंने इसे ऑन किया और सो गया!",
"चुटकुला 499:\n\nडॉक्टर: तुम्हें सोना चाहिए।\nमरीज़: डॉक्टर साहब, मैं सोता हूं।\nडॉक्टर: कितने घंटे?\nमरीज़: डॉक्टर साहब, मैं दिन भर सोता हूं!",
"चुटकुला 500:\n\nमां: बेटा, तुम्हारा बैग कहां है?\nबेटा: मां, मैंने इसे स्कूल में छोड़ दिया।\nमां: क्यों?\nबेटा: मां, मैंने सोचा कि कल फिर ले आऊंगा! 😄",
"चुटकुला 501:\n\nटीचर: तुम्हें पढ़ाई में दिल क्यों नहीं लगता?\nछात्र: सर, दिल तो है, लेकिन दिमाग को आराम चाहिए!",

"चुटकुला 503:\n\nपत्नी: जी, आज खाने में क्या है?\nपति: जो तुमने बनाया है।\nपत्नी: मैंने कुछ नहीं बनाया!\nपति: तो फिर बाहर से मंगवा लो!",
"चुटकुला 504:\n\nटीचर: तुमने होमवर्क कहां किया?\nछात्र: सर, मैंने घर पर किया।\nटीचर: फिर कॉपी में क्यों नहीं है?\nछात्र: सर, मैंने घर पर किया, कॉपी में नहीं!",
"चुटकुला 505:\n\nडॉक्टर: तुम्हें एक्सरसाइज करनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह भागता हूं!",

"चुटकुला 645:\n\nटीचर: तुम्हें भूगोल क्यों नहीं आता?\nछात्र: सर, मैंने कोशिश की, लेकिन दुनिया बहुत बड़ी है!",
"चुटकुला 646:\n\nपापा: बेटा, तुम्हारा मोबाइल कहां है?\nबेटा: पापा, मैंने इसे चार्ज पर लगाया है।\nपापा: कहां?\nबेटा: पापा, मैंने इसे फ्रिज में रखा है, वहां ठंडा रहेगा!",
"चुटकुला 647:\n\nपत्नी: जी, आप मुझे कितना प्यार करते हैं?\nपति: इतना कि तुम्हारे बगैर एक घंटा नहीं रह सकता।\nपत्नी: तो फिर आपने मुझे फूल क्यों नहीं दिए?\nपति: क्योंकि फूल महंगे होते हैं!",
"चुटकुला 648:\n\nटीचर: तुम्हें कंप्यूटर क्यों पसंद है?\nछात्र: सर, क्योंकि ये सब कुछ कर सकता है!\nटीचर: तो फिर तुमने क्या किया?\nछात्र: सर, मैंने इसे ऑन किया और सो गया!",
"चुटकुला 649:\n\nडॉक्टर: तुम्हें सोना चाहिए।\nमरीज़: डॉक्टर साहब, मैं सोता हूं।\nडॉक्टर: कितने घंटे?\nमरीज़: डॉक्टर साहब, मैं दिन भर सोता हूं!",
"चुटकुला 650:\n\nमां: बेटा, तुम्हारा बैग कहां है?\nबेटा: मां, मैंने इसे स्कूल में छोड़ दिया।\nमां: क्यों?\nबेटा: मां, मैंने सोचा कि कल फिर ले आऊंगा!",
"चुटकुला 651:\n\nटीचर: तुम्हें पढ़ाई में दिल क्यों नहीं लगता?\nछात्र: सर, दिल तो है, लेकिन दिमाग को आराम चाहिए!",
"चुटकुला 652:\n\nपापा: बेटा, तुम्हारी गाड़ी का रंग क्या है?\nबेटा: पापा, मेरी गाड़ी का रंग नीला है।\nपापा: तो फिर ये लाल क्यों है?\nबेटा: पापा, मैंने इसे पेंट किया!",
"चुटकुला 653:\n\nपत्नी: जी, आज खाने में क्या है?\nपति: जो तुमने बनाया है।\nपत्नी: मैंने कुछ नहीं बनाया!\nपति: तो फिर बाहर से मंगवा लो!",
"चुटकुला 654:\n\nटीचर: तुमने होमवर्क कहां किया?\nछात्र: सर, मैंने घर पर किया।\nटीचर: फिर कॉपी में क्यों नहीं है?\nछात्र: सर, मैंने घर पर किया, कॉपी में नहीं!",
"चुटकुला 655:\n\nडॉक्टर: तुम्हें एक्सरसाइज करनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह भागता हूं!",
"चुटकुला 656:\n\nमां: बेटा, तुम्हारे कपड़े गंदे क्यों हैं?\nबेटा: मां, मैं खेलते वक्त गिर गया।\nमां: फिर क्या हुआ?\nबेटा: मां, मैंने फिर खेला!",
"चुटकुला 657:\n\nटीचर: तुम्हें गणित क्यों पसंद है?\nछात्र: सर, क्योंकि इसमें नंबर होते हैं!\nटीचर: तो फिर तुम्हारे नंबर कम क्यों हैं?\nछात्र: सर, नंबर तो हैं, लेकिन कम हैं!",
"चुटकुला 658:\n\nपापा: बेटा, तुम्हारा मोबाइल कहां है?\nबेटा: पापा, मैंने इसे खो दिया।\nपापा: कहां?\nबेटा: पापा, मैंने इसे घर में कहीं रखा था!",
"चुटकुला 659:\n\nपत्नी: जी, आप मुझे कहां ले जा रहे हैं?\nपति: मैं तुम्हें सैर पर ले जा रहा हूं।\nपत्नी: कहां?\nपति: तुम्हें जो पसंद हो!",
"चुटकुला 660:\n\nटीचर: तुमने परीक्षा में क्या लिखा?\nछात्र: सर, मैंने जो याद था लिखा।\nटीचर: और जो याद नहीं था?\nछात्र: सर, मैंने उसे छोड़ दिया!",
"चुटकुला 661:\n\nडॉक्टर: तुम्हें फल खाने चाहिएं।\nमरीज़: डॉक्टर साहब, मैं रोज़ फल खाता हूं।\nडॉक्टर: कौन सा?\nमरीज़: डॉक्टर साहब, मैं आम खाता हूं!",
"चुटकुला 662:\n\nमां: बेटा, तुम्हारा होमवर्क कहां है?\nबेटा: मां, मैंने इसे स्कूल में छोड़ दिया।\nमां: क्यों?\nबेटा: मां, मैंने सोचा कि कल फिर ले आऊंगा!",
"चुटकुला 663:\n\nटीचर: तुम्हें साइंस क्यों पसंद है?\nछात्र: सर, क्योंकि इसमें एक्सपेरिमेंट करते हैं!\nटीचर: तो फिर तुमने क्या एक्सपेरिमेंट किया?\nछात्र: सर, मैंने सोना एक्सपेरिमेंट किया!",
"चुटकुला 664:\n\nपापा: बेटा, तुम्हारी गाड़ी कहां है?\nबेटा: पापा, मैंने इसे पार्क किया।\nपापा: कहां?\nबेटा: पापा, मैंने इसे घर के बाहर पार्क किया!",
"चुटकुला 665:\n\nपत्नी: जी, आप मुझे क्या तोहफा देंगे?\nपति: तुम्हें जो चाहिए वो मांगो।\nपत्नी: मुझे एक नया बैग चाहिए।\nपति: अरे नहीं, मैंने मज़ाक किया था!",
"चुटकुला 666:\n\nटीचर: तुम्हें इतिहास क्यों नहीं आता?\nछात्र: सर, इतिहास तो पुराना होता है, मुझे नई चीज़ें पसंद हैं!",
"चुटकुला 667:\n\nडॉक्टर: तुम्हें एक्सरसाइज करनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह उठने की कोशिश करता हूं!",
"चुटकुला 668:\n\nमां: बेटा, तुम्हारा कमरा गंदा क्यों है?\nबेटा: मां, मैंने सफाई की कोशिश की, लेकिन कमरा साफ नहीं हुआ!",
"चुटकुला 669:\n\nटीचर: तुम्हें इंग्लिश क्यों नहीं आती?\nछात्र: सर, मैंने इंग्लिश सीखने की कोशिश की, लेकिन इंग्लिश ने सीखने से इंकार कर दिया!",
"चुटकुला 670:\n\nपापा: बेटा, तुम्हारी गाड़ी कहां है?\nबेटा: पापा, मैंने इसे पार्क किया।\nपापा: कहां?\nबेटा: पापा, पेड़ पर!",
"चुटकुला 671:\n\nपत्नी: जी, आप मुझे कहां ले जा रहे हैं?\nपति: मैं तुम्हें बाज़ार ले जा रहा हूं।\nपत्नी: क्या खरीदना है?\nपति: तुम्हें जो पसंद हो!",

"चुटकुला 747:\n\nटीचर: तुम्हें गणित क्यों पसंद है?\nछात्र: सर, क्योंकि इसमें नंबर होते हैं!\nटीचर: तो फिर तुम्हारे नंबर कम क्यों हैं?\nछात्र: सर, नंबर तो हैं, लेकिन कम हैं!",
"चुटकुला 748:\n\nपापा: बेटा, तुम्हारा मोबाइल कहां है?\nबेटा: पापा, मैंने इसे खो दिया।\nपापा: कहां?\nबेटा: पापा, मैंने इसे घर में कहीं रखा था!",
"चुटकुला 749:\n\nपत्नी: जी, आप मुझे कहां ले जा रहे हैं?\nपति: मैं तुम्हें सैर पर ले जा रहा हूं।\nपत्नी: कहां?\nपति: तुम्हें जो पसंद हो!",
"चुटकुला 750:\n\nटीचर: तुमने परीक्षा में क्या लिखा?\nछात्र: सर, मैंने जो याद था लिखा।\nटीचर: और जो याद नहीं था?\nछात्र: सर, मैंने उसे छोड़ दिया!",
"चुटकुला 751:\n\nडॉक्टर: तुम्हें फल खाने चाहिएं।\nमरीज़: डॉक्टर साहब, मैं रोज़ फल खाता हूं।\nडॉक्टर: कौन सा?\nमरीज़: डॉक्टर साहब, मैं आम खाता हूं!",
"चुटकुला 752:\n\nमां: बेटा, तुम्हारा होमवर्क कहां है?\nबेटा: मां, मैंने इसे स्कूल में छोड़ दिया।\nमां: क्यों?\nबेटा: मां, मैंने सोचा कि कल फिर ले आऊंगा!",
"चुटकुला 753:\n\nटीचर: तुम्हें साइंस क्यों पसंद है?\nछात्र: सर, क्योंकि इसमें एक्सपेरिमेंट करते हैं!\nटीचर: तो फिर तुमने क्या एक्सपेरिमेंट किया?\nछात्र: सर, मैंने सोना एक्सपेरिमेंट किया!",
"चुटकुला 754:\n\nपापा: बेटा, तुम्हारी गाड़ी कहां है?\nबेटा: पापा, मैंने इसे पार्क किया।\nपापा: कहां?\nबेटा: पापा, मैंने इसे घर के बाहर पार्क किया!",
"चुटकुला 755:\n\nपत्नी: जी, आप मुझे क्या तोहफा देंगे?\nपति: तुम्हें जो चाहिए वो मांगो।\nपत्नी: मुझे एक नया बैग चाहिए।\nपति: अरे नहीं, मैंने मज़ाक किया था!",
"चुटकुला 756:\n\nटीचर: तुम्हें इतिहास क्यों नहीं आता?\nछात्र: सर, इतिहास तो पुराना होता है, मुझे नई चीज़ें पसंद हैं!",
"चुटकुला 757:\n\nडॉक्टर: तुम्हें एक्सरसाइज करनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह उठने की कोशिश करता हूं!",
"चुटकुला 758:\n\nमां: बेटा, तुम्हारा कमरा गंदा क्यों है?\nबेटा: मां, मैंने सफाई की कोशिश की, लेकिन कमरा साफ नहीं हुआ!",
"चुटकुला 759:\n\nटीचर: तुम्हें इंग्लिश क्यों नहीं आती?\nछात्र: सर, मैंने इंग्लिश सीखने की कोशिश की, लेकिन इंग्लिश ने सीखने से इंकार कर दिया!",
"चुटकुला 760:\n\nपापा: बेटा, तुम्हारी गाड़ी कहां है?\nबेटा: पापा, मैंने इसे पार्क किया।\nपापा: कहां?\nबेटा: पापा, पेड़ पर!",
"चुटकुला 761:\n\nपत्नी: जी, आप मुझे कहां ले जा रहे हैं?\nपति: मैं तुम्हें बाज़ार ले जा रहा हूं।\nपत्नी: क्या खरीदना है?\nपति: तुम्हें जो पसंद हो!",
"चुटकुला 762:\n\nटीचर: तुमने परीक्षा में क्या किया?\nछात्र: सर, मैंने कॉपी में लिखा।\nटीचर: फिर क्या हुआ?\nछात्र: सर, मैंने कॉपी में लिखा, लेकिन टीचर ने पढ़ा नहीं!",
"चुटकुला 763:\n\nडॉक्टर: तुम्हें मीठा कम खाना चाहिए।\nमरीज़: डॉक्टर साहब, मैं मीठा नहीं खाता।\nडॉक्टर: तो फिर तुम्हारे दांत क्यों खराब हैं?\nमरीज़: डॉक्टर साहब, मैंने मीठा छोड़ा, लेकिन बीवी नहीं छोड़ी!",
"चुटकुला 764:\n\nमां: बेटा, तुम्हें नींद क्यों आ रही है?\nबेटा: मां, मैंने रात भर पढ़ाई की।\nमां: पढ़ाई की या गेम खेला?\nबेटा: मां, गेम भी पढ़ाई का हिस्सा है!",
"चुटकुला 765:\n\nटीचर: तुम्हें भूगोल क्यों नहीं आता?\nछात्र: सर, मैंने कोशिश की, लेकिन दुनिया बहुत बड़ी है!",
"चुटकुला 766:\n\nपापा: बेटा, तुम्हारा मोबाइल कहां है?\nबेटा: पापा, मैंने इसे चार्ज पर लगाया है।\nपापा: कहां?\nबेटा: पापा, मैंने इसे फ्रिज में रखा है, वहां ठंडा रहेगा!",
"चुटकुला 767:\n\nपत्नी: जी, आप मुझे कितना प्यार करते हैं?\nपति: इतना कि तुम्हारे बगैर एक घंटा नहीं रह सकता।\nपत्नी: तो फिर आपने मुझे फूल क्यों नहीं दिए?\nपति: क्योंकि फूल महंगे होते हैं!",
"चुटकुला 768:\n\nटीचर: तुम्हें कंप्यूटर क्यों पसंद है?\nछात्र: सर, क्योंकि ये सब कुछ कर सकता है!\nटीचर: तो फिर तुमने क्या किया?\nछात्र: सर, मैंने इसे ऑन किया और सो गया!",
"चुटकुला 769:\n\nडॉक्टर: तुम्हें सोना चाहिए।\nमरीज़: डॉक्टर साहब, मैं सोता हूं।\nडॉक्टर: कितने घंटे?\nमरीज़: डॉक्टर साहब, मैं दिन भर सोता हूं!",
"चुटकुला 770:\n\nमां: बेटा, तुम्हारा बैग कहां है?\nबेटा: मां, मैंने इसे स्कूल में छोड़ दिया।\nमां: क्यों?\nबेटा: मां, मैंने सोचा कि कल फिर ले आऊंगा!",
"चुटकुला 771:\n\nटीचर: तुम्हें पढ़ाई में दिल क्यों नहीं लगता?\nछात्र: सर, दिल तो है, लेकिन दिमाग को आराम चाहिए!",
"चुटकुला 772:\n\nपापा: बेटा, तुम्हारी गाड़ी का रंग क्या है?\nबेटा: पापा, मेरी गाड़ी का रंग नीला है।\nपापा: तो फिर ये लाल क्यों है?\nबेटा: पापा, मैंने इसे पेंट किया!",
"चुटकुला 773:\n\nपत्नी: जी, आज खाने में क्या है?\nपति: जो तुमने बनाया है।\nपत्नी: मैंने कुछ नहीं बनाया!\nपति: तो फिर बाहर से मंगवा लो!",
"चुटकुला 774:\n\nटीचर: तुमने होमवर्क कहां किया?\nछात्र: सर, मैंने घर पर किया।\nटीचर: फिर कॉपी में क्यों नहीं है?\nछात्र: सर, मैंने घर पर किया, कॉपी में नहीं!",
"चुटकुला 775:\n\nडॉक्टर: तुम्हें एक्सरसाइज करनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह भागता हूं!",

"चुटकुला 849:\n\nटीचर: तुम्हें इंग्लिश क्यों नहीं आती?\nछात्र: सर, मैंने इंग्लिश सीखने की कोशिश की, लेकिन इंग्लिश ने सीखने से इंकार कर दिया!",
"चुटकुला 850:\n\nपापा: बेटा, तुम्हारी गाड़ी कहां है?\nबेटा: पापा, मैंने इसे पार्क किया।\nपापा: कहां?\nबेटा: पापा, पेड़ पर!",
"चुटकुला 851:\n\nपत्नी: जी, आप मुझे कहां ले जा रहे हैं?\nपति: मैं तुम्हें बाज़ार ले जा रहा हूं।\nपत्नी: क्या खरीदना है?\nपति: तुम्हें जो पसंद हो!",
"चुटकुला 852:\n\nटीचर: तुमने परीक्षा में क्या किया?\nछात्र: सर, मैंने कॉपी में लिखा।\nटीचर: फिर क्या हुआ?\nछात्र: सर, मैंने कॉपी में लिखा, लेकिन टीचर ने पढ़ा नहीं!",
"चुटकुला 853:\n\nडॉक्टर: तुम्हें मीठा कम खाना चाहिए।\nमरीज़: डॉक्टर साहब, मैं मीठा नहीं खाता।\nडॉक्टर: तो फिर तुम्हारे दांत क्यों खराब हैं?\nमरीज़: डॉक्टर साहब, मैंने मीठा छोड़ा, लेकिन बीवी नहीं छोड़ी!",
"चुटकुला 854:\n\nमां: बेटा, तुम्हें नींद क्यों आ रही है?\nबेटा: मां, मैंने रात भर पढ़ाई की।\nमां: पढ़ाई की या गेम खेला?\nबेटा: मां, गेम भी पढ़ाई का हिस्सा है!",
"चुटकुला 855:\n\nटीचर: तुम्हें भूगोल क्यों नहीं आता?\nछात्र: सर, मैंने कोशिश की, लेकिन दुनिया बहुत बड़ी है!",
"चुटकुला 856:\n\nपापा: बेटा, तुम्हारा मोबाइल कहां है?\nबेटा: पापा, मैंने इसे चार्ज पर लगाया है।\nपापा: कहां?\nबेटा: पापा, मैंने इसे फ्रिज में रखा है, वहां ठंडा रहेगा!",
"चुटकुला 857:\n\nपत्नी: जी, आप मुझे कितना प्यार करते हैं?\nपति: इतना कि तुम्हारे बगैर एक घंटा नहीं रह सकता।\nपत्नी: तो फिर आपने मुझे फूल क्यों नहीं दिए?\nपति: क्योंकि फूल महंगे होते हैं!",
"चुटकुला 858:\n\nटीचर: तुम्हें कंप्यूटर क्यों पसंद है?\nछात्र: सर, क्योंकि ये सब कुछ कर सकता है!\nटीचर: तो फिर तुमने क्या किया?\nछात्र: सर, मैंने इसे ऑन किया और सो गया!",
"चुटकुला 859:\n\nडॉक्टर: तुम्हें सोना चाहिए।\nमरीज़: डॉक्टर साहब, मैं सोता हूं।\nडॉक्टर: कितने घंटे?\nमरीज़: डॉक्टर साहब, मैं दिन भर सोता हूं!",
"चुटकुला 860:\n\nमां: बेटा, तुम्हारा बैग कहां है?\nबेटा: मां, मैंने इसे स्कूल में छोड़ दिया।\nमां: क्यों?\nबेटा: मां, मैंने सोचा कि कल फिर ले आऊंगा!",
"चुटकुला 861:\n\nटीचर: तुम्हें पढ़ाई में दिल क्यों नहीं लगता?\nछात्र: सर, दिल तो है, लेकिन दिमाग को आराम चाहिए!",
"चुटकुला 862:\n\nपापा: बेटा, तुम्हारी गाड़ी का रंग क्या है?\nबेटा: पापा, मेरी गाड़ी का रंग नीला है।\nपापा: तो फिर ये लाल क्यों है?\nबेटा: पापा, मैंने इसे पेंट किया!",
"चुटकुला 863:\n\nपत्नी: जी, आज खाने में क्या है?\nपति: जो तुमने बनाया है।\nपत्नी: मैंने कुछ नहीं बनाया!\nपति: तो फिर बाहर से मंगवा लो!",
"चुटकुला 864:\n\nटीचर: तुमने होमवर्क कहां किया?\nछात्र: सर, मैंने घर पर किया।\nटीचर: फिर कॉपी में क्यों नहीं है?\nछात्र: सर, मैंने घर पर किया, कॉपी में नहीं!",
"चुटकुला 865:\n\nडॉक्टर: तुम्हें एक्सरसाइज करनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह भागता हूं!",
"चुटकुला 866:\n\nमां: बेटा, तुम्हारे कपड़े गंदे क्यों हैं?\nबेटा: मां, मैं खेलते वक्त गिर गया।\nमां: फिर क्या हुआ?\nबेटा: मां, मैंने फिर खेला!",
"चुटकुला 867:\n\nटीचर: तुम्हें गणित क्यों पसंद है?\nछात्र: सर, क्योंकि इसमें नंबर होते हैं!\nटीचर: तो फिर तुम्हारे नंबर कम क्यों हैं?\nछात्र: सर, नंबर तो हैं, लेकिन कम हैं!",
"चुटकुला 868:\n\nपापा: बेटा, तुम्हारा मोबाइल कहां है?\nबेटा: पापा, मैंने इसे खो दिया।\nपापा: कहां?\nबेटा: पापा, मैंने इसे घर में कहीं रखा था!",
"चुटकुला 869:\n\nपत्नी: जी, आप मुझे कहां ले जा रहे हैं?\nपति: मैं तुम्हें सैर पर ले जा रहा हूं।\nपत्नी: कहां?\nपति: तुम्हें जो पसंद हो!",
"चुटकुला 870:\n\nटीचर: तुमने परीक्षा में क्या लिखा?\nछात्र: सर, मैंने जो याद था लिखा।\nटीचर: और जो याद नहीं था?\nछात्र: सर, मैंने उसे छोड़ दिया!",
"चुटकुला 871:\n\nडॉक्टर: तुम्हें फल खाने चाहिएं।\nमरीज़: डॉक्टर साहब, मैं रोज़ फल खाता हूं।\nडॉक्टर: कौन सा?\nमरीज़: डॉक्टर साहब, मैं आम खाता हूं!",
"चुटकुला 872:\n\nमां: बेटा, तुम्हारा होमवर्क कहां है?\nबेटा: मां, मैंने इसे स्कूल में छोड़ दिया।\nमां: क्यों?\nबेटा: मां, मैंने सोचा कि कल फिर ले आऊंगा!",
"चुटकुला 873:\n\nटीचर: तुम्हें साइंस क्यों पसंद है?\nछात्र: सर, क्योंकि इसमें एक्सपेरिमेंट करते हैं!\nटीचर: तो फिर तुमने क्या एक्सपेरिमेंट किया?\nछात्र: सर, मैंने सोना एक्सपेरिमेंट किया!",
"चुटकुला 874:\n\nपापा: बेटा, तुम्हारी गाड़ी कहां है?\nबेटा: पापा, मैंने इसे पार्क किया।\nपापा: कहां?\nबेटा: पापा, मैंने इसे घर के बाहर पार्क किया!",
"चुटकुला 875:\n\nपत्नी: जी, आप मुझे क्या तोहफा देंगे?\nपति: तुम्हें जो चाहिए वो मांगो।\nपत्नी: मुझे एक नया बैग चाहिए।\nपति: अरे नहीं, मैंने मज़ाक किया था!",
"चुटकुला 876:\n\nटीचर: तुम्हें इतिहास क्यों नहीं आता?\nछात्र: सर, इतिहास तो पुराना होता है, मुझे नई चीज़ें पसंद हैं!",
"चुटकुला 877:\n\nडॉक्टर: तुम्हें एक्सरसाइज करनी चाहिए।\nमरीज़: डॉक्टर साहब, मैं रोज़ एक्सरसाइज करता हूं।\nडॉक्टर: क्या करते हो?\nमरीज़: मैं रोज़ सुबह उठने की कोशिश करता हूं!",

var current = 0;

function showJoke(){
    document.getElementById('jokeBox').innerText = jokes[current];
    document.getElementById('count').innerText = "चुटकुला " + (current+1) + " / " + jokes.length;
}

function next(){ 
    if(current < jokes.length-1){

        showJoke();

    } 
}

function prev(){ 
    if(current > 0){

    } 
}
