"Biro 518:\n\nDoktor: Pasyente, kailangan mong tumigil sa paninigarilyo.\nPasyente: Doktor, hindi ako naninigarilyo.\nDoktor: Umiinom ka ba ng alak?\nPasyente: Hindi rin.\nDoktor: Eh ano ang ginagawa mo?\nPasyente: Nabubuhay lang ako kasama ang asawa ko!\nDoktor: Kung ganoon, tumigil ka na sa pagbubuhay kasama ang asawa mo!\nPasyente: Pwede ba akong mabuhay kasama ang biyenan ko?\nDoktor: Kung ganoon, tumigil ka na sa pagbubuhay!",
