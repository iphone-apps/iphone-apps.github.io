"농담 44:\n\n아버지: 아들아, 왜 숙제 안 하니?\n아들: 아빠, 숙제는 내일 한다고 했어요.\n아버지: 하지만 내일은 소풍이잖아.\n아들: 그래서 오늘은 쉬는 거예요!",

"농담 46:\n\n선생님: 달은 왜 지구 주위를 도니?\n학생: 선생님, 지구 중력에 끌리니까요.\n선생님: 정답. 그럼 왜 떨어지지 않니?\n학생: 선생님, 옆으로 움직이고 있으니까요!",
"농담 47:\n\n아내: 여보, 내 새 신발 어때?\n남편: 멋져.\n아내: 하지만 비쌌어.\n남편: 얼마야?\n아내: 50만 원.\n남편: 헉! 그 신발 신고 걸을 때 발 안 아파?\n아내: 아프지만, 겉모습이 중요해!",
"농담 48:\n\n선생님: 왜 천둥이 치니?\n학생: 선생님, 전기가 방전되니까요.\n선생님: 정답. 그럼 왜 번쩍이고 나서 소리가 나니?\n학생: 선생님, 빛이 소리보다 빠르니까요!",
"농담 49:\n\n아버지: 아들아, 왜 TV만 보니?\n아들: 아빠, TV는 교육에 좋아요.\n아버지: 어떻게?\n아들: TV를 보면 현실 도피를 할 수 있거든요!",
"농담 50:\n\n선생님: 지구는 왜 도니?\n학생: 선생님, 태양 주위를 돌면서 낮과 밤이 생기니까요.\n선생님: 그럼 왜 지구는 기울어져 있니?\n학생: 선생님, 지구가 피곤해서 기대고 있나 봐요!",
"농담 51:\n\n아내: 여보, 내일 뭐 입을까?\n남편: 아무거나 입어.\n아내: 이거 어때?\n남편: 응, 좋아.\n아내: 저거는?\n남편: 그것도 좋아.\n아내: 당신은 관심이 없잖아!\n남편: 아니야, 난 네가 뭘 입어도 예쁘다고 생각해!",
"농담 52:\n\n의사: 당신은 커피를 너무 많이 마셔요.\n환자: 선생님, 저는 하루에 한 잔만 마셔요.\n의사: 그 한 잔이 엄청 큰 머그컵이군요?\n환자: 맞아요!",
"농담 53:\n\n선생님: 왜 우주는 어두우니?\n학생: 선생님, 빛이 없으니까요.\n선생님: 그럼 별은 왜 빛나니?\n학생: 선생님, 별들이 밤에 일어나서 그런 거예요!",
"농담 54:\n\n아버지: 아들아, 왜 늦었니?\n아들: 아빠, 버스가 늦었어요.\n아버지: 학교까지 걸어서 10분이잖아.\n아들: 네, 하지만 버스를 1시간 기다렸어요!",
"농담 55:\n\n아내: 여보, 나 사랑해?\n남편: 사랑해.\n아내: 그럼 나를 위해 뭐든 해줄 수 있어?\n남편: 물론이지. 뭐든 말해.\n아내: 그럼 조용히 있어줘!",
"농담 56:\n\n선생님: 왜 지구는 자전하니?\n학생: 선생님, 태양 빛을 골고루 받기 위해서요.\n선생님: 정답. 그럼 왜 공전하니?\n학생: 선생님, 계절을 만들기 위해서요!",
"농담 57:\n\n의사: 당신은 잠을 더 자야 해요.\n환자: 선생님, 저는 매일 10시간 자요.\n의사: 그럼 왜 아직도 피곤하죠?\n환자: 선생님, 꿈에서 일하느라 바빠요!",
"농담 58:\n\n아내: 여보, 내 가방 어때?\n남편: 예뻐.\n아내: 비싼데 안 아깝지?\n남편: 응, 네가 들면 가방이 더 빛나 보여!\n아내: 오늘 말 잘하네!",
"농담 59:\n\n선생님: 왜 바다는 파랗니?\n학생: 선생님, 물이 빛을 흡수하니까요.\n선생님: 그럼 왜 수영장은 파랗니?\n학생: 선생님, 물감을 풀었나 봐요!",
"농담 60:\n\n아버지: 아들아, 왜 숙제를 안 했니?\n아들: 아빠, 선생님이 내일까지 하래요.\n아버지: 그래서 안 한 거야?\n아들: 네, 내일까지니까 오늘은 안 해도 되죠!",
"농담 61:\n\n아내: 여보, 전등 좀 꺼줘.\n남편: 왜? 무서워?\n아내: 아니, 전기세 아끼려고.\n남편: 그럼 내일부터 꺼.\n아내: 지금 꺼!\n남편: 알았어, 알았어!",
"농담 62:\n\n의사: 당신은 과일을 더 먹어야 해요.\n환자: 선생님, 저는 매일 사과를 먹어요.\n의사: 어떤 사과요?\n환자: 애플파이요!",
"농담 63:\n\n선생님: 왜 하늘은 파랗고 노을은 빨갛니?\n학생: 선생님, 빛의 산란 때문이에요. 낮에는 파란 빛이, 저녁에는 빨간 빛이 잘 보여요.\n선생님: 완벽해!",
"농담 64:\n\n아내: 여보, 내 생일 선물 뭐야?\n남편: 비밀이야.\n아내: 힌트만 줘.\n남편: 음... 아직 안 샀어!",
"농담 65:\n\n선생님: 왜 물고기는 물속에서 숨 쉴 수 있니?\n학생: 선생님, 아가미가 있으니까요.\n선생님: 그럼 왜 땅에서는 못 숨 쉬니?\n학생: 선생님, 아가미가 말라서요!",
"농담 66:\n\n아버지: 아들아, 용돈 다 썼니?\n아들: 네, 아빠.\n아버지: 뭐에 썼어?\n아들: 과자랑 장난감이요.\n아버지: 다음엔 저축도 좀 해라.\n아들: 네, 다음엔 더 비싼 장난감 살 거예요!",
"농담 67:\n\n아내: 여보, 나 살쪘어?\n남편: 아니야.\n아내: 진짜? 거울 보니까 뚱뚱해 보여.\n남편: 거울이 이상한 거야!\n아내: 당신이 더 이상해!",
"농담 68:\n\n의사: 당신은 스트레스를 줄여야 해요.\n환자: 어떻게 줄여요?\n의사: 좋아하는 일을 하세요.\n환자: 저는 잠자는 게 좋아요.\n의사: 그럼 많이 자세요!\n환자: 하지만 저는 일해야 해요!",
"농담 69:\n\n선생님: 왜 무지개는 반원 모양이니?\n학생: 선생님, 땅에 가려져서 그래요.\n선생님: 정답! 그럼 왜 비 온 뒤에 나타나니?\n학생: 선생님, 햇빛이 물방울에 반사되니까요!",
"농담 70:\n\n아내: 여보, TV 좀 그만 봐!\n남편: 하지만 뉴스 보고 있어.\n아내: 무슨 뉴스?\n남편: 축구 뉴스.\n아내: 그건 스포츠잖아!",
"농담 71:\n\n선생님: 왜 달은 지구 주위를 도니?\n학생: 선생님, 중력 때문에요.\n선생님: 그럼 왜 부딪히지 않니?\n학생: 선생님, 계속 옆으로 움직이니까요!",
"농담 72:\n\n아버지: 아들아, 왜 우유를 안 마시니?\n아들: 아빠, 저는 우유가 싫어요.\n아버지: 키가 크려면 마셔야지.\n아들: 아빠는 우유 많이 마셨는데 왜 안 크셨어요?",

"농담 100:\n\n선생님: 왜 물은 끓니?\n학생: 선생님, 열에너지로 분자가 활발해져서요.\n선생님: 정답. 그럼 왜 수증기가 되니?\n학생: 선생님, 분자가 도망가고 싶어 해서요! 🎉 (100개 완료!)",
"농담 101:\n\n선생님: 왜 토끼는 귀가 길어?\n학생: 선생님, 멀리 있는 소리를 듣기 위해서요.\n선생님: 그럼 왜 코끼리는 코가 길어?\n학생: 선생님, 멀리 있는 냄새를 맡기 위해서요!",
"농담 102:\n\n아내: 여보, 내 생일 까먹었지?\n남편: 아니야, 기억해.\n아내: 그럼 내가 태어난 년도는?\n남편: 음... 1900년대?\n아내: 당신 오늘 밥 굶어!",
"농담 103:\n\n의사: 당신은 당분을 줄여야 해요.\n환자: 선생님, 저는 설탕을 안 넣어요.\n의사: 그럼 왜 혈당이 높죠?\n환자: 선생님, 꿀을 엄청 많이 먹어서요!",
"농담 104:\n\n선생님: 왜 물고기는 바다에 사니?\n학생: 선생님, 뭍에서는 숨을 못 쉬니까요.\n선생님: 그럼 왜 고래는 바다에 사니?\n학생: 선생님, 고래는 너무 커서 수영장에 안 들어가니까요!",
"농담 105:\n\n아버지: 아들아, 왜 숙제를 안 하니?\n아들: 아빠, 숙제는 내일 한다고 말했어요.\n아버지: 그럼 내일은?\n아들: 내일도 똑같은 말을 할 거예요!",
"농담 106:\n\n아내: 여보, 내 새로운 헤어스타일 어때?\n남편: 멋져.\n아내: 정말? 너무 짧지 않아?\n남편: 응, 그런데 네 미소는 더 짧아 보여!",
"농담 107:\n\n선생님: 지구에서 달까지 얼마나 멀어?\n학생: 선생님, 약 38만 킬로미터입니다.\n선생님: 정답. 그럼 지구에서 태양까지는?\n학생: 선생님, 1억 5천만 킬로미터입니다. 태양은 정말 멀어요!",
"농담 108:\n\n어떤 남자가 이발소에 갔습니다: 머리를 잘라주세요.\n이발사: 어떤 스타일로 해드릴까요?\n남자: 아내가 좋아하는 스타일로요.\n이발사: 그럼 스포츠 머리로 해드릴게요!",
"농담 109:\n\n의사: 당신은 스트레스가 많네요.\n환자: 어떻게 해야 하죠?\n의사: 더 많이 웃으세요.\n환자: 선생님, 저는 코미디언이 아니에요!",
"농담 110:\n\n선생님: 왜 화산은 폭발하니?\n학생: 선생님, 마그마가 화가 나서요.\n선생님: 그럼 왜 마그마는 화가 나니?\n학생: 선생님, 아무도 같이 안 놀아줘서요!",
"농담 111:\n\n아내: 여보, 오늘 저녁 뭐 먹을까?\n남편: 네가 좋아하는 걸로 해.\n아내: 그럼 초밥?\n남편: 하지만 비싸잖아.\n아내: 그럼 라면?\n남편: 그것도 비싸.\n아내: 그럼 집에서 먹자!",
"농담 112:\n\n선생님: 물은 몇 도에서 얼어?\n학생: 선생님, 0도입니다.\n선생님: 그럼 왜 바다는 얼지 않니?\n학생: 선생님, 소금이 들어있어서요!",
"농담 113:\n\n아버지: 아들아, 왜 눈이 빨개?\n아들: 아빠, 울었어요.\n아버지: 왜?\n아들: 아빠, TV 영화가 슬펐어요!\n아버지: 무슨 영화?\n아들: 숙제를 잊은 아이 영화요!",
"농담 114:\n\n선생님: 왜 새는 날 수 있니?\n학생: 선생님, 날개가 있으니까요.\n선생님: 그럼 왜 펭귄은 못 날아?\n학생: 선생님, 펭귄은 수영을 좋아하니까요!",
"농담 115:\n\n아내: 여보, 나 사랑해?\n남편: 사랑해.\n아내: 그럼 증명해 봐.\n남편: 음... 네가 해준 밥을 다 먹고 있잖아!",
"농담 116:\n\n의사: 당신은 운동 부족이에요.\n환자: 선생님, 저는 매일 리모컨을 조작해요!\n의사: 그건 운동이 아니에요.\n환자: 그럼 TV 채널 바꾸려고 일어나면요?\n의사: 그건 훌륭한 운동이죠!",
"농담 117:\n\n선생님: 이탈리아의 수도는?\n학생: 선생님, 로마입니다.\n선생님: 그럼 프랑스의 수도는?\n학생: 선생님, 파리입니다.\n선생님: 그럼 네 머리의 수도는?\n학생: 선생님, 텅 비었습니다!",
"농담 118:\n\n아버지: 아들아, 왜 TV만 보니?\n아들: 아빠, 저는 교육 방송을 보고 있어요.\n아버지: 무슨 방송?\n아들: 요리 방송이요. 배고파지네요!",
"농담 119:\n\n선생님: 왜 밤에 별이 보이니?\n학생: 선생님, 해가 자고 있기 때문이에요.\n선생님: 그럼 왜 별이 빛나니?\n학생: 선생님, 별은 밤샘을 좋아하니까요!",
"농담 120:\n\n아내: 여보, 내 새 드레스 어때?\n남편: 정말 멋져.\n아내: 정말? 뚱뚱해 보이지 않아?\n남편: 응, 드레스는 날씬해 보여.\n아내: 그럼 나는?\n남편: 음... 드레스가 멋지다고만 했어!",
"농담 121:\n\n선생님: 광합성이 뭐니?\n학생: 선생님, 식물이 햇빛으로 영양분을 만드는 거예요.\n선생님: 정답. 그럼 식물은 밤에 뭐 하니?\n학생: 선생님, 밤에는 자요!",
"농담 122:\n\n어떤 남자가 의사에게 갔습니다: 선생님, 요즘 건망증이 심해요.\n의사: 언제부터요?\n남자: 언제부터 뭐요?\n의사: 건망증이요.\n남자: 아, 건망증. 언제부터였지?",
"농담 123:\n\n선생님: 달은 왜 모양이 바뀌니?\n학생: 선생님, 달이 부끄러워해서 가끔 숨는 거예요.\n선생님: 그럼 초승달일 때는?\n학생: 선생님, 그때는 얼굴을 반만 내미는 거예요!",
"농담 124:\n\n아버지: 아들아, 왜 지각했니?\n아들: 아빠, 버스가 늦었어요.\n아버지: 학교까지 걸어서 10분이잖아.\n아들: 네, 하지만 버스를 1시간 기다렸어요!",
"농담 125:\n\n의사: 당신은 야채를 더 먹어야 해요.\n환자: 선생님, 저는 매일 토마토를 먹어요.\n의사: 토마토는 과일이에요.\n환자: 앗, 그럼 저는 과일을 먹고 있었네요!",
"농담 126:\n\n아내: 여보, 휴지 샀어?\n남편: 응, 샀어.\n아내: 어디에 뒀어?\n남편: 화장실에 뒀어.\n아내: 하지만 화장실에 없는데!\n남편: 아, 옆집 화장실에 뒀나 봐!",
"농담 127:\n\n선생님: 왜 하늘은 파랗니?\n학생: 선생님, 빛의 산란 때문이에요.\n선생님: 자세히 설명해 봐.\n학생: 파란 빛이 가장 잘 퍼지기 때문이에요.\n선생님: 정답! 그럼 노을은?\n학생: 빨간 빛이 두드러지니까요!",
"농담 128:\n\n아버지: 아들아, 왜 TV만 보니?\n아들: 아빠, TV를 보면 똑똑해진대요.\n아버지: 누가 그랬어?\n아들: TV에서 그랬어요!",
"농담 129:\n\n어떤 남자가 서점에 갔습니다: 사전을 주세요.\n점원: 어떤 사전이요?\n남자: 모르겠어요. 사전에서 찾아보려고요.\n점원: 사전을 찾는 데 사전이 필요하네요!",
"농담 130:\n\n선생님: 왜 화산은 폭발하니?\n학생: 선생님, 마그마가 너무 많이 쌓여서 터지는 거예요.\n선생님: 그럼 왜 마그마가 쌓이니?\n학생: 선생님, 화산이 과식했기 때문이에요!",
"농담 131:\n\n아내: 여보, 오늘 저녁 뭐 먹을까?\n남편: 네가 좋아하는 걸로 해.\n아내: 그럼 피자 어때?\n남편: 하지만 다이어트 중이잖아?\n아내: 맞다. 그럼 샐러드?\n남편: 샐러드만으론 부족해.\n아내: 그럼 피자랑 샐러드!",
"농담 132:\n\n선생님: 왜 식물은 초록색이니?\n학생: 선생님, 엽록소가 있으니까요.\n선생님: 정답. 그럼 왜 단풍은 빨간색이니?\n학생: 선생님, 가을이 되면 엽록소가 줄어들어서 빨간 색소가 보이니까요!",
"농담 133:\n\n아버지: 아들아, 왜 눈이 빨개?\n아들: 아빠, 울었어요.\n아버지: 왜 울었니?\n아들: 아빠, TV 영화가 슬펐어요!\n아버지: 무슨 영화?\n아들: 숙제를 잊은 아이 영화요!",
"농담 134:\n\n의사: 당신은 담배를 너무 많이 피워요.\n환자: 선생님, 저는 하루에 3개비만 피워요.\n의사: 그럼 왜 폐가 까맣죠?\n환자: 선생님, 한 개비가 시가예요!",
"농담 135:\n\n선생님: 새는 왜 날 수 있니?\n학생: 선생님, 날개가 있으니까요.\n선생님: 그럼 왜 타조는 못 날아?\n학생: 선생님, 타조는 달리기를 좋아하니까요!",
"농담 136:\n\n아내: 여보, 빨래 개켰어?\n남편: 응, 개켰어.\n아내: 어디에 뒀어?\n남편: 침대 위에 뒀어.\n아내: 하지만 침대 위엔 고양이가 자고 있잖아!\n남편: 고양이가 따뜻하게 해주고 있어!",
"농담 137:\n\n선생님: 왜 물은 투명하니?\n학생: 선생님, 빛이 통과하기 때문이에요.\n선생님: 정답. 그럼 왜 우유는 하얗니?\n학생: 선생님, 우유는 빛을 산란시키니까요.\n선생님: 훌륭해!",
"농담 138:\n\n아버지: 아들아, 왜 공부 안 하니?\n아들: 아빠, 저는 천재라서 공부 안 해도 돼요.\n아버지: 누가 그랬니?\n아들: 아무도 안 했지만, 제가 그렇게 생각해요!",
"농담 139:\n\n선생님: 지구는 왜 도니?\n학생: 선생님, 태양 주위를 돌면서 낮과 밤이 생기니까요.\n선생님: 그럼 왜 지구는 기울어져 있니?\n학생: 선생님, 지구가 피곤해서 기대고 있나 봐요!",
"농담 140:\n\n아내: 여보, 나 좋아해?\n남편: 좋아해.\n아내: 얼마나?\n남편: 음, 매일 네가 해준 밥을 먹을 정도!\n아내: 그건 사랑이 아니라 식욕이잖아!",
"농담 141:\n\n선생님: 왜 여름은 더우니?\n학생: 선생님, 지구가 태양에 가까워지니까요.\n선생님: 정답. 그럼 왜 겨울은 추우니?\n학생: 선생님, 지구가 태양에서 멀어지니까요!",
"농담 142:\n\n아버지: 아들아, 왜 신발 안 신었니?\n아들: 아빠, 양말을 신고 있으니까 괜찮아요.\n아버지: 하지만 밖에 비가 오잖아!\n아들: 아빠, 그래서 양말을 벗었어요!",
"농담 143:\n\n의사: 당신은 더 자야 해요.\n환자: 선생님, 저는 매일 8시간 자요.\n의사: 그럼 왜 피곤하죠?\n환자: 선생님, 야간 근무거든요!",
"농담 144:\n\n선생님: 왜 바닷물은 짜니?\n학생: 선생님, 물고기가 땀을 흘리니까요.\n선생님: 물고기는 땀을 흘리지 않아!\n학생: 선생님, 그럼 왜 짜요?",
"농담 145:\n\n아내: 여보, 이번 주말 어디 갈까?\n남편: 아무 데나 좋아.\n아내: 그럼 바다 갈까!\n남편: 하지만 바다는 멀어.\n아내: 그럼 산은?\n남편: 산도 멀어.\n아내: 그럼 집에 있자!\n남편: 그게 제일 좋겠네!",
"농담 146:\n\n선생님: 왜 식물은 초록색이니?\n학생: 선생님, 엽록소가 있으니까요.\n선생님: 정답. 그럼 왜 단풍은 빨간색이니?\n학생: 선생님, 가을이 되면 엽록소가 줄어들어서 빨간 색소가 보이니까요!",
"농담 147:\n\n아버지: 아들아, 왜 지각했니?\n아들: 아빠, 꿈을 꿨어요.\n아버지: 무슨 꿈?\n아들: 학교 가는 꿈요. 그래서 일어날 필요가 없다고 생각했어요!",
"농담 148:\n\n어떤 남자가 케이크 가게에 갔습니다: 생일 케이크 주세요.\n점원: 몇 살 생일이세요?\n남자: 30살이요.\n점원: 그럼 초는 30개 드려야겠네요.\n남자: 아니요, 1개만 주세요. 불 끄기가 힘들어서요!",
"농담 149:\n\n선생님: 왜 별은 빛나니?\n학생: 선생님, 핵융합 반응이 일어나서요.\n선생님: 정답. 그럼 왜 별은 반짝이니?\n학생: 선생님, 별이 윙크하는 거예요!",
"농담 150:\n\n아내: 여보, 우리 엄마가 온다는 거 알았어?\n남편: 응, 알았어.\n아내: 그럼 왜 도망가지 않았어?\n남편: 도망가려고 했는데, 짐이 너무 많았어!",

"농담 157:\n\n아버지: 아들아, 왜 양말 안 신었니?\n아들: 아빠, 신발을 신고 있으니까 괜찮아요.\n아버지: 하지만 양말 안 신으면 발 냄새 나잖아!\n아들: 아빠, 신발을 벗지 않으면 안 들켜요!",

"농담 160:\n\n아내: 여보, 내 어디가 좋아?\n남편: 네 미소가 좋아.\n아내: 그런데 지금 안 웃고 있잖아.\n남편: 그래서 지금은 안 좋아!",

"농담 162:\n\n아버지: 아들아, 왜 숙제 안 하니?\n아들: 아빠, 숙제는 내일 한다고 했어요.\n아버지: 하지만 내일은 소풍이잖아.\n아들: 그래서 오늘은 쉬는 거예요!",
"농담 163:\n\n의사: 당신은 야채를 더 먹어야 해요.\n환자: 선생님, 저는 매일 샐러드를 먹어요.\n의사: 무슨 야채?\n환자: 상추, 토마토, 오이, 그리고... 감자칩!",

"농담 165:\n\n아내: 여보, 내 새 신발 어때?\n남편: 멋져.\n아내: 하지만 비쌌어.\n남편: 얼마야?\n아내: 50만 원.\n남편: 헉! 그 신발 신고 걸을 때 발 안 아파?\n아내: 아프지만, 겉모습이 중요해!",
"농담 166:\n\n선생님: 왜 천둥이 치니?\n학생: 선생님, 전기가 방전되니까요.\n선생님: 정답. 그럼 왜 번쩍이고 나서 소리가 나니?\n학생: 선생님, 빛이 소리보다 빠르니까요!",
"농담 167:\n\n아버지: 아들아, 왜 TV만 보니?\n아들: 아빠, TV는 교육에 좋아요.\n아버지: 어떻게?\n아들: TV를 보면 현실 도피를 할 수 있거든요!",

"농담 201:\n\n선생님: 왜 개미는 부지런하니?\n학생: 선생님, 먹이를 모아야 하니까요.\n선생님: 그럼 왜 베짱이는 노래만 부르니?\n학생: 선생님, 겨울이 아직 멀어서요!",
"농담 202:\n\n아내: 여보, 나 예뻐?\n남편: 응, 예뻐.\n아내: 거짓말!\n남편: 그럼 왜 물어봐?\n아내: 그냥 듣고 싶어서!",
"농담 203:\n\n의사: 당신은 눈을 쉬게 해야 해요.\n환자: 선생님, 저는 매일 8시간 자요.\n의사: 그럼 왜 눈이 피곤하죠?\n환자: 선생님, 꿈에서 TV를 봐요!",
"농담 204:\n\n선생님: 왜 꽃은 좋은 냄새가 나니?\n학생: 선생님, 벌레를 부르기 위해서요.\n선생님: 그럼 왜 벌레를 부르니?\n학생: 선생님, 꽃가루를 옮겨달라고요!",
"농담 205:\n\n아내: 여보, 내 머리 어때?\n남편: 예뻐.\n아내: 너무 짧지 않아?\n남편: 응, 그런데 네 미소는 더 짧아!",
"농담 206:\n\n선생님: 왜 사막은 더우니?\n학생: 선생님, 물이 없어서요.\n선생님: 그럼 왜 물이 없니?\n학생: 선생님, 너무 더워서 증발했어요!",
"농담 207:\n\n아내: 여보, 내 생일 잊지 않았지?\n남편: 물론 기억하지.\n아내: 그럼 언제야?\n남편: 음... 오늘?\n아내: 맞아!\n남편: 그래서 기억한다고 했잖아!",
"농담 208:\n\n선생님: 왜 거북이는 등껍질이 있니?\n학생: 선생님, 몸을 보호하려고요.\n선생님: 그럼 왜 거북이는 느리니?\n학생: 선생님, 등껍질이 무거워서요!",
"농담 209:\n\n아내: 여보, 내 새 신발 어때?\n남편: 멋져.\n아내: 하지만 비쌌어.\n남편: 얼마야?\n아내: 30만 원.\n남편: 헉! 그 신발 신고 뛸 수 있어?\n아내: 안 뛰어, 보여주기만 할 거야!",
"농담 210:\n\n선생님: 왜 화산은 폭발하니?\n학생: 선생님, 마그마가 너무 많이 쌓여서 터지는 거예요.\n선생님: 그럼 왜 마그마가 쌓이니?\n학생: 선생님, 화산이 과식했기 때문이에요!",
"농담 211:\n\n의사: 당신은 야채를 더 먹어야 해요.\n환자: 선생님, 저는 매일 토마토를 먹어요.\n의사: 토마토는 과일이에요.\n환자: 앗, 그럼 저는 과일을 먹고 있었네요!",
"농담 212:\n\n선생님: 달은 왜 모양이 바뀌니?\n학생: 선생님, 달이 부끄러워해서 가끔 숨는 거예요.\n선생님: 그럼 초승달일 때는?\n학생: 선생님, 그때는 얼굴을 반만 내미는 거예요!",
"농담 213:\n\n아내: 여보, 오늘 저녁 뭐 먹을까?\n남편: 네가 좋아하는 걸로 해.\n아내: 그럼 초밥 어때?\n남편: 비싸잖아.\n아내: 그럼 라면?\n남편: 그것도 비싸.\n아내: 그럼 집에서 먹자!",
"농담 214:\n\n선생님: 왜 물은 끓니?\n학생: 선생님, 열에너지로 분자가 활발해져서요.\n선생님: 정답. 그럼 왜 수증기가 되니?\n학생: 선생님, 분자가 도망가고 싶어 해서요!",
"농담 215:\n\n아버지: 아들아, 왜 눈이 빨개?\n아들: 아빠, 울었어요.\n아버지: 왜 울었니?\n아들: 아빠, TV 영화가 슬펐어요!\n아버지: 무슨 영화?\n아들: 숙제를 잊은 아이 영화요!",
"농담 216:\n\n의사: 당신은 담배를 너무 많이 피워요.\n환자: 선생님, 저는 하루에 3개비만 피워요.\n의사: 그럼 왜 폐가 까맣죠?\n환자: 선생님, 한 개비가 시가예요!",
"농담 217:\n\n선생님: 새는 왜 날 수 있니?\n학생: 선생님, 날개가 있으니까요.\n선생님: 그럼 왜 타조는 못 날아?\n학생: 선생님, 타조는 달리기를 좋아하니까요!",
"농담 218:\n\n아내: 여보, 빨래 개켰어?\n남편: 응, 개켰어.\n아내: 어디에 뒀어?\n남편: 침대 위에 뒀어.\n아내: 하지만 침대 위엔 고양이가 자고 있잖아!\n남편: 고양이가 따뜻하게 해주고 있어!",
"농담 219:\n\n선생님: 왜 물은 투명하니?\n학생: 선생님, 빛이 통과하기 때문이에요.\n선생님: 정답. 그럼 왜 우유는 하얗니?\n학생: 선생님, 우유는 빛을 산란시키니까요.\n선생님: 훌륭해!",
"농담 220:\n\n아버지: 아들아, 왜 공부 안 하니?\n아들: 아빠, 저는 천재라서 공부 안 해도 돼요.\n아버지: 누가 그랬니?\n아들: 아무도 안 했지만, 제가 그렇게 생각해요!",
"농담 221:\n\n선생님: 지구는 왜 도니?\n학생: 선생님, 태양 주위를 돌면서 낮과 밤이 생기니까요.\n선생님: 그럼 왜 지구는 기울어져 있니?\n학생: 선생님, 지구가 피곤해서 기대고 있나 봐요!",
"농담 222:\n\n아내: 여보, 나 좋아해?\n남편: 좋아해.\n아내: 얼마나?\n남편: 음, 매일 네가 해준 밥을 먹을 정도!\n아내: 그건 사랑이 아니라 식욕이잖아!",
"농담 223:\n\n선생님: 왜 여름은 더우니?\n학생: 선생님, 지구가 태양에 가까워지니까요.\n선생님: 정답. 그럼 왜 겨울은 추우니?\n학생: 선생님, 지구가 태양에서 멀어지니까요!",
"농담 224:\n\n아버지: 아들아, 왜 신발 안 신었니?\n아들: 아빠, 양말을 신고 있으니까 괜찮아요.\n아버지: 하지만 밖에 비가 오잖아!\n아들: 아빠, 그래서 양말을 벗었어요!",
"농담 225:\n\n의사: 당신은 더 자야 해요.\n환자: 선생님, 저는 매일 8시간 자요.\n의사: 그럼 왜 피곤하죠?\n환자: 선생님, 야간 근무거든요!",
"농담 226:\n\n선생님: 왜 바닷물은 짜니?\n학생: 선생님, 물고기가 땀을 흘리니까요.\n선생님: 물고기는 땀을 흘리지 않아!\n학생: 선생님, 그럼 왜 짜요?",
"농담 227:\n\n아내: 여보, 이번 주말 어디 갈까?\n남편: 아무 데나 좋아.\n아내: 그럼 바다 갈까!\n남편: 하지만 바다는 멀어.\n아내: 그럼 산은?\n남편: 산도 멀어.\n아내: 그럼 집에 있자!\n남편: 그게 제일 좋겠네!",
"농담 228:\n\n선생님: 왜 식물은 초록색이니?\n학생: 선생님, 엽록소가 있으니까요.\n선생님: 정답. 그럼 왜 단풍은 빨간색이니?\n학생: 선생님, 가을이 되면 엽록소가 줄어들어서 빨간 색소가 보이니까요!",
"농담 229:\n\n아버지: 아들아, 왜 지각했니?\n아들: 아빠, 꿈을 꿨어요.\n아버지: 무슨 꿈?\n아들: 학교 가는 꿈요. 그래서 일어날 필요가 없다고 생각했어요!",
"농담 230:\n\n어떤 남자가 케이크 가게에 갔습니다: 생일 케이크 주세요.\n점원: 몇 살 생일이세요?\n남자: 30살이요.\n점원: 그럼 초는 30개 드려야겠네요.\n남자: 아니요, 1개만 주세요. 불 끄기가 힘들어서요!",
"농담 231:\n\n선생님: 왜 별은 빛나니?\n학생: 선생님, 핵융합 반응이 일어나서요.\n선생님: 정답. 그럼 왜 별은 반짝이니?\n학생: 선생님, 별이 윙크하는 거예요!",
"농담 232:\n\n아내: 여보, 우리 엄마가 온다는 거 알았어?\n남편: 응, 알았어.\n아내: 그럼 왜 도망가지 않았어?\n남편: 도망가려고 했는데, 짐이 너무 많았어!",
"농담 233:\n\n선생님: 왜 하늘은 파랗니?\n학생: 선생님, 레일리 산란 때문이에요.\n선생님: 잘 아네! 그럼 왜 노을은 빨갛니?\n학생: 선생님, 해가 지평선에 가까워지면 빛이 더 많은 대기를 통과하니까요!",
"농담 234:\n\n아버지: 아들아, 왜 TV만 보니?\n아들: 아빠, TV는 교육에 좋아요.\n아버지: 어떻게?\n아들: 일찍 안 자면 다음 프로그램을 못 보니까요!",
"농담 235:\n\n의사: 당신은 운동 부족이에요.\n환자: 선생님, 저는 매일 강아지 산책을 시켜요.\n의사: 얼마나 걸어요?\n환자: 강아지가 걷는 만큼만요. 저는 차로 따라가요!",
"농담 236:\n\n선생님: 왜 산은 높니?\n학생: 선생님, 판의 충돌로 생겼으니까요.\n선생님: 정답. 그럼 왜 산은 오래되면 낮아지니?\n학생: 선생님, 침식되니까요!",
"농담 237:\n\n아내: 여보, 오늘 무슨 날인지 알아?\n남편: 응, 알아.\n아내: 그럼 말해봐.\n남편: 음... 빨래하는 날?\n아내: 아니야, 우리 결혼기념일이야!\n남편: 아, 그래서 케이크를 산 거야!",
"농담 238:\n\n선생님: 왜 물은 끓니?\n학생: 선생님, 열에너지로 분자가 활발해져서요.\n선생님: 정답. 그럼 왜 수증기가 되니?\n학생: 선생님, 분자가 도망가고 싶어 해서요!",
"농담 239:\n\n아버지: 아들아, 왜 양말 안 신었니?\n아들: 아빠, 신발을 신고 있으니까 괜찮아요.\n아버지: 하지만 양말 안 신으면 발 냄새 나잖아!\n아들: 아빠, 신발을 벗지 않으면 안 들켜요!",
"농담 240:\n\n어떤 남자가 식당에 갔습니다: 이 스테이크 너무 딱딱해요!\n웨이터: 죄송합니다. 익힌 정도를 바꿔드릴까요?\n남자: 아니요, 부드럽게 해주세요!\n웨이터: 그건 불가능합니다, 소가 딱딱해서요!",
"농담 241:\n\n선생님: 왜 지구는 둥그니?\n학생: 선생님, 중력이 중심으로 당기니까요.\n선생님: 정답. 그럼 왜 완벽한 구가 아니니?\n학생: 선생님, 자전으로 원심력이 작용하니까요!",
"농담 242:\n\n아내: 여보, 내 어디가 좋아?\n남편: 네 미소가 좋아.\n아내: 그런데 지금 안 웃고 있잖아.\n남편: 그래서 지금은 안 좋아!",
"농담 243:\n\n선생님: 왜 비가 오니?\n학생: 선생님, 구름 속 물방울이 커져서 떨어지니까요.\n선생님: 정답. 그럼 왜 눈이 오니?\n학생: 선생님, 너무 추워서 물방울이 얼어붙으니까요!",
"농담 244:\n\n아버지: 아들아, 왜 숙제 안 하니?\n아들: 아빠, 숙제는 내일 한다고 했어요.\n아버지: 하지만 내일은 소풍이잖아.\n아들: 그래서 오늘은 쉬는 거예요!",
"농담 245:\n\n의사: 당신은 야채를 더 먹어야 해요.\n환자: 선생님, 저는 매일 샐러드를 먹어요.\n의사: 무슨 야채?\n환자: 상추, 토마토, 오이, 그리고... 감자칩!",
"농담 246:\n\n선생님: 달은 왜 지구 주위를 도니?\n학생: 선생님, 지구 중력에 끌리니까요.\n선생님: 정답. 그럼 왜 떨어지지 않니?\n학생: 선생님, 옆으로 움직이고 있으니까요!",
"농담 247:\n\n아내: 여보, 내 새 신발 어때?\n남편: 멋져.\n아내: 하지만 비쌌어.\n남편: 얼마야?\n아내: 50만 원.\n남편: 헉! 그 신발 신고 걸을 때 발 안 아파?\n아내: 아프지만, 겉모습이 중요해!",
"농담 248:\n\n선생님: 왜 천둥이 치니?\n학생: 선생님, 전기가 방전되니까요.\n선생님: 정답. 그럼 왜 번쩍이고 나서 소리가 나니?\n학생: 선생님, 빛이 소리보다 빠르니까요!",
"농담 249:\n\n아버지: 아들아, 왜 TV만 보니?\n아들: 아빠, TV는 교육에 좋아요.\n아버지: 어떻게?\n아들: TV를 보면 현실 도피를 할 수 있거든요!",
"농담 250:\n\n선생님: 왜 바람이 부니?\n학생: 선생님, 기압 차이로 공기가 움직이니까요.\n선생님: 정답. 그럼 왜 해풍은 낮에 부니?\n학생: 선생님, 땅이 빨리 데워져서요!",
"농담 251:\n\n아내: 여보, 나 사랑해?\n남편: 사랑해.\n아내: 그럼 어디가 좋아?\n남편: 네 요리.\n아내: 그럼 나 말고 요리가 좋은 거야?\n남편: 아니, 요리해주는 네가 좋은 거야!",
"농담 252:\n\n선생님: 왜 무지개가 생기니?\n학생: 선생님, 비 온 뒤 빛이 물방울에서 굴절되니까요.\n선생님: 정답. 그럼 왜 무지개는 반원이니?\n학생: 선생님, 땅에 가려져서요!",
"농담 253:\n\n아버지: 아들아, 왜 신발 안 신었니?\n아들: 아빠, 양말이 찢어졌어요.\n아버지: 그럼 양말을 신으면 되잖아!\n아들: 아빠, 그래서 신발을 안 신는 거예요!",
"농담 254:\n\n의사: 당신은 담배를 끊어야 해요.\n환자: 선생님, 저는 이미 끊었어요.\n의사: 언제요?\n환자: 5분 전에요.\n의사: 그럼 왜 담배 냄새가 나죠?\n환자: 아직 피고 있거든요!",

"농담 306:\n\n선생님: 왜 천둥이 치니?\n학생: 선생님, 전기가 방전되니까요.\n선생님: 정답. 그럼 왜 번쩍이고 나서 소리가 나니?\n학생: 선생님, 빛이 더 빠르니까요!",
"농담 307:\n\n아버지: 아들아, 왜 지각했니?\n아들: 아빠, 꿈을 꿨어요.\n아버지: 무슨 꿈?\n아들: 학교 가는 꿈요. 그래서 일어날 필요가 없다고 생각했어요!",
"농담 308:\n\n어떤 남자가 케이크 가게에 갔습니다: 생일 케이크 주세요.\n점원: 몇 살 생일이세요?\n남자: 40살이요.\n점원: 그럼 초는 40개 드려야겠네요.\n남자: 아니요, 1개만 주세요. 불 끄기가 힘들어서요!",
"농담 309:\n\n선생님: 왜 별은 빛나니?\n학생: 선생님, 핵융합 반응이 일어나서요.\n선생님: 정답. 그럼 왜 별은 반짝이니?\n학생: 선생님, 별이 윙크하는 거예요!",
"농담 310:\n\n아내: 여보, 우리 엄마가 온다는 거 알았어?\n남편: 응, 알았어.\n아내: 그럼 왜 도망가지 않았어?\n남편: 도망가려고 했는데, 짐이 너무 많았어!",
"농담 311:\n\n선생님: 왜 하늘은 파랗니?\n학생: 선생님, 레일리 산란 때문이에요.\n선생님: 잘 아네! 그럼 왜 노을은 빨갛니?\n학생: 선생님, 해가 지평선에 가까워지면 빛이 더 많은 대기를 통과하니까요!",
"농담 312:\n\n아버지: 아들아, 왜 TV만 보니?\n아들: 아빠, TV는 교육에 좋아요.\n아버지: 어떻게?\n아들: 일찍 안 자면 다음 프로그램을 못 보니까요!",
"농담 313:\n\n의사: 당신은 운동 부족이에요.\n환자: 선생님, 저는 매일 강아지 산책을 시켜요.\n의사: 얼마나 걸어요?\n환자: 강아지가 걷는 만큼만요. 저는 차로 따라가요!",
"농담 314:\n\n선생님: 왜 산은 높니?\n학생: 선생님, 판의 충돌로 생겼으니까요.\n선생님: 정답. 그럼 왜 산은 오래되면 낮아지니?\n학생: 선생님, 침식되니까요!",
"농담 315:\n\n아내: 여보, 오늘 무슨 날인지 알아?\n남편: 응, 알아.\n아내: 그럼 말해봐.\n남편: 음... 빨래하는 날?\n아내: 아니야, 우리 결혼기념일이야!\n남편: 아, 그래서 케이크를 산 거야!",
"농담 316:\n\n선생님: 왜 물은 끓니?\n학생: 선생님, 열에너지로 분자가 활발해져서요.\n선생님: 정답. 그럼 왜 수증기가 되니?\n학생: 선생님, 분자가 도망가고 싶어 해서요!",
"농담 317:\n\n아버지: 아들아, 왜 양말 안 신었니?\n아들: 아빠, 신발을 신고 있으니까 괜찮아요.\n아버지: 하지만 양말 안 신으면 발 냄새 나잖아!\n아들: 아빠, 신발을 벗지 않으면 안 들켜요!",
"농담 318:\n\n어떤 남자가 식당에 갔습니다: 이 스테이크 너무 딱딱해요!\n웨이터: 죄송합니다. 익힌 정도를 바꿔드릴까요?\n남자: 아니요, 부드럽게 해주세요!\n웨이터: 그건 불가능합니다, 소가 딱딱해서요!",
"농담 319:\n\n선생님: 왜 지구는 둥그니?\n학생: 선생님, 중력이 중심으로 당기니까요.\n선생님: 정답. 그럼 왜 완벽한 구가 아니니?\n학생: 선생님, 자전으로 원심력이 작용하니까요!",
"농담 320:\n\n아내: 여보, 내 어디가 좋아?\n남편: 네 미소가 좋아.\n아내: 그런데 지금 안 웃고 있잖아.\n남편: 그래서 지금은 안 좋아!",
"농담 321:\n\n선생님: 왜 비가 오니?\n학생: 선생님, 구름 속 물방울이 커져서 떨어지니까요.\n선생님: 정답. 그럼 왜 눈이 오니?\n학생: 선생님, 너무 추워서 물방울이 얼어붙으니까요!",
"농담 322:\n\n아버지: 아들아, 왜 숙제 안 하니?\n아들: 아빠, 숙제는 내일 한다고 했어요.\n아버지: 하지만 내일은 소풍이잖아.\n아들: 그래서 오늘은 쉬는 거예요!",
"농담 323:\n\n의사: 당신은 야채를 더 먹어야 해요.\n환자: 선생님, 저는 매일 샐러드를 먹어요.\n의사: 무슨 야채?\n환자: 상추, 토마토, 오이, 그리고... 감자칩!",
"농담 324:\n\n선생님: 달은 왜 지구 주위를 도니?\n학생: 선생님, 지구 중력에 끌리니까요.\n선생님: 정답. 그럼 왜 떨어지지 않니?\n학생: 선생님, 옆으로 움직이고 있으니까요!",
"농담 325:\n\n아내: 여보, 내 새 신발 어때?\n남편: 멋져.\n아내: 하지만 비쌌어.\n남편: 얼마야?\n아내: 50만 원.\n남편: 헉! 그 신발 신고 걸을 때 발 안 아파?\n아내: 아프지만, 겉모습이 중요해!",
"농담 326:\n\n선생님: 왜 천둥이 치니?\n학생: 선생님, 전기가 방전되니까요.\n선생님: 정답. 그럼 왜 번쩍이고 나서 소리가 나니?\n학생: 선생님, 빛이 소리보다 빠르니까요!",
"농담 327:\n\n아버지: 아들아, 왜 TV만 보니?\n아들: 아빠, TV는 교육에 좋아요.\n아버지: 어떻게?\n아들: TV를 보면 현실 도피를 할 수 있거든요!",
"농담 328:\n\n선생님: 왜 바람이 부니?\n학생: 선생님, 기압 차이로 공기가 움직이니까요.\n선생님: 정답. 그럼 왜 해풍은 낮에 부니?\n학생: 선생님, 땅이 빨리 데워져서요!",

"농담 359:\n\n아내: 여보, 내 어디가 좋아?\n남편: 네 미소가 좋아.\n아내: 그런데 지금 안 웃고 있잖아.\n남편: 그래서 지금은 안 좋아!",
"농담 360:\n\n선생님: 왜 비가 오니?\n학생: 선생님, 구름 속 물방울이 커져서 떨어지니까요.\n선생님: 정답. 그럼 왜 눈이 오니?\n학생: 선생님, 너무 추워서 물방울이 얼어붙으니까요!",
"농담 361:\n\n아버지: 아들아, 왜 숙제 안 하니?\n아들: 아빠, 숙제는 내일 한다고 했어요.\n아버지: 하지만 내일은 소풍이잖아.\n아들: 그래서 오늘은 쉬는 거예요!",
"농담 362:\n\n의사: 당신은 야채를 더 먹어야 해요.\n환자: 선생님, 저는 매일 샐러드를 먹어요.\n의사: 무슨 야채?\n환자: 상추, 토마토, 오이, 그리고... 감자칩!",

"농담 364:\n\n아내: 여보, 내 새 신발 어때?\n남편: 멋져.\n아내: 하지만 비쌌어.\n남편: 얼마야?\n아내: 50만 원.\n남편: 헉! 그 신발 신고 걸을 때 발 안 아파?\n아내: 아프지만, 겉모습이 중요해!",

"농담 366:\n\n아버지: 아들아, 왜 TV만 보니?\n아들: 아빠, TV는 교육에 좋아요.\n아버지: 어떻게?\n아들: TV를 보면 현실 도피를 할 수 있거든요!",
"농담 367:\n\n선생님: 왜 바람이 부니?\n학생: 선생님, 기압 차이로 공기가 움직이니까요.\n선생님: 정답. 그럼 왜 해풍은 낮에 부니?\n학생: 선생님, 땅이 빨리 데워져서요!",

"농담 369:\n\n선생님: 왜 무지개가 생기니?\n학생: 선생님, 비 온 뒤 빛이 물방울에서 굴절되니까요.\n선생님: 정답. 그럼 왜 무지개는 반원이니?\n학생: 선생님, 땅에 가려져서요!",
"농담 370:\n\n아버지: 아들아, 왜 신발 안 신었니?\n아들: 아빠, 양말이 찢어졌어요.\n아버지: 그럼 양말을 신으면 되잖아!\n아들: 아빠, 그래서 신발을 안 신는 거예요!",
"농담 371:\n\n의사: 당신은 담배를 끊어야 해요.\n환자: 선생님, 저는 이미 끊었어요.\n의사: 언제요?\n환자: 5분 전에요.\n의사: 그럼 왜 담배 냄새가 나죠?\n환자: 아직 피고 있거든요!",
"농담 372:\n\n선생님: 왜 눈은 하얗니?\n학생: 선생님, 빛이 눈 결정에 반사되니까요.\n선생님: 정답. 그럼 왜 눈은 차가우니?\n학생: 선생님, 얼음 결정이니까요!",
"농담 373:\n\n아내: 여보, 주말에 뭐 할 거야?\n남편: 잘 거야.\n아내: 그럼 나는?\n남편: 너도 자면 되잖아?\n아내: 하지만 나는 쇼핑 가고 싶어!\n남편: 그럼 꿈에서 쇼핑해!",
"농담 374:\n\n선생님: 왜 별은 반짝이니?\n학생: 선생님, 지구 대기에서 빛이 굴절되니까요.\n선생님: 정답. 그럼 우주에서는 반짝이니?\n학생: 선생님, 우주에서는 반짝이지 않아요!",
"농담 375:\n\n아버지: 아들아, 왜 숙제 안 하니?\n아들: 아빠, 숙제는 내일 한다고 선생님께 말했어요.\n아버지: 그럼 내일은 뭐라고 할 거니?\n아들: 모레 한다고 할 거예요!",

"농담 417:\n\n아내: 여보, 나 좋아해?\n남편: 좋아해.\n아내: 얼마나?\n남편: 별의 수만큼!\n아내: 그럼 세어봐.\n남편: 음... 1, 2, 3... 많아!",

"농담 419:\n\n아버지: 아들아, 왜 TV만 보니?\n아들: 아빠, TV는 교육에 좋아요.\n아버지: 어떤 교육?\n아들: TV를 보면 숙제를 잊을 수 있거든요!",

"농담 464:\n\n어떤 남자가 케이크 가게에 갔습니다: 생일 케이크 주세요.\n점원: 몇 살 생일이세요?\n남자: 40살이요.\n점원: 그럼 초는 40개 드려야겠네요.\n남자: 아니요, 1개만 주세요. 불 끄기가 힘들어서요!",
"농담 465:\n\n선생님: 왜 별은 빛나니?\n학생: 선생님, 핵융합 반응이 일어나서요.\n선생님: 정답. 그럼 왜 별은 반짝이니?\n학생: 선생님, 별이 윙크하는 거예요!",
"농담 466:\n\n아내: 여보, 우리 엄마가 온다는 거 알았어?\n남편: 응, 알았어.\n아내: 그럼 왜 도망가지 않았어?\n남편: 도망가려고 했는데, 짐이 너무 많았어!",
"농담 467:\n\n선생님: 왜 하늘은 파랗니?\n학생: 선생님, 레일리 산란 때문이에요.\n선생님: 잘 아네! 그럼 왜 노을은 빨갛니?\n학생: 선생님, 해가 지평선에 가까워지면 빛이 더 많은 대기를 통과하니까요!",
"농담 468:\n\n아버지: 아들아, 왜 TV만 보니?\n아들: 아빠, TV는 교육에 좋아요.\n아버지: 어떻게?\n아들: 일찍 안 자면 다음 프로그램을 못 보니까요!",
"농담 469:\n\n의사: 당신은 운동 부족이에요.\n환자: 선생님, 저는 매일 강아지 산책을 시켜요.\n의사: 얼마나 걸어요?\n환자: 강아지가 걷는 만큼만요. 저는 차로 따라가요!",
"농담 470:\n\n선생님: 왜 산은 높니?\n학생: 선생님, 판의 충돌로 생겼으니까요.\n선생님: 정답. 그럼 왜 산은 오래되면 낮아지니?\n학생: 선생님, 침식되니까요!",
"농담 471:\n\n아내: 여보, 오늘 무슨 날인지 알아?\n남편: 응, 알아.\n아내: 그럼 말해봐.\n남편: 음... 빨래하는 날?\n아내: 아니야, 우리 결혼기념일이야!\n남편: 아, 그래서 케이크를 산 거야!",
"농담 472:\n\n선생님: 왜 물은 끓니?\n학생: 선생님, 열에너지로 분자가 활발해져서요.\n선생님: 정답. 그럼 왜 수증기가 되니?\n학생: 선생님, 분자가 도망가고 싶어 해서요!",
"농담 473:\n\n아버지: 아들아, 왜 양말 안 신었니?\n아들: 아빠, 신발을 신고 있으니까 괜찮아요.\n아버지: 하지만 양말 안 신으면 발 냄새 나잖아!\n아들: 아빠, 신발을 벗지 않으면 안 들켜요!",
"농담 474:\n\n어떤 남자가 식당에 갔습니다: 이 스테이크 너무 딱딱해요!\n웨이터: 죄송합니다. 익힌 정도를 바꿔드릴까요?\n남자: 아니요, 부드럽게 해주세요!\n웨이터: 그건 불가능합니다, 소가 딱딱해서요!",
"농담 475:\n\n선생님: 왜 지구는 둥그니?\n학생: 선생님, 중력이 중심으로 당기니까요.\n선생님: 정답. 그럼 왜 완벽한 구가 아니니?\n학생: 선생님, 자전으로 원심력이 작용하니까요!",
"농담 476:\n\n아내: 여보, 내 어디가 좋아?\n남편: 네 미소가 좋아.\n아내: 그런데 지금 안 웃고 있잖아.\n남편: 그래서 지금은 안 좋아!",
"농담 477:\n\n선생님: 왜 비가 오니?\n학생: 선생님, 구름 속 물방울이 커져서 떨어지니까요.\n선생님: 정답. 그럼 왜 눈이 오니?\n학생: 선생님, 너무 추워서 물방울이 얼어붙으니까요!",
"농담 478:\n\n아버지: 아들아, 왜 숙제 안 하니?\n아들: 아빠, 숙제는 내일 한다고 했어요.\n아버지: 하지만 내일은 소풍이잖아.\n아들: 그래서 오늘은 쉬는 거예요!",
"농담 479:\n\n의사: 당신은 야채를 더 먹어야 해요.\n환자: 선생님, 저는 매일 샐러드를 먹어요.\n의사: 무슨 야채?\n환자: 상추, 토마토, 오이, 그리고... 감자칩!",
"농담 480:\n\n선생님: 달은 왜 지구 주위를 도니?\n학생: 선생님, 지구 중력에 끌리니까요.\n선생님: 정답. 그럼 왜 떨어지지 않니?\n학생: 선생님, 옆으로 움직이고 있으니까요!",
"농담 481:\n\n아내: 여보, 내 새 신발 어때?\n남편: 멋져.\n아내: 하지만 비쌌어.\n남편: 얼마야?\n아내: 50만 원.\n남편: 헉! 그 신발 신고 걸을 때 발 안 아파?\n아내: 아프지만, 겉모습이 중요해!",
"농담 482:\n\n선생님: 왜 천둥이 치니?\n학생: 선생님, 전기가 방전되니까요.\n선생님: 정답. 그럼 왜 번쩍이고 나서 소리가 나니?\n학생: 선생님, 빛이 소리보다 빠르니까요!",
"농담 483:\n\n아버지: 아들아, 왜 TV만 보니?\n아들: 아빠, TV는 교육에 좋아요.\n아버지: 어떻게?\n아들: TV를 보면 현실 도피를 할 수 있거든요!",
"농담 484:\n\n선생님: 왜 바람이 부니?\n학생: 선생님, 기압 차이로 공기가 움직이니까요.\n선생님: 정답. 그럼 왜 해풍은 낮에 부니?\n학생: 선생님, 땅이 빨리 데워져서요!",
"농담 485:\n\n아내: 여보, 나 사랑해?\n남편: 사랑해.\n아내: 그럼 어디가 좋아?\n남편: 네 요리.\n아내: 그럼 나 말고 요리가 좋은 거야?\n남편: 아니, 요리해주는 네가 좋은 거야!",
"농담 486:\n\n선생님: 왜 무지개가 생기니?\n학생: 선생님, 비 온 뒤 빛이 물방울에서 굴절되니까요.\n선생님: 정답. 그럼 왜 무지개는 반원이니?\n학생: 선생님, 땅에 가려져서요!",
"농담 487:\n\n아버지: 아들아, 왜 신발 안 신었니?\n아들: 아빠, 양말이 찢어졌어요.\n아버지: 그럼 양말을 신으면 되잖아!\n아들: 아빠, 그래서 신발을 안 신는 거예요!",
"농담 488:\n\n의사: 당신은 담배를 끊어야 해요.\n환자: 선생님, 저는 이미 끊었어요.\n의사: 언제요?\n환자: 5분 전에요.\n의사: 그럼 왜 담배 냄새가 나죠?\n환자: 아직 피고 있거든요!",
"농담 489:\n\n선생님: 왜 눈은 하얗니?\n학생: 선생님, 빛이 눈 결정에 반사되니까요.\n선생님: 정답. 그럼 왜 눈은 차가우니?\n학생: 선생님, 얼음 결정이니까요!",
"농담 490:\n\n아내: 여보, 주말에 뭐 할 거야?\n남편: 잘 거야.\n아내: 그럼 나는?\n남편: 너도 자면 되잖아?\n아내: 하지만 나는 쇼핑 가고 싶어!\n남편: 그럼 꿈에서 쇼핑해!",
"농담 491:\n\n선생님: 왜 별은 반짝이니?\n학생: 선생님, 지구 대기에서 빛이 굴절되니까요.\n선생님: 정답. 그럼 우주에서는 반짝이니?\n학생: 선생님, 우주에서는 반짝이지 않아요!",
"농담 492:\n\n아버지: 아들아, 왜 숙제 안 하니?\n아들: 아빠, 숙제는 내일 한다고 선생님께 말했어요.\n아버지: 그럼 내일은 뭐라고 할 거니?\n아들: 모레 한다고 할 거예요!",
"농담 493:\n\n어떤 남자가 안경점에 갔습니다: 안경을 주세요.\n점원: 어떤 안경이요?\n남자: 멋있어 보이는 걸로요!\n점원: 그럼 선글라스를 드릴게요!",
"농담 494:\n\n선생님: 왜 하늘은 파랗니?\n학생: 선생님, 레일리 산란 때문이에요.\n선생님: 정답. 그럼 왜 바다는 파랗니?\n학생: 선생님, 물이 빛을 흡수하니까요!",
"농담 495:\n\n아내: 여보, 나 좋아해?\n남편: 좋아해.\n아내: 얼마나?\n남편: 별의 수만큼!\n아내: 그럼 세어봐.\n남편: 음... 1, 2, 3... 많아!",
"농담 496:\n\n선생님: 왜 지구는 온난화되고 있니?\n학생: 선생님, 온실가스가 늘어나서요.\n선생님: 정답. 그럼 어떻게 해야 할까?\n학생: 선생님, 에어컨을 끄고 창문을 열어요!",
"농담 497:\n\n아버지: 아들아, 왜 TV만 보니?\n아들: 아빠, TV는 교육에 좋아요.\n아버지: 어떤 교육?\n아들: TV를 보면 숙제를 잊을 수 있거든요!",
"농담 498:\n\n의사: 당신은 운동 부족이에요.\n환자: 선생님, 저는 매일 계단을 이용해요.\n의사: 몇 층까지요?\n환자: 1층에서 2층까지요!\n의사: 그건 운동이 아니에요.",
"농담 499:\n\n선생님: 왜 물은 끓니?\n학생: 선생님, 열로 분자가 활발해지니까요.\n선생님: 정답. 그럼 왜 수증기가 되니?\n학생: 선생님, 분자가 뛰쳐나가고 싶어 해서요!",
"농담 500:\n\n아내: 여보, 내 새 가방 어때?\n남편: 멋져.\n아내: 하지만 비쌌어.\n남편: 얼마야?\n아내: 100만 원.\n남편: 헉! 그 가방 들고 쇼핑 가는 거야?\n아내: 응, 겉모습이 중요하니까! 🎉 (500개 완료!)",
"농담 501:\n\n선생님: 왜 개미는 부지런하니?\n학생: 선생님, 겨울을 대비해야 하니까요.\n선생님: 그럼 왜 베짱이는 노래만 부르니?\n학생: 선생님, 겨울이 아직 멀어서요!",
"농담 502:\n\n아내: 여보, 내 생일 선물 뭐야?\n남편: 비밀이야.\n아내: 힌트만 줘.\n남편: 음... 아직 안 샀어!",
"농담 503:\n\n의사: 당신은 과일을 더 먹어야 해요.\n환자: 선생님, 저는 매일 사과를 먹어요.\n의사: 어떤 사과요?\n환자: 애플파이요!",
"농담 504:\n\n선생님: 왜 하늘은 파랗고 노을은 빨갛니?\n학생: 선생님, 빛의 산란 때문이에요. 낮에는 파란 빛이, 저녁에는 빨간 빛이 잘 보여요.\n선생님: 완벽해!",
"농담 505:\n\n아내: 여보, 나 살쪘어?\n남편: 아니야.\n아내: 진짜? 거울 보니까 뚱뚱해 보여.\n남편: 거울이 이상한 거야!\n아내: 당신이 더 이상해!",
"농담 506:\n\n선생님: 왜 물고기는 물속에서 숨 쉴 수 있니?\n학생: 선생님, 아가미가 있으니까요.\n선생님: 그럼 왜 땅에서는 못 숨 쉬니?\n학생: 선생님, 아가미가 말라서요!",
"농담 507:\n\n아버지: 아들아, 용돈 다 썼니?\n아들: 네, 아빠.\n아버지: 뭐에 썼어?\n아들: 과자랑 장난감이요.\n아버지: 다음엔 저축도 좀 해라.\n아들: 네, 다음엔 더 비싼 장난감 살 거예요!",
"농담 508:\n\n의사: 당신은 스트레스를 줄여야 해요.\n환자: 어떻게 줄여요?\n의사: 좋아하는 일을 하세요.\n환자: 저는 잠자는 게 좋아요.\n의사: 그럼 많이 자세요!\n환자: 하지만 저는 일해야 해요!",
"농담 509:\n\n선생님: 왜 무지개는 반원 모양이니?\n학생: 선생님, 땅에 가려져서 그래요.\n선생님: 정답! 그럼 왜 비 온 뒤에 나타나니?\n학생: 선생님, 햇빛이 물방울에 반사되니까요!",
"농담 510:\n\n아내: 여보, TV 좀 그만 봐!\n남편: 하지만 뉴스 보고 있어.\n아내: 무슨 뉴스?\n남편: 축구 뉴스.\n아내: 그건 스포츠잖아!",
"농담 511:\n\n선생님: 왜 달은 지구 주위를 도니?\n학생: 선생님, 중력 때문에요.\n선생님: 그럼 왜 부딪히지 않니?\n학생: 선생님, 계속 옆으로 움직이니까요!",
"농담 512:\n\n아버지: 아들아, 왜 우유를 안 마시니?\n아들: 아빠, 저는 우유가 싫어요.\n아버지: 키가 크려면 마셔야지.\n아들: 아빠는 우유 많이 마셨는데 왜 안 크셨어요?",
"농담 513:\n\n아내: 여보, 나 예뻐?\n남편: 응, 예뻐.\n아내: 거짓말!\n남편: 그럼 왜 물어봐?\n아내: 그냥 듣고 싶어서!",
"농담 514:\n\n의사: 당신은 물을 많이 마셔야 해요.\n환자: 선생님, 저는 매일 콜라를 마셔요.\n의사: 콜라는 물이 아니에요.\n환자: 하지만 콜라에도 물이 들어있잖아요!",
