"Анекдот 81:\n\nУчитель: Какой главный урок?\nУченик: До свадьбы я думал, что царь, а после свадьбы понял, что министр, а жена — премьер!",
"Анекдот 82:\n\nВрач: Вам нужно спать.\nПациент: Я сплю.\nВрач: Сколько часов?\nПациент: Весь день!",
"Анекдот 83:\n\nУчитель: Если у тебя будет самолет, куда полетишь?\nУченик: К маме жены!",
"Анекдот 84:\n\nЖена: Если я умру, ты женишься?\nМуж: Женюсь.\nЖена: А если я останусь жива?\nМуж: Тогда останешься!",
"Анекдот 85:\n\nУчитель: Если у тебя будет миллион, что сделаешь?\nУченик: Отправлю жену к маме и посплю!",
"Анекдот 86:\n\nВрач: Вам нельзя курить.\nПациент: Я только смотрю.\nВрач: Тогда перестаньте смотреть!",
"Анекдот 87:\n\nУчитель: Что ты почувствовал после свадьбы?\nУченик: Раньше думал, что свободен, а после свадьбы понял, что был в тюрьме, а теперь вышел!",
"Анекдот 88:\n\nЖена: Ты меня сильно любишь?\nМуж: Так сильно, что не пускаю к маме.\nЖена: Ой, какая любовь!\nМуж: Нет, экономлю!",
"Анекдот 89:\n\nУчитель: Какой самый большой стресс?\nУченик: Когда жена сказала, что я стану папой, а я еще ребенок!",
"Анекдот 90:\n\nВрач: Вам нужно заниматься спортом.\nПациент: Я занимаюсь каждый день.\nВрач: Как?\nПациент: Бегаю от ругани жены!",
"Анекдот 91:\n\nУчитель: Если жена и мама ругают, кого слушаешь?\nУченик: Маму.\nУчитель: А жену?\nУченик: Жену я и ночью слушаю!",
"Анекдот 92:\n\nЖена: Что приготовить?\nМуж: Что душа пожелает.\nЖена: Хорошо, ничего не готовлю.\nМуж: Нет, я пошутил!",
"Анекдот 93:\n\nУчитель: Зачем тебе жениться?\nУченик: Мама сказала, что после свадьбы никто не будет ругать.\nУчитель: И что?\nУченик: Теперь ругает только жена!",
"Анекдот 94:\n\nВрач: Вам нужно меньше сладкого.\nПациент: Я не ем сладкое.\nВрач: Тогда почему плохие зубы?\nПациент: Я бросил сладкое, но не бросил жену!",
"Анекдот 95:\n\nУчитель: Какой самый большой шок?\nУченик: Когда собрал жену к маме, а она сказала: «Я не поеду!»",
"Анекдот 96:\n\nЖена: Какая твоя любимая вещь?\nМуж: Ты.\nЖена: Ой, как мило!\nМуж: Нет, моя любимая вещь — твой отъезд!",
"Анекдот 97:\n\nУчитель: Если жена и ребенок упадут в реку, кого спасешь?\nУченик: Ребенка.\nУчитель: А жену?\nУченик: Жена сама выплывет!",
"Анекдот 98:\n\nВрач: Вам нужен отдых.\nПациент: Я и так отдыхаю.\nВрач: Тогда почему больны?\nПациент: Устал отдыхать!",
"Анекдот 99:\n\nУчитель: Как твои оценки?\nУченик: Я сдал!\nУчитель: Сколько баллов?\nУчитель: Для сдачи баллы не нужны!",
"Анекдот 100:\n\nЖена: Куда пойдем вечером?\nМуж: Куда скажешь.\nЖена: К маме?\nМуж: Зачем?\nЖена: Там еда есть и зарплата сохранится! Поздравляю, 100 анекдотов готово! 🎉",
"Анекдот 101:\n\nУчитель: Вовочка, почему ты опоздал на урок?\nВовочка: Марья Ивановна, я проснулся, посмотрел на часы, а там уже 8:30!\nУчитель: А если бы ты посмотрел на календарь, то понял бы, что сегодня суббота!",
"Анекдот 102:\n\nВрач: Пациент, у вас отличное здоровье! Сколько вам лет?\nПациент: 40.\nВрач: И вы выглядите на 30!\nПациент: Спасибо, это потому что я не женат.\nВрач: А кто вас тогда так довел до жизни такой?",
"Анекдот 103:\n\nЖена: Дорогой, у нас кончился сахар.\nМуж: Я в магазине.\nЖена: И еще кончилось молоко, хлеб, масло...\nМуж: Я понял, я уже еду в супермаркет.\nЖена: И еще мне нужна новая шуба!\nМуж: Я уже в ювелирном... то есть в аэропорту!",
"Анекдот 104:\n\nРазговор двух друзей:\n- Как дела?\n- Да вот, женился.\n- Поздравляю! А как жена?\n- Не знаю, она пока молчит, но уже подозрительно смотрит.",
"Анекдот 105:\n\nУчитель: Петров, ты почему домашнее задание не сделал?\nПетров: А мы с папой рыбу ловили.\nУчитель: И много поймали?\nПетров: Нет, но папа сказал, что если я не сдам домашку, он меня на рыбалку больше не возьмет. А я не хочу!",
"Анекдот 106:\n\nМужчина в аптеке:\n- Дайте мне что-нибудь от головной боли.\n- Вот, возьмите.\n- А от жены есть что-нибудь?\n- Увы, это не лечится, только развод!",
"Анекдот 107:\n\nЖена: Ты меня любишь?\nМуж: Да.\nЖена: А почему ты тогда не говоришь мне комплименты?\nМуж: Я же сказал «Да».\nЖена: Это не комплимент!\nМуж: Хорошо, «Да, моя королева».",
"Анекдот 108:\n\nУчитель: Сидоров, ты знаешь, что такое «вечность»?\nСидоров: Это время, которое пройдет, пока мама поговорит по телефону с тетей Зиной!",
"Анекдот 109:\n\nДва программиста:\n- У меня дома ремонт. Жена заставила обои клеить.\n- И как?\n- Пока не знаю, вчера два раза переделывал. В третий раз нанимаю специалистов.",
"Анекдот 110:\n\nМуж: Дорогая, я сегодня задержусь на работе, у нас аврал.\nЖена: Хорошо, а я тогда приглашу подруг.\nМуж: Не надо! Я уже иду домой!",
"Анекдот 111:\n\nВрач: У вас амнезия. Вы помните, что я вам говорил вчера?\nПациент: Нет.\nВрач: А позавчера?\nПациент: Тоже нет.\nВрач: И вы еще жалуетесь на память?",
"Анекдот 112:\n\nУчитель: Иванов, что такое «бизнес»?\nИванов: Это когда ты продаешь вещи, которые купил в кредит, чтобы купить то, что продал.",
"Анекдот 113:\n\nТеща зятю:\n- Почему ты вчера так поздно пришел?\nЗять: Я был с друзьями.\n- А почему от тебя не пахнет спиртным?\n- Я не пил.\n- А почему от тебя пахнет женой?\n- Ой, простите, я перепутал этажи!",
"Анекдот 114:\n\nУчитель: Вовочка, ты знаешь, сколько будет дважды два?\nВовочка: Четыре.\nУчитель: Правильно! А сколько будет пятью пять?\nВовочка: Двадцать пять.\nУчитель: А что такое «бесконечность»?\nВовочка: Это то, что я получаю по математике за домашку!",
"Анекдот 115:\n\nЖена: Дорогой, если ты меня не любишь, скажи прямо.\nМуж: Я тебя люблю.\nЖена: Почему ты это сказал без эмоций?\nМуж: Потому что у меня нет пульта управления, чтобы включить эмоции!",
"Анекдот 116:\n\nМужик приходит к врачу:\n- Доктор, у меня проблема: каждый раз, когда я закрываю глаза, я вижу жену.\n- И что тут плохого?\n- Она меня ругает даже в моих мечтах!",
"Анекдот 117:\n\nДва друга:\n- Слушай, ты когда женился, ты счастлив?\n- Конечно!\n- А как же твоя свобода?\n- А я ее и не терял! Я просто теперь спрашиваю разрешение на все!",
"Анекдот 118:\n\nУчитель: Петров, ты почему молчишь?\nПетров: Я думаю.\nУчитель: О чем?\nПетров: О смысле жизни.\nУчитель: И какой же смысл?\nПетров: Получить двойку и пойти домой спать!",
"Анекдот 119:\n\nМуж жене:\n- Я понял, что я не идеален.\n- И что теперь?\n- Теперь я понимаю, что ты тоже не идеальна. Пойдем, выпьем чаю за наше несовершенство!",
"Анекдот 120:\n\nВ аптеке:\n- Мне нужны таблетки от жадности.\n- Вам одну пачку?\n- Дайте мне две, но скидку пополам!",
"Анекдот 121:\n\nУчитель: Как ты понимаешь слово «компромисс»?\nУченик: Это когда жена говорит: «Купи мне шубу», а ты покупаешь ей машину, но подешевле, чтобы она не заметила!",
"Анекдот 122:\n\nДве подруги:\n- Мой муж мне совсем не помогает по дому.\n- А ты ему что говорила?\n- Я ему говорила, что он ленивый.\n- А надо было сказать, что у него руки не из того места растут! Тогда он сразу все сделает, чтобы доказать обратное!",
"Анекдот 123:\n\nМужик в ресторане:\n- Официант, у меня в супе плавает муха!\n- Извините, сэр, мы сейчас ее выловим и заменим на свежую!",
"Анекдот 124:\n\nУчитель: Вовочка, почему ты не сдал экзамен?\nВовочка: Марья Ивановна, я не мог прийти.\nУчитель: А что случилось?\nВовочка: Я смотрел телевизор, и у меня отобрали пульт!",
"Анекдот 125:\n\nЖена: Ты помнишь, что сегодня годовщина нашей свадьбы?\nМуж: Конечно, дорогая! Я даже подарок купил!\nЖена: А почему он у тебя в гараже?\nМуж: Потому что у нас в доме места нет!",
"Анекдот 126:\n\nМужчина в магазине:\n- У вас есть что-нибудь от депрессии?\n- Есть шоколад.\n- А что-нибудь действенное?\n- Есть еще дополнительная скидка!",
"Анекдот 127:\n\nУчитель: Что такое «ложь»?\nУченик: Это когда папа говорит, что он не голоден, а потом съедает весь ужин!",
"Анекдот 128:\n\nДва мужика:\n- Ты знаешь, я вчера так напился, что не помню, как пришел домой.\n- А как жена отреагировала?\n- Не знаю, я не помню, как она меня ругала, но утром у меня болела не только голова, но и уши!",
"Анекдот 129:\n\nЖена: Дорогой, ты меня слышишь?\nМуж: Да, дорогая.\nЖена: А почему ты тогда не слушаешь?\nМуж: Я слушаю, просто не запоминаю!",
"Анекдот 130:\n\nВрач: Пациент, у вас серьезное заболевание.\nПациент: Доктор, а можно я выйду покурить, чтобы успокоиться?\nВрач: Нет, курить нельзя!\nПациент: А тогда можно я выйду выпить?\nВрач: Тоже нельзя!\nПациент: А как же я успокоюсь?",
"Анекдот 131:\n\nУчитель: Вовочка, ты знаешь, что такое «эволюция»?\nВовочка: Это когда обезьяна превратилась в человека.\nУчитель: А ты знаешь, что такое «деградация»?\nВовочка: Это когда человек превращается в ученика!",
"Анекдот 132:\n\nМуж: Дорогая, я забыл, что мы ссорились. Ты не подскажешь, из-за чего?\nЖена: Из-за того, что ты забыл, что мы ссорились!",
"Анекдот 133:\n\nДва друга:\n- У меня жена готовит ужин.\n- А что она готовит?\n- Я не знаю, но она сказала, что это будет сюрприз.\n- Боишься?\n- Очень!",
"Анекдот 134:\n\nУчитель: Петров, как называется человек, который живет в лесу?\nПетров: Дикарь!\nУчитель: А если он сидит на дереве?\nПетров: Это уже телевизор смотрит!",
"Анекдот 135:\n\nЖена: Дорогой, я нашла у тебя в кармане чек из ресторана. Ты с кем там был?\nМуж: Я был с другом.\nЖена: А почему там написано «два кофе и один десерт»?\nМуж: Потому что друг не любит сладкое!",
"Анекдот 136:\n\nВрач: Пациент, у вас склероз.\nПациент: А что это?\nВрач: Это когда вы все забываете.\nПациент: А, ну это не так страшно, я думал, что у меня что-то серьезное!",
"Анекдот 137:\n\nУчитель: Вовочка, ты почему опоздал?\nВовочка: Я проснулся, посмотрел на часы, а там 8:30.\nУчитель: А почему ты не посмотрел на будильник?\nВовочка: А я его разбил, когда он меня будил!",
"Анекдот 138:\n\nЖена: Дорогой, ты меня любишь?\nМуж: Да.\nЖена: А почему ты не скажешь это с эмоциями?\nМуж: Потому что я экономлю слова, чтобы купить тебе подарок!",
"Анекдот 139:\n\nМужик приходит в магазин:\n- У вас есть шоколад «Аленка»?\n- Есть.\n- А почему он такой дорогой?\n- Потому что он с орехами.\n- А орехи где?\n- В цене!",
"Анекдот 140:\n\nУчитель: Иванов, что такое «дружба»?\nИванов: Это когда один друг звонит другому в 3 часа ночи, и тот не бросает трубку!\nУчитель: А что такое «настоящая дружба»?\nИванов: Это когда он еще и приезжает на помощь!",
"Анекдот 141:\n\nДва мужика:\n- Ты знаешь, я вчера жене цветы подарил.\n- И что она сказала?\n- Сказала, что она не ожидала. А потом спросила, что я натворил!",
"Анекдот 142:\n\nВрач: Пациент, вам нужно похудеть.\nПациент: Доктор, я не могу.\nВрач: Почему?\nПациент: Я боюсь, что если я похудею, жена меня разлюбит. Она меня любит за мою доброту, а доброта у меня в животе!",
"Анекдот 143:\n\nУчитель: Вовочка, ты знаешь, кто такой «оптимист»?\nВовочка: Это тот, кто думает, что его двойка по математике — это просто недоразумение!",
"Анекдот 144:\n\nЖена: Дорогой, я сегодня видела сон, что ты мне изменил.\nМуж: Дорогая, это же просто сон.\nЖена: А почему ты тогда оправдываешься?",
"Анекдот 145:\n\nДва друга:\n- Я вчера так устал на работе, что уснул прямо за ужином.\n- А жена что?\n- Она тоже уснула, но за телевизором!",
"Анекдот 146:\n\nУчитель: Петров, как называется человек, который не хочет учиться?\nПетров: Лентяй!\nУчитель: А как называется человек, который хочет учиться, но не может?\nПетров: Это я!",
"Анекдот 147:\n\nМужчина в аптеке:\n- Мне нужны таблетки от жадности.\n- Вам одну пачку?\n- Дайте мне две, но чтобы бесплатно!",
"Анекдот 148:\n\nЖена: Ты знаешь, что я тебя люблю?\nМуж: Да, дорогая.\nЖена: А почему ты не говоришь мне, что любишь меня?\nМуж: Потому что я тебе это уже говорил, когда ты выходила за меня замуж!",
"Анекдот 149:\n\nУчитель: Вовочка, что такое «время»?\nВовочка: Это то, чего у меня нет, когда я играю в компьютер, и которое очень долго тянется, когда я делаю уроки!",
"Анекдот 150:\n\nДва мужика:\n- Ты знаешь, я вчера жене признался, что я не идеален.\n- И что она сказала?\n- Она сказала, что это она уже давно знает и что она с этим мирится!",
"Анекдот 151:\n\nВрач: Пациент, у вас проблема с сердцем.\nПациент: Доктор, а это серьезно?\nВрач: Это зависит от того, как вы относитесь к своей жене!",
"Анекдот 152:\n\nУчитель: Иванов, ты знаешь, что такое «ложь»?\nИванов: Это когда папа говорит, что он не голоден, а потом съедает весь ужин!",
"Анекдот 153:\n\nЖена: Дорогой, я хочу с тобой поговорить.\nМуж: О чем?\nЖена: О нас.\nМуж: А что с нами?\nЖена: Вот именно, что с нами? Ты меня не слушаешь!",
"Анекдот 154:\n\nДва друга:\n- Ты знаешь, я вчера так напился, что не помню, как пришел домой.\n- А как жена отреагировала?\n- Не знаю, но утром у меня болела не только голова, но и уши!",
"Анекдот 155:\n\nУчитель: Петров, ты почему не сделал домашнее задание?\nПетров: Я его сделал, но оно убежало.\nУчитель: Как это?\nПетров: Я его положил в тетрадь, а тетрадь убежала в портфель, а портфель убежал домой!",
"Анекдот 156:\n\nМуж: Дорогая, я сегодня задержусь на работе.\nЖена: Хорошо, а я приглашу подруг.\nМуж: Не надо, я уже иду домой!",
"Анекдот 157:\n\nВрач: Пациент, у вас амнезия. Вы помните, что я вам говорил вчера?\nПациент: Нет.\nВрач: А позавчера?\nПациент: Тоже нет.\nВрач: И вы еще жалуетесь на память?",
"Анекдот 158:\n\nУчитель: Вовочка, что такое «бизнес»?\nВовочка: Это когда ты продаешь вещи, которые купил в кредит, чтобы купить то, что продал!",
"Анекдот 159:\n\nЖена: Дорогой, ты меня слышишь?\nМуж: Да, дорогая.\nЖена: А почему ты тогда не слушаешь?\nМуж: Я слушаю, просто не запоминаю!",
"Анекдот 160:\n\nДва мужика:\n- Я вчера так устал на работе, что уснул прямо за ужином.\n- А жена что?\n- Она тоже уснула, но за телевизором!",
"Анекдот 161:\n\nУчитель: Петров, как называется человек, который не хочет учиться?\nПетров: Лентяй!\nУчитель: А как называется человек, который хочет учиться, но не может?\nПетров: Это я!",
"Анекдот 162:\n\nМужчина в аптеке:\n- Мне нужны таблетки от жадности.\n- Вам одну пачку?\n- Дайте мне две, но чтобы бесплатно!",
"Анекдот 163:\n\nЖена: Ты знаешь, что я тебя люблю?\nМуж: Да, дорогая.\nЖена: А почему ты не говоришь мне, что любишь меня?\nМуж: Потому что я тебе это уже говорил, когда ты выходила за меня замуж!",
"Анекдот 164:\n\nУчитель: Вовочка, что такое «время»?\nВовочка: Это то, чего у меня нет, когда я играю в компьютер, и которое очень долго тянется, когда я делаю уроки!",
"Анекдот 165:\n\nДва мужика:\n- Ты знаешь, я вчера жене признался, что я не идеален.\n- И что она сказала?\n- Она сказала, что это она уже давно знает и что она с этим мирится!",
"Анекдот 166:\n\nВрач: Пациент, у вас проблема с сердцем.\nПациент: Доктор, а это серьезно?\nВрач: Это зависит от того, как вы относитесь к своей жене!",
"Анекдот 167:\n\nУчитель: Иванов, ты знаешь, что такое «ложь»?\nИванов: Это когда папа говорит, что он не голоден, а потом съедает весь ужин!",

"Анекдот 201:\n\nУчитель: Вовочка, кем работает твой папа?\nВовочка: Он директор завода.\nУчитель: А мама?\nВовочка: А мама дома, она отдыхает.\nУчитель: А кто же тогда зарабатывает деньги?\nВовочка: Папа зарабатывает, а мама их тратит!",
"Анекдот 202:\n\nЖена: Дорогой, а ты меня ревнуешь?\nМуж: Нет.\nЖена: А почему?\nМуж: Потому что я знаю, что ты меня любишь, и я тебе доверяю. А еще потому, что у меня есть ружье!",
"Анекдот 203:\n\nВрач: Пациент, вам нужно бросить курить.\nПациент: Доктор, я не курю.\nВрач: А пить?\nПациент: Тоже не пью.\nВрач: А что вы тогда делаете?\nПациент: Я просто живу с женой!",
"Анекдот 204:\n\nДва друга:\n- Слушай, ты знаешь, как отличить настоящую любовь от привычки?\n- Нет, а как?\n- Настоящая любовь — это когда ты хочешь проводить с ней время, а привычка — это когда ты просто не хочешь скандала!",
"Анекдот 205:\n\nУчитель: Петров, почему ты такой грустный?\nПетров: Потому что я не сделал домашнее задание.\nУчитель: А почему не сделал?\nПетров: Потому что я грустный!",
"Анекдот 206:\n\nМужчина приходит к психологу:\n- Доктор, у меня проблема: я не могу найти общий язык с женой.\n- А вы пробовали с ней поговорить?\n- Пробовал, но она меня не слушает.\n- А вы пробовали ее слушать?\n- А зачем? Она же все равно говорит одно и то же!",
"Анекдот 207:\n\nЖена: Дорогой, а ты меня любишь?\nМуж: Да.\nЖена: А почему ты тогда не даришь мне цветы?\nМуж: Потому что цветы вянут, а моя любовь к тебе — вечна!",
"Анекдот 208:\n\nУчитель: Вовочка, ты знаешь, что такое «настоящий друг»?\nВовочка: Это тот, кто придет на помощь, даже если ты его об этом не просил.\nУчитель: А что такое «настоящий враг»?\nВовочка: Это тот, кто придет на помощь, чтобы потом напомнить тебе об этом!",
"Анекдот 209:\n\nМужик в магазине:\n- Девушка, у вас есть что-нибудь от жены?\n- В смысле?\n- Ну, чтобы она перестала пилить!\n- У нас есть наушники и беруши!",
"Анекдот 210:\n\nЖена: Дорогой, как ты думаешь, я толстая?\nМуж: Нет, дорогая, ты не толстая.\nЖена: А почему ты тогда так долго думал?\nМуж: Потому что я не хотел тебя обидеть!",
"Анекдот 211:\n\nУчитель: Иванов, что такое «время»?\nИванов: Это то, что летит, когда ты отдыхаешь, и тянется, когда ты на работе.\nУчитель: А что такое «жизнь»?\nИванов: Это то, что проходит мимо, пока ты работаешь!",
"Анекдот 212:\n\nМуж: Дорогая, я сегодня задержусь на работе.\nЖена: Хорошо, а я приглашу подруг.\nМуж: Не надо, я уже иду домой!\nЖена: Почему?\nМуж: Потому что я боюсь, что вы без меня все съедите!",
"Анекдот 213:\n\nВрач: Пациент, у вас отличное здоровье!\nПациент: Спасибо, доктор, это потому что я не женат.\nВрач: А кто вас тогда так довел до жизни такой?\nПациент: Моя мама!",
"Анекдот 214:\n\nУчитель: Вовочка, ты знаешь, что такое «счастье»?\nВовочка: Это когда ты приходишь домой, а там никого нет!\nУчитель: А если там кто-то есть?\nВовочка: Тогда это не счастье, а сюрприз!",
"Анекдот 215:\n\nДва мужика:\n- Ты знаешь, я вчера так устал, что уснул прямо на диване.\n- А жена что?\n- Она тоже уснула, но перед телевизором!\n- А кто же тогда посуду мыл?\n- Никто, мы ее вчера не пачкали!",
"Анекдот 216:\n\nЖена: Дорогой, ты меня слушаешь?\nМуж: Да, дорогая.\nЖена: А что я сказала?\nМуж: Ты сказала, что я тебя не слушаю.\nЖена: Вот видишь, ты меня не слушаешь!",
"Анекдот 217:\n\nУчитель: Петров, почему ты опоздал?\nПетров: Я проспал.\nУчитель: А почему ты проспал?\nПетров: Потому что я поздно лег.\nУчитель: А почему поздно лег?\nПетров: Потому что я долго не мог уснуть!\nУчитель: А почему не мог уснуть?\nПетров: Потому что я думал, что опоздаю в школу!",
"Анекдот 218:\n\nМужчина в аптеке:\n- Дайте мне что-нибудь от бессонницы.\n- Вот, возьмите.\n- А от жены есть что-нибудь?\n- Увы, это не лечится, только развод!\n- А от развода есть?\n- Есть, но это уже в другом отделе!",
"Анекдот 219:\n\nЖена: Дорогой, а ты меня ревнуешь?\nМуж: Нет.\nЖена: А почему?\nМуж: Потому что я знаю, что ты меня любишь, и я тебе доверяю. А еще потому, что у меня есть ружье!\nЖена: А если я тебя разлюблю?\nМуж: Тогда я буду ревновать!",
"Анекдот 220:\n\nУчитель: Вовочка, кем работает твой папа?\nВовочка: Он директор завода.\nУчитель: А мама?\nВовочка: А мама дома, она отдыхает.\nУчитель: А кто же тогда зарабатывает деньги?\nВовочка: Папа зарабатывает, а мама их тратит!\nУчитель: А кто же тогда отдыхает?\nВовочка: Папа, когда мама уезжает к бабушке!",
"Анекдот 221:\n\nДва друга:\n- Слушай, ты знаешь, как отличить настоящую любовь от привычки?\n- Нет, а как?\n- Настоящая любовь — это когда ты хочешь проводить с ней время, а привычка — это когда ты просто не хочешь скандала!\n- А что такое брак?\n- Это когда любовь переходит в привычку, а привычка — в скандал!",
"Анекдот 222:\n\nВрач: Пациент, вам нужно бросить курить.\nПациент: Доктор, я не курю.\nВрач: А пить?\nПациент: Тоже не пью.\nВрач: А что вы тогда делаете?\nПациент: Я просто живу с женой!\nВрач: Тогда вам нужно бросить жить с женой!",

"Анекдот 225:\n\nМуж: Дорогая, я сегодня задержусь на работе.\nЖена: Хорошо, а я приглашу подруг.\nМуж: Не надо, я уже иду домой!\nЖена: Почему?\nМуж: Потому что я боюсь, что вы без меня все съедите!\nЖена: А мы уже все съели!",

"Анекдот 233:\n\nВрач: Пациент, вам нужно бросить курить.\nПациент: Доктор, я не курю.\nВрач: А пить?\nПациент: Тоже не пью.\nВрач: А что вы тогда делаете?\nПациент: Я просто живу с женой!\nВрач: Тогда вам нужно бросить жить с женой!",
"Анекдот 234:\n\nЖена: Дорогой, а ты меня любишь?\nМуж: Да.\nЖена: А почему ты тогда не даришь мне цветы?\nМуж: Потому что цветы вянут, а моя любовь к тебе — вечна!\nЖена: А почему ты тогда не даришь мне шубу?\nМуж: Потому что шуба не вянет, а любовь может!",
"Анекдот 235:\n\nУчитель: Иванов, что такое «время»?\nИванов: Это то, что летит, когда ты отдыхаешь, и тянется, когда ты на работе.\nУчитель: А что такое «жизнь»?\nИванов: Это то, что проходит мимо, пока ты работаешь!\nУчитель: А что такое «счастье»?\nИванов: Это когда ты не работаешь!",
"Анекдот 236:\n\nМуж: Дорогая, я сегодня задержусь на работе.\nЖена: Хорошо, а я приглашу подруг.\nМуж: Не надо, я уже иду домой!\nЖена: Почему?\nМуж: Потому что я боюсь, что вы без меня все съедите!\nЖена: А мы уже все съели!",
"Анекдот 237:\n\nДва мужика:\n- Ты знаешь, я вчера так устал, что уснул прямо на диване.\n- А жена что?\n- Она тоже уснула, но перед телевизором!\n- А кто же тогда посуду мыл?\n- Никто, мы ее вчера не пачкали!\n- А кто же тогда готовил?\n- Никто, мы вчера ели в ресторане!",
"Анекдот 238:\n\nЖена: Дорогой, ты меня слушаешь?\nМуж: Да, дорогая.\nЖена: А что я сказала?\nМуж: Ты сказала, что я тебя не слушаю.\nЖена: Вот видишь, ты меня не слушаешь!\nМуж: Я слушаю, просто не запоминаю!",
"Анекдот 239:\n\nУчитель: Петров, почему ты опоздал?\nПетров: Я проспал.\nУчитель: А почему ты проспал?\nПетров: Потому что я поздно лег.\nУчитель: А почему поздно лег?\nПетров: Потому что я долго не мог уснуть!\nУчитель: А почему не мог уснуть?\nПетров: Потому что я думал, что опоздаю в школу!",

"Анекдот 284:\n\nМужчина в аптеке:\n- Дайте мне что-нибудь от бессонницы.\n- Вот, возьмите.\n- А от жены есть что-нибудь?\n- Увы, это не лечится, только развод!\n- А от развода есть?\n- Есть, но это уже в другом отделе!\n- А от другого отдела есть?",
"Анекдот 285:\n\nЖена: Дорогой, а ты меня ревнуешь?\nМуж: Нет.\nЖена: А почему?\nМуж: Потому что я знаю, что ты меня любишь, и я тебе доверяю. А еще потому, что у меня есть ружье!\nЖена: А если я тебя разлюблю?\nМуж: Тогда я буду ревновать!\nЖена: А если я тебя полюблю?\nМуж: Тогда я буду счастлив!",
"Анекдот 286:\n\nУчитель: Вовочка, кем работает твой папа?\nВовочка: Он директор завода.\nУчитель: А мама?\nВовочка: А мама дома, она отдыхает.\nУчитель: А кто же тогда зарабатывает деньги?\nВовочка: Папа зарабатывает, а мама их тратит!\nУчитель: А кто же тогда отдыхает?\nВовочка: Папа, когда мама уезжает к бабушке!",
"Анекдот 287:\n\nДва друга:\n- Слушай, ты знаешь, как отличить настоящую любовь от привычки?\n- Нет, а как?\n- Настоящая любовь — это когда ты хочешь проводить с ней время, а привычка — это когда ты просто не хочешь скандала!\n- А что такое брак?\n- Это когда любовь переходит в привычку, а привычка — в скандал!",
"Анекдот 288:\n\nВрач: Пациент, вам нужно бросить курить.\nПациент: Доктор, я не курю.\nВрач: А пить?\nПациент: Тоже не пью.\nВрач: А что вы тогда делаете?\nПациент: Я просто живу с женой!\nВрач: Тогда вам нужно бросить жить с женой!",
"Анекдот 289:\n\nЖена: Дорогой, а ты меня любишь?\nМуж: Да.\nЖена: А почему ты тогда не даришь мне цветы?\nМуж: Потому что цветы вянут, а моя любовь к тебе — вечна!\nЖена: А почему ты тогда не даришь мне шубу?\nМуж: Потому что шуба не вянет, а любовь может!",
"Анекдот 290:\n\nУчитель: Иванов, что такое «время»?\nИванов: Это то, что летит, когда ты отдыхаешь, и тянется, когда ты на работе.\nУчитель: А что такое «жизнь»?\nИванов: Это то, что проходит мимо, пока ты работаешь!\nУчитель: А что такое «счастье»?\nИванов: Это когда ты не работаешь!",
"Анекдот 291:\n\nМуж: Дорогая, я сегодня задержусь на работе.\nЖена: Хорошо, а я приглашу подруг.\nМуж: Не надо, я уже иду домой!\nЖена: Почему?\nМуж: Потому что я боюсь, что вы без меня все съедите!\nЖена: А мы уже все съели!",
"Анекдот 292:\n\nДва мужика:\n- Ты знаешь, я вчера так устал, что уснул прямо на диване.\n- А жена что?\n- Она тоже уснула, но перед телевизором!\n- А кто же тогда посуду мыл?\n- Никто, мы ее вчера не пачкали!\n- А кто же тогда готовил?\n- Никто, мы вчера ели в ресторане!",
"Анекдот 293:\n\nЖена: Дорогой, ты меня слушаешь?\nМуж: Да, дорогая.\nЖена: А что я сказала?\nМуж: Ты сказала, что я тебя не слушаю.\nЖена: Вот видишь, ты меня не слушаешь!\nМуж: Я слушаю, просто не запоминаю!",
"Анекдот 294:\n\nУчитель: Петров, почему ты опоздал?\nПетров: Я проспал.\nУчитель: А почему ты проспал?\nПетров: Потому что я поздно лег.\nУчитель: А почему поздно лег?\nПетров: Потому что я долго не мог уснуть!\nУчитель: А почему не мог уснуть?\nПетров: Потому что я думал, что опоздаю в школу!",
"Анекдот 295:\n\nМужчина в аптеке:\n- Дайте мне что-нибудь от бессонницы.\n- Вот, возьмите.\n- А от жены есть что-нибудь?\n- Увы, это не лечится, только развод!\n- А от развода есть?\n- Есть, но это уже в другом отделе!\n- А от другого отдела есть?",
"Анекдот 296:\n\nЖена: Дорогой, а ты меня ревнуешь?\nМуж: Нет.\nЖена: А почему?\nМуж: Потому что я знаю, что ты меня любишь, и я тебе доверяю. А еще потому, что у меня есть ружье!\nЖена: А если я тебя разлюблю?\nМуж: Тогда я буду ревновать!\nЖена: А если я тебя полюблю?\nМуж: Тогда я буду счастлив!",
"Анекдот 297:\n\nУчитель: Вовочка, кем работает твой папа?\nВовочка: Он директор завода.\nУчитель: А мама?\nВовочка: А мама дома, она отдыхает.\nУчитель: А кто же тогда зарабатывает деньги?\nВовочка: Папа зарабатывает, а мама их тратит!\nУчитель: А кто же тогда отдыхает?\nВовочка: Папа, когда мама уезжает к бабушке!",
"Анекдот 298:\n\nДва друга:\n- Слушай, ты знаешь, как отличить настоящую любовь от привычки?\n- Нет, а как?\n- Настоящая любовь — это когда ты хочешь проводить с ней время, а привычка — это когда ты просто не хочешь скандала!\n- А что такое брак?\n- Это когда любовь переходит в привычку, а привычка — в скандал!",
"Анекдот 299:\n\nВрач: Пациент, вам нужно бросить курить.\nПациент: Доктор, я не курю.\nВрач: А пить?\nПациент: Тоже не пью.\nВрач: А что вы тогда делаете?\nПациент: Я просто живу с женой!\nВрач: Тогда вам нужно бросить жить с женой!",
"Анекдот 300:\n\nЖена: Дорогой, а ты меня любишь?\nМуж: Да.\nЖена: А почему ты тогда не даришь мне цветы?\nМуж: Потому что цветы вянут, а моя любовь к тебе — вечна!\nЖена: А почему ты тогда не даришь мне шубу?\nМуж: Потому что шуба не вянет, а любовь может! Поздравляю, 300 анекдотов готово! 🎉",
"Анекдот 301:\n\nУчитель: Вовочка, почему ты опоздал?\nВовочка: Марья Ивановна, я проснулся, посмотрел на часы, а там уже 8:30!\nУчитель: А если бы ты посмотрел на календарь, то понял бы, что сегодня суббота!",
"Анекдот 302:\n\nВрач: Пациент, у вас отличное здоровье! Сколько вам лет?\nПациент: 40.\nВрач: И вы выглядите на 30!\nПациент: Спасибо, это потому что я не женат.\nВрач: А кто вас тогда так довел до жизни такой?",
"Анекдот 303:\n\nЖена: Дорогой, у нас кончился сахар.\nМуж: Я в магазине.\nЖена: И еще кончилось молоко, хлеб, масло...\nМуж: Я понял, я уже еду в супермаркет.\nЖена: И еще мне нужна новая шуба!\nМуж: Я уже в ювелирном... то есть в аэропорту!",
"Анекдот 304:\n\nРазговор двух друзей:\n- Как дела?\n- Да вот, женился.\n- Поздравляю! А как жена?\n- Не знаю, она пока молчит, но уже подозрительно смотрит.",
"Анекдот 305:\n\nУчитель: Петров, ты почему домашнее задание не сделал?\nПетров: А мы с папой рыбу ловили.\nУчитель: И много поймали?\nПетров: Нет, но папа сказал, что если я не сдам домашку, он меня на рыбалку больше не возьмет. А я не хочу!",
"Анекдот 306:\n\nМужчина в аптеке:\n- Дайте мне что-нибудь от головной боли.\n- Вот, возьмите.\n- А от жены есть что-нибудь?\n- Увы, это не лечится, только развод!",
"Анекдот 307:\n\nЖена: Ты меня любишь?\nМуж: Да.\nЖена: А почему ты тогда не говоришь мне комплименты?\nМуж: Я же сказал «Да».\nЖена: Это не комплимент!\nМуж: Хорошо, «Да, моя королева».",
"Анекдот 308:\n\nУчитель: Сидоров, ты знаешь, что такое «вечность»?\nСидоров: Это время, которое пройдет, пока мама поговорит по телефону с тетей Зиной!",
"Анекдот 309:\n\nДва программиста:\n- У меня дома ремонт. Жена заставила обои клеить.\n- И как?\n- Пока не знаю, вчера два раза переделывал. В третий раз нанимаю специалистов.",
"Анекдот 310:\n\nМуж: Дорогая, я сегодня задержусь на работе, у нас аврал.\nЖена: Хорошо, а я тогда приглашу подруг.\nМуж: Не надо! Я уже иду домой!",
"Анекдот 311:\n\nВрач: У вас амнезия. Вы помните, что я вам говорил вчера?\nПациент: Нет.\nВрач: А позавчера?\nПациент: Тоже нет.\nВрач: И вы еще жалуетесь на память?",
"Анекдот 312:\n\nУчитель: Иванов, что такое «бизнес»?\nИванов: Это когда ты продаешь вещи, которые купил в кредит, чтобы купить то, что продал.",
"Анекдот 313:\n\nТеща зятю:\n- Почему ты вчера так поздно пришел?\nЗять: Я был с друзьями.\n- А почему от тебя не пахнет спиртным?\n- Я не пил.\n- А почему от тебя пахнет женой?\n- Ой, простите, я перепутал этажи!",
"Анекдот 314:\n\nУчитель: Вовочка, ты знаешь, сколько будет дважды два?\nВовочка: Четыре.\nУчитель: Правильно! А сколько будет пятью пять?\nВовочка: Двадцать пять.\nУчитель: А что такое «бесконечность»?\nВовочка: Это то, что я получаю по математике за домашку!",
"Анекдот 315:\n\nЖена: Дорогой, если ты меня не любишь, скажи прямо.\nМуж: Я тебя люблю.\nЖена: Почему ты это сказал без эмоций?\nМуж: Потому что у меня нет пульта управления, чтобы включить эмоции!",
"Анекдот 316:\n\nМужик приходит к врачу:\n- Доктор, у меня проблема: каждый раз, когда я закрываю глаза, я вижу жену.\n- И что тут плохого?\n- Она меня ругает даже в моих мечтах!",
"Анекдот 317:\n\nДва друга:\n- Слушай, ты когда женился, ты счастлив?\n- Конечно!\n- А как же твоя свобода?\n- А я ее и не терял! Я просто теперь спрашиваю разрешение на все!",
"Анекдот 318:\n\nУчитель: Петров, ты почему молчишь?\nПетров: Я думаю.\nУчитель: О чем?\nПетров: О смысле жизни.\nУчитель: И какой же смысл?\nПетров: Получить двойку и пойти домой спать!",
"Анекдот 319:\n\nМуж жене:\n- Я понял, что я не идеален.\n- И что теперь?\n- Теперь я понимаю, что ты тоже не идеальна. Пойдем, выпьем чаю за наше несовершенство!",
"Анекдот 320:\n\nВ аптеке:\n- Мне нужны таблетки от жадности.\n- Вам одну пачку?\n- Дайте мне две, но скидку пополам!",
"Анекдот 321:\n\nУчитель: Как ты понимаешь слово «компромисс»?\nУченик: Это когда жена говорит: «Купи мне шубу», а ты покупаешь ей машину, но подешевле, чтобы она не заметила!",
"Анекдот 322:\n\nДве подруги:\n- Мой муж мне совсем не помогает по дому.\n- А ты ему что говорила?\n- Я ему говорила, что он ленивый.\n- А надо было сказать, что у него руки не из того места растут! Тогда он сразу все сделает, чтобы доказать обратное!",
"Анекдот 323:\n\nМужик в ресторане:\n- Официант, у меня в супе плавает муха!\n- Извините, сэр, мы сейчас ее выловим и заменим на свежую!",
"Анекдот 324:\n\nУчитель: Вовочка, почему ты не сдал экзамен?\nВовочка: Марья Ивановна, я не мог прийти.\nУчитель: А что случилось?\nВовочка: Я смотрел телевизор, и у меня отобрали пульт!",
"Анекдот 325:\n\nЖена: Ты помнишь, что сегодня годовщина нашей свадьбы?\nМуж: Конечно, дорогая! Я даже подарок купил!\nЖена: А почему он у тебя в гараже?\nМуж: Потому что у нас в доме места нет!",
"Анекдот 326:\n\nМужчина в магазине:\n- У вас есть что-нибудь от депрессии?\n- Есть шоколад.\n- А что-нибудь действенное?\n- Есть еще дополнительная скидка!",
"Анекдот 327:\n\nУчитель: Что такое «ложь»?\nУченик: Это когда папа говорит, что он не голоден, а потом съедает весь ужин!",
"Анекдот 328:\n\nДва мужика:\n- Ты знаешь, я вчера так напился, что не помню, как пришел домой.\n- А как жена отреагировала?\n- Не знаю, я не помню, как она меня ругала, но утром у меня болела не только голова, но и уши!",
"Анекдот 329:\n\nЖена: Дорогой, ты меня слышишь?\nМуж: Да, дорогая.\nЖена: А почему ты тогда не слушаешь?\nМуж: Я слушаю, просто не запоминаю!",
"Анекдот 330:\n\nВрач: Пациент, у вас серьезное заболевание.\nПациент: Доктор, а можно я выйду покурить, чтобы успокоиться?\nВрач: Нет, курить нельзя!\nПациент: А тогда можно я выйду выпить?\nВрач: Тоже нельзя!\nПациент: А как же я успокоюсь?",
"Анекдот 331:\n\nУчитель: Вовочка, ты знаешь, что такое «эволюция»?\nВовочка: Это когда обезьяна превратилась в человека.\nУчитель: А ты знаешь, что такое «деградация»?\nВовочка: Это когда человек превращается в ученика!",
"Анекдот 332:\n\nМуж: Дорогая, я забыл, что мы ссорились. Ты не подскажешь, из-за чего?\nЖена: Из-за того, что ты забыл, что мы ссорились!",
"Анекдот 333:\n\nДва друга:\n- У меня жена готовит ужин.\n- А что она готовит?\n- Я не знаю, но она сказала, что это будет сюрприз.\n- Боишься?\n- Очень!",
"Анекдот 334:\n\nУчитель: Петров, как называется человек, который живет в лесу?\nПетров: Дикарь!\nУчитель: А если он сидит на дереве?\nПетров: Это уже телевизор смотрит!",
"Анекдот 335:\n\nЖена: Дорогой, я нашла у тебя в кармане чек из ресторана. Ты с кем там был?\nМуж: Я был с другом.\nЖена: А почему там написано «два кофе и один десерт»?\nМуж: Потому что друг не любит сладкое!",
"Анекдот 336:\n\nВрач: Пациент, у вас склероз.\nПациент: А что это?\nВрач: Это когда вы все забываете.\nПациент: А, ну это не так страшно, я думал, что у меня что-то серьезное!",
"Анекдот 337:\n\nУчитель: Вовочка, ты почему опоздал?\nВовочка: Я проснулся, посмотрел на часы, а там 8:30.\nУчитель: А почему ты не посмотрел на будильник?\nВовочка: А я его разбил, когда он меня будил!",
"Анекдот 338:\n\nЖена: Дорогой, ты меня любишь?\nМуж: Да.\nЖена: А почему ты не скажешь это с эмоциями?\nМуж: Потому что я экономлю слова, чтобы купить тебе подарок!",
"Анекдот 339:\n\nМужик приходит в магазин:\n- У вас есть шоколад «Аленка»?\n- Есть.\n- А почему он такой дорогой?\n- Потому что он с орехами.\n- А орехи где?\n- В цене!",
"Анекдот 340:\n\nУчитель: Иванов, что такое «дружба»?\nИванов: Это когда один друг звонит другому в 3 часа ночи, и тот не бросает трубку!\nУчитель: А что такое «настоящая дружба»?\nИванов: Это когда он еще и приезжает на помощь!",
"Анекдот 341:\n\nДва мужика:\n- Ты знаешь, я вчера жене цветы подарил.\n- И что она сказала?\n- Сказала, что она не ожидала. А потом спросила, что я натворил!",
"Анекдот 342:\n\nВрач: Пациент, вам нужно похудеть.\nПациент: Доктор, я не могу.\nВрач: Почему?\nПациент: Я боюсь, что если я похудею, жена меня разлюбит. Она меня любит за мою доброту, а доброта у меня в животе!",
"Анекдот 343:\n\nУчитель: Вовочка, ты знаешь, кто такой «оптимист»?\nВовочка: Это тот, кто думает, что его двойка по математике — это просто недоразумение!",
"Анекдот 344:\n\nЖена: Дорогой, я сегодня видела сон, что ты мне изменил.\nМуж: Дорогая, это же просто сон.\nЖена: А почему ты тогда оправдываешься?",
"Анекдот 345:\n\nДва друга:\n- Я вчера так устал на работе, что уснул прямо за ужином.\n- А жена что?\n- Она тоже уснула, но за телевизором!",
"Анекдот 346:\n\nУчитель: Петров, как называется человек, который не хочет учиться?\nПетров: Лентяй!\nУчитель: А как называется человек, который хочет учиться, но не может?\nПетров: Это я!",
"Анекдот 347:\n\nМужчина в аптеке:\n- Мне нужны таблетки от жадности.\n- Вам одну пачку?\n- Дайте мне две, но чтобы бесплатно!",
"Анекдот 348:\n\nЖена: Ты знаешь, что я тебя люблю?\nМуж: Да, дорогая.\nЖена: А почему ты не говоришь мне, что любишь меня?\nМуж: Потому что я тебе это уже говорил, когда ты выходила за меня замуж!",
"Анекдот 349:\n\nУчитель: Вовочка, что такое «время»?\nВовочка: Это то, чего у меня нет, когда я играю в компьютер, и которое очень долго тянется, когда я делаю уроки!",

"Анекдот 401:\n\nУчитель: Вовочка, что такое «деньги»?\nВовочка: Это то, что папа прячет от мамы, а мама находит!\nУчитель: А что такое «бюджет»?\nВовочка: Это когда папа думает, что у него есть деньги, а мама знает, что их нет!",
"Анекдот 402:\n\nЖена: Дорогой, а почему ты никогда не даришь мне цветы?\nМуж: Потому что я не хочу, чтобы ты думала, что я тебя люблю только по праздникам.\nЖена: Тогда подари мне шубу.\nМуж: Чтобы ты думала, что я тебя люблю только зимой?",
"Анекдот 403:\n\nВрач: Пациент, у вас отличное здоровье. Сколько вам лет?\nПациент: 50.\nВрач: И вы чувствуете себя на 30?\nПациент: Да, но жена говорит, что я выгляжу на 60, а веду себя на 10!",
"Анекдот 404:\n\nУчитель: Петров, ты почему опоздал?\nПетров: Я вышел из дома вовремя, но потом вспомнил, что забыл портфель.\nУчитель: И что?\nПетров: Я вернулся, а когда пришел в школу, понял, что забыл дома голову!",
"Анекдот 405:\n\nДва друга:\n- Ты знаешь, я вчера купил жене подарок.\n- Что купил?\n- Пылесос.\n- И что она сказала?\n- Она сказала, что теперь у меня есть выбор: либо я, либо пылесос!",
"Анекдот 406:\n\nЖена: Дорогой, я хочу поговорить.\nМуж: О чем?\nЖена: О нас.\nМуж: А что с нами?\nЖена: Вот именно, ты меня не слушаешь!\nМуж: Я слушаю, просто у меня в голове сейчас футбол!",
"Анекдот 407:\n\nВ аптеке:\n- У вас есть что-нибудь от жадности?\n- Есть, но оно дорогое.\n- А есть что-нибудь подешевле?\n- Тогда это уже не от жадности, а от бедности!",
"Анекдот 408:\n\nУчитель: Вовочка, кем ты хочешь стать?\nВовочка: Программистом.\nУчитель: А что ты будешь делать?\nВовочка: Буду писать код, чтобы у всех были деньги и счастье!\nУчитель: А почему не начнешь с себя?\nВовочка: Потому что код еще не дописан!",
"Анекдот 409:\n\nМуж: Дорогая, ты меня любишь?\nЖена: Да, но не больше, чем шоколад.\nМуж: А я тебя больше, чем футбол!\nЖена: Тогда почему ты не смотришь на меня, как на футбол?\nМуж: Потому что ты не транслируешься в записи!",
"Анекдот 410:\n\nДва мужика:\n- Ты знаешь, я вчера жене сказал, что она самая красивая.\n- И что она ответила?\n- Она спросила, что я натворил, и проверила мой кошелек!",
"Анекдот 411:\n\nУчитель: Вовочка, что такое «справедливость»?\nВовочка: Это когда я получаю двойку, а папа получает ремень!\nУчитель: А что такое «несправедливость»?\nВовочка: Это когда папа получает ремень, а я получаю двойку!",
"Анекдот 412:\n\nЖена: Дорогой, ты помнишь, что завтра годовщина свадьбы?\nМуж: Конечно, я уже купил билеты на футбол!\nЖена: А я купила билеты в кино.\nМуж: Отлично, значит, я пойду на футбол, а ты в кино!\nЖена: Нет, мы пойдем вместе в кино, а билеты на футбол я сдала!",
"Анекдот 413:\n\nВрач: Пациент, вам нужно меньше нервничать.\nПациент: Доктор, как я могу не нервничать, если у меня жена и трое детей?\nВрач: Тогда вам нужно больше отдыхать.\nПациент: А как я могу отдыхать, если у меня жена и трое детей?",
"Анекдот 414:\n\nУчитель: Петров, что такое «прогресс»?\nПетров: Это когда раньше я получал двойки, а теперь получаю тройки!\nУчитель: А что такое «регресс»?\nПетров: Это когда я получаю двойки, а папа получает инфаркт!",
"Анекдот 415:\n\nДва друга:\n- Ты знаешь, я вчера с женой в ресторан ходил.\n- И как?\n- Отлично, она даже не заметила, что я забыл бумажник!",
"Анекдот 416:\n\nЖена: Дорогой, а ты меня ревнуешь?\nМуж: Нет, я тебе доверяю.\nЖена: А почему ты тогда проверяешь мой телефон?\nМуж: Я не проверяю, я ищу там свои фотографии!\nЖена: А почему они там?\nМуж: Потому что ты их удалила, а я восстановил!",
"Анекдот 417:\n\nВ аптеке:\n- Мне нужны таблетки от бессонницы.\n- Вам одну упаковку?\n- Нет, две. Одну для себя, а другую для жены, чтобы она не мешала спать!\n- А для жены от чего?\n- От храпа!",
"Анекдот 418:\n\nУчитель: Вовочка, ты знаешь, что такое «экономика»?\nВовочка: Это когда мама говорит, что денег нет, а папа покупает новый телевизор!\nУчитель: А что такое «инфляция»?\nВовочка: Это когда папа покупает телевизор, а мама говорит, что он стоил дешевле!",
"Анекдот 419:\n\nМуж: Дорогая, я сегодня заработал много денег!\nЖена: Отлично, дай мне их.\nМуж: А можно я оставлю немного на карманные расходы?\nЖена: Конечно, вот тебе 100 рублей.\nМуж: А где остальные?\nЖена: Остальные я потратила на твою же пользу — купила тебе новую рубашку!",
"Анекдот 420:\n\nДва мужика:\n- Ты знаешь, я вчера с женой поругался.\n- Из-за чего?\n- Она сказала, что я не уделяю ей внимания.\n- И что ты сделал?\n- Я уделил ей внимание и вынес мусор!",
"Анекдот 421:\n\nУчитель: Петров, ты знаешь, что такое «любовь»?\nПетров: Это когда ты готов отдать все, чтобы быть с ней.\nУчитель: А что такое «брак»?\nПетров: Это когда ты отдал все, но она все равно недовольна!",
"Анекдот 422:\n\nЖена: Дорогой, а ты помнишь, как мы познакомились?\nМуж: Конечно, ты уронила сумку, а я помог ее поднять.\nЖена: А что ты подумал в тот момент?\nМуж: Я подумал, что у тебя тяжелая сумка, и если я ее подниму, ты меня накормишь!\nЖена: А я подумала, что ты сильный и сможешь носить мои сумки всю жизнь!",
"Анекдот 423:\n\nВрач: Пациент, вам нужно заниматься спортом.\nПациент: Доктор, я каждый день бегаю за автобусом!\nВрач: Это хорошо. А что вы делаете, когда догоняете его?\nПациент: Я сажусь в него и еду на работу!\nВрач: А если не догоняете?\nПациент: Тогда я иду пешком, это тоже спорт!",
"Анекдот 424:\n\nУчитель: Вовочка, что такое «дружба»?\nВовочка: Это когда ты даешь другу списать домашку, а он потом говорит, что это он сам сделал!\nУчитель: А что такое «настоящая дружба»?\nВовочка: Это когда он еще и говорит, что ты ему помог!",

"Анекдот 496:\n\nДва мужика:\n- Ты знаешь, я вчера жене сказал, что она выглядит отлично.\n- И что она ответила?\n- Она спросила, что я сделал, и проверила мой телефон!\n- А ты что?\n- Я сказал, что я просто говорю правду, а она сказала, что я вру!\n- А ты?\n- А я сказал, что я всегда говорю правду, и она сказала, что я точно что-то натворил!\n- А ты?\n- А я сказал, что я ничего не делал, и она сказала, что я вру!",
"Анекдот 497:\n\nУчитель: Петров, что такое «любовь»?\nПетров: Это когда ты готов отдать все, чтобы быть с ней.\nУчитель: А что такое «брак»?\nПетров: Это когда ты отдал все, но она все равно недовольна!\nУчитель: А что такое «развод»?\nПетров: Это когда ты забираешь все обратно, но она все равно недовольна!\nУчитель: А что такое «счастье»?\nПетров: Это когда ты отдал все, она довольна, и ты тоже!\nУчитель: А что такое «мир»?\nПетров: Это когда ты ничего не отдал, она недовольна, но ты доволен!\nУчитель: А что такое «война»?\nПетров: Это когда ты ничего не отдал, она недовольна, и ты тоже недоволен!",
"Анекдот 498:\n\nМуж: Дорогая, я сегодня заработал много денег!\nЖена: Отлично, дай мне их.\nМуж: А можно я оставлю немного на карманные расходы?\nЖена: Конечно, вот тебе 100 рублей.\nМуж: А где остальные?\nЖена: Остальные я потратила на твою же пользу — купила тебе новую рубашку!\nМуж: А почему рубашка женская?\nЖена: Потому что я ее буду носить!\nМуж: А почему я тогда должен радоваться?\nЖена: Потому что ты меня любишь!\nМуж: А почему я тогда должен молчать?\nЖена: Потому что я так сказала!\nМуж: А почему я тогда должен слушаться?\nЖена: Потому что я твоя жена!",
"Анекдот 499:\n\nДва друга:\n- Ты знаешь, я вчера с женой поругался.\n- Из-за чего?\n- Она сказала, что я не уделяю ей внимания.\n- И что ты сделал?\n- Я уделил ей внимание и вынес мусор!\n- А она что?\n- Она сказала, что это не то внимание, которое она имела в виду!\n- А ты что?\n- Я сказал, что другое внимание стоит дорого!\n- А она?\n- А она сказала, что я жадный!\n- А ты?\n- А я сказал, что я не жадный, а экономный!",
"Анекдот 500:\n\nУчитель: Вовочка, что такое «дружба»?\nВовочка: Это когда ты даешь другу списать домашку, а он потом говорит, что это он сам сделал!\nУчитель: А что такое «настоящая дружба»?\nВовочка: Это когда он еще и говорит, что ты ему помог!\nУчитель: А что такое «любовь»?\nВовочка: Это когда ты даешь списать не только домашку, но и контрольную!\nУчитель: А что такое «брак»?\nВовочка: Это когда ты даешь списать все, а тебе за это еще и попадает!\nУчитель: А что такое «жизнь»?\nВовочка: Это когда ты уже никому ничего не даешь, потому что тебе никто не дает! Поздравляю, 500 анекдотов готово! 🎉",
"Анекдот 501:\n\nУчитель: Вовочка, кого ты больше любишь — маму или папу?\nВовочка: Конечно, маму!\nУчитель: А почему?\nВовочка: Потому что она готовит, стирает, убирает, а папа только смотрит телевизор.\nУчитель: А если папа начнет помогать?\nВовочка: Тогда я буду любить того, кто купит мне новый компьютер!",
"Анекдот 502:\n\nЖена: Дорогой, а что бы ты сделал, если бы я превратилась в кошку?\nМуж: Я бы тебя гладил, кормил и играл с тобой.\nЖена: А если бы я превратилась в собаку?\nМуж: То же самое.\nЖена: А если бы я превратилась в змею?\nМуж: Я бы тебя посадил в террариум.\nЖена: А если бы я превратилась в птицу?\nМуж: Я бы тебя выпустил на волю, чтобы ты улетела к маме!",
"Анекдот 503:\n\nВрач: Пациент, у вас отличное здоровье. Сколько вам лет?\nПациент: 60.\nВрач: И вы чувствуете себя на 40?\nПациент: Да, но жена говорит, что я выгляжу на 70, а веду себя на 15!\nВрач: А что вы делаете, чтобы чувствовать себя на 40?\nПациент: Я не смотрю новости и не слушаю жену!",
"Анекдот 504:\n\nДва мужика:\n- Ты знаешь, я вчера жене сказал, что она похудела.\n- И что она ответила?\n- Она спросила, где я был и с кем!\n- А ты что?\n- Я сказал, что был на работе, а она сказала, что на работе так не говорят!",
"Анекдот 505:\n\nУчитель: Петров, что такое «экономия»?\nПетров: Это когда папа покупает самую дешевую колбасу, а мама покупает самую дорогую шубу!\nУчитель: А что такое «бюджет»?\nПетров: Это когда папа думает, что он экономит, а мама знает, что она тратит!",
"Анекдот 506:\n\nЖена: Дорогой, а ты меня ревнуешь?\nМуж: Нет, я тебе доверяю.\nЖена: А почему ты тогда проверяешь мой телефон?\nМуж: Я не проверяю, я ищу там свои фотографии!\nЖена: А почему они там?\nМуж: Потому что ты их удалила, а я восстановил!\nЖена: А почему ты их восстановил?\nМуж: Потому что они мне нравятся!\nЖена: А почему они тебе нравятся?\nМуж: Потому что там я с друзьями на рыбалке!\nЖена: А почему ты не сказал, что едешь на рыбалку?\nМуж: Потому что ты бы не пустила!",
"Анекдот 507:\n\nВ аптеке:\n- У вас есть что-нибудь от головной боли?\n- Есть.\n- А от жены?\n- Тоже есть, но это уже не головная боль, а головная боль!\n- А от тещи?\n- Есть, но это уже не в аптеке, а в полиции!",
"Анекдот 508:\n\nУчитель: Вовочка, кем работает твой папа?\nВовочка: Он директор завода.\nУчитель: А мама?\nВовочка: А мама дома, она отдыхает.\nУчитель: А кто же тогда зарабатывает деньги?\nВовочка: Папа зарабатывает, а мама их тратит!\nУчитель: А кто же тогда отдыхает?\nВовочка: Папа, когда мама уезжает к бабушке!\nУчитель: А кто же тогда работает?\nВовочка: Бабушка, когда мама у нее в гостях!",
"Анекдот 509:\n\nМуж: Дорогая, я сегодня задержусь на работе.\nЖена: Хорошо, а я приглашу подруг.\nМуж: Не надо, я уже иду домой!\nЖена: Почему?\nМуж: Потому что я боюсь, что вы без меня все съедите!\nЖена: А мы уже все съели!\nМуж: А что вы ели?\nЖена: То, что ты должен был купить!",
"Анекдот 510:\n\nДва друга:\n- Ты знаешь, я вчера так устал, что уснул прямо на диване.\n- А жена что?\n- Она тоже уснула, но перед телевизором!\n- А кто же тогда посуду мыл?\n- Никто, мы ее вчера не пачкали!\n- А кто же тогда готовил?\n- Никто, мы вчера ели в ресторане!\n- А кто же тогда платил?\n- Никто, мы ушли, не заплатив!",
"Анекдот 511:\n\nУчитель: Вовочка, что такое «настоящий мужчина»?\nВовочка: Это тот, кто не боится ни жены, ни тещи, ни начальника!\nУчитель: А что такое «настоящий герой»?\nВовочка: Это тот, кто не боится жены, тещи, начальника и еще умудряется с ними жить!",
"Анекдот 512:\n\nЖена: Дорогой, ты меня слушаешь?\nМуж: Да, дорогая.\nЖена: А что я сказала?\nМуж: Ты сказала, что я тебя не слушаю.\nЖена: Вот видишь, ты меня не слушаешь!\nМуж: Я слушаю, просто не запоминаю!\nЖена: А почему ты не запоминаешь?\nМуж: Потому что я думаю о футболе!",
"Анекдот 513:\n\nУчитель: Петров, почему ты опоздал?\nПетров: Я проспал.\nУчитель: А почему ты проспал?\nПетров: Потому что я поздно лег.\nУчитель: А почему поздно лег?\nПетров: Потому что я долго не мог уснуть!\nУчитель: А почему не мог уснуть?\nПетров: Потому что я думал, что опоздаю в школу!\nУчитель: А почему ты не мог уснуть из-за этого?\nПетров: Потому что я знал, что вы меня спросите, почему я опоздал!",
"Анекдот 514:\n\nМужчина в аптеке:\n- Дайте мне что-нибудь от бессонницы.\n- Вот, возьмите.\n- А от жены есть что-нибудь?\n- Увы, это не лечится, только развод!\n- А от развода есть?\n- Есть, но это уже в другом отделе!\n- А от другого отдела есть?\n- Есть, но это уже в суде!",
"Анекдот 515:\n\nЖена: Дорогой, а ты меня ревнуешь?\nМуж: Нет.\nЖена: А почему?\nМуж: Потому что я знаю, что ты меня любишь, и я тебе доверяю. А еще потому, что у меня есть ружье!\nЖена: А если я тебя разлюблю?\nМуж: Тогда я буду ревновать!\nЖена: А если я тебя полюблю?\nМуж: Тогда я буду счастлив!\nЖена: А если я тебя убью?\nМуж: Тогда я буду призраком и буду тебя преследовать!",
"Анекдот 516:\n\nУчитель: Вовочка, кем работает твой папа?\nВовочка: Он директор завода.\nУчитель: А мама?\nВовочка: А мама дома, она отдыхает.\nУчитель: А кто же тогда зарабатывает деньги?\nВовочка: Папа зарабатывает, а мама их тратит!\nУчитель: А кто же тогда отдыхает?\nВовочка: Папа, когда мама уезжает к бабушке!\nУчитель: А кто же тогда работает?\nВовочка: Бабушка, когда мама у нее в гостях!\nУчитель: А кто же тогда плачет?\nВовочка: Папа, когда мама возвращается!",
"Анекдот 517:\n\nДва друга:\n- Слушай, ты знаешь, как отличить настоящую любовь от привычки?\n- Нет, а как?\n- Настоящая любовь — это когда ты хочешь проводить с ней время, а привычка — это когда ты просто не хочешь скандала!\n- А что такое брак?\n- Это когда любовь переходит в привычку, а привычка — в скандал!\n- А что такое развод?\n- Это когда скандал переходит в свободу!",
"Анекдот 518:\n\nВрач: Пациент, вам нужно бросить курить.\nПациент: Доктор, я не курю.\nВрач: А пить?\nПациент: Тоже не пью.\nВрач: А что вы тогда делаете?\nПациент: Я просто живу с женой!\nВрач: Тогда вам нужно бросить жить с женой!\nПациент: А можно я буду жить с тещей?\nВрач: Тогда вам нужно бросить жить вообще!",
"Анекдот 519:\n\nЖена: Дорогой, а ты меня любишь?\nМуж: Да.\nЖена: А почему ты тогда не даришь мне цветы?\nМуж: Потому что цветы вянут, а моя любовь к тебе — вечна!\nЖена: А почему ты тогда не даришь мне шубу?\nМуж: Потому что шуба не вянет, а любовь может!\nЖена: А почему ты тогда не даришь мне машину?\nМуж: Потому что машина не вянет, шуба не вянет, а любовь может!",
"Анекдот 520:\n\nУчитель: Иванов, что такое «время»?\nИванов: Это то, что летит, когда ты отдыхаешь, и тянется, когда ты на работе.\nУчитель: А что такое «жизнь»?\nИванов: Это то, что проходит мимо, пока ты работаешь!\nУчитель: А что такое «счастье»?\nИванов: Это когда ты не работаешь!\nУчитель: А что такое «работа»?\nИванов: Это то, что мешает жить!",
"Анекдот 521:\n\nМуж: Дорогая, я сегодня задержусь на работе.\nЖена: Хорошо, а я приглашу подруг.\nМуж: Не надо, я уже иду домой!\nЖена: Почему?\nМуж: Потому что я боюсь, что вы без меня все съедите!\nЖена: А мы уже все съели!\nМуж: А что вы ели?\nЖена: То, что ты должен был купить!",

"Анекдот 804:\n\nРазговор двух друзей:\n- Как дела?\n- Да вот, женился.\n- Поздравляю! А как жена?\n- Не знаю, она пока молчит, но уже подозрительно смотрит.",

"Анекдот 806:\n\nМужчина в аптеке:\n- Дайте мне что-нибудь от головной боли.\n- Вот, возьмите.\n- А от жены есть что-нибудь?\n- Увы, это не лечится, только развод!",

"Анекдот 811:\n\nВрач: У вас амнезия. Вы помните, что я вам говорил вчера?\nПациент: Нет.\nВрач: А позавчера?\nПациент: Тоже нет.\nВрач: И вы еще жалуетесь на память?",

"Анекдот 813:\n\nТеща зятю:\n- Почему ты вчера так поздно пришел?\nЗять: Я был с друзьями.\n- А почему от тебя не пахнет спиртным?\n- Я не пил.\n- А почему от тебя пахнет женой?\n- Ой, простите, я перепутал этажи!",
"Анекдот 814:\n\nУчитель: Вовочка, ты знаешь, сколько будет дважды два?\nВовочка: Четыре.\nУчитель: Правильно! А сколько будет пятью пять?\nВовочка: Двадцать пять.\nУчитель: А что такое «бесконечность»?\nВовочка: Это то, что я получаю по математике за домашку!",

"Анекдот 816:\n\nМужик приходит к врачу:\n- Доктор, у меня проблема: каждый раз, когда я закрываю глаза, я вижу жену.\n- И что тут плохого?\n- Она меня ругает даже в моих мечтах!",
"Анекдот 817:\n\nДва друга:\n- Слушай, ты когда женился, ты счастлив?\n- Конечно!\n- А как же твоя свобода?\n- А я ее и не терял! Я просто теперь спрашиваю разрешение на все!",
"Анекдот 818:\n\nУчитель: Петров, ты почему молчишь?\nПетров: Я думаю.\nУчитель: О чем?\nПетров: О смысле жизни.\nУчитель: И какой же смысл?\nПетров: Получить двойку и пойти домой спать!",
"Анекдот 819:\n\nМуж жене:\n- Я понял, что я не идеален.\n- И что теперь?\n- Теперь я понимаю, что ты тоже не идеальна. Пойдем, выпьем чаю за наше несовершенство!",

"Анекдот 829:\n\nЖена: Дорогой, ты меня слышишь?\nМуж: Да, дорогая.\nЖена: А почему ты тогда не слушаешь?\nМуж: Я слушаю, просто не запоминаю!",
"Анекдот 830:\n\nВрач: Пациент, у вас серьезное заболевание.\nПациент: Доктор, а можно я выйду покурить, чтобы успокоиться?\nВрач: Нет, курить нельзя!\nПациент: А тогда можно я выйду выпить?\nВрач: Тоже нельзя!\nПациент: А как же я успокоюсь?",
"Анекдот 831:\n\nУчитель: Вовочка, ты знаешь, что такое «эволюция»?\nВовочка: Это когда обезьяна превратилась в человека.\nУчитель: А ты знаешь, что такое «деградация»?\nВовочка: Это когда человек превращается в ученика!",
"Анекдот 832:\n\nМуж: Дорогая, я забыл, что мы ссорились. Ты не подскажешь, из-за чего?\nЖена: Из-за того, что ты забыл, что мы ссорились!",
"Анекдот 833:\n\nДва друга:\n- У меня жена готовит ужин.\n- А что она готовит?\n- Я не знаю, но она сказала, что это будет сюрприз.\n- Боишься?\n- Очень!",

"Анекдот 844:\n\nЖена: Дорогой, я сегодня видела сон, что ты мне изменил.\nМуж: Дорогая, это же просто сон.\nЖена: А почему ты тогда оправдываешься?",

"Анекдот 931:\n\nДва друга:\n- Слушай, ты знаешь, как отличить настоящую любовь от привычки?\n- Нет, а как?\n- Настоящая любовь — это когда ты хочешь проводить с ней время, а привычка — это когда ты просто не хочешь скандала!",

"Анекдот 935:\n\nМуж: Дорогая, я сегодня задержусь на работе.\nЖена: Хорошо, а я приглашу подруг.\nМуж: Не надо, я уже иду домой!\nЖена: Почему?\nМуж: Потому что я боюсь, что вы без меня все съедите!\nЖена: А мы уже все съели!",
