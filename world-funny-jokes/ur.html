"لطیفہ 36:\n\nبیوی: جی، آپ مجھے کہاں لے جا رہے ہیں؟\nشوہر: میں تمہیں بازار لے جا رہا ہوں۔\nبیوی: کیا خریدنا ہے؟\nشوہر: تمہیں جو پسند ہو، لیکن پیسے میرے پاس صرف 500 ہیں!",
"لطیفہ 37:\n\nاستاد: تمہیں شادی کیوں کرنی ہے؟\nشاگرد: سر، کیونکہ میری ماں نے کہا کہ شادی کے بعد مجھے کوئی نہیں ڈانٹے گا۔\nاستاد: پھر کیا ہوا؟\nشاگرد: سر، شادی کے بعد پتہ چلا کہ اب مجھے ایک ہی ڈانٹنے والی باقی ہے — بیوی!",
"لطیفہ 38:\n\nڈاکٹر: تمہیں میٹھا کم کھانا چاہیے۔\nمریض: ڈاکٹر صاحب، میں میٹھا نہیں کھاتا۔\nڈاکٹر: تو پھر تمہارے دانت کیوں خراب ہیں؟\nمریض: ڈاکٹر صاحب، میں نے میٹھا چھوڑا، لیکن بیوی نہیں چھوڑی!",
"لطیفہ 39:\n\nاستاد: تمہیں زندگی کا سب سے بڑا جھٹکا کیا لگا؟\nشاگرد: سر، جب میں نے اپنی بیوی کو میکے جانے کے لیے تیار کیا، اور وہ بولی ‘میں نہیں جا رہی’ — یہ سب سے بڑا جھٹکا تھا!",
"لطیفہ 40:\n\nبیوی: جی، آپ کی سب سے پسندیدہ چیز کیا ہے؟\nشوہر: تم۔\nبیوی: واہ، کتنا پیار!\nشوہر: نہیں، میری پسندیدہ چیز تمہارا میکے جانا ہے!",
"لطیفہ 41:\n\nایک آدمی نے دکاندار سے پوچھا: بھائی، کاروبار کیسا چل رہا ہے؟\nدکاندار: ماشاءاللہ، روزانہ لاکھوں کی سیل ہے!\nآدمی: کیا آپ نے کبھی ٹیکس دیا ہے؟\nدکاندار: بھائی، میں تو اس پورے بازار میں جھوٹا مشہور ہوں — ابھی جو آپ سے جھوٹ بولا، وہی سچ سمجھ لیں!",
"لطیفہ 42:\n\nاستاد: اگر تمہاری بیوی اور بچہ دونوں دریا میں گر جائیں تو پہلے کسے بچاؤ گے؟\nشاگرد: سر، بچے کو۔\nاستاد: بیوی کو کیوں نہیں؟\nشاگرد: سر، بیوی تو خود تیر کر نکل آئے گی، بچہ نہیں نکل سکے گا!",
"لطیفہ 43:\n\nڈاکٹر: تمہیں آرام کی ضرورت ہے۔\nمریض: ڈاکٹر صاحب، میں تو آرام ہی کرتا ہوں۔\nڈاکٹر: پھر تم بیمار کیسے ہو؟\nمریض: آرام کرتے کرتے تھک گیا!",
"لطیفہ 44:\n\nاستاد: تمہارا رزلٹ کیسا ہے؟\nشاگرد: سر، پاس ہو گیا!\nاستاد: کتنے نمبر ہیں؟\nشاگرد: سر، پاس ہونے کے لیے نمبر ضروری نہیں!",
"لطیفہ 45:\n\nبیوی: جی، آج شام کو کہاں جائیں؟\nشوہر: جہاں تم کہو۔\nبیوی: میکے چلیں؟\nشوہر: وہاں کیوں؟\nبیوی: کیونکہ وہاں کھانا بھی ملے گا اور آپ کی تنخواہ بھی بچ جائے گی!",
"لطیفہ 46:\n\nاستاد: تمہیں زندگی کا سب سے بڑا سبق کیا ملا؟\nشاگرد: سر، شادی سے پہلے میں سوچتا تھا کہ میں بادشاہ ہوں، شادی کے بعد پتہ چلا کہ میں وزیر ہوں — اور بیوی وزیراعظم!",
"لطیفہ 47:\n\nڈاکٹر: تمہیں سونا چاہیے۔\nمریض: ڈاکٹر صاحب، میں سوتا ہوں۔\nڈاکٹر: کتنے گھنٹے؟\nمریض: ڈاکٹر صاحب، میں دن بھر سوتا ہوں!",
"لطیفہ 48:\n\nاستاد: اگر تمہیں ایک جہاز ملے تو کہاں جاؤ گے؟\nشاگرد: سر، میکے!",
"لطیفہ 49:\n\nبیوی: جی، اگر میں مر جاؤں تو کیا کرو گے؟\nشوہر: دوسری شادی کر لوں گا۔\nبیوی: اور اگر میں زندہ رہوں؟\nشوہر: پھر کیا، پہلے والی ہی رہے گی!",
"لطیفہ 50:\n\nاستاد: اگر تمہیں ایک کروڑ روپے ملیں تو کیا کرو گے؟\nشاگرد: سر، پہلے بیوی کو میکے بھیجوں گا، پھر سکون سے سوؤں گا!",
"لطیفہ 51:\n\nڈاکٹر: تمہیں سگریٹ نہیں پینی چاہیے۔\nمریض: ڈاکٹر صاحب، میں تو صرف دیکھتا ہوں۔\nڈاکٹر: تو پھر دیکھنا چھوڑ دو!",
"لطیفہ 52:\n\nاستاد: تمہیں شادی کے بعد کیا محسوس ہوا؟\nشاگرد: سر، پہلے مجھے لگتا تھا کہ میں آزاد ہوں — شادی کے بعد پتہ چلا کہ میں پہلے قید تھا، اب رہائی ملی ہے!",
"لطیفہ 53:\n\nبیوی: جی، آپ مجھے کتنا پیار کرتے ہیں؟\nشوہر: اتنا کہ میں تمہیں میکے بھی نہیں جانے دیتا۔\nبیوی: واہ، اتنی محبت!\nشوہر: نہیں، میکے جانے کا خرچہ بچانا ہے!",
"لطیفہ 54:\n\nاستاد: تمہیں زندگی کا سب سے بڑا صدمہ کیا ہوا؟\nشاگرد: سر، جب میری بیوی نے بتایا کہ میں باپ بننے والا ہوں — اور میں نے سوچا کہ میں تو خود ابھی بچہ ہوں!",
"لطیفہ 55:\n\nڈاکٹر: تمہیں ورزش کرنی چاہیے۔\nمریض: ڈاکٹر صاحب، میں روزانہ ورزش کرتا ہوں۔\nڈاکٹر: کیا کرتے ہو؟\nمریض: میں روزانہ بیوی سے ڈانٹ کھانے کے بعد بھاگتا ہوں!",
"لطیفہ 56:\n\nاستاد: اگر تمہاری بیوی اور ماں دونوں ایک ساتھ ڈانٹیں تو کس کی سنو گے؟\nشاگرد: سر، ماں کی۔\nاستاد: بیوی کی کیوں نہیں؟\nشاگرد: سر، بیوی کی تو رات کو بھی سننی ہے، ماں کی صرف دن میں!",
"لطیفہ 57:\n\nبیوی: جی، آج کھانے میں کیا بناؤں؟\nشوہر: جو تمہارا دل کرے۔\nبیوی: ٹھیک ہے، میں آج کچھ نہیں بناؤں گی۔\nشوہر: ارے نہیں، میں نے تو مذاق کیا تھا!",
"لطیفہ 58:\n\nاستاد: تمہیں شادی کیوں کرنی ہے؟\nشاگرد: سر، کیونکہ میری ماں نے کہا کہ شادی کے بعد مجھے کوئی نہیں ڈانٹے گا۔\nاستاد: پھر کیا ہوا؟\nشاگرد: سر، شادی کے بعد پتہ چلا کہ اب مجھے ایک ہی ڈانٹنے والی باقی ہے — بیوی!",

"لطیفہ 62:\n\nاستاد: اگر تمہیں ایک کروڑ روپے ملیں تو کیا کرو گے؟\nشاگرد: سر، پہلے اسکول کی فیس دوں گا۔\nاستاد: واہ، کتنا اچھا بچہ ہے!\nشاگرد: پھر باقی پیسوں سے بیوی کو میکے بھیجوں گا!",
"لطیفہ 63:\n\nبیوی: جی، اگر میں مر جاؤں تو کیا کرو گے؟\nشوہر: دوسری شادی کر لوں گا۔\nبیوی: اور اگر میں زندہ رہوں؟\nشوہر: پھر کیا، پہلے والی ہی رہے گی!",
"لطیفہ 64:\n\nاستاد: حادثہ اور مصیبت میں کیا فرق ہے؟\nشاگرد: سر، جب کسی کی بیوی میکے چلی جائے اور واپسی پر ایکسیڈنٹ ہو جائے اور مر جائے تو یہ حادثہ ہے۔ اور اگر زندہ سلامت گھر واپس آ جائے تو یہ مصیبت ہے!",
"لطیفہ 65:\n\nبیوی: جی، آپ مجھے کتنا پیار کرتے ہیں؟\nشوہر: اتنا کہ تمہارے بغیر ایک گھنٹہ نہیں رہ سکتا۔\nبیوی: تو پھر آپ نے آج کھانا کیوں نہیں بنایا؟\nشوہر: کیونکہ میں تمہارے بغیر کھانا نہیں بنا سکتا!",
"لطیفہ 66:\n\nاستاد: اگر تمہاری بیوی اور ماں دونوں دریا میں گر جائیں تو پہلے کسے بچاؤ گے؟\nشاگرد: سر، پہلے ماں کو، کیونکہ بیوی تو تیرنا جانتی ہے — میکے جانے کے لیے روز دریا پار کرتی ہے!",
"لطیفہ 67:\n\nڈاکٹر: تمہیں کیا تکلیف ہے؟\nمریض: ڈاکٹر صاحب، میری بیوی مجھے روز ڈانٹتی ہے۔\nڈاکٹر: تو اس میں میں کیا کروں؟\nمریض: آپ اسے کوئی دوا دے دیں تاکہ وہ ڈانٹنا چھوڑ دے!",
"لطیفہ 68:\n\nاستاد: تمہیں شادی کے بعد کیا محسوس ہوا؟\nشاگرد: سر، پہلے مجھے لگتا تھا کہ میں آزاد ہوں — شادی کے بعد پتہ چلا کہ میں پہلے قید تھا، اب رہائی ملی ہے!",

"لطیفہ 70:\n\nاستاد: اگر تمہیں نوکری ملے تو کیا کرو گے؟\nشاگرد: سر، پہلے مہینے کی تنخواہ سے ماں کو تحفہ دوں گا۔\nاستاد: واہ، کتنا اچھا بیٹا ہے!\nشاگرد: پھر باقی مہینے بھی ماں کو دے دوں گا، بیوی کو کچھ نہیں!",

var current = 0;

function showJoke(){
    document.getElementById('jokeBox').innerText = jokes[current];

}
