"Lelucon 78:\n\nGuru: Apa kejutan terbesar dalam hidupmu?\nMurid: Pak, ketika saya menyiapkan istri saya untuk pergi ke rumah ayahnya, dan dia bilang 'aku tidak mau pergi' – itu kejutan terbesar!",
"Lelucon 79:\n\nSeorang pria pergi ke dokter dan berkata: Dokter, setiap hari saya merasa akan mati.\nDokter: Sejak kapan?\nPria: Sejak saya menikah.\nDokter: Bro, itu bukan penyakit, itu kenyataan!",
"Lelucon 80:\n\nGuru: Jika saya memberimu satu juta, apa yang akan kamu lakukan?\nMurid: Pak, saya akan membayar uang sekolah dulu.\nGuru: Wow, murid yang baik!\nMurid: Lalu dengan sisa uangnya, saya akan mengirim istri saya ke rumah ayahnya!",
"Lelucon 81:\n\nIstri: Sayang, jika aku mati, apa yang akan kamu lakukan?\nSuami: Aku akan menikah lagi.\nIstri: Dan jika aku tetap hidup?\nSuami: Terus kenapa? Yang pertama tetap sama!",
"Lelucon 82:\n\nSuami: Sayang, seberapa besar kamu mencintaiku?\nIstri: Begitu besar sampai aku tidak bisa hidup tanpamu satu jam pun!\nSuami: Lalu kenapa kamu tidak memasak hari ini?\nIstri: Karena aku juga tidak bisa memasak tanpamu!",
"Lelucon 83:\n\nGuru: Jika istri dan ibumu jatuh ke sungai, siapa yang kamu selamatkan dulu?\nMurid: Pak, saya selamatkan ibu dulu, karena istri saya bisa berenang – dia menyeberangi sungai setiap hari untuk pergi ke rumah ayahnya!",
"Lelucon 84:\n\nDokter: Apa masalahmu?\nPasien: Dokter, istri saya membentak saya setiap hari.\nDokter: Lalu apa yang bisa saya lakukan?\nPasien: Beri dia obat supaya berhenti membentak!",
"Lelucon 85:\n\nGuru: Apa yang kamu rasakan setelah menikah?\nMurid: Pak, sebelumnya saya pikir saya bebas – setelah menikah saya tahu bahwa sebelumnya saya tahanan, sekarang saya menemukan kebebasan!",
"Lelucon 86:\n\nIstri: Sayang, ayo kita ke pasar hari ini?\nSuami: Tidak ada uang.\nIstri: Terus kenapa? Kita cuma lihat-lihat.\nSuami: Terakhir kali kamu bilang begitu, dan saya meninggalkan gaji tiga bulan di pasar!",
"Lelucon 87:\n\nGuru: Jika kamu mendapat pekerjaan, apa yang akan kamu lakukan?\nMurid: Pak, saya akan memberikan gaji pertama saya kepada ibu saya.\nGuru: Wow, anak yang baik!\nMurid: Dan bulan-bulan berikutnya juga saya berikan ke ibu saya, tidak untuk istri saya!",
"Lelucon 88:\n\nIstri: Sayang, kamu tidak pernah memberiku bunga.\nSuami: Kamu suka bunga?\nIstri: Iya.\nSuami: Kalau begitu besok pergi ke pasar dan beli bunga!",
"Lelucon 89:\n\nGuru: Apa kejutan terbesar dalam hidupmu?\nMurid: Pak, ketika istri saya bilang saya akan menjadi ayah – dan saya pikir saya masih anak-anak!",
"Lelucon 90:\n\nDokter: Kamu harus berolahraga.\nPasien: Dokter, saya berolahraga setiap hari.\nDokter: Apa yang kamu lakukan?\nPasien: Saya berlari setiap hari setelah istri saya membentak saya!",
"Lelucon 91:\n\nGuru: Jika istri dan ibumu membentakmu pada saat yang sama, siapa yang kamu dengarkan?\nMurid: Pak, saya dengarkan ibu saya.\nGuru: Kenapa bukan istri?\nMurid: Pak, istri saya harus saya dengarkan juga malam, ibu saya hanya siang!",
"Lelucon 92:\n\nIstri: Sayang, hari ini aku masak apa?\nSuami: Terserah kamu.\nIstri: Oke, hari ini aku tidak masak apa-apa.\nSuami: Jangan, jangan, aku hanya bercanda!",
"Lelucon 93:\n\nGuru: Apa pelajaran terbesar yang kamu dapat dari hidup?\nMurid: Pak, sebelum menikah saya pikir saya raja, setelah menikah saya tahu saya menteri – dan istri adalah perdana menteri!",
"Lelucon 94:\n\nDokter: Kamu tidak boleh merokok.\nPasien: Dokter, saya hanya melihatnya.\nDokter: Kalau begitu berhenti melihatnya!",
"Lelucon 95:\n\nGuru: Jika kamu diberi pesawat, kamu mau ke mana?\nMurid: Pak, ke rumah ayahnya istri saya!",
"Lelucon 96:\n\nIstri: Sayang, apa hal favoritmu?\nSuami: Kamu.\nIstri: Wow, cinta banget!\nSuami: Bukan, hal favoritku adalah saat kamu pergi ke rumah ayahmu.",
"Lelucon 97:\n\nGuru: Jika istri dan anakmu naik ke atap, siapa yang kamu turunkan dulu?\nMurid: Pak, anaknya.\nGuru: Kenapa bukan istrimu?\nMurid: Pak, istri saya akan melompat sendiri dan turun, anak saya tidak bisa!",
"Lelucon 98:\n\nDokter: Kamu harus tidur yang cukup.\nPasien: Dokter, saya tidur.\nDokter: Berapa jam?\nPasien: Dokter, saya tidur sepanjang malam, tapi siang hari istri saya tidak membiarkan saya tidur!",
"Lelucon 99:\n\nGuru: Siapa orang terkuat di rumahmu?\nMurid: Pak, istri saya.\nGuru: Bagaimana bisa?\nMurid: Pak, dia mengatur seluruh rumah dengan satu tangan, dan juga gaji saya!",
"Lelucon 100:\n\nIstri: Sayang, jika aku dan ibumu sakit pada saat yang sama, obat siapa yang kamu bawa?\nSuami: Obatmu!\nIstri: Wow, cinta banget!\nSuami: Bukan, obat ibuku akan datang sendiri, obatmu aku yang bawa! 😄",
"Lelucon 101:\n\nGuru: Kenapa kamu datang terlambat?\nMurid: Pak, saya bangun kesiangan.\nGuru: Dan kenapa?\nMurid: Pak, saya bermimpi sedang di sekolah, jadi saya tidak perlu datang!",
"Lelucon 102:\n\nSuami: Sayang, aku punya kabar baik.\nIstri: Apa itu?\nSuami: Aku berhenti merokok!\nIstri: Sejak kapan?\nSuami: Sejak aku menghabiskan rokok terakhir!",
"Lelucon 103:\n\nDokter: Kamu harus berhenti makan di malam hari.\nPasien: Dokter, saya tidak makan di malam hari.\nDokter: Lalu kenapa kulkasmu kosong di pagi hari?\nPasien: Dokter, kulkasnya kosong sendiri!",
"Lelucon 104:\n\nGuru: Apa ibu kota Prancis?\nMurid: Pak, itu Paris.\nGuru: Bagus. Dan ibu kota Italia?\nMurid: Pak, itu... sama, tapi dengan lebih banyak pizza!",
"Lelucon 105:\n\nIstri: Sayang, kamu lupa hari jadi kita!\nSuami: Tidak, aku tidak lupa.\nIstri: Lalu di mana hadiahku?\nSuami: Hadiahnya adalah aku tidak melupakannya!",
"Lelucon 106:\n\nGuru: Kenapa ikan tidak pergi ke sekolah?\nMurid: Pak, karena mereka sudah punya sisik!",
"Lelucon 107:\n\nDokter: Kamu minum terlalu banyak kopi.\nPasien: Dokter, saya minum kopi supaya tidak tidur.\nDokter: Dan kenapa kamu tidak mau tidur?\nPasien: Dokter, karena saya harus minum kopi!",
"Lelucon 108:\n\nAyah: Nak, kenapa tanganmu kotor?\nAnak: Yah, aku bermain di lumpur.\nAyah: Dan kenapa kamu tidak mandi?\nAnak: Yah, aku ingin menyimpan kenangannya!",
"Lelucon 109:\n\nGuru: Berapa 2 ditambah 2?\nMurid: Pak, 4.\nGuru: Dan 4 ditambah 4?\nMurid: Pak, 8.\nGuru: Dan 8 ditambah 8?\nMurid: Pak, terlalu banyak!",
"Lelucon 110:\n\nIstri: Sayang, kamu lebih mencintaiku daripada mobilmu?\nSuami: Tentu saja!\nIstri: Kalau begitu biarkan aku yang mengemudi.\nSuami: Jangan, jangan, aku bohong!",
"Lelucon 111:\n\nDokter: Kamu harus lebih banyak berjalan.\nPasien: Dokter, saya berjalan setiap hari.\nDokter: Berapa langkah?\nPasien: Dokter, dari kasur ke kulkas!",
"Lelucon 112:\n\nGuru: Kenapa langit berwarna biru?\nMurid: Pak, karena Tuhan suka warna biru!\nGuru: Dan kenapa rumput berwarna hijau?\nMurid: Pak, karena Dia sudah kehabisan warna biru!",
"Lelucon 113:\n\nAyah: Nak, apakah kamu sudah mengerjakan PR?\nAnak: Yah, aku sudah mengerjakan setengahnya.\nAyah: Di mana setengahnya lagi?\nAnak: Yah, aku simpan untuk besok!",
"Lelucon 114:\n\nIstri: Sayang, kamu tambah gemuk!\nSuami: Bukan, cerminnya yang menyusut.\nIstri: Dan timbangannya?\nSuami: Timbangannya juga menyusut!",
"Lelucon 115:\n\nDokter: Kamu harus tidur 8 jam sehari.\nPasien: Dokter, saya tidur 12 jam.\nDokter: Lalu kenapa kamu lelah?\nPasien: Dokter, karena saya bangun setiap jam!",
"Lelucon 116:\n\nGuru: Planet mana yang paling dekat dengan matahari?\nMurid: Pak, itu Merkurius.\nGuru: Dan yang paling dingin?\nMurid: Pak, yang tidak punya matahari!",
"Lelucon 117:\n\nIstri: Sayang, kita sudah tidak punya gula.\nSuami: Kalau begitu pakai garam.\nIstri: Tapi itu tidak akan manis!\nSuami: Iya, tapi itu akan asin, itu sudah cukup!",
"Lelucon 118:\n\nAyah: Nak, kenapa kamu menangis?\nAnak: Yah, aku kehilangan uang jajanku.\nAyah: Di mana?\nAnak: Yah, aku menghabiskannya!",
"Lelucon 119:\n\nGuru: Kenapa kamu belajar?\nMurid: Pak, untuk mendapatkan pekerjaan yang baik.\nGuru: Dan kenapa kamu ingin pekerjaan yang baik?\nMurid: Pak, supaya tidak perlu belajar lagi!",
"Lelucon 120:\n\nDokter: Kamu harus berhenti menonton TV.\nPasien: Dokter, saya tidak menonton.\nDokter: Lalu kenapa matamu lelah?\nPasien: Dokter, saya melihat handphone saya!",
"Lelucon 121:\n\nIstri: Sayang, kamu ingat kencan pertama kita?\nSuami: Tentu saja.\nIstri: Di mana itu?\nSuami: Hmm... di rumah ibumu?\nIstri: Itu pernikahan kita, bukan kencan pertama kita!",
"Lelucon 122:\n\nGuru: Apa itu lubang hitam?\nMurid: Pak, itu lubang yang tidak punya cahaya.\nGuru: Dan apa itu lubang putih?\nMurid: Pak, lubang yang lupa menjadi hitam!",
"Lelucon 123:\n\nAyah: Nak, kenapa kamu mengambil handphone-ku?\nAnak: Yah, aku ingin menelepon ibu.\nAyah: Dan kenapa?\nAnak: Yah, untuk memberitahunya bahwa kamu sedang mencari handphone-mu!",
"Lelucon 124:\n\nDokter: Kamu alergi terhadap apa?\nPasien: Dokter, saya alergi terhadap pekerjaan.\nDokter: Itu bukan alergi, itu kemalasan!\nPasien: Dokter, kemalasan membuat saya bersin!",
"Lelucon 125:\n\nIstri: Sayang, di mana lipstikku?\nSuami: Aku tidak tahu.\nIstri: Kamu mengambilnya?\nSuami: Tidak!\nIstri: Lalu kenapa bibirmu merah?",
"Lelucon 126:\n\nGuru: Ada berapa benua?\nMurid: Pak, lima.\nGuru: Tidak, ada tujuh!\nMurid: Pak, dua sedang berlibur!",
"Lelucon 127:\n\nAyah: Nak, kenapa kamu sedih?\nAnak: Yah, aku tidak lulus ujian.\nAyah: Kenapa?\nAnak: Yah, aku sudah belajar tapi soalnya berbeda!",
"Lelucon 128:\n\nDokter: Kamu harus makan lebih banyak sayur.\nPasien: Dokter, saya makan salad setiap hari.\nDokter: Dan apa lagi?\nPasien: Dokter, ayam dengan salad!",
"Lelucon 129:\n\nIstri: Sayang, kamu lihat kacamataku?\nSuami: Ada di kepalamu.\nIstri: Oh iya! Tapi di mana handphone-ku?\nSuami: Di tanganmu!",
"Lelucon 130:\n\nGuru: Kenapa jerapah punya leher panjang?\nMurid: Pak, supaya bisa melihat lebih jauh.\nGuru: Dan kenapa?\nMurid: Pak, karena mereka penasaran!",
"Lelucon 131:\n\nAyah: Nak, kamu tadi di mana?\nAnak: Yah, di rumah teman.\nAyah: Teman yang mana?\nAnak: Yah, anak tetangga!",
"Lelucon 132:\n\nDokter: Kamu harus mengurangi minuman bersoda.\nPasien: Dokter, saya minum air.\nDokter: Lalu kenapa perutmu berbunyi?\nPasien: Dokter, airnya bersoda!",
"Lelucon 133:\n\nIstri: Sayang, kamu mendengarku?\nSuami: Iya, tentu saja.\nIstri: Lalu apa yang baru saja aku katakan?\nSuami: Hmm... bahwa kamu mencintaiku?",
"Lelucon 134:\n\nGuru: Kenapa air itu transparan?\nMurid: Pak, karena tidak punya warna.\nGuru: Dan kenapa?\nMurid: Pak, karena dia pemalu!",
"Lelucon 135:\n\nAyah: Nak, apakah kamu sudah membersihkan kamarmu?\nAnak: Yah, aku sudah mulai.\nAyah: Di mana kamu mulai?\nAnak: Yah, dari pintu!",
"Lelucon 136:\n\nDokter: Kamu harus berhenti stres.\nPasien: Dokter, saya tidak stres.\nDokter: Lalu kenapa rambutmu rontok?\nPasien: Dokter, itu karena istri saya!",
"Lelucon 137:\n\nIstri: Sayang, akhir pekan ini kita ke mana?\nSuami: Ke rumah ibumu.\nIstri: Kenapa?\nSuami: Karena gratis!",
"Lelucon 138:\n\nGuru: Apa itu fotosintesis?\nMurid: Pak, itu saat tumbuhan mengambil foto.\nGuru: Bukan, itu saat mereka membuat makanan mereka sendiri!\nMurid: Pak, berarti mereka koki!",
"Lelucon 139:\n\nAyah: Nak, apakah kamu sudah menghabiskan segelas susu?\nAnak: Yah, sudah.\nAyah: Lalu kenapa kucingnya putih?\nAnak: Yah, karena aku memberikan susunya ke kucing!",
"Lelucon 140:\n\nDokter: Kamu harus menghindari gula.\nPasien: Dokter, saya tidak suka gula.\nDokter: Lalu kenapa gigimu rusak?\nPasien: Dokter, itu gula dari istri saya, dia terlalu manis!",
"Lelucon 141:\n\nIstri: Sayang, apakah kamu sudah membeli hadiah untuk ibuku?\nSuami: Sudah.\nIstri: Apa?\nSuami: Tiket supaya dia datang ke rumah kita!",
"Lelucon 142:\n\nGuru: Kenapa bintang bersinar?\nMurid: Pak, karena mereka senang.\nGuru: Kenapa?\nMurid: Pak, karena mereka tidak perlu pergi ke sekolah!",
"Lelucon 143:\n\nAyah: Nak, kenapa matamu merah?\nAnak: Yah, aku menonton film sedih.\nAyah: Film apa?\nAnak: Yah, film tentang PR-ku yang belum dikerjakan!",
"Lelucon 144:\n\nDokter: Kamu harus berjalan 30 menit sehari.\nPasien: Dokter, saya berjalan 2 jam.\nDokter: Di mana?\nPasien: Dokter, di pusat perbelanjaan!",
"Lelucon 145:\n\nIstri: Sayang, apakah kamu sudah membayar tagihan listrik?\nSuami: Sudah.\nIstri: Lalu kenapa gelap?\nSuami: Karena aku lupa membayarnya!",
"Lelucon 146:\n\nGuru: Apa itu atom?\nMurid: Pak, itu benda kecil.\nGuru: Dan apa itu molekul?\nMurid: Pak, itu beberapa benda kecil yang berkumpul!",
"Lelucon 147:\n\nAyah: Nak, apakah kamu sudah mandi?\nAnak: Yah, sudah.\nAyah: Lalu kenapa rambutmu kering?\nAnak: Yah, aku berjemur!",
"Lelucon 148:\n\nDokter: Kamu harus berhenti merokok.\nPasien: Dokter, saya tidak merokok.\nDokter: Lalu kenapa paru-parumu hitam?\nPasien: Dokter, itu polusi dari kotaku!",
"Lelucon 149:\n\nIstri: Sayang, apakah kamu sudah membeli roti?\nSuami: Sudah, tapi aku memakannya di jalan!\nIstri: Kenapa?\nSuami: Karena aku lapar!",
"Lelucon 150:\n\nGuru: Kenapa bulan berubah bentuk?\nMurid: Pak, karena dia sedang diet.\nGuru: Kenapa?\nMurid: Pak, supaya lebih cantik!",
"Lelucon 151:\n\nAyah: Nak, apakah kamu sudah mengerjakan tugas matematika?\nAnak: Yah, sudah.\nAyah: Lalu 7 kali 8 berapa?\nAnak: Yah, aku lupa!",
"Lelucon 152:\n\nDokter: Kamu harus tidur telentang.\nPasien: Dokter, saya tidur tengkurap.\nDokter: Kenapa?\nPasien: Dokter, supaya tidak melihat istri saya!",
"Lelucon 153:\n\nIstri: Sayang, apakah kamu sudah mencuci piring?\nSuami: Sudah.\nIstri: Lalu kenapa piringnya masih kotor?\nSuami: Karena aku hanya mencuci piringku sendiri!",
"Lelucon 154:\n\nGuru: Apa itu gravitasi?\nMurid: Pak, itu yang membuat benda jatuh.\nGuru: Dan kenapa?\nMurid: Pak, karena bumi menariknya!",
"Lelucon 155:\n\nAyah: Nak, apakah kamu sudah memakai sepatu?\nAnak: Yah, sudah.\nAyah: Lalu kenapa kamu bertelanjang kaki?\nAnak: Yah, aku memakai sepatu kakak perempuanku!",
"Lelucon 156:\n\nDokter: Kamu harus makan lebih sedikit garam.\nPasien: Dokter, saya tidak menambahkan garam.\nDokter: Lalu kenapa tekanan darahmu tinggi?\nPasien: Dokter, itu garam dari istri saya, dia terlalu asin!",
"Lelucon 157:\n\nIstri: Sayang, apakah kamu sudah menyiram tanaman?\nSuami: Sudah.\nIstri: Lalu kenapa tanamannya layu?\nSuami: Karena aku menyiramnya dengan kopi!",
"Lelucon 158:\n\nGuru: Kenapa gunung berapi meletus?\nMurid: Pak, karena mereka marah.\nGuru: Kenapa?\nMurid: Pak, karena orang melemparinya dengan batu!",
"Lelucon 159:\n\nAyah: Nak, apakah kamu sudah sarapan?\nAnak: Yah, sudah.\nAyah: Lalu kenapa kamu lapar?\nAnak: Yah, aku memakan sarapan kakak perempuanku!",
"Lelucon 160:\n\nDokter: Kamu harus menghindari stres.\nPasien: Dokter, saya tidak stres.\nDokter: Lalu kenapa kamu gemetar?\nPasien: Dokter, itu istri saya yang datang!",
"Lelucon 161:\n\nIstri: Sayang, apakah kamu sudah membeli susu?\nSuami: Sudah, tapi aku meminumnya.\nIstri: Kenapa?\nSuami: Karena mau kedaluwarsa!",
"Lelucon 162:\n\nGuru: Apa itu listrik?\nMurid: Pak, itu yang menyalakan bola lampu.\nGuru: Dan kenapa?\nMurid: Pak, karena bola lampu butuh cahaya!",
"Lelucon 163:\n\nAyah: Nak, apakah kamu sudah merapikan tas sekolahmu?\nAnak: Yah, sudah.\nAyah: Lalu kenapa tasnya kosong?\nAnak: Yah, aku meninggalkan PR-nya di rumah!",
"Lelucon 164:\n\nDokter: Kamu harus memperhatikan makananmu.\nPasien: Dokter, saya memperhatikan.\nDokter: Apa yang kamu makan?\nPasien: Dokter, saya makan apa yang diberikan istri saya!",
"Lelucon 165:\n\nIstri: Sayang, apakah kamu sudah mencuci mobil?\nSuami: Sudah.\nIstri: Lalu kenapa mobilnya kotor?\nSuami: Karena aku mencuci mobil tetangga!",
"Lelucon 166:\n\nGuru: Kenapa gunung itu tinggi?\nMurid: Pak, karena mereka ingin melihat laut.\nGuru: Dan kenapa?\nMurid: Pak, karena mereka penasaran!",
"Lelucon 167:\n\nAyah: Nak, apakah kamu sudah merapikan tempat tidurmu?\nAnak: Yah, sudah.\nAyah: Lalu kenapa masih berantakan?\nAnak: Yah, aku merapikannya di mimpiku!",
"Lelucon 168:\n\nDokter: Kamu harus minum jus jeruk.\nPasien: Dokter, saya minum jus apel.\nDokter: Kenapa?\nPasien: Dokter, karena jeruk lebih mahal!",
"Lelucon 169:\n\nIstri: Sayang, apakah kamu sudah menelepon ibumu?\nSuami: Sudah.\nIstri: Apa katanya?\nSuami: Dia bilang kamu harus lebih sering menelepon!",
"Lelucon 170:\n\nGuru: Apa itu fotosintesis?\nMurid: Pak, itu saat tumbuhan bernapas.\nGuru: Bukan, itu saat mereka membuat makanan mereka sendiri!\nMurid: Pak, berarti mereka bernapas sambil makan!",
"Lelucon 171:\n\nAyah: Nak, apakah kamu sudah memakai mantelmu?\nAnak: Yah, sudah.\nAyah: Lalu kenapa kamu kedinginan?\nAnak: Yah, aku memakai mantel kakak perempuanku, terlalu kecil!",
"Lelucon 172:\n\nDokter: Kamu harus bersepeda.\nPasien: Dokter, saya tidak punya sepeda.\nDokter: Kalau begitu jalan kaki!\nPasien: Dokter, saya tidak punya kaki... eh, punya, tapi tidak mau!",
"Lelucon 173:\n\nIstri: Sayang, apakah kamu sudah membeli ikan?\nSuami: Sudah, tapi ikan itu melompat dari wajan!\nIstri: Di mana ikan itu?\nSuami: Di taman, dia berenang di kolam!",
"Lelucon 174:\n\nGuru: Kenapa planet-planet berputar?\nMurid: Pak, karena mereka berolahraga.\nGuru: Kenapa?\nMurid: Pak, supaya tetap bugar!",
"Lelucon 175:\n\nAyah: Nak, apakah kamu sudah makan sayurmu?\nAnak: Yah, sudah.\nAyah: Lalu kenapa sayurnya ada di piring?\nAnak: Yah, aku memakannya dengan mataku!",
"Lelucon 176:\n\nDokter: Kamu harus berhenti minum kopi.\nPasien: Dokter, saya tidak minum kopi.\nDokter: Lalu kenapa kamu gugup?\nPasien: Dokter, ini tehnya!",
"Lelucon 177:\n\nIstri: Sayang, apakah kamu sudah membuang sampah?\nSuami: Sudah.\nIstri: Lalu kenapa sampahnya ada di depan pintu?\nSuami: Karena aku membuang pintunya juga!",
"Lelucon 178:\n\nGuru: Apa itu oksigen?\nMurid: Pak, itu yang kita hirup.\nGuru: Dan apa itu karbon dioksida?\nMurid: Pak, itu yang kita hembuskan, itu udara bekas!",
"Lelucon 179:\n\nAyah: Nak, apakah kamu sudah mematikan lampu?\nAnak: Yah, sudah.\nAyah: Lalu kenapa terang?\nAnak: Yah, itu matahari!",
"Lelucon 180:\n\nDokter: Kamu harus menurunkan berat badan.\nPasien: Dokter, saya sudah kehilangan 2 kilo.\nDokter: Bagaimana?\nPasien: Dokter, aku memotong rambutku!",
"Lelucon 181:\n\nIstri: Sayang, apakah kamu sudah membayar sewa rumah?\nSuami: Sudah.\nIstri: Lalu kenapa pemiliknya marah?\nSuami: Karena aku membayarnya dengan cek kosong!",
"Lelucon 182:\n\nGuru: Kenapa bumi berputar mengelilingi matahari?\nMurid: Pak, karena dia takut gelap.\nGuru: Kenapa?\nMurid: Pak, karena matahari adalah lampunya!",
"Lelucon 183:\n\nAyah: Nak, apakah kamu sudah mengerjakan tugas bahasa Indonesia?\nAnak: Yah, sudah.\nAyah: Kalau begitu tulis satu kalimat.\nAnak: Yah, „Aku belum mengerjakan PR-ku“!",
"Lelucon 184:\n\nGuru: Apa hal terindah di dunia?\nMurid: Pak, itu wanita.\nGuru: Dan yang paling berbahaya?\nMurid: Pak, wanita yang sama – itu sebabnya disebut „bahaya“! 😄",
"Lelucon 185:\n\nDokter: Kamu harus lebih banyak tidur.\nPasien: Dokter, saya tidur 10 jam.\nDokter: Lalu kenapa kamu masih lelah?\nPasien: Dokter, saya tidur di kantor, bukan di rumah!",
"Lelucon 186:\n\nIstri: Sayang, apakah kamu sudah menjemput anak-anak dari sekolah?\nSuami: Sudah.\nIstri: Lalu kenapa mereka tidak ada di sini?\nSuami: Karena aku membawa mereka ke sekolah yang salah!",
"Lelucon 187:\n\nGuru: Kenapa langit gelap di malam hari?\nMurid: Pak, karena lampunya dimatikan.\nGuru: Siapa yang mematikannya?\nMurid: Pak, bulan, untuk menghemat listrik!",
"Lelucon 188:\n\nAyah: Nak, apakah kamu sudah menyikat gigi?\nAnak: Yah, sudah.\nAyah: Lalu kenapa sikat gigimu kering?\nAnak: Yah, aku menyikatnya dengan jariku!",
"Lelucon 189:\n\nDokter: Kamu harus berhenti makan makanan cepat saji.\nPasien: Dokter, saya hanya makan salad.\nDokter: Lalu kenapa kamu kelebihan berat badan?\nPasien: Dokter, saladnya pakai kentang goreng!",
"Lelucon 190:\n\nIstri: Sayang, apakah kamu sudah menutup jendela?\nSuami: Sudah.\nIstri: Lalu kenapa di sini dingin?\nSuami: Karena aku menutup jendela tetangga!",
"Lelucon 191:\n\nGuru: Apa itu gunung berapi?\nMurid: Pak, itu gunung yang demam.\nGuru: Kenapa?\nMurid: Pak, karena dia memuntahkan api!",
"Lelucon 192:\n\nAyah: Nak, kenapa kamu tidak menabung uang jajanmu?\nAnak: Yah, aku sudah menabungnya.\nAyah: Di mana uangnya?\nAnak: Yah, aku menghabiskannya untuk permen!",
"Lelucon 193:\n\nDokter: Kamu harus minum lebih banyak air.\nPasien: Dokter, saya minum air setiap hari.\nDokter: Berapa banyak?\nPasien: Dokter, setetes per jam!",
"Lelucon 194:\n\nIstri: Sayang, apakah kamu sudah melihat sepatuku?\nSuami: Ada di lemari.\nIstri: Lemari yang mana?\nSuami: Yang kamu rapikan kemarin!",
"Lelucon 195:\n\nGuru: Kenapa gajah punya belalai?\nMurid: Pak, untuk minum air.\nGuru: Dan kenapa panjang sekali?\nMurid: Pak, karena mereka punya botol besar!",
"Lelucon 196:\n\nAyah: Nak, apakah kamu sudah memperbaiki sepedamu?\nAnak: Yah, sudah.\nAyah: Lalu kenapa bannya kempes?\nAnak: Yah, aku lupa mengisi udaranya!",
"Lelucon 197:\n\nDokter: Kamu harus berhenti ngemil.\nPasien: Dokter, saya tidak ngemil.\nDokter: Lalu kenapa gigimu penuh lubang?\nPasien: Dokter, aku ngemil sembunyi-sembunyi!",
"Lelucon 198:\n\nIstri: Sayang, apakah kamu sudah menyetel alarm?\nSuami: Sudah.\nIstri: Lalu kenapa kita kesiangan?\nSuami: Karena aku menyetelnya untuk waktu yang salah!",
"Lelucon 199:\n\nGuru: Apa itu matahari?\nMurid: Pak, itu bintang besar.\nGuru: Kenapa panas sekali?\nMurid: Pak, karena dia tidak pernah libur!",
"Lelucon 200:\n\nAyah: Nak, apakah kamu sudah membersihkan sepatumu?\nAnak: Yah, sudah.\nAyah: Lalu kenapa sepatunya kotor?\nAnak: Yah, aku membersihkannya dengan lumpur! 😄",
"Lelucon 201:\n\nGuru: Kenapa kamu tidak mengerjakan PR?\nMurid: Pak, saya meninggalkannya di rumah.\nGuru: Dan kenapa?\nMurid: Pak, karena anjing saya memakannya dan saya tidak ingin mengganggunya!",
"Lelucon 202:\n\nSeorang pria pergi ke dokter: Dokter, saya merasa setiap hari saya akan mati.\nDokter: Sejak kapan?\nPria: Sejak saya menikah.\nDokter: Bro, itu bukan penyakit, itu kenyataan!",
"Lelucon 203:\n\nIstri: Sayang, jika aku dan ibumu jatuh ke air pada saat yang sama, siapa yang kamu selamatkan dulu?\nSuami: Tentu saja kamu!\nIstri: Kenapa?\nSuami: Karena ibuku tahu cara berenang, dia pergi ke pasar setiap hari menyeberangi sungai!",
"Lelucon 204:\n\nGuru: Apa perbedaan antara burung dan pesawat?\nMurid: Pak, pesawat tidak punya sangkar!",
"Lelucon 205:\n\nDokter: Kamu harus berhenti merokok.\nPasien: Dokter, saya bersumpah, saya tidak merokok.\nDokter: Lalu kenapa jarimu kuning?\nPasien: Dokter, saya bekerja di toko roti!",
"Lelucon 206:\n\nAyah: Nak, apakah kamu sudah merapikan tempat tidurmu?\nAnak: Yah, sudah.\nAyah: Lalu kenapa bantalannya ada di lantai?\nAnak: Yah, aku mencucinya!",
"Lelucon 207:\n\nGuru: Siapa presiden pertama Amerika Serikat?\nMurid: Pak, George Washington.\nGuru: Benar. Dan apa yang dia lakukan?\nMurid: Pak, dia menebang pohon!",
"Lelucon 208:\n\nIstri: Sayang, apakah kamu sudah mencuci piring?\nSuami: Sudah, tapi aku hanya mencuci piringku.\nIstri: Dan apa yang terjadi dengan piringku?\nSuami: Aku menyimpannya untukmu, untuk membuatmu senang!",
"Lelucon 209:\n\nDokter: Kamu harus makan lebih banyak buah.\nPasien: Dokter, saya makan apel setiap hari.\nDokter: Dan apa lagi?\nPasien: Dokter, kue apel!",
"Lelucon 210:\n\nGuru: Kenapa langit berwarna biru?\nMurid: Pak, karena laut memantul di langit!\nGuru: Tapi kenapa langit hitam di malam hari?\nMurid: Pak, karena lautnya tidur!",
"Lelucon 211:\n\nSeorang pria datang ke dokter gigi: Dokter, gigi saya sangat sakit!\nDokter gigi: Tidak masalah, saya cabut saja.\nPria: Tapi saya takut sakit!\nDokter gigi: Jangan khawatir, saya melakukannya tanpa bius, maka Anda tidak akan merasakan sakit lagi karena Anda akan pingsan!",
"Lelucon 212:\n\nIstri: Sayang, apakah kamu menikahiku hanya karena penampilanku?\nSuami: Bukan, sayang, aku menikahimu karena humormu.\nIstri: Tapi aku tidak melawak!\nSuami: Itu dia, itulah leluconnya!",
"Lelucon 213:\n\nGuru: Apa ibu kota Jerman?\nMurid: Pak, Berlin.\nGuru: Benar. Dan apa ibu kota Bavaria?\nMurid: Pak, München.\nGuru: Bagus sekali. Dan apa ibu kota dirimu?\nMurid: Pak, kepalaku!",
"Lelucon 214:\n\nDokter: Kamu harus berhenti menonton TV terlalu banyak.\nPasien: Dokter, saya tidak menonton TV.\nDokter: Lalu kenapa matamu merah?\nPasien: Dokter, saya hanya menonton YouTube di handphone!",
"Lelucon 215:\n\nAyah: Nak, kamu ingin jadi apa nanti?\nAnak: Yah, aku ingin jadi jutawan.\nAyah: Dan bagaimana kamu melakukannya?\nAnak: Yah, aku cukup menabung uang jajanku selama 1000 tahun!",
"Lelucon 216:\n\nIstri: Sayang, apakah kamu sudah menyiram bunga?\nSuami: Sudah, tapi aku menyiramnya dengan cola.\nIstri: Kenapa begitu?\nSuami: Karena mereka akan tumbuh lebih cepat, karena gula!",
"Lelucon 217:\n\nGuru: Sebutkan tiga hewan yang hidup di gurun.\nMurid: Pak, unta, ular, dan... lumba-lumba!\nGuru: Lumba-lumba tidak hidup di gurun!\nMurid: Pak, maksud saya yang tersesat!",
"Lelucon 218:\n\nPria: Sayang, hari ini aku membeli kupon lotre.\nIstri: Dan? Apakah kamu menang?\nPria: Tidak, tapi sekarang aku punya kertas yang memberiku harapan!",
"Lelucon 219:\n\nDokter: Kamu harus lebih banyak tidur.\nPasien: Dokter, saya tidur di tempat kerja.\nDokter: Dan kenapa kamu masih lelah?\nPasien: Dokter, karena bosku menangkapku!",
"Lelucon 220:\n\nGuru: Apa yang terjadi jika air dipanaskan sampai 100 derajat?\nMurid: Pak, maka airnya mendidih!\nGuru: Dan jika didinginkan sampai 0 derajat?\nMurid: Pak, maka airnya membeku!\nGuru: Dan apa yang terjadi pada 50 derajat?\nMurid: Pak, maka airnya bingung!",
"Lelucon 221:\n\nIstri: Sayang, apakah kamu sudah membuang sampah?\nSuami: Sudah, tapi aku melemparkannya ke taman.\nIstri: Kenapa?\nSuami: Karena aku pikir itu akan tumbuh dan kita punya lebih banyak sampah!",
"Lelucon 222:\n\nGuru: Jelaskan perbedaan antara sungai dan danau.\nMurid: Pak, sungai mengalir dan danau diam.\nGuru: Dan apa itu laut?\nMurid: Pak, danau yang sangat besar yang tidak bergerak!",
"Lelucon 223:\n\nSeorang pria menelepon pemadam kebakaran: Tolong, rumah saya terbakar!\nPemadam: Di mana yang terbakar?\nPria: Di dapur!\nPemadam: Dan bagaimana kami masuk?\nPria: Lewat pintu depan, tapi cepatlah, pintunya terbuka!",
"Lelucon 224:\n\nAyah: Nak, apakah kamu sudah mengerjakan PR?\nAnak: Yah, aku meninggalkannya di bus.\nAyah: Dan kenapa kamu meninggalkannya?\nAnak: Yah, karena aku tidur di bus!",
"Lelucon 225:\n\nDokter: Kamu harus berhenti makan makanan manis.\nPasien: Dokter, saya hanya makan sepotong cokelat sehari.\nDokter: Dan kenapa gigimu begitu buruk?\nPasien: Dokter, aku memakan sebatang cokelat sekaligus!",
"Lelucon 226:\n\nGuru: Kenapa air laut asin?\nMurid: Pak, karena ikan-ikan menangis di dalamnya!\nGuru: Dan kenapa ikan menangis?\nMurid: Pak, karena mereka tidak bisa ke darat!",
"Lelucon 227:\n\nIstri: Sayang, apakah kamu sudah mengundang ibuku untuk makan?\nSuami: Ya, sayangnya.\nIstri: Dan apa yang kamu masak?\nSuami: Mie dengan saus tomat, supaya dia tidak datang lagi!",
"Lelucon 228:\n\nGuru: Apa itu bintang?\nMurid: Pak, bola api besar di angkasa.\nGuru: Dan kenapa kita melihatnya di malam hari?\nMurid: Pak, karena dia tidur di siang hari!",
"Lelucon 229:\n\nSeorang pria pergi ke toko roti: Apakah Anda punya roti?\nTukang roti: Ya, tentu saja.\nPria: Dan apa lagi yang Anda punya?\nTukang roti: Roti bulat, kue, biskuit.\nPria: Kalau begitu beri saya segelas air, saya haus!",
"Lelucon 230:\n\nAyah: Nak, kenapa kamu tidak merapikan kamarmu?\nAnak: Yah, aku tidak punya waktu.\nAyah: Apa yang kamu lakukan?\nAnak: Yah, aku menonton TV!",
"Lelucon 231:\n\nDokter: Kamu harus minum lebih banyak air.\nPasien: Dokter, saya minum 2 liter air setiap hari.\nDokter: Dan kenapa kamu dehidrasi?\nPasien: Dokter, saya meminumnya di kolam renang!",
"Lelucon 232:\n\nGuru: Apa itu pelangi?\nMurid: Pak, itu langit yang sedang berdandan!\nGuru: Dan kenapa hanya terlihat setelah hujan?\nMurid: Pak, karena sebelumnya dia tidak punya waktu!",
"Lelucon 233:\n\nIstri: Sayang, apakah kamu sudah mencuci pakaian?\nSuami: Sudah, tapi aku memasukkannya ke pengering.\nIstri: Dan kenapa masih basah?\nSuami: Karena aku tidak menyalakan pengeringnya!",
"Lelucon 234:\n\nGuru: Apa yang istimewa dari penguin?\nMurid: Pak, dia tidak bisa terbang.\nGuru: Dan apa lagi?\nMurid: Pak, dia selalu memakai jas!",
"Lelucon 235:\n\nSeorang pria pergi ke tukang cukur: Tolong potong rambut saya.\nTukang cukur: Tapi Anda tidak punya rambut!\nPria: Saya tahu, saya hanya ingin berbicara dengan seseorang lagi!",
"Lelucon 236:\n\nAyah: Nak, apakah kamu sudah membersihkan sepatumu?\nAnak: Yah, sudah.\nAyah: Lalu kenapa masih kotor?\nAnak: Yah, aku membersihkannya dengan air, tapi airnya kotor!",
"Lelucon 237:\n\nDokter: Kamu harus berhenti merokok.\nPasien: Dokter, saya hanya merokok satu batang sehari.\nDokter: Dan kenapa kamu punya masalah paru-paru?\nPasien: Dokter, saya merokok rokok yang sangat besar!",
"Lelucon 238:\n\nGuru: Apa itu gunung?\nMurid: Pak, bukit yang besar.\nGuru: Dan apa itu bukit?\nMurid: Pak, gunung yang kecil!",

"Lelucon 240:\n\nGuru: Apa itu samudra?\nMurid: Pak, laut yang besar.\nGuru: Dan apa itu laut?\nMurid: Pak, danau yang besar!",
"Lelucon 241:\n\nSeorang pria pergi ke optik: Saya tidak bisa melihat dengan baik lagi.\nOptik: Seberapa jauh Anda bisa melihat?\nPria: Sampai ke pintu.\nOptik: Dan apa yang ada di belakangnya?\nPria: Saya tidak tahu, saya tidak bisa melihat sejauh itu!",
"Lelucon 242:\n\nAyah: Nak, apakah kamu sudah membaca koran?\nAnak: Yah, sudah.\nAyah: Dan apa isinya?\nAnak: Yah, aku tidak tahu, aku hanya melihat gambarnya!",
"Lelucon 243:\n\nDokter: Kamu harus makan lebih banyak sayur.\nPasien: Dokter, saya makan brokoli setiap hari.\nDokter: Dan apa lagi?\nPasien: Dokter, kentang tumbuk dengan brokoli!",

"Lelucon 247:\n\nSeorang pria pergi ke dokter: Saya punya masalah, saya mendengar suara-suara.\nDokter: Apa kata suara-suara itu?\nPria: Mereka bilang saya harus pergi ke dokter!\nDokter: Dan kenapa kamu di sini?\nPria: Karena saya tidak mendengarkan suara-suara!",

"Lelucon 251:\n\nIstri: Sayang, apakah kamu sudah membuang sampah?\nSuami: Sudah, tapi aku membuangnya ke taman tetangga.\nIstri: Kenapa?\nSuami: Karena tempat sampah kita penuh!",

"Lelucon 254:\n\nAyah: Nak, kenapa kamu tidak merapikan kamarmu?\nAnak: Yah, aku sudah merapikannya, tapi barang-barangnya jatuh lagi!\nAyah: Bagaimana bisa?\nAnak: Yah, aku meletakkannya di lemari dan lemarinya jatuh!",

"Lelucon 601:\n\nSeorang pria masuk ke restoran dan berkata: Saya mau makan malam.\nPelayan: Apa yang ingin Anda pesan?\nPria: Apa saja, yang penting murah.\nPelayan: Kalau begitu, silakan ambil air putih gratis di sudut sana!",
"Lelucon 602:\n\nGuru: Jika kamu punya 10 permen dan kamu memberikan 2 kepada temanmu, apa yang kamu dapatkan?\nMurid: Pak, saya mendapat teman yang giginya sakit!",
"Lelucon 603:\n\nIstri: Sayang, apakah kamu mencintaiku karena aku cantik?\nSuami: Tidak, aku mencintaimu karena aku tidak bisa melihat dengan baik tanpa kacamata.\nIstri: Apa maksudmu?\nSuami: Maksudku, cintaku padamu buta!",
"Lelucon 604:\n\nDokter: Kamu harus berhenti makan mie instan.\nPasien: Dokter, saya tidak makan mie instan.\nDokter: Lalu kenapa perutmu buncit?\nPasien: Dokter, saya makan nasi 5 piring setiap kali makan!",
"Lelucon 605:\n\nAyah: Nak, kenapa nilai matematikamu jelek?\nAnak: Yah, karena gurunya tidak suka angka 0.\nAyah: Memangnya kenapa?\nAnak: Yah, setiap kali aku jawab 0, dia bilang salah!",
"Lelucon 606:\n\nSeorang pria pergi ke toko hewan: Saya mau beli kucing yang tidak suka mengeong.\nPenjual: Kalau begitu beli ikan mas saja, Pak!",
"Lelucon 607:\n\nGuru: Apa itu gempa bumi?\nMurid: Pak, itu saat bumi sedang bersin!\nGuru: Kenapa bisa begitu?\nMurid: Pak, karena bumi menghirup terlalu banyak debu!",
"Lelucon 608:\n\nIstri: Sayang, ibu bilang dia mau datang minggu ini.\nSuami: Oh, tidak! Aku harus mencari pekerjaan luar kota minggu ini.\nIstri: Kenapa?\nSuami: Supaya aku tidak perlu bertemu dengannya!",
"Lelucon 609:\n\nDokter: Pasien, kamu harus banyak minum air putih.\nPasien: Sudah, Dokter. Saya minum 8 gelas sehari.\nDokter: Bagus. Tapi kenapa bibirmu kering?\nPasien: Karena saya minum airnya sekaligus di pagi hari, Dokter!",
"Lelucon 610:\n\nGuru: Siapa yang bisa sebutkan hewan yang bisa terbang?\nMurid: Burung, Pak!\nGuru: Selain burung?\nMurid: Nyamuk, lalat, kupu-kupu, dan... ibu saya kalau melihat cicak!",
"Lelucon 611:\n\nPria: Pelayan, mengapa sup ini rasanya aneh?\nPelayan: Maaf, Pak. Apa ada masalah?\nPria: Ini rasanya seperti air cucian piring!\nPelayan: Oh, maaf, Pak. Seharusnya supnya tidak saya cuci!",
"Lelucon 612:\n\nIstri: Sayang, kalau aku jadi bunga, kamu jadi apa?\nSuami: Aku jadi pot.\nIstri: Kenapa pot?\nSuami: Supaya aku bisa memuatmu di rumah!",
"Lelucon 613:\n\nAyah: Nak, kamu sudah belajar untuk ujian besok?\nAnak: Sudah, Yah.\nAyah: Coba ayah tes, apa ibu kota Indonesia?\nAnak: Jakarta, Yah.\nAyah: Kalau ibu kota Malaysia?\nAnak: Kuala Lumpur, Yah.\nAyah: Kalau ibu kota hatimu?\nAnak: Ya... ibu, Yah!",
"Lelucon 614:\n\nGuru: Mengapa kamu selalu datang terlambat ke sekolah?\nMurid: Karena saya harus menunggu bus, Pak.\nGuru: Kenapa tidak bangun lebih pagi?\nMurid: Karena busnya datang lebih siang, Pak!",
"Lelucon 615:\n\nDokter: Kamu harus mengurangi kopi.\nPasien: Tapi Dokter, saya butuh kopi untuk tetap terjaga.\nDokter: Kenapa kamu harus tetap terjaga?\nPasien: Supaya saya bisa minum kopi, Dokter!",
"Lelucon 616:\n\nIstri: Sayang, lihat baju baru saya. Bagaimana menurutmu?\nSuami: Bagus, Sayang.\nIstri: Kamu tidak melihatnya dengan serius!\nSuami: Aku sudah melihatnya dengan serius, dan tetap bilang bagus!",
"Lelucon 617:\n\nSeorang pria menelepon kantor polisi: Tolong, ada pencuri di rumah saya!\nPolisi: Tenang, Pak. Apakah pencurinya masih di sana?\nPria: Tidak, dia sudah kabur.\nPolisi: Lalu apa yang bisa kami bantu?\nPria: Tolong bantu saya mencari alasan untuk istri saya, kenapa TV-nya hilang!",
"Lelucon 618:\n\nGuru: Apa itu matahari terbit?\nMurid: Pak, itu saat matahari bangun tidur.\nGuru: Kalau matahari terbenam?\nMurid: Ya, saat matahari tidur lagi, Pak!",
"Lelucon 619:\n\nAyah: Nak, apakah kamu sudah menyiram tanaman?\nAnak: Sudah, Yah.\nAyah: Kenapa tanamannya malah mati?\nAnak: Karena aku menyiramnya dengan air panas, Yah!",
"Lelucon 620:\n\nIstri: Sayang, tolong belikan obat sakit kepala.\nSuami: Kamu sakit kepala, Sayang?\nIstri: Tidak, tapi kamu akan sakit kepala kalau tidak membelinya!",
"Lelucon 621:\n\nDokter: Pasien, kamu perlu banyak istirahat.\nPasien: Saya sudah istirahat, Dokter.\nDokter: Berapa lama?\nPasien: 3 bulan, Dokter.\nDokter: Lalu kenapa kamu masih lelah?\nPasien: Karena istirahatnya membuat saya lelah, Dokter!",
"Lelucon 622:\n\nGuru: Mengapa air laut rasanya asin?\nMurid: Karena banyak ikan yang menangis di dalamnya, Pak.\nGuru: Kenapa ikan menangis?\nMurid: Karena mereka tidak bisa naik ke darat!",
"Lelucon 623:\n\nSeorang pria pergi ke toko kacamata: Saya mau beli kacamata.\nPenjual: Mau yang model apa, Pak?\nPria: Yang bisa membuat saya terlihat pintar.\nPenjual: Kalau begitu, beli buku saja, Pak!",
"Lelucon 624:\n\nIstri: Sayang, kamu lebih sayang aku atau ibumu?\nSuami: Tentu saja sayang kalian berdua, Sayang.\nIstri: Tidak boleh, harus pilih satu!\nSuami: Kalau begitu, aku pilih... tidur!",
"Lelucon 625:\n\nAyah: Nak, bantu ayah bersihkan halaman.\nAnak: Nanti, Yah, aku sedang sibuk.\nAyah: Sibuk apa?\nAnak: Sibuk menghindari pekerjaan, Yah!",
"Lelucon 626:\n\nGuru: Hewan apa yang paling rajin?\nMurid: Semut, Pak!\nGuru: Kenapa?\nMurid: Karena mereka tidak pernah tidur, selalu bekerja!",
"Lelucon 627:\n\nDokter: Pasien, kamu harus berhenti merokok.\nPasien: Sudah, Dokter. Saya sudah berhenti sejak kemarin.\nDokter: Bagus! Tapi kenapa kamu masih bau rokok?\nPasien: Karena saya hanya berhenti merokok, tidak berhenti menghirup asapnya, Dokter!",
"Lelucon 628:\n\nIstri: Sayang, aku ingin pergi liburan ke Bali.\nSuami: Kita tidak punya uang, Sayang.\nIstri: Ya sudah, kita ke rumah ibuku saja.\nSuami: Itu bukan liburan, itu ujian kesabaran!",
"Lelucon 629:\n\nSeorang pria bertanya kepada temannya: Kenapa kamu selalu membawa payung saat cuaca cerah?\nTeman: Karena saya tidak suka basah kuyup saat hujan, dan tidak suka kepanasan saat terik.\nPria: Tapi cuaca sekarang cerah?\nTeman: Iya, tapi saya tetap tidak suka kepanasan!",
"Lelucon 630:\n\nGuru: Apa itu pelangi?\nMurid: Pak, itu jembatan berwarna-warni yang dibuat bidadari.\nGuru: Kalau begitu, kenapa hanya muncul setelah hujan?\nMurid: Karena bidadari baru selesai mengecatnya, Pak!",
"Lelucon 631:\n\nAyah: Nak, kenapa kamu tidak mengerjakan PR?\nAnak: Karena aku tidak punya pensil, Yah.\nAyah: Kenapa tidak bilang sama ayah?\nAnak: Karena ayah juga tidak punya pensil!",
"Lelucon 632:\n\nIstri: Sayang, kamu ingat tidak, hari ini kita ulang tahun pernikahan?\nSuami: Tentu saja ingat, Sayang.\nIstri: Lalu mana hadiahnya?\nSuami: Hadiahnya adalah aku masih ingat!",
"Lelucon 633:\n\nDokter: Pasien, kamu harus makan banyak sayur.\nPasien: Saya sudah makan sayur, Dokter.\nDokter: Sayur apa?\nPasien: Sayur mie instan, Dokter!",
"Lelucon 634:\n\nGuru: Mengapa bumi berputar?\nMurid: Karena bumi sedang berolahraga, Pak.\nGuru: Kenapa harus berolahraga?\nMurid: Supaya bumi tidak gemuk!",
"Lelucon 635:\n\nSeorang pria pergi ke dokter gigi: Dokter, gigi saya ngilu.\nDokter gigi: Kamu sering makan es krim, ya?\nPria: Iya, Dokter. Kok tahu?\nDokter gigi: Karena gigimu kedinginan!",
"Lelucon 636:\n\nIstri: Sayang, bagaimana kalau kita beli mobil baru?\nSuami: Kita tidak punya uang.\nIstri: Ya sudah, beli motor baru saja.\nSuami: Uangnya juga tidak ada.\nIstri: Ya sudah, beli sepeda baru saja.\nSuami: Sayang, kita bahkan tidak punya uang untuk beli ban sepeda!",
"Lelucon 637:\n\nAyah: Nak, bantu ayah cuci mobil.\nAnak: Nanti, Yah, aku sedang menonton TV.\nAyah: Kalau begitu, ayah matikan TV-nya!\nAnak: Jangan, Yah! Aku akan bantu cuci mobil, asalkan TV tetap menyala!",
"Lelucon 638:\n\nGuru: Apa itu air?\nMurid: Pak, air adalah benda cair yang tidak berwarna, tidak berbau, dan tidak berasa.\nGuru: Bagus! Kalau es?\nMurid: Es adalah air yang sedang membeku karena kedinginan, Pak!",
"Lelucon 639:\n\nDokter: Pasien, kamu harus mengurangi gula.\nPasien: Saya sudah mengurangi, Dokter.\nDokter: Berapa sendok sekarang?\nPasien: Dari 5 sendok jadi 3 sendok, Dokter!",
"Lelucon 640:\n\nIstri: Sayang, kamu sayang aku tidak?\nSuami: Sayang, Sayang.\nIstri: Buktikan!\nSuami: Aku sudah membuktikan dengan menikahimu, bukan?",
"Lelucon 641:\n\nSeorang pria bertanya kepada temannya: Kenapa kamu selalu tersenyum saat berjalan?\nTeman: Karena saya sedang mengingat lelucon lucu.\nPria: Kenapa tidak diceritakan saja?\nTeman: Nanti saya lupa, dan malah sedih!",
"Lelucon 642:\n\nGuru: Apa itu gunung?\nMurid: Pak, gunung adalah tumpukan tanah yang sangat tinggi.\nGuru: Kalau bukit?\nMurid: Bukit adalah gunung yang belum besar, Pak!",
"Lelucon 643:\n\nAyah: Nak, apakah kamu sudah makan?\nAnak: Sudah, Yah.\nAyah: Kenapa masih lapar?\nAnak: Karena aku hanya makan camilan, Yah!",
"Lelucon 644:\n\nIstri: Sayang, aku ingin beli baju baru.\nSuami: Baju di lemari masih banyak, Sayang.\nIstri: Tapi itu sudah tidak mode lagi.\nSuami: Kalau begitu, aku juga mau beli baju baru!",
"Lelucon 645:\n\nDokter: Pasien, kamu harus berolahraga setiap pagi.\nPasien: Saya sudah berolahraga, Dokter.\nDokter: Olahraga apa?\nPasien: Lari dari bangun tidur, Dokter!",
"Lelucon 646:\n\nGuru: Mengapa air sungai mengalir ke laut?\nMurid: Karena sungai ingin berlibur ke laut, Pak.\nGuru: Kalau air laut?\nMurid: Air laut tidak bisa ke sungai, karena sudah betah di laut!",
"Lelucon 647:\n\nSeorang pria pergi ke restoran: Pelayan, saya pesan ayam goreng.\nPelayan: Maaf, Pak, ayamnya sudah habis.\nPria: Kalau begitu, saya pesan ikan goreng.\nPelayan: Ikan juga habis, Pak.\nPria: Lalu apa yang tersisa?\nPelayan: Piringnya, Pak!",
"Lelucon 648:\n\nIstri: Sayang, kamu lebih cinta aku atau pekerjaanmu?\nSuami: Tentu saja kamu, Sayang.\nIstri: Buktinya?\nSuami: Aku sudah menikahimu, bukan menikahi pekerjaan!",
"Lelucon 649:\n\nAyah: Nak, kamu mau jadi apa kalau besar nanti?\nAnak: Aku mau jadi orang kaya, Yah.\nAyah: Caranya?\nAnak: Aku akan menabung uang jajan sampai 100 tahun!",
"Lelucon 650:\n\nGuru: Apa itu matahari?\nMurid: Pak, matahari adalah bola api raksasa di langit.\nGuru: Kenapa matahari bersinar?\nMurid: Karena matahari tidak pernah mati lampu, Pak!",
"Lelucon 651:\n\nDokter: Pasien, kamu harus berhenti begadang.\nPasien: Saya tidak begadang, Dokter.\nDokter: Lalu kenapa matamu merah?\nPasien: Saya menonton film sampai jam 3 pagi, Dokter!",
"Lelucon 652:\n\nIstri: Sayang, kalau aku mati, kamu akan menikah lagi?\nSuami: Tidak, Sayang, aku akan setia padamu.\nIstri: Tapi kalau aku tetap hidup?\nSuami: Ya, sama saja, aku tetap setia!",
"Lelucon 653:\n\nSeorang pria bertanya kepada temannya: Kenapa kamu selalu memakai topi?\nTeman: Karena saya tidak mau kepalaku kepanasan.\nPria: Tapi sekarang malam?\nTeman: Iya, tapi saya tidak mau kepalaku kedinginan!",
"Lelucon 654:\n\nGuru: Apa itu bintang?\nMurid: Pak, bintang adalah lampu di langit.\nGuru: Kenapa bintang hanya muncul di malam hari?\nMurid: Karena bintang takut matahari, Pak!",
"Lelucon 655:\n\nAyah: Nak, apakah kamu sudah membersihkan sepatu?\nAnak: Sudah, Yah.\nAyah: Kenapa masih kotor?\nAnak: Karena aku membersihkannya dengan lumpur, Yah!",
"Lelucon 656:\n\nIstri: Sayang, aku ingin pergi ke salon.\nSuami: Untuk apa?\nIstri: Untuk mempercantik diri.\nSuami: Kamu sudah cantik, tidak perlu ke salon.\nIstri: Tapi aku ingin lebih cantik!\nSuami: Kalau begitu, aku ikut ke salon!",
"Lelucon 657:\n\nDokter: Pasien, kamu harus mengurangi makanan pedas.\nPasien: Saya sudah mengurangi, Dokter.\nDokter: Berapa kali seminggu?\nPasien: Dari 7 kali jadi 6 kali, Dokter!",
"Lelucon 658:\n\nGuru: Mengapa hewan punya ekor?\nMurid: Untuk mengusir lalat, Pak.\nGuru: Kalau gajah?\nMurid: Gajah juga punya ekor, Pak!\nGuru: Kalau manusia?\nMurid: Manusia tidak punya ekor, tapi punya masalah!",
"Lelucon 659:\n\nSeorang pria pergi ke apotek: Saya mau beli obat tidur.\nApoteker: Ini, Pak.\nPria: Berapa harganya?\nApoteker: 50 ribu, Pak.\nPria: Mahal sekali. Ada yang lebih murah?\nApoteker: Ada, Pak. Buku pelajaran matematika!",
"Lelucon 660:\n\nIstri: Sayang, kamu masih cinta sama aku?\nSuami: Tentu saja, Sayang.\nIstri: Seberapa besar?\nSuami: Sebesar utang kita, Sayang!",
"Lelucon 661:\n\nAyah: Nak, kenapa kamu tidak mau makan sayur?\nAnak: Karena sayur itu pahit, Yah.\nAyah: Tapi sayur itu sehat!\nAnak: Kalau begitu, ayah saja yang makan!",
"Lelucon 662:\n\nGuru: Apa itu laut?\nMurid: Pak, laut adalah kumpulan air yang sangat luas.\nGuru: Kenapa air laut asin?\nMurid: Karena banyak ikan yang berkeringat di dalamnya, Pak!",
"Lelucon 663:\n\nDokter: Pasien, kamu harus lebih banyak bergerak.\nPasien: Saya sudah bergerak, Dokter.\nDokter: Bergerak apa?\nPasien: Bergerak dari kasur ke sofa, Dokter!",
"Lelucon 664:\n\nIstri: Sayang, aku ingin punya gaun baru.\nSuami: Kita tidak punya uang, Sayang.\nIstri: Ya sudah, aku ingin punya tas baru.\nSuami: Uangnya juga tidak ada.\nIstri: Ya sudah, aku ingin punya suami baru!\nSuami: Tunggu, aku cari uang dulu!",
"Lelucon 665:\n\nSeorang pria bertanya kepada temannya: Kenapa kamu selalu membawa buku kemana-mana?\nTeman: Karena saya ingin terlihat pintar.\nPria: Tapi kamu tidak pernah membacanya?\nTeman: Itu karena saya juga ingin terlihat sibuk!",
"Lelucon 666:\n\nGuru: Apa itu awan?\nMurid: Pak, awan adalah kapas yang ada di langit.\nGuru: Kenapa awan berwarna putih?\nMurid: Karena awan belum mandi, Pak!",
"Lelucon 667:\n\nAyah: Nak, apakah kamu sudah mengerjakan tugas sekolah?\nAnak: Sudah, Yah.\nAyah: Kenapa tidak ada di buku?\nAnak: Karena aku mengerjakannya di kepalaku, Yah!",
"Lelucon 668:\n\nIstri: Sayang, kamu ingat tidak pertama kali kita bertemu?\nSuami: Tentu saja, Sayang.\nIstri: Di mana?\nSuami: Di rumah sakit, saat kamu sakit perut karena makan terlalu banyak!",
"Lelucon 669:\n\nDokter: Pasien, kamu harus banyak makan buah.\nPasien: Saya sudah makan buah, Dokter.\nDokter: Buah apa?\nPasien: Buah apel, Dokter. Tapi apelnya apel malang!",
"Lelucon 670:\n\nGuru: Mengapa pohon kelapa tinggi?\nMurid: Supaya bisa melihat laut, Pak.\nGuru: Kenapa pohon kelapa tidak pernah jatuh?\nMurid: Karena pohon kelapa tidak punya kaki, Pak!",
"Lelucon 671:\n\nSeorang pria pergi ke toko roti: Saya mau beli roti tawar.\nPenjual: Maaf, Pak, roti tawarnya habis.\nPria: Kalau roti manis?\nPenjual: Habis juga, Pak.\nPria: Kalau roti sobek?\nPenjual: Habis juga, Pak.\nPria: Lalu apa yang tersisa?\nPenjual: Rotiannya, Pak!",
"Lelucon 672:\n\nIstri: Sayang, apakah kamu mencintaiku?\nSuami: Tentu saja, Sayang.\nIstri: Seberapa besar?\nSuami: Sebesar keinginanku untuk tidur siang, Sayang!",
"Lelucon 673:\n\nAyah: Nak, bantu ayah bersihkan gudang.\nAnak: Nanti, Yah, aku sedang belajar.\nAyah: Belajar apa?\nAnak: Belajar menghindari pekerjaan, Yah!",
"Lelucon 674:\n\nGuru: Apa itu salju?\nMurid: Pak, salju adalah es yang jatuh dari langit.\nGuru: Kenapa salju berwarna putih?\nMurid: Karena salju belum mandi, Pak!",
"Lelucon 675:\n\nDokter: Pasien, kamu harus mengurangi minuman bersoda.\nPasien: Saya sudah mengurangi, Dokter.\nDokter: Berapa gelas sekarang?\nPasien: Dari 10 gelas jadi 9 gelas, Dokter!",
"Lelucon 676:\n\nIstri: Sayang, aku ingin pergi ke pantai.\nSuami: Kita tidak punya uang, Sayang.\nIstri: Ya sudah, kita ke kolam renang saja.\nSuami: Kolam renang juga butuh uang, Sayang.\nIstri: Ya sudah, kita ke kamar mandi saja!\nSuami: Itu ide bagus, Sayang!",
"Lelucon 677:\n\nSeorang pria bertanya kepada temannya: Kenapa kamu selalu memakai kacamata hitam di malam hari?\nTeman: Karena saya tidak mau melihat dunia ini terlalu terang.\nPria: Tapi malam ini gelap?\nTeman: Justru karena gelap, saya butuh kacamata hitam!",
"Lelucon 678:\n\nGuru: Apa itu bulan?\nMurid: Pak, bulan adalah satelit bumi.\nGuru: Kenapa bulan bersinar di malam hari?\nMurid: Karena bulan tidak mau kalah dengan matahari, Pak!",
"Lelucon 679:\n\nAyah: Nak, apakah kamu sudah memakai sepatu?\nAnak: Sudah, Yah.\nAyah: Kenapa masih bertelanjang kaki?\nAnak: Karena aku memakai sepatu kakak, Yah!",
"Lelucon 680:\n\nIstri: Sayang, kamu sayang sama aku tidak?\nSuami: Sayang, Sayang.\nIstri: Buktikan dengan belikan aku perhiasan!\nSuami: Aku sayang kamu, tapi bukan berarti aku harus beli perhiasan, Sayang!",
"Lelucon 681:\n\nDokter: Pasien, kamu harus berhenti makan gorengan.\nPasien: Saya sudah berhenti, Dokter.\nDokter: Sejak kapan?\nPasien: Sejak 5 menit yang lalu, Dokter!",
"Lelucon 682:\n\nGuru: Mengapa air laut rasanya asin?\nMurid: Karena banyak ikan yang berenang sambil menangis, Pak.\nGuru: Kenapa ikan menangis?\nMurid: Karena mereka tidak bisa pulang ke rumah!",
"Lelucon 683:\n\nSeorang pria pergi ke toko buku: Saya mau beli buku yang bisa membuat saya pintar dalam semalam.\nPenjual: Maaf, Pak, buku seperti itu tidak ada.\nPria: Kalau buku yang bisa membuat saya kaya dalam semalam?\nPenjual: Itu juga tidak ada, Pak. Tapi kalau buku mimpi, ada!",
"Lelucon 684:\n\nIstri: Sayang, apakah kamu masih cinta sama aku?\nSuami: Tentu saja, Sayang.\nIstri: Seberapa besar?\nSuami: Sebesar rasa malasku untuk bangun pagi, Sayang!",
"Lelucon 685:\n\nAyah: Nak, kenapa kamu tidak membantu ibu di dapur?\nAnak: Aku sedang sibuk, Yah.\nAyah: Sibuk apa?\nAnak: Sibuk menonton TV, Yah!",
"Lelucon 686:\n\nGuru: Apa itu pelangi?\nMurid: Pak, pelangi adalah lengkungan berwarna-warni di langit.\nGuru: Kenapa pelangi muncul setelah hujan?\nMurid: Karena pelangi baru selesai mandi, Pak!",
"Lelucon 687:\n\nDokter: Pasien, kamu harus tidur lebih awal.\nPasien: Saya sudah tidur lebih awal, Dokter.\nDokter: Jam berapa?\nPasien: Jam 4 pagi, Dokter!",
"Lelucon 688:\n\nIstri: Sayang, aku ingin punya mobil mewah.\nSuami: Kita tidak punya uang, Sayang.\nIstri: Ya sudah, aku ingin punya rumah mewah.\nSuami: Uangnya juga tidak ada, Sayang.\nIstri: Ya sudah, aku ingin punya suami murah hati!\nSuami: Itu juga tidak ada, Sayang!",
"Lelucon 689:\n\nSeorang pria bertanya kepada temannya: Kenapa kamu selalu memakai sepatu bot saat hujan?\nTeman: Supaya kakiku tidak basah.\nPria: Tapi sekarang tidak hujan?\nTeman: Iya, tapi aku tidak mau kakiku basah kalau tiba-tiba hujan!",
"Lelucon 690:\n\nGuru: Apa itu matahari?\nMurid: Pak, matahari adalah bintang yang sangat besar.\nGuru: Kenapa matahari sangat panas?\nMurid: Karena matahari tidak pernah minum, Pak!",
"Lelucon 691:\n\nAyah: Nak, apakah kamu sudah menyiram bunga?\nAnak: Sudah, Yah.\nAyah: Kenapa bunganya layu?\nAnak: Karena aku menyiramnya dengan air panas, Yah!",
"Lelucon 692:\n\nIstri: Sayang, kamu lebih cinta aku atau ibumu?\nSuami: Tentu saja kalian berdua, Sayang.\nIstri: Tidak boleh, harus pilih satu!\nSuami: Kalau begitu, aku pilih... tidur!",
"Lelucon 693:\n\nDokter: Pasien, kamu harus berolahraga setiap hari.\nPasien: Saya sudah berolahraga, Dokter.\nDokter: Olahraga apa?\nPasien: Lari dari kenyataan, Dokter!",
"Lelucon 694:\n\nGuru: Mengapa air sungai mengalir ke laut?\nMurid: Karena sungai ingin berlibur ke laut, Pak.\nGuru: Kalau air laut?\nMurid: Air laut tidak bisa ke sungai, karena sudah betah di laut!",
"Lelucon 695:\n\nSeorang pria pergi ke restoran: Pelayan, saya pesan nasi goreng.\nPelayan: Maaf, Pak, nasinya habis.\nPria: Kalau begitu, saya pesan mie goreng.\nPelayan: Mienya juga habis, Pak.\nPria: Lalu apa yang tersisa?\nPelayan: Piringnya, Pak!",
"Lelucon 696:\n\nIstri: Sayang, kamu ingat tidak, hari ini kita ulang tahun pernikahan?\nSuami: Tentu saja ingat, Sayang.\nIstri: Lalu mana hadiahnya?\nSuami: Hadiahnya adalah aku masih ingat!",
"Lelucon 697:\n\nAyah: Nak, kamu mau jadi apa kalau besar nanti?\nAnak: Aku mau jadi orang kaya, Yah.\nAyah: Caranya?\nAnak: Aku akan menabung uang jajan sampai 100 tahun!",
"Lelucon 698:\n\nGuru: Apa itu matahari?\nMurid: Pak, matahari adalah bola api raksasa di langit.\nGuru: Kenapa matahari bersinar?\nMurid: Karena matahari tidak pernah mati lampu, Pak!",
"Lelucon 699:\n\nDokter: Pasien, kamu harus berhenti begadang.\nPasien: Saya tidak begadang, Dokter.\nDokter: Lalu kenapa matamu merah?\nPasien: Saya menonton film sampai jam 3 pagi, Dokter!",
"Lelucon 700:\n\nIstri: Sayang, kalau aku mati, kamu akan menikah lagi?\nSuami: Tidak, Sayang, aku akan setia padamu.\nIstri: Tapi kalau aku tetap hidup?\nSuami: Ya, sama saja, aku tetap setia! 😄",
"Lelucon 701:\n\nSeorang pria pergi ke toko roti: Apakah Anda punya roti?\nTukang roti: Ya, berapa banyak yang Anda inginkan?\nPria: Satu kilo.\nTukang roti: Dan apa lagi?\nPria: Satu kilo mentega, tapi tanpa roti!",
"Lelucon 702:\n\nGuru: Apa itu planet?\nMurid: Pak, benda langit.\nGuru: Dan apa itu bintang?\nMurid: Pak, planet yang bersinar!",
"Lelucon 703:\n\nIstri: Sayang, apakah kamu sudah menjemur pakaian?\nSuami: Sudah, tapi aku meletakkannya di lantai.\nIstri: Kenapa?\nSuami: Karena talinya penuh!",
"Lelucon 704:\n\nAyah: Nak, berapa 2 kali 2?\nAnak: Yah, 4.\nAyah: Dan 4 kali 4?\nAnak: Yah, 16.\nAyah: Dan 16 kali 16?\nAnak: Yah, terlalu banyak untukku!",
"Lelucon 705:\n\nSeorang pria datang ke tukang cukur: Tolong potong rambut saya.\nTukang cukur: Bagaimana Anda ingin potongannya?\nPria: Pendek dan tanpa rasa sakit!\nTukang cukur: Kalau begitu botak saja!",
"Lelucon 706:\n\nGuru: Apa itu danau?\nMurid: Pak, kumpulan air.\nGuru: Dan apa itu sungai?\nMurid: Pak, danau yang bergerak!",
"Lelucon 707:\n\nIstri: Sayang, apakah kamu sudah membuang sampah?\nSuami: Sudah, tapi aku membuangnya ke sungai.\nIstri: Kenapa?\nSuami: Karena tempat sampahnya penuh!",
"Lelucon 708:\n\nSeorang pria pergi ke dokter: Dokter, saya sakit kepala.\nDokter: Minumlah tablet.\nPria: Tapi saya tidak punya!\nDokter: Kalau begitu beli!\nPria: Tapi saya tidak punya uang!\nDokter: Kalau begitu simpan saja sakit kepalamu!",
"Lelucon 709:\n\nGuru: Apa itu samudra?\nMurid: Pak, laut yang besar.\nGuru: Dan apa itu laut?\nMurid: Pak, danau yang besar!\nGuru: Dan apa itu danau?\nMurid: Pak, samudra kecil!",
"Lelucon 710:\n\nIstri: Sayang, apakah kamu sudah menjemput anak-anak dari sekolah?\nSuami: Sudah, tapi aku menaruh mereka di bus yang salah.\nIstri: Kenapa?\nSuami: Karena aku pikir itu bus yang benar!",
"Lelucon 711:\n\nAyah: Nak, apakah kamu sudah merapikan kamarmu?\nAnak: Yah, sudah.\nAyah: Lalu kenapa semuanya ada di lantai?\nAnak: Yah, aku sudah merapikannya, tapi kemudian jatuh lagi!",
"Lelucon 712:\n\nSeorang pria pergi ke dokter: Dokter, saya sakit punggung.\nDokter: Berapa lama Anda duduk sehari?\nPria: 12 jam.\nDokter: Dan berapa lama Anda berdiri?\nPria: 12 jam.\nDokter: Dan kapan Anda tidur?\nPria: Saya tidak tidur, saya bekerja!",
"Lelucon 713:\n\nGuru: Apa itu tornado?\nMurid: Pak, angin pusaran.\nGuru: Dan kenapa dia berputar?\nMurid: Pak, karena dia ingin naik korsel!",
"Lelucon 714:\n\nIstri: Sayang, apakah kamu sudah membersihkan jendela?\nSuami: Sudah, tapi aku membersihkannya dari dalam.\nIstri: Kenapa?\nSuami: Karena di luar sedang hujan!",
"Lelucon 715:\n\nSeorang pria pergi ke dokter gigi: Dokter, gigi saya sangat sakit!\nDokter gigi: Yang mana?\nPria: Yang sudah tidak ada!\nDokter gigi: Kalau begitu tidak bisa sakit lagi!\nPria: Tapi lubangnya sakit!",

"Lelucon 805:\n\nSeorang pria menelepon tukang ledeng: Tolong datang, pipa air di rumah saya bocor parah!\nTukang ledeng: Baik, Pak. Apakah airnya sudah dimatikan?\nPria: Belum, tapi saya sudah memakai payung di dalam rumah!",
"Lelucon 806:\n\nGuru: Apa itu inflasi?\nMurid: Itu saat uang jajan saya tetap, tapi harga jajanan di kantin naik terus, Pak!",
"Lelucon 807:\n\nIstri: Sayang, coba lihat mata saya, ada yang berbeda tidak?\nSuami: Tidak ada, Sayang. Masih sama seperti kemarin.\nIstri: Aku baru saja beli maskara baru! Kamu tidak peka!",
"Lelucon 808:\n\nAyah: Nak, bantu Ayah cuci mobil, nanti Ayah beri uang jajan tambahan.\nAnak: Maaf Yah, hari ini tarif saya sudah naik. Harus uang jajan tambahan ditambah es krim!",
"Lelucon 809:\n\nDokter: Pasien, kamu harus lebih banyak jalan kaki.\nPasien: Sudah, Dokter. Saya berjalan dari kasur ke dapur setiap kali saya lapar di malam hari!",
"Lelucon 810:\n\nGuru: Siapa pahlawan nasional yang kamu kagumi?\nMurid: Ayah saya, Pak!\nGuru: Kenapa?\nMurid: Karena dia bisa bertahan hidup meskipun dimarahi Ibu setiap hari!",
"Lelucon 811:\n\nTeman 1: Kenapa kamu beli payung baru padahal cuaca sedang cerah?\nTeman 2: Karena saat hujan, payung di toko pasti sudah habis dan harganya mahal!",
"Lelucon 812:\n\nIstri: Sayang, kalau aku jadi kucing, kamu jadi apa?\nSuami: Aku jadi ikan.\nIstri: Kenapa ikan?\nSuami: Supaya aku bisa berenang menjauh darimu!",
"Lelucon 813:\n\nDokter: Pasien, kamu harus berhenti merokok kalau tidak mau sakit.\nPasien: Tapi Dokter, kakek saya merokok seumur hidup dan umurnya sampai 90 tahun.\nDokter: Apakah kakekmu juga suka ikut campur urusan orang seperti ini?",
"Lelucon 814:\n\nGuru: Apa itu prokrastinasi?\nMurid: Itu kebiasaan menunda pekerjaan, Pak.\nGuru: Kalau kamu tahu itu buruk, kenapa masih melakukannya?\nMurid: Nanti saja saya jelaskannya, Pak!",
"Lelucon 815:\n\nPaman: Nak, kalau kamu dapat nilai 100 di sekolah, Paman kasih hadiah handphone baru.\nKeponakan: Paman, lebih baik Paman kasih saya handphone sekarang. Nanti saya bisa cari jawaban ujian pakai handphone itu!",
"Lelucon 816:\n\nSeorang pria ke apotek: Ada obat penurun berat badan?\nApoteker: Ada, Pak. Ini harganya.\nPria: Mahal sekali. Ada yang lebih murah?\nApoteker: Ada, Pak. Cukup tutup mulut Anda rapat-rapat!",
"Lelucon 817:\n\nIstri: Sayang, aku mimpi kamu membelikanku kalung emas.\nSuami: Itu cuma mimpi, Sayang.\nIstri: Iya, karena itu aku ingin kamu mewujudkannya menjadi kenyataan!",
"Lelucon 818:\n\nGuru: Sebutkan hewan yang bisa berenang!\nMurid: Ikan, Pak.\nGuru: Selain ikan?\nMurid: Paus, lumba-lumba, hiu, dan... tetangga saya yang kabur dari utang!",
"Lelucon 819:\n\nAyah: Nak, kenapa lampu kamarmu menyala padahal hari masih siang?\nAnak: Karena aku sedang menghemat tenaga, Yah. Dengan lampu menyala, aku tidak perlu bangun untuk mencari remote TV!",
"Lelucon 820:\n\nDokter: Pasien, kamu harus makan lebih banyak sayur.\nPasien: Saya sudah, Dokter. Saya makan sayur setiap hari.\nDokter: Sayur apa?\nPasien: Sayur yang ada di dalam mie instan, Dokter!",
"Lelucon 821:\n\nSeorang pria ke tukang kunci: Bang, kunci rumah saya hilang. Bisa buatkan yang baru?\nTukang kunci: Bisa, Pak. Rumahnya di mana?\nPria: Lho, kalau saya tahu rumah saya di mana, saya tidak akan minta bantuan tukang kunci!",
"Lelucon 822:\n\nGuru: Apa itu gempa tektonik?\nMurid: Itu gempa yang terjadi karena lempeng bumi bertabrakan, Pak.\nGuru: Kalau gempa vulkanik?\nMurid: Itu gempa karena gunung berapi marah, Pak!",
"Lelucon 823:\n\nIstri: Sayang, aku beli baju baru. Bagus tidak?\nSuami: Bagus, Sayang. Tapi...\nIstri: Tapi kenapa? Memangnya tidak cocok dengan tubuhku?\nSuami: Cocok, tapi tidak cocok dengan isi dompetku!",
"Lelucon 824:\n\nAyah: Nak, ayo bantu Ayah mencuci mobil. Nanti Ayah kasih uang jajan.\nAnak: Ayah, saya sedang sibuk belajar matematika.\nAyah: Belajar apa?\nAnak: Belajar menghitung uang jajan yang harus Ayah berikan jika saya tidak mencuci mobil!",
"Lelucon 825:\n\nDokter: Pasien, kamu harus tidur yang cukup.\nPasien: Saya sudah tidur cukup, Dokter. 12 jam sehari.\nDokter: Kalau begitu kenapa matamu masih kelihatan lelah?\nPasien: Karena saya harus bangun setiap 2 jam untuk mengecek HP!",
"Lelucon 826:\n\nGuru: Hewan apa yang paling pintar?\nMurid: Lumba-lumba, Pak.\nGuru: Kenapa?\nMurid: Karena dia bisa melompat dan bermain bola, sedangkan ayam saja tidak bisa!",
"Lelucon 827:\n\nSeorang pria ke restoran: Pelayan, tolong bawa menu.\nPelayan: Ini menu kami, Pak. Mau pesan apa?\nPria: Saya pesan nasi putih dan air putih saja, karena saya baru sadar dompet saya tertinggal di rumah!",
"Lelucon 828:\n\nIstri: Sayang, ibu bilang dia akan datang minggu ini.\nSuami: Oh, tidak! Aku harus segera mencari pekerjaan luar kota minggu ini.\nIstri: Kenapa?\nSuami: Supaya aku tidak perlu bertemu dengannya!",
"Lelucon 829:\n\nGuru: Apa itu fotosintesis?\nMurid: Itu proses tumbuhan memasak makanan sendiri, Pak.\nGuru: Kalau tumbuhan tidak punya daun?\nMurid: Berarti tumbuhan itu sedang diet karbohidrat, Pak!",
"Lelucon 830:\n\nAyah: Nak, kamu sudah belajar untuk ujian besok?\nAnak: Sudah, Yah.\nAyah: Coba Ayah tes, apa ibu kota Indonesia?\nAnak: Jakarta, Yah.\nAyah: Kalau ibu kota Malaysia?\nAnak: Kuala Lumpur, Yah.\nAyah: Kalau ibu kota hatimu?\nAnak: Ya... ibu, Yah!",
"Lelucon 831:\n\nDokter: Pasien, kamu harus berhenti makan mie instan.\nPasien: Dokter, saya tidak makan mie instan.\nDokter: Lalu kenapa perutmu buncit?\nPasien: Dokter, saya makan nasi 5 piring setiap kali makan!",
"Lelucon 832:\n\nSeorang pria ke toko hewan: Saya mau beli kucing yang tidak suka mengeong.\nPenjual: Kalau begitu beli ikan mas saja, Pak!",
"Lelucon 833:\n\nGuru: Apa itu pelangi?\nMurid: Pak, itu jembatan berwarna-warni yang dibuat bidadari.\nGuru: Kalau begitu, kenapa hanya muncul setelah hujan?\nMurid: Karena bidadari baru selesai mengecatnya, Pak!",
"Lelucon 834:\n\nIstri: Sayang, tolong belikan obat sakit kepala.\nSuami: Kamu sakit kepala, Sayang?\nIstri: Tidak, tapi kamu akan sakit kepala kalau tidak membelinya!",
"Lelucon 835:\n\nPaman: Nak, kalau kamu juara kelas, Paman akan belikan sepeda motor.\nKeponakan: Paman, saya tidak mau juara kelas. Saya mau sepeda motornya saja sekarang!",
"Lelucon 836:\n\nSeorang pria ke dokter gigi: Dokter, gigi saya ngilu.\nDokter gigi: Kamu sering makan es krim, ya?\nPria: Iya, Dokter. Kok tahu?\nDokter gigi: Karena gigimu kedinginan!",
"Lelucon 837:\n\nGuru: Mengapa air laut rasanya asin?\nMurid: Karena banyak ikan yang berenang sambil menangis, Pak.\nGuru: Kenapa ikan menangis?\nMurid: Karena mereka tidak bisa pulang ke rumah!",
"Lelucon 838:\n\nIstri: Sayang, apakah kamu masih cinta sama aku?\nSuami: Tentu saja, Sayang.\nIstri: Seberapa besar?\nSuami: Sebesar rasa malasku untuk bangun pagi, Sayang!",
"Lelucon 839:\n\nDokter: Pasien, kamu harus mengurangi minuman bersoda.\nPasien: Saya sudah mengurangi, Dokter.\nDokter: Berapa gelas sekarang?\nPasien: Dari 10 gelas jadi 9 gelas, Dokter!",
"Lelucon 840:\n\nGuru: Apa itu bulan?\nMurid: Pak, bulan adalah satelit bumi.\nGuru: Kenapa bulan bersinar di malam hari?\nMurid: Karena bulan tidak mau kalah dengan matahari, Pak!",
"Lelucon 841:\n\nAyah: Nak, apakah kamu sudah memakai sepatu?\nAnak: Sudah, Yah.\nAyah: Kenapa masih bertelanjang kaki?\nAnak: Karena aku memakai sepatu kakak, Yah!",
"Lelucon 842:\n\nIstri: Sayang, kamu sayang sama aku tidak?\nSuami: Sayang, Sayang.\nIstri: Buktikan dengan belikan aku perhiasan!\nSuami: Aku sayang kamu, tapi bukan berarti aku harus beli perhiasan, Sayang!",
"Lelucon 843:\n\nDokter: Pasien, kamu harus berhenti makan gorengan.\nPasien: Saya sudah berhenti, Dokter.\nDokter: Sejak kapan?\nPasien: Sejak 5 menit yang lalu, Dokter!",
"Lelucon 844:\n\nGuru: Mengapa pohon kelapa tinggi?\nMurid: Supaya bisa melihat laut, Pak.\nGuru: Kenapa pohon kelapa tidak pernah jatuh?\nMurid: Karena pohon kelapa tidak punya kaki, Pak!",
"Lelucon 845:\n\nSeorang pria ke toko roti: Saya mau beli roti tawar.\nPenjual: Maaf, Pak, roti tawarnya habis.\nPria: Kalau roti manis?\nPenjual: Habis juga, Pak.\nPria: Kalau roti sobek?\nPenjual: Habis juga, Pak.\nPria: Lalu apa yang tersisa?\nPenjual: Rotiannya, Pak!",
"Lelucon 846:\n\nIstri: Sayang, apakah kamu mencintaiku?\nSuami: Tentu saja, Sayang.\nIstri: Seberapa besar?\nSuami: Sebesar keinginanku untuk tidur siang, Sayang!",
"Lelucon 847:\n\nAyah: Nak, bantu Ayah bersihkan gudang.\nAnak: Nanti, Yah, aku sedang belajar.\nAyah: Belajar apa?\nAnak: Belajar menghindari pekerjaan, Yah!",
"Lelucon 848:\n\nGuru: Apa itu salju?\nMurid: Pak, salju adalah es yang jatuh dari langit.\nGuru: Kenapa salju berwarna putih?\nMurid: Karena salju belum mandi, Pak!",
"Lelucon 849:\n\nDokter: Pasien, kamu harus mengurangi minuman bersoda.\nPasien: Saya sudah mengurangi, Dokter.\nDokter: Berapa gelas sekarang?\nPasien: Dari 10 gelas jadi 9 gelas, Dokter!",
"Lelucon 850:\n\nIstri: Sayang, aku ingin pergi ke pantai.\nSuami: Kita tidak punya uang, Sayang.\nIstri: Ya sudah, kita ke kolam renang saja.\nSuami: Kolam renang juga butuh uang, Sayang.\nIstri: Ya sudah, kita ke kamar mandi saja!\nSuami: Itu ide bagus, Sayang!",
"Lelucon 851:\n\nSeorang pria bertanya kepada temannya: Kenapa kamu selalu memakai kacamata hitam di malam hari?\nTeman: Karena saya tidak mau melihat dunia ini terlalu terang.\nPria: Tapi malam ini gelap?\nTeman: Justru karena gelap, saya butuh kacamata hitam!",
"Lelucon 852:\n\nGuru: Apa itu matahari?\nMurid: Pak, matahari adalah bintang yang sangat besar.\nGuru: Kenapa matahari sangat panas?\nMurid: Karena matahari tidak pernah minum, Pak!",
"Lelucon 853:\n\nAyah: Nak, apakah kamu sudah menyiram bunga?\nAnak: Sudah, Yah.\nAyah: Kenapa bunganya layu?\nAnak: Karena aku menyiramnya dengan air panas, Yah!",
"Lelucon 854:\n\nIstri: Sayang, kamu lebih cinta aku atau ibumu?\nSuami: Tentu saja kalian berdua, Sayang.\nIstri: Tidak boleh, harus pilih satu!\nSuami: Kalau begitu, aku pilih... tidur!",

"Lelucon 856:\n\nGuru: Mengapa air sungai mengalir ke laut?\nMurid: Karena sungai ingin berlibur ke laut, Pak.\nGuru: Kalau air laut?\nMurid: Air laut tidak bisa ke sungai, karena sudah betah di laut!",

"Lelucon 858:\n\nIstri: Sayang, kamu ingat tidak, hari ini kita ulang tahun pernikahan?\nSuami: Tentu saja ingat, Sayang.\nIstri: Lalu mana hadiahnya?\nSuami: Hadiahnya adalah aku masih ingat!",

"Lelucon 865:\n\nAyah: Nak, kenapa kamu tidak mau makan sayur?\nAnak: Karena sayur itu pahit, Yah.\nAyah: Tapi sayur itu sehat!\nAnak: Kalau begitu, Ayah saja yang makan!",
"Lelucon 866:\n\nGuru: Apa itu laut?\nMurid: Pak, laut adalah kumpulan air yang sangat luas.\nGuru: Kenapa air laut asin?\nMurid: Karena banyak ikan yang berkeringat di dalamnya, Pak!",

"Lelucon 904:\n\nAyah: Nak, bantu Ayah cuci mobil.\nAnak: Nanti, Yah, aku sedang menonton TV.\nAyah: Kalau begitu, Ayah matikan TV-nya!\nAnak: Jangan, Yah! Aku akan bantu cuci mobil, asalkan TV tetap menyala!",

"Lelucon 910:\n\nDokter: Pasien, kamu harus mengurangi makanan pedas.\nPasien: Saya sudah mengurangi, Dokter.\nDokter: Berapa kali seminggu?\nPasien: Dari 7 kali jadi 6 kali, Dokter!",

"Lelucon 912:\n\nGuru: Apa itu gunung?\nMurid: Pak, gunung adalah tumpukan tanah yang sangat tinggi.\nGuru: Kalau bukit?\nMurid: Bukit adalah gunung yang belum besar, Pak!",
"Lelucon 913:\n\nAyah: Nak, apakah kamu sudah makan?\nAnak: Sudah, Yah.\nAyah: Kenapa masih lapar?\nAnak: Karena aku hanya makan camilan, Yah!",
"Lelucon 914:\n\nIstri: Sayang, aku ingin beli baju baru.\nSuami: Baju di lemari masih banyak, Sayang.\nIstri: Tapi itu sudah tidak mode lagi.\nSuami: Kalau begitu, aku juga mau beli baju baru!",
"Lelucon 915:\n\nDokter: Pasien, kamu harus berolahraga setiap pagi.\nPasien: Saya sudah berolahraga, Dokter.\nDokter: Olahraga apa?\nPasien: Lari dari bangun tidur, Dokter!",

"Lelucon 919:\n\nAyah: Nak, kenapa lampu kamarmu menyala padahal hari masih siang?\nAnak: Karena aku sedang menghemat tenaga, Yah. Dengan lampu menyala, aku tidak perlu bangun untuk mencari remote TV!",
"Lelucon 920:\n\nDokter: Pasien, kamu harus makan lebih banyak sayur.\nPasien: Saya sudah, Dokter. Saya makan sayur setiap hari.\nDokter: Sayur apa?\nPasien: Sayur yang ada di dalam mie instan, Dokter!",
"Lelucon 921:\n\nSeorang pria ke tukang kunci: Bang, kunci rumah saya hilang. Bisa buatkan yang baru?\nTukang kunci: Bisa, Pak. Rumahnya di mana?\nPria: Lho, kalau saya tahu rumah saya di mana, saya tidak akan minta bantuan tukang kunci!",

var current = 0;

function showJoke(){
    document.getElementById('jokeBox').innerText = jokes[current];

}

function next(){

}

}
