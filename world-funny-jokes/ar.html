"نكتة 828:\n\nالطبيب: يجب أن تقلل الحلويات.\nالمريض: يا دكتور، لا آكل الحلويات.\nالطبيب: إذاً لماذا أسنانك تالفة؟\nالمريض: يا دكتور، تركت الحلويات، لكن لم أترك زوجتي!",
"نكتة 829:\n\nالمعلم: ما أكبر صدمة في حياتك؟\nالطالب: يا أستاذ، عندما جهزت زوجتي للذهاب لبيت أبيها، فقالت 'لن أذهب' — كانت أكبر صدمة!",
"نكتة 830:\n\nالزوجة: عزيزي، ما الشيء المفضل لديك؟\nالزوج: أنت.\nالزوجة: واو، يا له من حب!\nالزوج: لا، الشيء المفضل لدي هو ذهابك لبيت أبيك!",
"نكتة 831:\n\nالمعلم: إذا وقعت زوجتك وطفلك في النهر، من ستنقذ أولاً؟\nالطالب: يا أستاذ، الطفل.\nالمعلم: ولماذا لا زوجتك؟\nالطالب: يا أستاذ، زوجتي ستعوم بنفسها وتخرج، الطفل لا يستطيع!",
"نكتة 832:\n\nالطبيب: تحتاج إلى راحة جيدة.\nالمريض: يا دكتور، أنا أرتاح.\nالطبيب: إذاً لماذا أنت مريض؟\nالمريض: تعبت من الراحة!",
"نكتة 833:\n\nالمعلم: كيف كانت نتيجتك؟\nالطالب: يا أستاذ، نجحت!\nالمعلم: كم درجة؟\nالطالب: يا أستاذ، النجاح لا يحتاج درجات!",
"نكتة 834:\n\nالزوجة: عزيزي، إلى أين نذهب هذا المساء؟\nالزوج: إلى حيث تقولين.\nالزوجة: نذهب لبيت أبي؟\nالزوج: لماذا هناك؟\nالزوجة: لأن هناك سيكون طعام، وسيوفر راتبك أيضاً!",
"نكتة 835:\n\nالمعلم: ما أكبر درس تعلمته من الحياة؟\nالطالب: يا أستاذ، قبل الزواج كنت أظن أنني ملك، بعد الزواج عرفت أنني وزير — والزوجة رئيسة الوزراء!",
"نكتة 836:\n\nالطبيب: تحتاج إلى نوم.\nالمريض: يا دكتور، أنا أنام.\nالطبيب: كم ساعة؟\nالمريض: يا دكتور، أنام طوال اليوم!",
"نكتة 837:\n\nالمعلم: إذا حصلت على طائرة، إلى أين ستذهب؟\nالطالب: يا أستاذ، لبيت أبيها!",
"نكتة 838:\n\nالزوجة: عزيزي، إذا مت، ماذا ستفعل؟\nالزوج: سأتزوج مرة ثانية.\nالزوجة: وإذا بقيت حية؟\nالزوج: ماذا بعد، ستبقى الأولى هي نفسها!",
"نكتة 839:\n\nالمعلم: إذا أعطيتك مليون ريال، ماذا ستفعل؟\nالطالب: يا أستاذ، سأرسل زوجتي لبيت أبيها أولاً، ثم سأنام بسلام!",
"نكتة 840:\n\nالطبيب: لا يجب أن تدخن السجائر.\nالمريض: يا دكتور، أنا فقط أنظر إليها.\nالطبيب: إذاً توقف عن النظر إليها!",
"نكتة 841:\n\nالمعلم: ماذا شعرت بعد الزواج؟\nالطالب: يا أستاذ، قبل الزواج كنت أظن أنني حر — بعد الزواج عرفت أنني كنت سجيناً، والآن وجدت الحرية!",
"نكتة 842:\n\nالزوجة: عزيزي، كم تحبني؟\nالزوج: بقدر ما لن أسمح لك بالذهاب لبيت أبيك.\nالزوجة: واو، يا له من حب!\nالزوج: لا، لأوفر تكاليف الذهاب لبيت أبيها!",
"نكتة 843:\n\nالمعلم: ما أكبر صدمة في حياتك؟\nالطالب: يا أستاذ، عندما قالت لي زوجتي أنني سأصبح أباً — وأنا ظننت أنني ما زلت طفلاً!",
"نكتة 844:\n\nالطبيب: تحتاج إلى رياضة.\nالمريض: يا دكتور، أمارس الرياضة كل يوم.\nالطبيب: ماذا تفعل؟\nالمريض: أجري كل يوم بعد صراخ زوجتي!",
"نكتة 845:\n\nالمعلم: إذا صرخت زوجتك وأمك في نفس الوقت، من ستسمع؟\nالطالب: يا أستاذ، سأسمع أمي.\nالمعلم: ولماذا لا تسمع زوجتك؟\nالطالب: يا أستاذ، زوجتي يجب أن أسمعها ليلاً أيضاً، أمي فقط في النهار!",
"نكتة 846:\n\nالزوجة: عزيزي، ماذا نطبخ اليوم؟\nالزوج: ما تشائين.\nالزوجة: حسناً، لن أطبخ شيئاً اليوم.\nالزوج: لا لا، كنت أمزح!",
"نكتة 847:\n\nالمعلم: لماذا تتزوج؟\nالطالب: يا أستاذ، لأن أمي قالت أنه بعد الزواج لن يصرخ علي أحد.\nالمعلم: ثم ماذا حدث؟\nالطالب: يا أستاذ، بعد الزواج عرفت أنه بقي واحدة فقط تصرخ — الزوجة!",
"نكتة 848:\n\nالطبيب: يجب أن تقلل الحلويات.\nالمريض: يا دكتور، لا آكل الحلويات.\nالطبيب: إذاً لماذا أسنانك تالفة؟\nالمريض: يا دكتور، تركت الحلويات، لكن لم أترك زوجتي!",
"نكتة 849:\n\nالمعلم: ما أكبر صدمة في حياتك؟\nالطالب: يا أستاذ، عندما جهزت زوجتي للذهاب لبيت أبيها، فقالت 'لن أذهب' — كانت أكبر صدمة!",
"نكتة 850:\n\nذهب رجل للطبيب وقال: يا دكتور، أشعر كل يوم أنني سأموت.\nالطبيب: منذ متى؟\nالرجل: منذ أن تزوجت.\nالطبيب: يا أخي، هذا ليس مرضاً، هذه حقيقة!",
"نكتة 851:\n\nالمعلم: إذا أعطيتك مليون ريال، ماذا ستفعل؟\nالطالب: يا أستاذ، سأدفع رسوم المدرسة أولاً.\nالمعلم: واو، يا له من طالب جيد!\nالطالب: ثم سأستخدم المال المتبقي لإرسال زوجتي لبيت أبيها!",
"نكتة 852:\n\nالزوجة: عزيزي، إذا مت، ماذا ستفعل؟\nالزوج: سأتزوج مرة ثانية.\nالزوجة: وإذا بقيت حية؟\nالزوج: ماذا بعد، ستبقى الأولى هي نفسها!",
"نكتة 853:\n\nالمعلم: ما الفرق بين الحادث والمصيبة؟\nالطالب: يا أستاذ، عندما تذهب زوجة شخص لبيت أبيها، وفي طريق عودتها يحدث لها حادث وتموت، فهذا حادث. أما إذا عادت سالمة للبيت، فهذه مصيبة!",
"نكتة 854:\n\nالزوج: عزيزتي، كم تحبينني؟\nالزوجة: بقدر ما لا أستطيع العيش بدونك ساعة.\nالزوج: إذاً لماذا لم تطبخي شيئاً اليوم؟\nالزوجة: لأنني لا أستطيع الطبخ بدونك!",
"نكتة 855:\n\nالمعلم: إذا وقعت زوجتك وأمك في النهر، من ستنقذ أولاً؟\nالطالب: يا أستاذ، سأنقذ أمي أولاً، لأن زوجتي تعرف السباحة — تعبر النهر كل يوم لتذهب لبيت أبيها!",
"نكتة 856:\n\nالطبيب: ما مشكلتك؟\nالمريض: يا دكتور، زوجتي تصرخ علي كل يوم.\nالطبيب: وماذا أفعل أنا؟\nالمريض: أعطها دواءً لتتوقف عن الصراخ!",
"نكتة 857:\n\nالمعلم: ماذا شعرت بعد الزواج؟\nالطالب: يا أستاذ، قبل الزواج كنت أظن أنني حر — بعد الزواج عرفت أنني كنت سجيناً، والآن وجدت الحرية!",
"نكتة 858:\n\nالزوجة: عزيزي، نذهب للسوق اليوم؟\nالزوج: لا يوجد مال.\nالزوجة: وماذا في ذلك، سنذهب للنظر فقط.\nالزوج: في المرة الماضية قلتي نفس الكلام، وأنا تركت راتب 3 أشهر في السوق!",
"نكتة 859:\n\nالمعلم: إذا وجدت وظيفة، ماذا ستفعل؟\nالطالب: يا أستاذ، سأهدي راتب الشهر الأول لأمي.\nالمعلم: واو، يا له من طالب جيد!\nالطالب: ثم سأعطي بقية الأشهر لأمي أيضاً، ولن أعطي لزوجتي شيئاً!",
"نكتة 860:\n\nالزوجة: عزيزي، لم تعطني زهوراً أبداً.\nالزوج: تحبين الزهور؟\nالزوجة: نعم.\nالزوج: إذاً اذهبي غداً للسوق واشتري زهوراً!",
"نكتة 861:\n\nالمعلم: ما أكبر صدمة في حياتك؟\nالطالب: يا أستاذ، عندما قالت لي زوجتي أنني سأصبح أباً — وأنا ظننت أنني ما زلت طفلاً!",
"نكتة 862:\n\nالطبيب: تحتاج إلى رياضة.\nالمريض: يا دكتور، أمارس الرياضة كل يوم.\nالطبيب: ماذا تفعل؟\nالمريض: أجري كل يوم بعد صراخ زوجتي!",
"نكتة 863:\n\nالمعلم: إذا صرخت زوجتك وأمك في نفس الوقت، من ستسمع؟\nالطالب: يا أستاذ، سأسمع أمي.\nالمعلم: ولماذا لا تسمع زوجتك؟\nالطالب: يا أستاذ، زوجتي يجب أن أسمعها ليلاً أيضاً، أمي فقط في النهار!",
"نكتة 864:\n\nالزوجة: عزيزي، ماذا نطبخ اليوم؟\nالزوج: ما تشائين.\nالزوجة: حسناً، لن أطبخ شيئاً اليوم.\nالزوج: لا لا، كنت أمزح!",
"نكتة 865:\n\nالمعلم: ما أكبر درس تعلمته من الحياة؟\nالطالب: يا أستاذ، قبل الزواج كنت أظن أنني ملك، بعد الزواج عرفت أنني وزير — والزوجة رئيسة الوزراء!",
"نكتة 866:\n\nالطبيب: لا يجب أن تدخن السجائر.\nالمريض: يا دكتور، أنا فقط أنظر إليها.\nالطبيب: إذاً توقف عن النظر إليها!",
"نكتة 867:\n\nالمعلم: إذا حصلت على طائرة، إلى أين ستذهب؟\nالطالب: يا أستاذ، لبيت أبيها!",
"نكتة 868:\n\nالزوجة: عزيزي، ما الشيء المفضل لديك؟\nالزوج: أنت.\nالزوجة: واو، يا له من حب!\nالزوج: لا، الشيء المفضل لدي هو ذهابك لبيت أبيك!",
"نكتة 869:\n\nالمعلم: إذا صعدت زوجتك وطفلك للسطح، من ستنزل أولاً؟\nالطالب: يا أستاذ، الطفل.\nالمعلم: ولماذا لا زوجتك؟\nالطالب: يا أستاذ، زوجتي ستقفز بنفسها وتنزل، الطفل لا يستطيع!",
"نكتة 870:\n\nالطبيب: تحتاج إلى نوم جيد.\nالمريض: يا دكتور، أنا أنام.\nالطبيب: كم ساعة؟\nالمريض: يا دكتور، أنام طوال الليل، وفي النهار زوجتي لا تتركني أنام!",
"نكتة 871:\n\nالمعلم: من هو أقوى شخص في بيتكم؟\nالطالب: يا أستاذ، زوجتي.\nالمعلم: كيف؟\nالطالب: يا أستاذ، هي تدير البيت كله بيد واحدة، وحتى راتبي!",
"نكتة 872:\n\nالزوجة: عزيزي، إذا مرضت أنا وأمك في نفس الوقت، دواء من ستحضر؟\nالزوج: دواءك!\nالزوجة: واو، يا له من حب!\nالزوج: لا، دواء أمي سيأتي من تلقاء نفسه، أما دواءك فأنا من سيحضره!",
"نكتة 873:\n\nالمعلم: هل تعتقد أن الزواج هو أكبر قرار في الحياة؟\nالطالب: يا أستاذ، لا، الزواج هو أكبر 'حادث' في الحياة — والزوجة 'مصيبة'!",
"نكتة 874:\n\nالطبيب: ما مشكلتك؟\nالمريض: يا دكتور، أشعر كل يوم أنني سأموت.\nالطبيب: منذ متى؟\nالمريض: منذ أن تزوجت!",
"نكتة 875:\n\nالمعلم: إذا أعطيتك مليون ريال، ماذا ستفعل؟\nالطالب: يا أستاذ، سأرسل زوجتي لبيت أبيها أولاً، ثم سأنام بسلام!",
"نكتة 876:\n\nالزوجة: عزيزي، كم تحبني؟\nالزوج: بقدر ما لن أسمح لك بالذهاب لبيت أبيك.\nالزوجة: واو، يا له من حب!\nالزوج: لا، لأوفر تكاليف الذهاب لبيت أبيها!",
"نكتة 877:\n\nالمعلم: ماذا شعرت بعد الزواج؟\nالطالب: يا أستاذ، كنت وحدي، الآن أنا 'نحن' — لكن في 'نحن' لا يسمع إلا كلام الزوجة!",
"نكتة 878:\n\nالطبيب: تحتاج إلى رياضة.\nالمريض: يا دكتور، أمارس الرياضة كل يوم.\nالطبيب: ماذا تفعل؟\nالمريض: أحاول الاستيقاظ مبكراً كل يوم!",
"نكتة 879:\n\nالمعلم: إذا مرضت زوجتك وأمك، من ستأخذ للمستشفى؟\nالطالب: يا أستاذ، أمي.\nالمعلم: وماذا ستفعل زوجتك؟\nالطالب: يا أستاذ، زوجتي ستذهب للمستشفى بنفسها — أنا فقط أفكر في أخذ أمي!",
"نكتة 880:\n\nالزوجة: عزيزي، ماذا نطبخ اليوم؟\nالزوج: ما طبخته أنت.\nالزوجة: لم أطبخ شيئاً!\nالزوج: إذاً لنطلب من الخارج!",
"نكتة 881:\n\nالمعلم: ماذا يعمل والدك؟\nالطالب: يا أستاذ، هو والدي!\nالمعلم: هذا أعرفه أيضاً، ماذا يعمل؟\nالطالب: يا أستاذ، هو زوج أمي!",
"نكتة 882:\n\nالطبيب: يجب أن تأكل فواكه.\nالمريض: يا دكتور، آكل المانجو كل يوم.\nالطبيب: فقط المانجو؟\nالمريض: يا دكتور، المانجو يعني 'ملك الفواكه'!",
"نكتة 883:\n\nالمعلم: إذا جعلتك رئيس وزراء لليلة، ماذا ستفعل؟\nالطالب: يا أستاذ، أولاً سأعطي عطلة للمدرسة، ثم سأزيد راتب زوجتي!",
"نكتة 884:\n\nالزوجة: عزيزي، إلى أين ستأخذني؟\nالزوج: سآخذك للسوق.\nالزوجة: ماذا سأشتري؟\nالزوج: ما تشائين، لكن معي فقط 500 ريال!",

"نكتة 894:\n\nالطبيب: تحتاج إلى نوم.\nالمريض: يا دكتور، أنا أنام.\nالطبيب: كم ساعة؟\nالمريض: يا دكتور، أنام طوال اليوم!",
"نكتة 895:\n\nالمعلم: إذا حصلت على طائرة، إلى أين ستذهب؟\nالطالب: يا أستاذ، لبيت أبيها!",
"نكتة 896:\n\nالزوجة: عزيزي، إذا مت، ماذا ستفعل؟\nالزوج: سأتزوج مرة ثانية.\nالزوجة: وإذا بقيت حية؟\nالزوج: ماذا بعد، ستبقى الأولى هي نفسها!",
"نكتة 897:\n\nالمعلم: إذا أعطيتك مليون ريال، ماذا ستفعل؟\nالطالب: يا أستاذ، سأرسل زوجتي لبيت أبيها أولاً، ثم سأنام بسلام!",
"نكتة 898:\n\nالطبيب: لا يجب أن تدخن السجائر.\nالمريض: يا دكتور، أنا فقط أنظر إليها.\nالطبيب: إذاً توقف عن النظر إليها!",
"نكتة 899:\n\nالمعلم: ماذا شعرت بعد الزواج؟\nالطالب: يا أستاذ، قبل الزواج كنت أظن أنني حر — بعد الزواج عرفت أنني كنت سجيناً، والآن وجدت الحرية!",
"نكتة 900:\n\nالزوجة: عزيزي، كم تحبني؟\nالزوج: بقدر ما لن أسمح لك بالذهاب لبيت أبيك.\nالزوجة: واو، يا له من حب!\nالزوج: لا، لأوفر تكاليف الذهاب لبيت أبيها! 😄",
"نكتة 901:\n\nالمعلم: إذا وجدت وظيفة، ماذا ستفعل؟\nالطالب: يا أستاذ، سأهدي راتب الشهر الأول لأمي.\nالمعلم: واو، يا له من طالب جيد!\nالطالب: ثم سأعطي بقية الأشهر لأمي أيضاً، ولن أعطي لزوجتي شيئاً!",
"نكتة 902:\n\nالزوجة: عزيزي، لم تعطني زهوراً أبداً.\nالزوج: تحبين الزهور؟\nالزوجة: نعم.\nالزوج: إذاً اذهبي غداً للسوق واشتري زهوراً!",
"نكتة 903:\n\nالمعلم: ما أكبر صدمة في حياتك؟\nالطالب: يا أستاذ، عندما قالت لي زوجتي أنني سأصبح أباً — وأنا ظننت أنني ما زلت طفلاً!",
"نكتة 904:\n\nالطبيب: تحتاج إلى رياضة.\nالمريض: يا دكتور، أمارس الرياضة كل يوم.\nالطبيب: ماذا تفعل؟\nالمريض: أجري كل يوم بعد صراخ زوجتي!",
"نكتة 905:\n\nالمعلم: إذا صرخت زوجتك وأمك في نفس الوقت، من ستسمع؟\nالطالب: يا أستاذ، سأسمع أمي.\nالمعلم: ولماذا لا تسمع زوجتك؟\nالطالب: يا أستاذ، زوجتي يجب أن أسمعها ليلاً أيضاً، أمي فقط في النهار!",
"نكتة 906:\n\nالزوجة: عزيزي، ماذا نطبخ اليوم؟\nالزوج: ما تشائين.\nالزوجة: حسناً، لن أطبخ شيئاً اليوم.\nالزوج: لا لا، كنت أمزح!",
"نكتة 907:\n\nالمعلم: ما أكبر درس تعلمته من الحياة؟\nالطالب: يا أستاذ، قبل الزواج كنت أظن أنني ملك، بعد الزواج عرفت أنني وزير — والزوجة رئيسة الوزراء!",
"نكتة 908:\n\nالطبيب: لا يجب أن تدخن السجائر.\nالمريض: يا دكتور، أنا فقط أنظر إليها.\nالطبيب: إذاً توقف عن النظر إليها!",
"نكتة 909:\n\nالمعلم: إذا حصلت على طائرة، إلى أين ستذهب؟\nالطالب: يا أستاذ، لبيت أبيها!",
"نكتة 910:\n\nالزوجة: عزيزي، ما الشيء المفضل لديك؟\nالزوج: أنت.\nالزوجة: واو، يا له من حب!\nالزوج: لا، الشيء المفضل لدي هو ذهابك لبيت أبيك!",
"نكتة 911:\n\nالمعلم: إذا صعدت زوجتك وطفلك للسطح، من ستنزل أولاً؟\nالطالب: يا أستاذ، الطفل.\nالمعلم: ولماذا لا زوجتك؟\nالطالب: يا أستاذ، زوجتي ستقفز بنفسها وتنزل، الطفل لا يستطيع!",
"نكتة 912:\n\nالطبيب: تحتاج إلى نوم جيد.\nالمريض: يا دكتور، أنا أنام.\nالطبيب: كم ساعة؟\nالمريض: يا دكتور، أنام طوال الليل، وفي النهار زوجتي لا تتركني أنام!",
"نكتة 913:\n\nالمعلم: من هو أقوى شخص في بيتكم؟\nالطالب: يا أستاذ، زوجتي.\nالمعلم: كيف؟\nالطالب: يا أستاذ، هي تدير البيت كله بيد واحدة، وحتى راتبي!",
"نكتة 914:\n\nالزوجة: عزيزي، إذا مرضت أنا وأمك في نفس الوقت، دواء من ستحضر؟\nالزوج: دواءك!\nالزوجة: واو، يا له من حب!\nالزوج: لا، دواء أمي سيأتي من تلقاء نفسه، أما دواءك فأنا من سيحضره!",
"نكتة 915:\n\nالمعلم: هل تعتقد أن الزواج هو أكبر قرار في الحياة؟\nالطالب: يا أستاذ، لا، الزواج هو أكبر 'حادث' في الحياة — والزوجة 'مصيبة'!",
"نكتة 916:\n\nالطبيب: ما مشكلتك؟\nالمريض: يا دكتور، أشعر كل يوم أنني سأموت.\nالطبيب: منذ متى؟\nالمريض: منذ أن تزوجت!",
"نكتة 917:\n\nالمعلم: إذا أعطيتك مليون ريال، ماذا ستفعل؟\nالطالب: يا أستاذ، سأرسل زوجتي لبيت أبيها أولاً، ثم سأنام بسلام!",
"نكتة 918:\n\nالزوجة: عزيزي، كم تحبني؟\nالزوج: بقدر ما لن أسمح لك بالذهاب لبيت أبيك.\nالزوجة: واو، يا له من حب!\nالزوج: لا، لأوفر تكاليف الذهاب لبيت أبيها!",
"نكتة 919:\n\nالمعلم: ماذا شعرت بعد الزواج؟\nالطالب: يا أستاذ، كنت وحدي، الآن أنا 'نحن' — لكن في 'نحن' لا يسمع إلا كلام الزوجة!",
"نكتة 920:\n\nالطبيب: تحتاج إلى رياضة.\nالمريض: يا دكتور، أمارس الرياضة كل يوم.\nالطبيب: ماذا تفعل؟\nالمريض: أحاول الاستيقاظ مبكراً كل يوم!",
"نكتة 921:\n\nالمعلم: إذا مرضت زوجتك وأمك، من ستأخذ للمستشفى؟\nالطالب: يا أستاذ، أمي.\nالمعلم: وماذا ستفعل زوجتك؟\nالطالب: يا أستاذ، زوجتي ستذهب للمستشفى بنفسها — أنا فقط أفكر في أخذ أمي!",
"نكتة 922:\n\nالزوجة: عزيزي، ماذا نطبخ اليوم؟\nالزوج: ما طبخته أنت.\nالزوجة: لم أطبخ شيئاً!\nالزوج: إذاً لنطلب من الخارج!",
"نكتة 923:\n\nالمعلم: ماذا يعمل والدك؟\nالطالب: يا أستاذ، هو والدي!\nالمعلم: هذا أعرفه أيضاً، ماذا يعمل؟\nالطالب: يا أستاذ، هو زوج أمي!",
"نكتة 924:\n\nالطبيب: يجب أن تأكل فواكه.\nالمريض: يا دكتور، آكل المانجو كل يوم.\nالطبيب: فقط المانجو؟\nالمريض: يا دكتور، المانجو يعني 'ملك الفواكه'!",
"نكتة 925:\n\nالمعلم: إذا جعلتك رئيس وزراء لليلة، ماذا ستفعل؟\nالطالب: يا أستاذ، أولاً سأعطي عطلة للمدرسة، ثم سأزيد راتب زوجتي!",
"نكتة 926:\n\nالزوجة: عزيزي، إلى أين ستأخذني؟\nالزوج: سآخذك للسوق.\nالزوجة: ماذا سأشتري؟\nالزوج: ما تشائين، لكن معي فقط 500 ريال!",
"نكتة 927:\n\nالمعلم: لماذا تتزوج؟\nالطالب: يا أستاذ، لأن أمي قالت أنه بعد الزواج لن يصرخ علي أحد.\nالمعلم: ثم ماذا حدث؟\nالطالب: يا أستاذ، بعد الزواج عرفت أنه بقي واحدة فقط تصرخ — الزوجة!",
"نكتة 928:\n\nالطبيب: يجب أن تقلل الحلويات.\nالمريض: يا دكتور، لا آكل الحلويات.\nالطبيب: إذاً لماذا أسنانك تالفة؟\nالمريض: يا دكتور، تركت الحلويات، لكن لم أترك زوجتي!",
"نكتة 929:\n\nالمعلم: ما أكبر صدمة في حياتك؟\nالطالب: يا أستاذ، عندما جهزت زوجتي للذهاب لبيت أبيها، فقالت 'لن أذهب' — كانت أكبر صدمة!",
"نكتة 930:\n\nالزوجة: عزيزي، ما الشيء المفضل لديك؟\nالزوج: أنت.\nالزوجة: واو، يا له من حب!\nالزوج: لا، الشيء المفضل لدي هو ذهابك لبيت أبيك!",
"نكتة 931:\n\nالمعلم: إذا وقعت زوجتك وطفلك في النهر، من ستنقذ أولاً؟\nالطالب: يا أستاذ، الطفل.\nالمعلم: ولماذا لا زوجتك؟\nالطالب: يا أستاذ، زوجتي ستعوم بنفسها وتخرج، الطفل لا يستطيع!",
"نكتة 932:\n\nالطبيب: تحتاج إلى راحة جيدة.\nالمريض: يا دكتور، أنا أرتاح.\nالطبيب: إذاً لماذا أنت مريض؟\nالمريض: تعبت من الراحة!",
"نكتة 933:\n\nالمعلم: كيف كانت نتيجتك؟\nالطالب: يا أستاذ، نجحت!\nالمعلم: كم درجة؟\nالطالب: يا أستاذ، النجاح لا يحتاج درجات!",
"نكتة 934:\n\nالزوجة: عزيزي، إلى أين نذهب هذا المساء؟\nالزوج: إلى حيث تقولين.\nالزوجة: نذهب لبيت أبي؟\nالزوج: لماذا هناك؟\nالزوجة: لأن هناك سيكون طعام، وسيوفر راتبك أيضاً!",
"نكتة 935:\n\nالمعلم: ما أكبر درس تعلمته من الحياة؟\nالطالب: يا أستاذ، قبل الزواج كنت أظن أنني ملك، بعد الزواج عرفت أنني وزير — والزوجة رئيسة الوزراء!",
"نكتة 936:\n\nالطبيب: تحتاج إلى نوم.\nالمريض: يا دكتور، أنا أنام.\nالطبيب: كم ساعة؟\nالمريض: يا دكتور، أنام طوال اليوم!",

"نكتة 940:\n\nالطبيب: لا يجب أن تدخن السجائر.\nالمريض: يا دكتور، أنا فقط أنظر إليها.\nالطبيب: إذاً توقف عن النظر إليها!",

"نكتة 948:\n\nالطبيب: يجب أن تقلل الحلويات.\nالمريض: يا دكتور، لا آكل الحلويات.\nالطبيب: إذاً لماذا أسنانك تالفة؟\nالمريض: يا دكتور، تركت الحلويات، لكن لم أترك زوجتي!",
"نكتة 949:\n\nالمعلم: ما أكبر صدمة في حياتك؟\nالطالب: يا أستاذ، عندما جهزت زوجتي للذهاب لبيت أبيها، فقالت 'لن أذهب' — كانت أكبر صدمة!",
"نكتة 950:\n\nذهب رجل للطبيب وقال: يا دكتور، أشعر كل يوم أنني سأموت.\nالطبيب: منذ متى؟\nالرجل: منذ أن تزوجت.\nالطبيب: يا أخي، هذا ليس مرضاً، هذه حقيقة!",
"نكتة 951:\n\nالمعلم: إذا أعطيتك مليون ريال، ماذا ستفعل؟\nالطالب: يا أستاذ، سأدفع رسوم المدرسة أولاً.\nالمعلم: واو، يا له من طالب جيد!\nالطالب: ثم سأستخدم المال المتبقي لإرسال زوجتي لبيت أبيها!",
"نكتة 952:\n\nالزوجة: عزيزي، إذا مت، ماذا ستفعل؟\nالزوج: سأتزوج مرة ثانية.\nالزوجة: وإذا بقيت حية؟\nالزوج: ماذا بعد، ستبقى الأولى هي نفسها!",
"نكتة 953:\n\nالمعلم: ما الفرق بين الحادث والمصيبة؟\nالطالب: يا أستاذ، عندما تذهب زوجة شخص لبيت أبيها، وفي طريق عودتها يحدث لها حادث وتموت، فهذا حادث. أما إذا عادت سالمة للبيت، فهذه مصيبة!",
"نكتة 954:\n\nالزوج: عزيزتي، كم تحبينني؟\nالزوجة: بقدر ما لا أستطيع العيش بدونك ساعة.\nالزوج: إذاً لماذا لم تطبخي شيئاً اليوم؟\nالزوجة: لأنني لا أستطيع الطبخ بدونك!",
"نكتة 955:\n\nالمعلم: إذا وقعت زوجتك وأمك في النهر، من ستنقذ أولاً؟\nالطالب: يا أستاذ، سأنقذ أمي أولاً، لأن زوجتي تعرف السباحة — تعبر النهر كل يوم لتذهب لبيت أبيها!",
"نكتة 956:\n\nالطبيب: ما مشكلتك؟\nالمريض: يا دكتور، زوجتي تصرخ علي كل يوم.\nالطبيب: وماذا أفعل أنا؟\nالمريض: أعطها دواءً لتتوقف عن الصراخ!",
"نكتة 957:\n\nالمعلم: ماذا شعرت بعد الزواج؟\nالطالب: يا أستاذ، قبل الزواج كنت أظن أنني حر — بعد الزواج عرفت أنني كنت سجيناً، والآن وجدت الحرية!",
"نكتة 958:\n\nالزوجة: عزيزي، نذهب للسوق اليوم؟\nالزوج: لا يوجد مال.\nالزوجة: وماذا في ذلك، سنذهب للنظر فقط.\nالزوج: في المرة الماضية قلتي نفس الكلام، وأنا تركت راتب 3 أشهر في السوق!",
"نكتة 959:\n\nالمعلم: إذا وجدت وظيفة، ماذا ستفعل؟\nالطالب: يا أستاذ، سأهدي راتب الشهر الأول لأمي.\nالمعلم: واو، يا له من طالب جيد!\nالطالب: ثم سأعطي بقية الأشهر لأمي أيضاً، ولن أعطي لزوجتي شيئاً!",

"نكتة 965:\n\nالمعلم: ما أكبر درس تعلمته من الحياة؟\nالطالب: يا أستاذ، قبل الزواج كنت أظن أنني ملك، بعد الزواج عرفت أنني وزير — والزوجة رئيسة الوزراء!",
"نكتة 966:\n\nالطبيب: لا يجب أن تدخن السجائر.\nالمريض: يا دكتور، أنا فقط أنظر إليها.\nالطبيب: إذاً توقف عن النظر إليها!",
"نكتة 967:\n\nالمعلم: إذا حصلت على طائرة، إلى أين ستذهب؟\nالطالب: يا أستاذ، لبيت أبيها!",
"نكتة 968:\n\nالزوجة: عزيزي، ما الشيء المفضل لديك؟\nالزوج: أنت.\nالزوجة: واو، يا له من حب!\nالزوج: لا، الشيء المفضل لدي هو ذهابك لبيت أبيك!",
"نكتة 969:\n\nالمعلم: إذا صعدت زوجتك وطفلك للسطح، من ستنزل أولاً؟\nالطالب: يا أستاذ، الطفل.\nالمعلم: ولماذا لا زوجتك؟\nالطالب: يا أستاذ، زوجتي ستقفز بنفسها وتنزل، الطفل لا يستطيع!",
"نكتة 970:\n\nالطبيب: تحتاج إلى نوم جيد.\nالمريض: يا دكتور، أنا أنام.\nالطبيب: كم ساعة؟\nالمريض: يا دكتور، أنام طوال الليل، وفي النهار زوجتي لا تتركني أنام!",
"نكتة 971:\n\nالمعلم: من هو أقوى شخص في بيتكم؟\nالطالب: يا أستاذ، زوجتي.\nالمعلم: كيف؟\nالطالب: يا أستاذ، هي تدير البيت كله بيد واحدة، وحتى راتبي!",
"نكتة 972:\n\nالزوجة: عزيزي، إذا مرضت أنا وأمك في نفس الوقت، دواء من ستحضر؟\nالزوج: دواءك!\nالزوجة: واو، يا له من حب!\nالزوج: لا، دواء أمي سيأتي من تلقاء نفسه، أما دواءك فأنا من سيحضره!",
"نكتة 973:\n\nالمعلم: هل تعتقد أن الزواج هو أكبر قرار في الحياة؟\nالطالب: يا أستاذ، لا، الزواج هو أكبر 'حادث' في الحياة — والزوجة 'مصيبة'!",
"نكتة 974:\n\nالطبيب: ما مشكلتك؟\nالمريض: يا دكتور، أشعر كل يوم أنني سأموت.\nالطبيب: منذ متى؟\nالمريض: منذ أن تزوجت!",
"نكتة 975:\n\nالمعلم: إذا أعطيتك مليون ريال، ماذا ستفعل؟\nالطالب: يا أستاذ، سأرسل زوجتي لبيت أبيها أولاً، ثم سأنام بسلام!",
"نكتة 976:\n\nالزوجة: عزيزي، كم تحبني؟\nالزوج: بقدر ما لن أسمح لك بالذهاب لبيت أبيك.\nالزوجة: واو، يا له من حب!\nالزوج: لا، لأوفر تكاليف الذهاب لبيت أبيها!",
"نكتة 977:\n\nالمعلم: ماذا شعرت بعد الزواج؟\nالطالب: يا أستاذ، كنت وحدي، الآن أنا 'نحن' — لكن في 'نحن' لا يسمع إلا كلام الزوجة!",
"نكتة 978:\n\nالطبيب: تحتاج إلى رياضة.\nالمريض: يا دكتور، أمارس الرياضة كل يوم.\nالطبيب: ماذا تفعل؟\nالمريض: أحاول الاستيقاظ مبكراً كل يوم!",
"نكتة 979:\n\nالمعلم: إذا مرضت زوجتك وأمك، من ستأخذ للمستشفى؟\nالطالب: يا أستاذ، أمي.\nالمعلم: وماذا ستفعل زوجتك؟\nالطالب: يا أستاذ، زوجتي ستذهب للمستشفى بنفسها — أنا فقط أفكر في أخذ أمي!",
"نكتة 980:\n\nالزوجة: عزيزي، ماذا نطبخ اليوم؟\nالزوج: ما طبخته أنت.\nالزوجة: لم أطبخ شيئاً!\nالزوج: إذاً لنطلب من الخارج!",
"نكتة 981:\n\nالمعلم: ماذا يعمل والدك؟\nالطالب: يا أستاذ، هو والدي!\nالمعلم: هذا أعرفه أيضاً، ماذا يعمل؟\nالطالب: يا أستاذ، هو زوج أمي!",
"نكتة 982:\n\nالطبيب: يجب أن تأكل فواكه.\nالمريض: يا دكتور، آكل المانجو كل يوم.\nالطبيب: فقط المانجو؟\nالمريض: يا دكتور، المانجو يعني 'ملك الفواكه'!",
"نكتة 983:\n\nالمعلم: إذا جعلتك رئيس وزراء لليلة، ماذا ستفعل؟\nالطالب: يا أستاذ، أولاً سأعطي عطلة للمدرسة، ثم سأزيد راتب زوجتي!",
"نكتة 984:\n\nالزوجة: عزيزي، إلى أين ستأخذني؟\nالزوج: سآخذك للسوق.\nالزوجة: ماذا سأشتري؟\nالزوج: ما تشائين، لكن معي فقط 500 ريال!",
"نكتة 985:\n\nالمعلم: لماذا تتزوج؟\nالطالب: يا أستاذ، لأن أمي قالت أنه بعد الزواج لن يصرخ علي أحد.\nالمعلم: ثم ماذا حدث؟\nالطالب: يا أستاذ، بعد الزواج عرفت أنه بقي واحدة فقط تصرخ — الزوجة!",
"نكتة 986:\n\nالطبيب: يجب أن تقلل الحلويات.\nالمريض: يا دكتور، لا آكل الحلويات.\nالطبيب: إذاً لماذا أسنانك تالفة؟\nالمريض: يا دكتور، تركت الحلويات، لكن لم أترك زوجتي!",
"نكتة 987:\n\nالمعلم: ما أكبر صدمة في حياتك؟\nالطالب: يا أستاذ، عندما جهزت زوجتي للذهاب لبيت أبيها، فقالت 'لن أذهب' — كانت أكبر صدمة!",
"نكتة 988:\n\nالزوجة: عزيزي، ما الشيء المفضل لديك؟\nالزوج: أنت.\nالزوجة: واو، يا له من حب!\nالزوج: لا، الشيء المفضل لدي هو ذهابك لبيت أبيك!",
"نكتة 989:\n\nالمعلم: إذا وقعت زوجتك وطفلك في النهر، من ستنقذ أولاً؟\nالطالب: يا أستاذ، الطفل.\nالمعلم: ولماذا لا زوجتك؟\nالطالب: يا أستاذ، زوجتي ستعوم بنفسها وتخرج، الطفل لا يستطيع!",
"نكتة 990:\n\nالطبيب: تحتاج إلى راحة جيدة.\nالمريض: يا دكتور، أنا أرتاح.\nالطبيب: إذاً لماذا أنت مريض؟\nالمريض: تعبت من الراحة!",
"نكتة 991:\n\nالمعلم: كيف كانت نتيجتك؟\nالطالب: يا أستاذ، نجحت!\nالمعلم: كم درجة؟\nالطالب: يا أستاذ، النجاح لا يحتاج درجات!",
"نكتة 992:\n\nالزوجة: عزيزي، إلى أين نذهب هذا المساء؟\nالزوج: إلى حيث تقولين.\nالزوجة: نذهب لبيت أبي؟\nالزوج: لماذا هناك؟\nالزوجة: لأن هناك سيكون طعام، وسيوفر راتبك أيضاً!",
"نكتة 993:\n\nالمعلم: ما أكبر درس تعلمته من الحياة؟\nالطالب: يا أستاذ، قبل الزواج كنت أظن أنني ملك، بعد الزواج عرفت أنني وزير — والزوجة رئيسة الوزراء!",
"نكتة 994:\n\nالطبيب: تحتاج إلى نوم.\nالمريض: يا دكتور، أنا أنام.\nالطبيب: كم ساعة؟\nالمريض: يا دكتور، أنام طوال اليوم!",
"نكتة 995:\n\nالمعلم: إذا حصلت على طائرة، إلى أين ستذهب؟\nالطالب: يا أستاذ، لبيت أبيها!",
"نكتة 996:\n\nالزوجة: عزيزي، إذا مت، ماذا ستفعل؟\nالزوج: سأتزوج مرة ثانية.\nالزوجة: وإذا بقيت حية؟\nالزوج: ماذا بعد، ستبقى الأولى هي نفسها!",
"نكتة 997:\n\nالمعلم: إذا أعطيتك مليون ريال، ماذا ستفعل؟\nالطالب: يا أستاذ، سأرسل زوجتي لبيت أبيها أولاً، ثم سأنام بسلام!",
"نكتة 998:\n\nالطبيب: لا يجب أن تدخن السجائر.\nالمريض: يا دكتور، أنا فقط أنظر إليها.\nالطبيب: إذاً توقف عن النظر إليها!",
"نكتة 999:\n\nالمعلم: ماذا شعرت بعد الزواج؟\nالطالب: يا أستاذ، قبل الزواج كنت أظن أنني حر — بعد الزواج عرفت أنني كنت سجيناً، والآن وجدت الحرية!",
"نكتة 1000:\n\nالمعلم: ما الفرق بين الحادث والمصيبة؟\nالطالب: يا أستاذ، عندما تذهب زوجة شخص لبيت أبيها، وفي طريق عودتها يحدث لها حادث وتموت، فهذا حادث. أما إذا عادت سالمة للبيت، فهذه مصيبة! مبارك، 1000 نكتة مكتملة! 🎉"
];

var current = 0;

function showJoke(){
    document.getElementById('jokeBox').innerText = jokes[current];
    document.getElementById('count').innerText = "نكتة " + (current+1) + " / " + jokes.length;
}

function next(){ 
    if(current < jokes.length-1){ 
        current++; 
        showJoke(); 
        document.getElementById('jokeBox').scrollTop = 0;
    } 
}

function prev(){ 
    if(current > 0){ 
        current--; 
        showJoke(); 
        document.getElementById('jokeBox').scrollTop = 0;
    } 
}

function goHome(){ 
    window.location.href='index.html'; 
}

showJoke();
</script>
