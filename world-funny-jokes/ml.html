"Jenaka 210:\n\nIsteri: Sayang, saya nampak gemuk ke?\nSuami: Tak, sayang, awak tak gemuk.\nIsteri: Kenapa fikir lama sangat?\nSuami: Sebab saya tak nak awak kecil hati!",
"Jenaka 211:\n\nCikgu: Ivanov, apa itu 'masa'?\nIvanov: Benda yang terbang bila awak rehat, dan lambat bila awak kerja.\nCikgu: Apa itu 'hidup'?\nIvanov: Benda yang berlalu semasa awak kerja!",
"Jenaka 212:\n\nSuami: Sayang, hari ni saya balik lambat.\nIsteri: Baiklah, saya ajak kawan.\nSuami: Jangan, saya dah balik!\nIsteri: Kenapa?\nSuami: Sebab saya takut awak habiskan semua makanan tanpa saya!",
"Jenaka 213:\n\nDoktor: Pesakit, kesihatan awak baik!\nPesakit: Terima kasih, doktor, sebab saya belum kahwin.\nDoktor: Siapa buat awak macam ni?\nPesakit: Emak saya!",
"Jenaka 214:\n\nCikgu: Vovochka, apa itu 'kebahagiaan'?\nVovochka: Bila awak balik rumah, tak ada orang!\nCikgu: Kalau ada orang?\nVovochka: Itu bukan kebahagiaan, itu kejutan!",
"Jenaka 215:\n\nDua lelaki:\n- Semalam saya penat sangat sampai tertidur atas sofa.\n- Isteri?\n- Dia pun tertidur, tapi depan TV!\n- Siapa basuh pinggan?\n- Tak ada, semalam tak kotor!",
"Jenaka 216:\n\nIsteri: Sayang, awak dengar tak?\nSuami: Ya, sayang.\nIsteri: Apa saya cakap?\nSuami: Awak cakap saya tak dengar.\nIsteri: Itulah, awak tak dengar!",
"Jenaka 217:\n\nCikgu: Petrov, kenapa lambat?\nPetrov: Saya tertidur.\nCikgu: Kenapa tertidur?\nPetrov: Sebab tidur lambat.\nCikgu: Kenapa tidur lambat?\nPetrov: Sebab saya tak boleh tidur!\nCikgu: Kenapa tak boleh tidur?\nPetrov: Sebab fikir akan lambat ke sekolah!",
"Jenaka 218:\n\nLelaki di farmasi:\n- Bagi saya ubat tidur.\n- Ini, ambil.\n- Ubat untuk isteri ada?\n- Maaf, itu tak boleh diubati, kena cerai!\n- Ubat cerai ada?\n- Ada, tapi di jabatan lain!",

"Jenaka 502:\n\nIsteri: Sayang, apa awak buat kalau saya jadi kucing?\nSuami: Saya belai, bagi makan dan main dengan awak.\nIsteri: Kalau saya jadi anjing?\nSuami: Sama juga.\nIsteri: Kalau saya jadi ular?\nSuami: Saya letak dalam akuarium.\nIsteri: Kalau saya jadi burung?\nSuami: Saya lepaskan supaya awak terbang balik rumah emak!",
"Jenaka 503:\n\nDoktor: Pesakit, kesihatan awak baik. Berapa umur awak?\nPesakit: 60.\nDoktor: Awak rasa macam 40?\nPesakit: Ya, tapi isteri cakap saya nampak macam 70, dan berkelakuan macam 15!\nDoktor: Apa awak buat untuk rasa macam 40?\nPesakit: Saya tak tengok berita dan tak dengar isteri!",
"Jenaka 504:\n\nDua lelaki:\n- Semalam saya cakap isteri saya kurus.\n- Dia cakap apa?\n- Dia tanya saya pergi mana dan dengan siapa!\n- Awak?\n- Saya cakap pergi kerja, dia cakap di tempat kerja tak cakap macam tu!",
"Jenaka 505:\n\nCikgu: Petrov, apa itu 'penjimatan'?\nPetrov: Bila ayah beli sosej paling murah, dan emak beli beg tangan paling mahal!\nCikgu: Apa itu 'bajet'?\nPetrov: Bila ayah ingat dia jimat, dan emak tahu dia belanja!",
"Jenaka 506:\n\nIsteri: Sayang, awak cemburu saya tak?\nSuami: Tak, saya percaya awak.\nIsteri: Kenapa awak periksa telefon saya?\nSuami: Saya tak periksa, saya cari gambar saya!\nIsteri: Kenapa ada dalam telefon saya?\nSuami: Sebab awak padam, dan saya pulihkan!\nIsteri: Kenapa awak pulihkan?\nSuami: Sebab saya suka!\nIsteri: Kenapa awak suka?\nSuami: Sebab gambar tu saya dengan kawan-kawan memancing!\nIsteri: Kenapa tak cakap pergi memancing?\nSuami: Sebab awak tak bagi!",
"Jenaka 507:\n\nDi farmasi:\n- Ada ubat sakit kepala?\n- Ada.\n- Untuk isteri?\n- Ada juga, tapi itu bukan sakit kepala, tapi sakit kepala!\n- Untuk mak mertua?\n- Ada, tapi bukan di farmasi, di balai polis!",
"Jenaka 508:\n\nCikgu: Vovochka, ayah awak kerja apa?\nVovochka: Dia pengarah kilang.\nCikgu: Emak awak?\nVovochka: Emak di rumah, rehat.\nCikgu: Siapa cari duit?\nVovochka: Ayah cari duit, emak belanja!\nCikgu: Siapa rehat?\nVovochka: Ayah, bila emak balik kampung!\nCikgu: Siapa kerja?\nVovochka: Nenek, bila emak datang rumah dia!",
"Jenaka 509:\n\nSuami: Sayang, hari ni saya balik lambat.\nIsteri: Baiklah, saya ajak kawan.\nSuami: Jangan, saya dah balik!\nIsteri: Kenapa?\nSuami: Sebab saya takut awak habiskan semua makanan tanpa saya!\nIsteri: Kami dah habiskan semua!\nSuami: Apa awak makan?\nIsteri: Apa yang awak patut beli!",

"Jenaka 714:\n\nDoktor: Pesakit, awak kena kurang tekanan.\nPesakit: Doktor, macam mana saya nak kurang tekanan, kalau saya ada isteri dan tiga anak?\nDoktor: Kalau macam tu, awak kena lebih rehat.\nPesakit: Macam mana saya nak rehat, kalau saya ada isteri dan tiga anak?\nDoktor: Kalau macam tu, awak kena cerai!\nPesakit: Macam mana saya nak cerai, kalau saya ada isteri dan tiga anak?",

"Jenaka 716:\n\nSuami: Sayang, hari ni saya beli hadiah untuk awak!\nIsteri: Apa?\nSuami: Saya beli penyedut habuk baru!\nIsteri: Kenapa tak beli bunga?\nSuami: Sebab bunga layu, penyedut habuk tahan lama!\nIsteri: Kenapa tak beli beg tangan?\nSuami: Sebab beg tak layu, tapi susah nak sedut habuk dengan beg!",
