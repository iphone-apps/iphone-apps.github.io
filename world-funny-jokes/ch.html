"笑话 77:\n\n妻子：亲爱的，你最喜欢的是什么？\n丈夫：你。\n妻子：哇，多么的爱！\n丈夫：不，我最喜欢的是你回娘家！",
"笑话 78:\n\n老师：如果你老婆和孩子都爬上屋顶，你先让谁下来？\n学生：老师，孩子。\n老师：为什么不先让老婆？\n学生：老师，老婆会自己跳下来，孩子不会！",
"笑话 79:\n\n医生：你需要好好睡觉。\n病人：医生，我睡了。\n医生：几个小时？\n病人：医生，我睡一整晚，白天老婆不让我睡！",
"笑话 80:\n\n老师：你家谁最厉害？\n学生：老师，我老婆。\n老师：为什么？\n学生：老师，她一只手管整个家，还管我的工资！",
"笑话 81:\n\n妻子：亲爱的，如果我和你妈同时生病，你先拿谁的药？\n丈夫：你的！\n妻子：哇，多么的爱！\n丈夫：不，我妈的药她自己会拿，你的只能我去拿！",
"笑话 82:\n\n老师：你认为婚姻是人生最大的决定吗？\n学生：老师，不，婚姻是人生最大的'事故'——而老婆是'倒霉'！",
"笑话 83:\n\n医生：你有什么问题？\n病人：医生，我每天感觉我快死了。\n医生：从什么时候开始的？\n病人：从我结婚开始！",
"笑话 84:\n\n老师：如果我给你一百万，你会做什么？\n学生：老师，我先送老婆回娘家，然后安稳地睡觉！",
"笑话 85:\n\n妻子：亲爱的，你有多爱我？\n丈夫：爱到不让你回娘家。\n妻子：哇，多么的爱！\n丈夫：不，是为了省路费！",
"笑话 86:\n\n老师：结婚后你有什么感受？\n学生：老师，以前我是一个人，现在我们是'我们'——但在'我们'里只能听到老婆的话！",
"笑话 87:\n\n医生：你需要运动。\n病人：医生，我每天都运动。\n医生：你做什么？\n病人：我每天努力早起！",
"笑话 88:\n\n老师：如果你老婆和你妈生病了，你送谁去医院？\n学生：老师，我妈。\n老师：那你老婆怎么办？\n学生：老师，老婆会自己去医院——我只管送我妈！",
"笑话 89:\n\n妻子：亲爱的，今天做什么饭？\n丈夫：你做啥我吃啥。\n妻子：我什么都没做！\n丈夫：那叫外卖！",
"笑话 90:\n\n老师：你爸爸是做什么的？\n学生：老师，他是我爸爸！\n老师：这我知道，我是问他做什么工作？\n学生：老师，他是我妈的丈夫！",
"笑话 91:\n\n医生：你应该吃水果。\n病人：医生，我每天都吃芒果。\n医生：只吃芒果？\n病人：医生，芒果就是'水果之王'！",
"笑话 92:\n\n老师：如果我让你当一晚总理，你会做什么？\n学生：老师，首先给学校放假，然后给老婆涨工资！",
"笑话 93:\n\n妻子：亲爱的，你要带我去哪儿？\n丈夫：带你去市场。\n妻子：买什么？\n丈夫：随你便，但我只有500块！",
"笑话 94:\n\n老师：你为什么要结婚？\n学生：老师，因为我妈说结婚后没人再吼我了。\n老师：后来呢？\n学生：老师，结婚后我才发现，只剩下一个人吼我——老婆！",
"笑话 95:\n\n医生：你应该少吃甜食。\n病人：医生，我不吃甜食。\n医生：那你的牙怎么坏了？\n病人：医生，我戒了甜食，但没戒老婆！",
"笑话 96:\n\n老师：你人生中最大的打击是什么？\n学生：老师，当我准备好送老婆回娘家，她却说'我不去'——这是最大的打击！",
"笑话 97:\n\n妻子：亲爱的，你最喜欢的是什么？\n丈夫：你。\n妻子：哇，多么的爱！\n丈夫：不，我最喜欢的是你回娘家！",

"笑话 99:\n\n医生：你需要好好休息。\n病人：医生，我在休息。\n医生：那你怎么还病着？\n病人：休息得都累了！",
"笑话 100:\n\n老师：迟到和倒霉有什么区别？\n学生：老师，如果一个人的老婆回娘家，回来的路上出了车祸死了，这叫事故。如果她活着平安回到家，那叫倒霉！ 😄",
"笑话 101:\n\n爸爸：儿子，你的车呢？\n儿子：爸，车挺好的，就是没油了！\n爸爸：那你怎么来的？\n儿子：我推着车，它自己就跑了！",
"笑话 102:\n\n老师：你为什么不喜欢学习？\n学生：老师，我有心，但我的大脑想放假！",

"笑话 549:\n\n老师：你人生中最大的打击是什么？\n学生：老师，当我准备好送老婆回娘家，她却说'我不去'——这是最大的打击！",
"笑话 550:\n\n一个人去看医生：医生，我每天感觉我快死了。\n医生：从什么时候开始的？\n那人：从我结婚开始。\n医生：兄弟，这不是病，这是事实！",
"笑话 551:\n\n老师：如果我给你一百万，你会做什么？\n学生：老师，我先交学费。\n老师：哇，多么好的学生！\n学生：然后用剩下的钱把老婆送回娘家！",
"笑话 552:\n\n妻子：亲爱的，如果我死了，你会做什么？\n丈夫：我会再婚。\n妻子：如果我还活着呢？\n丈夫：那又怎样，还是原来那个！",

"笑话 554:\n\n丈夫：亲爱的，你有多爱我？\n妻子：我一刻也离不开你。\n丈夫：那你今天怎么没做饭？\n妻子：因为我没有你也没法做饭！",

"笑话 556:\n\n医生：你有什么问题？\n病人：医生，我老婆每天冲我吼。\n医生：那我该怎么办？\n病人：给她开点药，让她别吼了！",

"笑话 644:\n\n医生：你需要运动。\n病人：医生，我每天都运动。\n医生：你做什么？\n病人：每天被老婆吼完之后跑步！",

"笑话 649:\n\n老师：你人生中最大的打击是什么？\n学生：老师，当我准备好送老婆回娘家，她却说'我不去'——这是最大的打击！",
