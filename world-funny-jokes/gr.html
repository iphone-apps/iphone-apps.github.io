"Witz 83:\n\nLehrer: Wenn deine Frau und deine Mutter in den Fluss fallen, wen rettest du zuerst?\nSchüler: Herr Lehrer, ich rette zuerst meine Mutter, weil meine Frau schwimmen kann – sie überquert jeden Tag den Fluss, um zu ihrem Vater zu gehen!",
"Witz 84:\n\nArzt: Was ist dein Problem?\nPatient: Doktor, meine Frau schreit mich jeden Tag an.\nArzt: Und was mache ich da?\nPatient: Geben Sie ihr ein Medikament, damit sie aufhört zu schreien!",
"Witz 85:\n\nLehrer: Was hast du nach der Hochzeit gefühlt?\nSchüler: Herr Lehrer, vorher dachte ich, ich sei frei – nach der Hochzeit wusste ich, dass ich vorher ein Gefangener war, jetzt habe ich die Befreiung gefunden!",
"Witz 86:\n\nFrau: Schatz, gehen wir heute auf den Markt?\nEhemann: Es gibt kein Geld.\nFrau: Na und? Wir schauen nur.\nEhemann: Letztes Mal hast du dasselbe gesagt und ich habe drei Monatsgehälter auf dem Markt gelassen!",
"Witz 87:\n\nLehrer: Wenn du einen Job findest, was würdest du tun?\nSchüler: Herr Lehrer, ich würde mein erstes Gehalt meiner Mutter geben.\nLehrer: Wow, was für ein guter Sohn!\nSchüler: Und die folgenden Monate auch, ich würde alles meiner Mutter geben, nichts meiner Frau!",
"Witz 88:\n\nFrau: Schatz, du hast mir nie Blumen geschenkt.\nEhemann: Magst du Blumen?\nFrau: Ja.\nEhemann: Dann geh morgen auf den Markt und kaufe Blumen!",
"Witz 89:\n\nLehrer: Was war der größte Schock in deinem Leben?\nSchüler: Herr Lehrer, als meine Frau mir sagte, dass ich Vater werde – und ich dachte, ich sei selbst noch ein Kind!",
"Witz 90:\n\nArzt: Du musst Sport treiben.\nPatient: Doktor, ich mache jeden Tag Sport.\nArzt: Was machst du?\nPatient: Ich renne jeden Tag weg, nachdem meine Frau mich angeschrien hat!",
"Witz 91:\n\nLehrer: Wenn deine Frau und deine Mutter dich gleichzeitig anschreien, wem hörst du zu?\nSchüler: Herr Lehrer, ich höre auf meine Mutter.\nLehrer: Warum nicht auf deine Frau?\nSchüler: Herr Lehrer, meiner Frau muss ich auch nachts zuhören, meiner Mutter nur tagsüber!",
"Witz 92:\n\nFrau: Schatz, was koche ich heute?\nEhemann: Was du willst.\nFrau: Okay, heute koche ich nichts.\nEhemann: Nein, nein, ich habe nur Spaß gemacht!",
"Witz 93:\n\nLehrer: Was ist die größte Lektion, die du vom Leben gelernt hast?\nSchüler: Herr Lehrer, vor der Hochzeit dachte ich, ich sei ein König, nach der Hochzeit wusste ich, dass ich ein Minister bin – und die Frau ist die Premierministerin!",
"Witz 94:\n\nArzt: Du solltest nicht rauchen.\nPatient: Doktor, ich schaue sie nur an.\nArzt: Dann hör auf, sie anzusehen!",
"Witz 95:\n\nLehrer: Wenn man dir ein Flugzeug gibt, wohin würdest du fliegen?\nSchüler: Herr Lehrer, zu meinem Schwiegervater!",
"Witz 96:\n\nFrau: Schatz, was ist deine Lieblingssache?\nEhemann: Du.\nFrau: Wow, welche Liebe!\nEhemann: Nein, meine Lieblingssache ist, wenn du zu deinem Vater gehst.",
"Witz 97:\n\nLehrer: Wenn deine Frau und dein Sohn auf das Dach steigen, wen holst du zuerst runter?\nSchüler: Herr Lehrer, das Kind.\nLehrer: Warum nicht deine Frau?\nSchüler: Herr Lehrer, meine Frau springt alleine runter, das Kind kann das nicht!",
"Witz 98:\n\nArzt: Du musst gut schlafen.\nPatient: Doktor, ich schlafe.\nArzt: Wie viele Stunden?\nPatient: Doktor, ich schlafe die ganze Nacht, aber tagsüber lässt meine Frau mich nicht schlafen!",
"Witz 99:\n\nLehrer: Wer ist die stärkste Person in deinem Haus?\nSchüler: Herr Lehrer, meine Frau.\nLehrer: Wie das?\nSchüler: Herr Lehrer, sie verwaltet das ganze Haus mit einer Hand und auch mein Gehalt!",
"Witz 100:\n\nFrau: Schatz, wenn ich und deine Mutter gleichzeitig krank werden, wessen Medikament bringst du?\nEhemann: Deins!\nFrau: Wow, welche Liebe!\nEhemann: Nein, das Medikament meiner Mutter kommt von selbst, deins bringe ich!",
"Witz 101:\n\nLehrer: Warum bist du zu spät gekommen?\nSchüler: Herr Lehrer, ich bin zu spät aufgewacht.\nLehrer: Und warum?\nSchüler: Herr Lehrer, ich habe geträumt, dass ich in der Schule bin, also musste ich nicht kommen!",
"Witz 102:\n\nEhemann: Schatz, ich habe gute Neuigkeiten.\nFrau: Welche?\nEhemann: Ich habe aufgehört zu rauchen!\nFrau: Seit wann?\nEhemann: Seit ich die letzte Zigarette geraucht habe!",
"Witz 103:\n\nArzt: Du musst aufhören, nachts zu essen.\nPatient: Doktor, ich esse nicht nachts.\nArzt: Warum ist dein Kühlschrank morgens dann leer?\nPatient: Doktor, der Kühlschrank leert sich von selbst!",
"Witz 104:\n\nLehrer: Was ist die Hauptstadt von Frankreich?\nSchüler: Herr Lehrer, das ist Paris.\nLehrer: Sehr gut. Und die Hauptstadt von Italien?\nSchüler: Herr Lehrer, das ist... dasselbe, aber mit mehr Pizza!",
"Witz 105:\n\nFrau: Schatz, du hast unseren Jahrestag vergessen!\nEhemann: Nein, ich habe ihn nicht vergessen.\nFrau: Wo ist dann mein Geschenk?\nEhemann: Das Geschenk ist, dass ich ihn nicht vergessen habe!",
"Witz 106:\n\nLehrer: Warum gehen Fische nicht zur Schule?\nSchüler: Herr Lehrer, weil sie schon Schuppen haben!",
"Witz 107:\n\nArzt: Du trinkst zu viel Kaffee.\nPatient: Doktor, ich trinke Kaffee, um nicht zu schlafen.\nArzt: Und warum willst du nicht schlafen?\nPatient: Doktor, weil ich Kaffee trinken muss!",
"Witz 108:\n\nVater: Sohn, warum sind deine Hände schmutzig?\nSohn: Papa, ich habe im Schlamm gespielt.\nVater: Und warum hast du dich nicht gewaschen?\nSohn: Papa, ich wollte die Erinnerung behalten!",
"Witz 109:\n\nLehrer: Wie viel ist 2 und 2?\nSchüler: Herr Lehrer, 4.\nLehrer: Und 4 und 4?\nSchüler: Herr Lehrer, 8.\nLehrer: Und 8 und 8?\nSchüler: Herr Lehrer, zu viel!",
"Witz 110:\n\nFrau: Schatz, liebst du mich mehr als dein Auto?\nEhemann: Natürlich!\nFrau: Dann lass mich fahren.\nEhemann: Nein, nein, ich habe gelogen!",
"Witz 111:\n\nArzt: Du musst mehr laufen.\nPatient: Doktor, ich laufe jeden Tag.\nArzt: Wie viele Schritte?\nPatient: Doktor, vom Bett zum Kühlschrank!",
"Witz 112:\n\nLehrer: Warum ist der Himmel blau?\nSchüler: Herr Lehrer, weil Gott Blau mag!\nLehrer: Und warum ist das Gras grün?\nSchüler: Herr Lehrer, weil er kein Blau mehr hatte!",
"Witz 113:\n\nVater: Sohn, hast du deine Hausaufgaben gemacht?\nSohn: Papa, ich habe die Hälfte gemacht.\nVater: Wo ist die andere Hälfte?\nSohn: Papa, ich habe sie für morgen aufgehoben!",
"Witz 114:\n\nFrau: Schatz, du hast zugenommen!\nEhemann: Nein, der Spiegel ist geschrumpft.\nFrau: Und die Waage?\nEhemann: Die Waage ist auch geschrumpft!",
"Witz 115:\n\nArzt: Du musst 8 Stunden am Tag schlafen.\nPatient: Doktor, ich schlafe 12 Stunden.\nArzt: Warum bist du dann müde?\nPatient: Doktor, weil ich jede Stunde aufwache!",
"Witz 116:\n\nLehrer: Welcher Planet ist der Sonne am nächsten?\nSchüler: Herr Lehrer, das ist Merkur.\nLehrer: Und der kälteste?\nSchüler: Herr Lehrer, der ohne Sonne!",
"Witz 117:\n\nFrau: Schatz, wir haben keinen Zucker mehr.\nEhemann: Dann nimm Salz.\nFrau: Aber das wird nicht süß!\nEhemann: Ja, aber es wird salzig, das ist doch schon was!",
"Witz 118:\n\nVater: Sohn, warum weinst du?\nSohn: Papa, ich habe mein Taschengeld verloren.\nVater: Wo?\nSohn: Papa, ich habe es ausgegeben!",
"Witz 119:\n\nLehrer: Warum lernst du?\nSchüler: Herr Lehrer, um einen guten Job zu bekommen.\nLehrer: Und warum willst du einen guten Job?\nSchüler: Herr Lehrer, um nicht mehr lernen zu müssen!",
"Witz 120:\n\nArzt: Du musst aufhören, fernzusehen.\nPatient: Doktor, ich schaue nicht.\nArzt: Warum sind deine Augen dann müde?\nPatient: Doktor, ich schaue auf mein Handy!",
"Witz 121:\n\nFrau: Schatz, erinnerst du dich an unser erstes Date?\nEhemann: Natürlich.\nFrau: Wo war das?\nEhemann: Ähm... bei deiner Mutter?\nFrau: Das war unsere Hochzeit, nicht unser erstes Date!",
"Witz 122:\n\nLehrer: Was ist ein schwarzes Loch?\nSchüler: Herr Lehrer, das ist ein Loch ohne Licht.\nLehrer: Und was ist ein weißes Loch?\nSchüler: Herr Lehrer, ein Loch, das vergessen hat, schwarz zu sein!",
"Witz 123:\n\nVater: Sohn, warum hast du mein Handy genommen?\nSohn: Papa, ich wollte Mama anrufen.\nVater: Und warum?\nSohn: Papa, um ihr zu sagen, dass du dein Handy suchst!",
"Witz 124:\n\nArzt: Gegen was bist du allergisch?\nPatient: Doktor, ich bin allergisch gegen Arbeit.\nArzt: Das ist keine Allergie, das ist Faulheit!\nPatient: Doktor, Faulheit lässt mich niesen!",
"Witz 125:\n\nFrau: Schatz, wo ist mein Lippenstift?\nEhemann: Ich weiß nicht.\nFrau: Hast du ihn genommen?\nEhemann: Nein!\nFrau: Warum sind deine Lippen dann rot?",
"Witz 126:\n\nLehrer: Wie viele Kontinente gibt es?\nSchüler: Herr Lehrer, fünf.\nLehrer: Nein, es sind sieben!\nSchüler: Herr Lehrer, zwei sind in den Urlaub gefahren!",
"Witz 127:\n\nVater: Sohn, warum bist du traurig?\nSohn: Papa, ich habe meine Prüfung nicht bestanden.\nVater: Warum?\nSohn: Papa, ich habe gelernt, aber die Fragen waren anders!",
"Witz 128:\n\nArzt: Du musst mehr Gemüse essen.\nPatient: Doktor, ich esse jeden Tag Salat.\nArzt: Und was noch?\nPatient: Doktor, Hähnchen mit Salat!",
"Witz 129:\n\nFrau: Schatz, hast du meine Brille gesehen?\nEhemann: Sie ist auf deinem Kopf.\nFrau: Ah ja! Aber wo ist mein Handy?\nEhemann: In deiner Hand!",
"Witz 130:\n\nLehrer: Warum haben Giraffen einen langen Hals?\nSchüler: Herr Lehrer, um weiter zu sehen.\nLehrer: Und warum?\nSchüler: Herr Lehrer, weil sie neugierig sind!",
"Witz 131:\n\nVater: Sohn, wo warst du?\nSohn: Papa, bei einem Freund.\nVater: Welcher Freund?\nSohn: Papa, der Sohn des Nachbarn!",
"Witz 132:\n\nArzt: Du musst weniger Limonade trinken.\nPatient: Doktor, ich trinke Wasser.\nArzt: Warum knurrt dein Bauch dann?\nPatient: Doktor, das Wasser ist sprudelig!",
"Witz 133:\n\nFrau: Schatz, hörst du mir zu?\nEhemann: Ja, natürlich.\nFrau: Was habe ich gerade gesagt?\nEhemann: Ähm... dass du mich liebst?",
"Witz 134:\n\nLehrer: Warum ist Wasser durchsichtig?\nSchüler: Herr Lehrer, weil es keine Farbe hat.\nLehrer: Und warum?\nSchüler: Herr Lehrer, weil es schüchtern ist!",
"Witz 135:\n\nVater: Sohn, hast du dein Zimmer geputzt?\nSohn: Papa, ich habe angefangen.\nVater: Wo hast du angefangen?\nSohn: Papa, an der Tür!",
"Witz 136:\n\nArzt: Du musst aufhören zu stressen.\nPatient: Doktor, ich bin nicht gestresst.\nArzt: Warum fallen dir dann die Haare aus?\nPatient: Doktor, das liegt an meiner Frau!",
"Witz 137:\n\nFrau: Schatz, wohin fahren wir am Wochenende?\nEhemann: Zu deiner Mutter.\nFrau: Warum?\nEhemann: Weil es kostenlos ist!",
"Witz 138:\n\nLehrer: Was ist Photosynthese?\nSchüler: Herr Lehrer, das ist, wenn Pflanzen Fotos machen.\nLehrer: Nein, das ist, wenn sie ihr Essen herstellen!\nSchüler: Herr Lehrer, dann sind sie Köche!",
"Witz 139:\n\nVater: Sohn, hast du dein Glas Milch ausgetrunken?\nSohn: Papa, ja.\nVater: Warum ist die Katze dann weiß?\nSohn: Papa, weil ich die Milch der Katze gegeben habe!",
"Witz 140:\n\nArzt: Du musst Zucker vermeiden.\nPatient: Doktor, ich mag keinen Zucker.\nArzt: Warum sind deine Zähne dann kaputt?\nPatient: Doktor, das ist der Zucker meiner Frau, sie ist zu süß!",
"Witz 141:\n\nFrau: Schatz, hast du das Geschenk für meine Mutter gekauft?\nEhemann: Ja.\nFrau: Was?\nEhemann: Ein Ticket, damit sie zu uns kommt!",
"Witz 142:\n\nLehrer: Warum leuchten die Sterne?\nSchüler: Herr Lehrer, weil sie glücklich sind.\nLehrer: Warum?\nSchüler: Herr Lehrer, weil sie nicht zur Schule gehen müssen!",
"Witz 143:\n\nVater: Sohn, warum sind deine Augen rot?\nSohn: Papa, ich habe einen traurigen Film gesehen.\nVater: Welchen?\nSohn: Papa, den Film meiner ungemachten Hausaufgaben!",
"Witz 144:\n\nArzt: Du musst 30 Minuten am Tag laufen.\nPatient: Doktor, ich laufe 2 Stunden.\nArzt: Wo?\nPatient: Doktor, im Einkaufszentrum!",
"Witz 145:\n\nFrau: Schatz, hast du die Stromrechnung bezahlt?\nEhemann: Ja.\nFrau: Warum ist es dann dunkel?\nEhemann: Weil ich vergessen habe zu zahlen!",
"Witz 146:\n\nLehrer: Was ist ein Atom?\nSchüler: Herr Lehrer, ein kleines Ding.\nLehrer: Und was ist ein Molekül?\nSchüler: Herr Lehrer, mehrere kleine Dinge zusammen!",
"Witz 147:\n\nVater: Sohn, hast du gebadet?\nSohn: Papa, ja.\nVater: Warum sind deine Haare dann trocken?\nSohn: Papa, ich habe ein Sonnenbad genommen!",
"Witz 148:\n\nArzt: Du musst aufhören zu rauchen.\nPatient: Doktor, ich rauche nicht.\nArzt: Warum sind deine Lungen dann schwarz?\nPatient: Doktor, das ist die Umweltverschmutzung meiner Stadt!",
"Witz 149:\n\nFrau: Schatz, hast du das Brot gekauft?\nEhemann: Ja, aber ich habe es unterwegs gegessen!\nFrau: Warum?\nEhemann: Weil ich Hunger hatte!",
"Witz 150:\n\nLehrer: Warum ändert der Mond seine Form?\nSchüler: Herr Lehrer, weil er eine Diät macht.\nLehrer: Warum?\nSchüler: Herr Lehrer, um schöner zu sein!",
"Witz 151:\n\nVater: Sohn, hast du deine Matheaufgaben gemacht?\nSohn: Papa, ja.\nVater: Was ist dann 7 mal 8?\nSohn: Papa, das habe ich vergessen!",
"Witz 152:\n\nArzt: Du musst auf dem Rücken schlafen.\nPatient: Doktor, ich schlafe auf dem Bauch.\nArzt: Warum?\nPatient: Doktor, um meine Frau nicht zu sehen!",
"Witz 153:\n\nFrau: Schatz, hast du das Geschirr gespült?\nEhemann: Ja.\nFrau: Warum sind die Teller dann schmutzig?\nEhemann: Weil ich nur meinen gespült habe!",
"Witz 154:\n\nLehrer: Was ist Schwerkraft?\nSchüler: Herr Lehrer, das ist, was Dinge fallen lässt.\nLehrer: Und warum?\nSchüler: Herr Lehrer, weil die Erde sie anzieht!",
"Witz 155:\n\nVater: Sohn, hast du deine Schuhe angezogen?\nSohn: Papa, ja.\nVater: Warum läufst du dann barfuß?\nSohn: Papa, ich habe die Schuhe meiner Schwester angezogen!",
"Witz 156:\n\nArzt: Du musst weniger Salz essen.\nPatient: Doktor, ich gebe kein Salz dazu.\nArzt: Warum ist dein Blutdruck dann hoch?\nPatient: Doktor, das ist das Salz meiner Frau, sie ist zu salzig!",
"Witz 157:\n\nFrau: Schatz, hast du die Pflanzen gegossen?\nEhemann: Ja.\nFrau: Warum sind sie dann verwelkt?\nEhemann: Weil ich sie mit Kaffee gegossen habe!",
"Witz 158:\n\nLehrer: Warum brechen Vulkane aus?\nSchüler: Herr Lehrer, weil sie wütend sind.\nLehrer: Warum?\nSchüler: Herr Lehrer, weil man Steine auf sie wirft!",
"Witz 159:\n\nVater: Sohn, hast du gefrühstückt?\nSohn: Papa, ja.\nVater: Warum hast du dann Hunger?\nSohn: Papa, ich habe das Frühstück meiner Schwester gegessen!",
"Witz 160:\n\nArzt: Du musst Stress vermeiden.\nPatient: Doktor, ich bin nicht gestresst.\nArzt: Warum zitterst du dann?\nPatient: Doktor, das ist meine Frau, die kommt!",
"Witz 161:\n\nFrau: Schatz, hast du die Milch gekauft?\nEhemann: Ja, aber ich habe sie getrunken.\nFrau: Warum?\nEhemann: Weil sie abgelaufen wäre!",
"Witz 162:\n\nLehrer: Was ist Elektrizität?\nSchüler: Herr Lehrer, das ist, was die Glühbirnen anmacht.\nLehrer: Und warum?\nSchüler: Herr Lehrer, weil die Glühbirnen Licht brauchen!",
"Witz 163:\n\nVater: Sohn, hast du deine Schultasche gepackt?\nSohn: Papa, ja.\nVater: Warum ist sie dann leer?\nSohn: Papa, ich habe die Hausaufgaben zu Hause gelassen!",
"Witz 164:\n\nArzt: Du musst auf deine Ernährung achten.\nPatient: Doktor, ich passe auf.\nArzt: Was isst du?\nPatient: Doktor, ich esse, was meine Frau mir gibt!",
"Witz 165:\n\nFrau: Schatz, hast du das Auto geputzt?\nEhemann: Ja.\nFrau: Warum ist es dann schmutzig?\nEhemann: Weil ich das Auto des Nachbarn geputzt habe!",
"Witz 166:\n\nLehrer: Warum sind Berge hoch?\nSchüler: Herr Lehrer, weil sie das Meer sehen wollen.\nLehrer: Und warum?\nSchüler: Herr Lehrer, weil sie neugierig sind!",
"Witz 167:\n\nVater: Sohn, hast du dein Bett gemacht?\nSohn: Papa, ja.\nVater: Warum ist es dann ungemacht?\nSohn: Papa, ich habe es in meinem Traum gemacht!",
"Witz 168:\n\nArzt: Du musst Orangensaft trinken.\nPatient: Doktor, ich trinke Apfelsaft.\nArzt: Warum?\nPatient: Doktor, weil Orangen teurer sind!",
"Witz 169:\n\nFrau: Schatz, hast du deine Mutter angerufen?\nEhemann: Ja.\nFrau: Was hat sie gesagt?\nEhemann: Sie sagte, du solltest öfter anrufen!",
"Witz 170:\n\nLehrer: Was ist Photosynthese?\nSchüler: Herr Lehrer, das ist, wenn Pflanzen atmen.\nLehrer: Nein, das ist, wenn sie ihr Essen herstellen!\nSchüler: Herr Lehrer, dann atmen sie beim Essen!",
"Witz 171:\n\nVater: Sohn, hast du deinen Mantel angezogen?\nSohn: Papa, ja.\nVater: Warum ist dir dann kalt?\nSohn: Papa, ich habe den Mantel meiner Schwester angezogen, er ist zu klein!",
"Witz 172:\n\nArzt: Du musst Fahrrad fahren.\nPatient: Doktor, ich habe kein Fahrrad.\nArzt: Dann lauf!\nPatient: Doktor, ich habe keine Beine... ähm, doch, aber keine Lust!",
"Witz 173:\n\nFrau: Schatz, hast du den Fisch gekauft?\nEhemann: Ja, aber er ist aus der Pfanne gesprungen!\nFrau: Wo ist er?\nEhemann: Im Garten, er schwimmt im Pool!",
"Witz 174:\n\nLehrer: Warum drehen sich die Planeten?\nSchüler: Herr Lehrer, weil sie Sport machen.\nLehrer: Warum?\nSchüler: Herr Lehrer, um fit zu bleiben!",
"Witz 175:\n\nVater: Sohn, hast du dein Gemüse gegessen?\nSohn: Papa, ja.\nVater: Warum ist es dann auf dem Teller?\nSohn: Papa, ich habe es mit den Augen gegessen!",
"Witz 176:\n\nArzt: Du musst aufhören Kaffee zu trinken.\nPatient: Doktor, ich trinke keinen Kaffee.\nArzt: Warum bist du dann nervös?\nPatient: Doktor, das ist der Tee!",
"Witz 177:\n\nFrau: Schatz, hast du den Müll rausgebracht?\nEhemann: Ja.\nFrau: Warum steht er dann vor der Tür?\nEhemann: Weil ich die Tür mit rausgebracht habe!",
"Witz 178:\n\nLehrer: Was ist Sauerstoff?\nSchüler: Herr Lehrer, das ist, was wir atmen.\nLehrer: Und was ist Kohlendioxid?\nSchüler: Herr Lehrer, das ist, was wir ausatmen, es ist gebrauchte Luft!",
"Witz 179:\n\nVater: Sohn, hast du das Licht ausgemacht?\nSohn: Papa, ja.\nVater: Warum ist es dann hell?\nSohn: Papa, das ist die Sonne!",
"Witz 180:\n\nArzt: Du musst abnehmen.\nPatient: Doktor, ich habe 2 Kilo verloren.\nArzt: Wie?\nPatient: Doktor, ich habe mir die Haare geschnitten!",
"Witz 181:\n\nFrau: Schatz, hast du die Miete bezahlt?\nEhemann: Ja.\nFrau: Warum ist der Vermieter dann wütend?\nEhemann: Weil ich mit einem Holz-Scheck bezahlt habe!",
"Witz 182:\n\nLehrer: Warum dreht sich die Erde um die Sonne?\nSchüler: Herr Lehrer, weil sie Angst vor der Dunkelheit hat.\nLehrer: Warum?\nSchüler: Herr Lehrer, weil die Sonne ihre Lampe ist!",
"Witz 183:\n\nVater: Sohn, hast du deine Französisch-Hausaufgaben gemacht?\nSohn: Papa, ja.\nVater: Dann schreib einen Satz.\nSohn: Papa, „Ich habe meine Hausaufgaben nicht gemacht“!",
"Witz 184:\n\nLehrer: Was ist das Schönste auf der Welt?\nSchüler: Herr Lehrer, das ist die Frau.\nLehrer: Und das Gefährlichste?\nSchüler: Herr Lehrer, es ist dieselbe Frau – deshalb sagt man „Gefahr“! 😄",
"Witz 185:\n\nArzt: Du musst mehr schlafen.\nPatient: Doktor, ich schlafe 10 Stunden.\nArzt: Warum bist du dann immer noch müde?\nPatient: Doktor, ich schlafe im Büro, nicht zu Hause!",
"Witz 186:\n\nFrau: Schatz, hast du die Kinder von der Schule abgeholt?\nEhemann: Ja.\nFrau: Warum sind sie dann nicht hier?\nEhemann: Weil ich sie zur falschen Schule gebracht habe!",
"Witz 187:\n\nLehrer: Warum ist der Himmel nachts dunkel?\nSchüler: Herr Lehrer, weil das Licht ausgeschaltet ist.\nLehrer: Wer hat es ausgeschaltet?\nSchüler: Herr Lehrer, der Mond, um Strom zu sparen!",
"Witz 188:\n\nVater: Sohn, hast du deine Zähne geputzt?\nSohn: Papa, ja.\nVater: Warum ist deine Zahnbürste dann trocken?\nSohn: Papa, ich habe sie mit meinem Finger geputzt!",
"Witz 189:\n\nArzt: Du musst aufhören Fast Food zu essen.\nPatient: Doktor, ich esse nur Salat.\nArzt: Warum bist du dann übergewichtig?\nPatient: Doktor, der Salat ist mit Pommes!",

"Witz 202:\n\nEin Mann geht zum Arzt: Herr Doktor, ich fühle mich jeden Tag so, als ob ich sterben würde.\nArzt: Seit wann?\nMann: Seit ich geheiratet habe.\nArzt: Mein Bruder, das ist keine Krankheit, das ist die Realität!",

"Witz 209:\n\nArzt: Du musst mehr Obst essen.\nPatient: Doktor, ich esse jeden Tag einen Apfel.\nArzt: Und was noch?\nPatient: Doktor, einen Apfelkuchen!",

"Witz 211:\n\nEin Mann kommt zum Zahnarzt: Herr Doktor, mein Zahn tut so weh!\nZahnarzt: Kein Problem, ich ziehe ihn raus.\nMann: Aber ich habe Angst vor Schmerzen!\nZahnarzt: Keine Sorge, ich mache das ohne Betäubung, dann spüren Sie den Schmerz nicht mehr, weil Sie ohnmächtig werden!",
"Witz 212:\n\nFrau: Schatz, hast du mich eigentlich nur wegen meines Aussehens geheiratet?\nMann: Nein, Schatz, ich habe dich wegen deines Humors geheiratet.\nFrau: Aber ich mache keine Witze!\nMann: Eben, das ist der Witz!",
"Witz 213:\n\nLehrer: Was ist die Hauptstadt von Deutschland?\nSchüler: Herr Lehrer, Berlin.\nLehrer: Richtig. Und was ist die Hauptstadt von Bayern?\nSchüler: Herr Lehrer, München.\nLehrer: Sehr gut. Und was ist die Hauptstadt von dir?\nSchüler: Herr Lehrer, mein Kopf!",
"Witz 214:\n\nArzt: Du musst aufhören, so viel Fernsehen zu schauen.\nPatient: Doktor, ich schaue kein Fernsehen.\nArzt: Warum sind deine Augen dann so rot?\nPatient: Doktor, ich schaue nur YouTube auf meinem Handy!",
"Witz 215:\n\nVater: Sohn, was möchtest du später werden?\nSohn: Papa, ich möchte Millionär werden.\nVater: Und wie willst du das schaffen?\nSohn: Papa, ich spare einfach mein Taschengeld für 1000 Jahre!",
"Witz 216:\n\nFrau: Schatz, hast du die Blumen gegossen?\nMann: Ja, aber ich habe sie mit Cola gegossen.\nFrau: Warum das denn?\nMann: Weil sie dann schneller wachsen, wegen des Zuckers!",

"Witz 218:\n\nMann: Schatz, ich habe heute einen Lottoschein gekauft.\nFrau: Und? Hast du gewonnen?\nMann: Nein, aber ich habe jetzt einen Zettel, der mir Hoffnung gibt!",
"Witz 219:\n\nArzt: Du musst mehr schlafen.\nPatient: Doktor, ich schlafe in der Arbeit.\nArzt: Und warum bist du dann immer noch müde?\nPatient: Doktor, weil mein Chef mich dabei erwischt hat!",

"Witz 292:\n\nLehrer: Warum ist der Himmel blau?\nSchüler: Herr Lehrer, weil das Meer sich im Himmel spiegelt!\nLehrer: Aber warum ist der Himmel nachts schwarz?\nSchüler: Herr Lehrer, weil das Meer schläft!",
"Witz 293:\n\nFrau: Schatz, hast du meine Mutter zum Essen eingeladen?\nMann: Ja, leider.\nFrau: Und was hast du gekocht?\nMann: Nudeln mit Ketchup, damit sie nicht wieder kommt!",
"Witz 294:\n\nLehrer: Was ist ein Stern?\nSchüler: Herr Lehrer, ein großer Feuerball im All.\nLehrer: Und warum sehen wir ihn nachts?\nSchüler: Herr Lehrer, weil er tagsüber schläft!",
"Witz 295:\n\nEin Mann geht zum Friseur: Schneiden Sie mir bitte die Haare.\nFriseur: Aber Sie haben ja gar keine Haare!\nMann: Ich weiß, ich wollte nur mal wieder mit jemandem reden!",
"Witz 296:\n\nVater: Sohn, hast du deine Schuhe geputzt?\nSohn: Papa, ja.\nVater: Warum sind sie dann noch dreckig?\nSohn: Papa, ich habe sie mit Wasser geputzt, aber das Wasser war schmutzig!",
"Witz 297:\n\nArzt: Du musst aufhören zu rauchen.\nPatient: Doktor, ich rauche nur eine Zigarette am Tag.\nArzt: Und warum hast du dann Lungenprobleme?\nPatient: Doktor, ich rauche eine sehr große Zigarette!",
"Witz 298:\n\nLehrer: Was ist ein Berg?\nSchüler: Herr Lehrer, ein großer Hügel.\nLehrer: Und was ist ein Hügel?\nSchüler: Herr Lehrer, ein kleiner Berg!",
"Witz 299:\n\nFrau: Schatz, hast du die Kinder ins Bett gebracht?\nMann: Ja.\nFrau: Und warum spielen sie dann noch im Wohnzimmer?\nMann: Weil ich sie ins Bett gebracht habe, aber sie sind wieder aufgestanden!",
"Witz 300:\n\nLehrer: Was ist ein Ozean?\nSchüler: Herr Lehrer, ein großes Meer.\nLehrer: Und was ist ein Meer?\nSchüler: Herr Lehrer, ein großer See! 😄",
"Witz 301:\n\nEin Mann kommt zur Bank und sagt: Ich möchte 100 Euro abheben.\nBankangestellter: Haben Sie ein Konto bei uns?\nMann: Nein, aber ich habe ein Foto von Ihnen!",
"Witz 302:\n\nLehrer: Was ist die Vergangenheit von 'ich esse'?\nSchüler: Herr Lehrer, 'ich habe gegessen'.\nLehrer: Und die Zukunft?\nSchüler: Herr Lehrer, 'ich werde essen'. Und was ist die Gegenwart?\nLehrer: 'Ich esse'.\nSchüler: Herr Lehrer, dann habe ich jetzt Hunger!",
"Witz 303:\n\nFrau: Schatz, hast du die Katze gefüttert?\nMann: Ja, aber ich habe ihr Hundefutter gegeben.\nFrau: Warum?\nMann: Weil sie so aussieht, als ob sie einen Hund mag!",
"Witz 304:\n\nVater: Sohn, wie war die Schule heute?\nSohn: Papa, langweilig.\nVater: Warum?\nSohn: Papa, der Lehrer hat nur geredet und ich musste zuhören!",
"Witz 305:\n\nEin Mann geht zum Arzt: Doktor, ich fühle mich wie ein Hund.\nArzt: Setzen Sie sich auf den Stuhl.\nMann: Darf ich mich nicht auf den Teppich legen?",
"Witz 306:\n\nLehrer: Was ist der Unterschied zwischen einem Apfel und einer Birne?\nSchüler: Herr Lehrer, der Apfel ist rot und die Birne ist grün.\nLehrer: Und was ist gleich?\nSchüler: Herr Lehrer, beide kann man essen!",
"Witz 307:\n\nFrau: Schatz, hast du den Rasen gemäht?\nMann: Ja, aber ich habe die Blumen mit abgeschnitten.\nFrau: Warum?\nMann: Weil ich dachte, sie wären Unkraut!",
"Witz 308:\n\nVater: Sohn, was ist 5 plus 5?\nSohn: Papa, 10.\nVater: Und was ist 10 plus 10?\nSohn: Papa, 20.\nVater: Und was ist 20 plus 20?\nSohn: Papa, eine Menge!",
"Witz 309:\n\nEin Mann kommt in ein Restaurant: Ich hätte gerne eine Suppe.\nKellner: Welche Sorte?\nMann: Egal, Hauptsache warm.\nKellner: Dann nehmen Sie doch ein Bad!",
"Witz 310:\n\nLehrer: Was ist ein Sternzeichen?\nSchüler: Herr Lehrer, das ist ein Zeichen am Himmel.\nLehrer: Und was bedeutet es?\nSchüler: Herr Lehrer, dass die Sterne uns etwas sagen wollen!",
"Witz 311:\n\nFrau: Schatz, hast du meine Handtasche gesehen?\nMann: Ja, sie steht im Flur.\nFrau: Und wo ist mein Schlüssel?\nMann: In der Tasche!\nFrau: Und wo ist die Tasche?\nMann: Im Flur, habe ich doch gesagt!",
"Witz 312:\n\nEin Mann geht zum Psychiater: Doktor, ich denke, ich bin ein Smartphone.\nPsychiater: Wie kommen Sie darauf?\nMann: Ich habe keine Ahnung, aber ich habe 1000 Freunde!",
"Witz 313:\n\nLehrer: Was ist die Hauptstadt von Spanien?\nSchüler: Herr Lehrer, Madrid.\nLehrer: Und was ist die Hauptstadt von Portugal?\nSchüler: Herr Lehrer, Lissabon.\nLehrer: Und was ist die Hauptstadt von dir?\nSchüler: Herr Lehrer, mein Kopf, aber der ist heute leer!",
"Witz 314:\n\nFrau: Schatz, hast du die Einkäufe gemacht?\nMann: Ja, aber ich habe das Geld zu Hause vergessen.\nFrau: Und wie hast du bezahlt?\nMann: Mit meiner Karte!\nFrau: Aber du hast doch kein Geld auf der Karte!\nMann: Ach, deshalb hat die Kassiererin so komisch geschaut!",
"Witz 315:\n\nEin Mann ruft beim Radio an: Ich habe eine Bitte.\nRadio: Ja, bitte?\nMann: Spielen Sie ein Lied für meine Frau.\nRadio: Welches denn?\nMann: 'Ich bin allein zu Haus'!",
"Witz 316:\n\nLehrer: Was ist ein Atom?\nSchüler: Herr Lehrer, das kleinste Teilchen.\nLehrer: Und was ist ein Molekül?\nSchüler: Herr Lehrer, ein Atom mit Freunden!",
"Witz 317:\n\nFrau: Schatz, hast du die Kinder ins Bett gebracht?\nMann: Ja, aber ich habe sie in mein Bett gelegt.\nFrau: Warum?\nMann: Weil sie Angst im Dunkeln hatten!",
"Witz 318:\n\nVater: Sohn, hast du deine Zähne geputzt?\nSohn: Papa, ja.\nVater: Zeig mal her.\nSohn: Papa, ich habe sie mit Kaugummi geputzt!",
