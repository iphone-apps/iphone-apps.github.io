var current = 0;

function showJoke(){
    document.getElementById('jokeBox').innerText = jokes[current];
    document.getElementById('count').innerText = "Blague " + (current+1) + " / " + jokes.length;
}

function next(){ 
    if(current < jokes.length-1){

        showJoke(); 
        document.getElementById('jokeBox').scrollTop = 0;

}

function prev(){ 
    if(current > 0){ 
        current--; 
        showJoke(); 
        document.getElementById('jokeBox').scrollTop = 0;
    } 
}
